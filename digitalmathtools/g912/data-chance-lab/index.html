<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Data &amp; Chance Lab — a Grades 9–12 statistics and probability app: dot plots, histograms and box plots, comparing groups, scatter plots and regression, probability simulations, tree diagrams, and two-way tables. Works offline. No data collected.">
<title>Data &amp; Chance Lab</title>
<style>
  :root{
    --bg:#fbf3ec;--panel:#ffffff;--ink:#1f1a16;--muted:#5a4c40;--line:#ead2bf;
    --accent:#d35400;--accentD:#a04000;--accent-ink:#ffffff;--good:#166534;--good-bg:#dcfce7;
    --hint:#7a4a00;--hint-bg:#fff4d6;--focus:#0a58ca;--b2:#1f6fb2;--g2:#16a34a;
    --tap:48px;font-size:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-text-size-adjust:100%}
  h1,h2,h3{line-height:1.15;margin:0 0 .3em}
  button{font-family:inherit;font-size:1rem;cursor:pointer}
  button:disabled{cursor:default}

  .topbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--accentD);color:var(--accent-ink);padding:.55rem .8rem}
  .topbar .brand{font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:.4rem;margin-inline-end:auto}
  .topbar a.homebtn,.topbar button.tb{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.4rem .7rem;min-height:var(--tap);min-width:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:.35rem;text-decoration:none;font-weight:700;font-size:.95rem}
  .globe{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.2rem .5rem;min-height:var(--tap)}
  .globe span{font-size:1.2rem}
  .globe select{border:0;background:#fff;color:var(--ink);border-radius:8px;min-height:44px;font-weight:700;font-size:1rem;padding:.2rem .4rem}

  main{max-width:1200px;margin:0 auto;padding:.7rem}
  .tabsrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 .7rem}
  .tabs{display:flex;gap:.4rem;flex-wrap:wrap;flex:1 1 auto}
  .tabs button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.45rem .75rem;min-height:var(--tap);font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:.4rem}
  .tabs button[aria-selected="true"]{background:var(--accentD);color:#fff;border-color:var(--accentD)}
  .tabs button .ic{font-size:1.15rem}
  .stars{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.4rem .8rem;font-weight:800;font-size:1.1rem;min-height:48px;display:inline-flex;align-items:center;gap:.3rem}
  .stars.pop{animation:pop .5s ease}
  @keyframes pop{50%{transform:scale(1.15)}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:.9rem;margin-bottom:.8rem}
  .panelhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
  .panelhead h2{margin:0;font-size:1.25rem;margin-inline-end:auto}

  .prompt{display:flex;align-items:center;gap:.6rem;background:#fdf0e6;border:2px solid #f0c9a8;border-radius:14px;padding:.6rem .8rem;margin-bottom:.7rem;font-size:1.08rem;font-weight:600;line-height:1.75}
  .speaker{background:var(--accentD);color:#fff;border:0;border-radius:50%;width:var(--tap);height:var(--tap);min-width:var(--tap);font-size:1.3rem;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}

  .btn{background:var(--accentD);color:#fff;border:2px solid var(--accentD);border-radius:12px;padding:.5rem .85rem;min-height:var(--tap);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
  .btn.ghost{background:var(--panel);color:var(--accentD)}
  .btn.on{background:#fde3cf;color:var(--accentD)}
  .btn:disabled{opacity:.45}

  .feedback{margin-top:.6rem;border-radius:12px;padding:.6rem .8rem;font-weight:600;display:none;line-height:1.8}
  .feedback.show{display:block}
  .feedback.good{background:var(--good-bg);color:var(--good);border:2px solid #86efac}
  .feedback.hint{background:var(--hint-bg);color:var(--hint);border:2px solid #f6d271}

  .math{unicode-bidi:isolate;direction:ltr;display:inline;font-weight:800;white-space:nowrap}
  .math i{font-family:Georgia,'Times New Roman',serif;font-weight:700}
  .math bdi{white-space:normal}
  .prompt>span{min-width:0;overflow-wrap:anywhere}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:800;margin:0 .08em;white-space:nowrap;font-size:.9em}
  .fr>span{padding:0 .16em}
  .fr>span:first-child{border-bottom:.12em solid currentColor}

  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;margin-top:.7rem}
  .choices:empty{display:none}
  .choice{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:.5rem;min-height:64px;display:flex;align-items:center;justify-content:center;position:relative;font-size:1.25rem;font-weight:800;color:var(--ink)}
  .choice .lbl{unicode-bidi:isolate;direction:ltr}
  .choice.txt{font-size:1rem;font-weight:700;line-height:1.45}
  .choice.txt .lbl{direction:inherit}
  .choices.wide{grid-template-columns:minmax(0,1fr)}
  @media (min-width:700px){ .choices.wide{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .choice.correctpick{border-color:var(--good);background:var(--good-bg)}
  .choice.wrongpick{border-color:#e3b341;background:var(--hint-bg);opacity:.75}
  .choice .badge{position:absolute;top:4px;inset-inline-end:6px;font-size:1rem;display:none}
  .choice.correctpick .badge{display:block}

  .work:empty{display:none}
  .meta{display:flex;flex-wrap:wrap;gap:.3rem .8rem;align-items:center;justify-content:space-between;font-weight:700;color:var(--muted);font-size:.92rem;margin-bottom:.3rem}
  .meta .seed{font-weight:600;font-size:.82rem}
  .datalist{background:#fffaf5;border:2px dashed var(--line);border-radius:12px;padding:.45rem .7rem;font-weight:800;font-size:1.08rem;line-height:1.7;text-align:center;word-spacing:.15em;overflow-wrap:anywhere}
  .datalist .math{white-space:normal}
  .chart{width:100%;max-width:720px;height:auto;display:block;background:#fff;border:2px solid var(--line);border-radius:12px;touch-action:none;margin:.4rem auto}
  .chart[tabindex]{cursor:pointer}
  .chart:focus{outline:none}
  .chart:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  .chart text{font-family:system-ui,sans-serif}
  .chart .tl,.chart .nz{direction:ltr} /* numeric axis labels: keep text-anchor and minus signs correct in Arabic/Urdu */
  .ax{stroke:#3b2f25;stroke-width:2}
  .tk{stroke:#3b2f25;stroke-width:1.5}
  .gl{stroke:#f1e2d6;stroke-width:1}
  .tl{font-size:15px;font-weight:600;fill:#5a4c40}
  .atl{font-size:15px;font-weight:800;fill:#3b2f25}
  .dot{fill:var(--accent);stroke:#fff;stroke-width:1.5}
  .dot.b{fill:var(--b2)}
  .dot.out{fill:#b91c1c}
  .dot.dim{opacity:.35}
  .bx line,.bx rect{stroke:#3b2f25;stroke-width:3;fill:#fde3cf}
  .bx.b line,.bx.b rect{fill:#d6e7f6}
  .bx .md{stroke:var(--accentD);stroke-width:5}
  .bx.b .md{stroke:var(--b2)}
  .hd{fill:#fff;stroke:var(--accentD);stroke-width:4}
  .hd.sel{fill:#fde3cf;stroke:#1f1a16;stroke-width:5}
  .hd.bad{stroke:#d97706;fill:#fff4d6}
  .hd.ok{stroke:var(--g2);fill:var(--good-bg)}
  .hdl{font-size:14px;font-weight:800;fill:#3b2f25;paint-order:stroke;stroke:#fff;stroke-width:4}
  .bar{fill:#f5b78a;stroke:var(--accentD);stroke-width:2}
  .bar.sel{fill:#f08a3e}
  .bar.ok{fill:#86efac;stroke:var(--g2)}
  .bar.bad{fill:#fde68a;stroke:#d97706}
  .bar.th{fill:#bbf7d0;stroke:var(--g2)}
  .binsel{fill:none;stroke:var(--focus);stroke-width:3;stroke-dasharray:6 4}
  .nsh{fill:#f5b78a;stroke:none}
  .ncv{fill:none;stroke:var(--accentD);stroke-width:3;stroke-linejoin:round}
  .nsd{stroke:#b9a090;stroke-width:1.5;stroke-dasharray:4 4}
  .nmu{stroke:#3b2f25;stroke-width:2;stroke-dasharray:4 4}
  .nz{font-size:13px;font-weight:700;font-style:italic;fill:#7a5a40}
  .pt{fill:var(--accent);stroke:#fff;stroke-width:2}
  .pt.p{fill:#b91c1c;stroke:#1f1a16;stroke-width:2.5}
  .uline{stroke:var(--b2);stroke-width:4;stroke-linecap:round}
  .lsrl{stroke:var(--g2);stroke-width:3.5;stroke-dasharray:10 7}
  .res{stroke:#b91c1c;stroke-width:2;stroke-dasharray:4 3}
  .mk{font-size:14px;font-weight:800}
  .tr{stroke:#8a7563;stroke-width:2.5;fill:none}
  .nd{fill:#fff;stroke:#3b2f25;stroke-width:2}
  .ndt{font-size:15px;font-weight:800;fill:#1f1a16}
  .leaf rect{fill:#fff;stroke:var(--line);stroke-width:2.5}
  .leaf.on rect{fill:#fde3cf;stroke:var(--accentD);stroke-width:3.5}
  .leaf.ok rect{fill:var(--good-bg);stroke:var(--g2)}
  .leaf.bad rect{fill:var(--hint-bg);stroke:#d97706}
  .leaf:focus{outline:none}
  .leaf:focus-visible rect{stroke:var(--focus);stroke-width:4}
  .leaf text{font-size:16px;font-weight:800;fill:#1f1a16}
  .readout{font-weight:700;text-align:center;line-height:1.9;min-height:1.5em}
  .readout .math{white-space:normal}
  .acts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;margin:.5rem 0}
  .acts:empty{display:none}
  .tools{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:.3rem 0}
  .chips{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;min-height:2rem;direction:ltr}
  .chips span{background:#fdf0e6;border:1px solid var(--line);border-radius:8px;padding:.1rem .45rem;font-weight:800}
  .chips span.hit{background:#fde3cf;border-color:var(--accentD)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:.35rem;direction:ltr;max-width:560px;margin:.3rem auto}
  .cards span{border:2px solid var(--line);border-radius:8px;min-height:44px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;background:#fff}
  .cards span.a{border-color:var(--accentD);border-width:4px}
  .cards span.b{background:#d6e7f6}
  .cards span.ab{border-color:var(--accentD);border-width:4px;background:#d6e7f6}
  .legend{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:.92rem}
  .legend i{display:inline-block;width:18px;height:18px;border-radius:4px;vertical-align:middle;margin-inline-end:.3rem;border:2px solid #3b2f25}
  .twoway{border-collapse:collapse;margin:.3rem auto;font-weight:700;font-size:1.02rem}
  .twoway th,.twoway td{border:2px solid #e0bfa4;padding:.35rem .5rem;text-align:center;min-width:3.6rem}
  .twoway th{background:#fdf0e6}
  .twoway td.tot,.twoway th.tot{background:#f7e6d8}
  .twoway td.blank{background:#fff8e1}
  .twoway td.ok{background:var(--good-bg)}
  .twoway td.bad{background:var(--hint-bg)}
  .twoway td.hl{outline:3px solid var(--b2);outline-offset:-3px}
  .twoway input{width:4.2rem;min-height:44px;font-size:1.1rem;font-weight:800;text-align:center;border:2px solid #d0a888;border-radius:8px}
  .twrap{overflow-x:auto;max-width:100%}
  .twoway .num{unicode-bidi:isolate;direction:ltr}

  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:1rem}
  .drawer.open{display:flex}
  .drawer .card{background:var(--panel);border-radius:16px;max-width:600px;width:100%;padding:1rem;max-height:90vh;overflow:auto}
  .setrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0;padding:.5rem 0;border-bottom:1px solid var(--line)}
  .setrow .lab{font-weight:700;min-width:150px}
  .toggle{display:inline-flex;align-items:center;gap:.35rem;border:2px solid var(--line);border-radius:10px;padding:.35rem .55rem;background:#fff;min-height:44px}
  .toggle input{width:22px;height:22px}
  select.diff,input.seedin{font-size:1rem;padding:.4rem;border-radius:10px;border:2px solid var(--line);min-height:48px;max-width:100%}
  input.seedin{width:9rem}
  .wrapflex{display:flex;flex-wrap:wrap;gap:.4rem}

  footer{max-width:1200px;margin:.5rem auto 2rem;padding:.8rem;color:var(--muted);font-size:.9rem;text-align:center}
  footer a{color:var(--accentD);font-weight:700}
  .stds{font-size:.82rem;color:var(--muted);background:#fdf6f0;border:1px dashed var(--line);border-radius:12px;padding:.5rem .7rem;margin-top:.4rem}

  .hidden{display:none !important}
  :focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  @media (max-width:480px){ :root{font-size:16.5px} main{padding:.5rem} .panel{padding:.6rem} .tabs button{padding:.4rem .5rem;font-size:.9rem} .twoway th,.twoway td{padding:.25rem .3rem;min-width:2.8rem;font-size:.92rem} .twoway input{width:3.4rem} }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

  .printonly{display:none}
  @media print{
    .topbar,.tabsrow,footer,.modepanel,#stdsNote,.no-print,#mtMuteBtn{display:none !important}
    body{background:#fff}
    .printonly{display:block}
    .card-print{border:2px solid #000;border-radius:12px;padding:1rem;margin:0 0 1rem;page-break-inside:avoid}
    .card-print h2{margin:.2rem 0}
    .card-print svg.chart{max-width:460px;border:1px solid #000}
    main{max-width:100%}
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">🎲 <span data-t="appTitle">Data &amp; Chance Lab</span></span>
  <a class="homebtn" href="../../index.html">🏠 <span data-t="home">Home</span></a>
  <label class="globe"><span aria-hidden="true">🌐</span>
    <select id="langSelect" aria-label="Language / Idioma"></select>
  </label>
  <button class="tb settingsbtn" id="openSettings" type="button">⚙️ <span data-t="teacher">Teacher</span></button>
</header>

<main>
  <div class="tabsrow">
    <div class="tabs" id="tabs" role="tablist" data-ta="modesLbl" aria-label="Modes"></div>
    <span class="stars" id="stars"><span aria-hidden="true">✔</span><span class="sr" data-t="stars">Correct answers</span> <b id="starCount">0</b></span>
  </div>
  <div id="panels"></div>
  <div class="stds" id="stdsNote"></div>
  <div class="printonly" id="printArea"></div>
</main>

<footer>
  <p data-t="footNote">No accounts · No data collected · Works offline</p>
  <p><a href="../../index.html" data-t="home">Home</a> · <a href="../../policy.html" data-t="privacy">Privacy</a></p>
</footer>

<!-- SETTINGS -->
<div class="drawer" id="settingsDrawer" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="card">
    <div class="panelhead"><h2 id="setTitle" data-t="teacherTitle">Teacher settings</h2>
      <button class="btn ghost" id="closeSettings" type="button" data-t="close">Close</button></div>
    <div class="setrow"><label class="lab" for="setLevel" data-t="setLevel">Course level</label>
      <select class="diff" id="setLevel">
        <option value="ms" data-t="lvMS">Middle school review</option>
        <option value="a1" data-t="lvA1">Algebra I statistics</option>
        <option value="st" data-t="lvST">Statistics &amp; Probability</option></select>
      <p class="stds" style="margin:0;flex:1 1 100%" data-t="levelNote"></p></div>
    <div class="setrow"><label class="lab" for="setSize" data-t="setSize">Data set size</label>
      <select class="diff" id="setSize">
        <option value="s" data-t="sizeS">Small</option>
        <option value="m" data-t="sizeM">Medium</option>
        <option value="l" data-t="sizeL">Large</option></select></div>
    <div class="setrow"><label class="lab" for="setSim" data-t="setSim">Most trials per click</label>
      <select class="diff" id="setSim">
        <option value="100">100</option>
        <option value="1000">1000</option>
        <option value="10000">10000</option></select></div>
    <div class="setrow"><label class="lab" for="setSeed" data-t="setSeed">Class seed</label>
      <input class="seedin" id="setSeed" type="text" inputmode="numeric" maxlength="6" autocomplete="off">
      <p class="stds" style="margin:0;flex:1 1 100%" data-t="seedNote"></p></div>
    <div class="setrow"><span class="lab" data-t="setModes">Modes</span>
      <div id="modeToggles" class="wrapflex"></div></div>
    <div class="setrow"><span class="lab" data-t="setSpeech">Speech</span>
      <label class="toggle"><input type="checkbox" id="setAuto"> <span data-t="autoRead">Auto-read directions</span></label></div>
    <div class="setrow" style="border:0"><button class="btn" id="printCards" type="button">🖨 <span data-t="printCards">Print challenge cards</span></button></div>
    <p class="stds" data-t="setStored">Settings are saved only on this device. No student information is ever stored.</p>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   Data & Chance Lab — single-file Grades 9–12 statistics & probability app.
   7 languages. No frameworks, no network, no data collection.
   Every round's data set comes from a seeded generator (no external data).
   ========================================================================= */

const LANGS = [
  {code:"en", name:"English",     dir:"ltr", bcp:"en-US"},
  {code:"es", name:"Español",     dir:"ltr", bcp:"es-ES"},
  {code:"vi", name:"Tiếng Việt",  dir:"ltr", bcp:"vi-VN"},
  {code:"ar", name:"العربية",     dir:"rtl", bcp:"ar-SA"},
  {code:"hi", name:"हिन्दी",       dir:"ltr", bcp:"hi-IN"},
  {code:"ur", name:"اردو",        dir:"rtl", bcp:"ur-PK"},
  {code:"zh", name:"中文",         dir:"ltr", bcp:"zh-CN"}
];
const LANG_KEY = "tcea.mathtools.lang";

/* ---------- Translations ---------- */
const T = {
  en:{

    footNote:"No accounts · No data collected · Works offline",
    mDist:"Distributions", mCmp:"Compare Groups", mScat:"Scatter & Regression", mProb:"Probability", mTwo:"Two-Way Tables",

    setModes:"Modes", setSpeech:"Speech", autoRead:"Auto-read directions", printCards:"Print challenge cards",
    setStored:"Settings are saved only on this device. No student information is ever stored.",
    dataset:"Data set", neg:"negative {n}", frSay:"{n} over {d}", yes:"Correct.", youPicked:"You chose {x}.",
    wTimes:"times", wPlus:"plus", wMinus:"minus", wEq:"equals", yhat:"y hat",
    nVals:"n = {n}", sortBtn:"Sort the data", unsortBtn:"Original order", dataLbl:"Data",
    chartDot:"Dot plot of the data", chartBox:"Box plots", chartHist:"Histogram", chartScat:"Scatter plot", chartTree:"Tree diagram",
    /* contexts */
    cQuiz:"Quiz scores (out of 20)", cPts:"Points scored per game", cPlant:"Plant heights (cm)", cCommute:"Commute times (minutes)", cPush:"Push-ups in one minute", cBooks:"Books read this year",
    gFert:"With fertilizer", gNoFert:"Without fertilizer", gBus:"Bus riders", gBike:"Bike riders", gP1:"1st period", gP2:"6th period", g9:"9th graders", g12:"12th graders",
    /* distributions */
    qMean:"What is the mean of these {n} values?", qMedian:"What is the median of these {n} values?", qMode:"What is the mode of these {n} values?",
    qRange:"What is the range of these {n} values?", qIQR:"What is the interquartile range (IQR) of these {n} values?",
    qMAD:"What is the mean absolute deviation (MAD) of these {n} values?", qSD:"What is the sample standard deviation s of these {n} values?",
    rndNote:"Round to the nearest tenth.",
    hMean:"The mean is the sum divided by the number of values: {sum} ÷ {n} = {v}.",
    hMedOdd:"Sort the {n} values first. The median is the middle value, in position {k}: {v}.",
    hMedEven:"Sort the {n} values first. With an even count, the median is the mean of the two middle values, {a} and {b}: {v}.",
    hMode:"The mode is the value that appears most often: {v} appears {k} times.",

/* ---------- Utils & seeded randomness ---------- */
const $ = s=>document.querySelector(s);

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let q=Math.imul(a^a>>>15,1|a); q=q+Math.imul(q^q>>>7,61|q)^q; return ((q^q>>>14)>>>0)/4294967296; }; }
let rng = Math.random;
const roundCount = {dist:0,cmp:0,scat:0,prob:0,two:0};
function seedRound(m){
  roundCount[m]++;
  const fx=settings.seed, s=fx!==""?((+fx*7919+MODES.indexOf(m)*1009+roundCount[m]*131)%99991)+1:1+Math.floor(Math.random()*99990);
  rng=mulberry32(s*2654435761>>>0); return s;
}
const rand = a=>a[Math.floor(rng()*a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const ri = (a,b)=>a+Math.floor(rng()*(b-a+1));
const gcd = (a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
const LV = ()=>settings.level;
const MINUS = "−";

/* ---------- Numbers: shown {h} and spoken {s} ---------- */
function rnd(v,d){ const p=10**(d==null?2:d); let r=Math.round(v*p+(v>=0?1e-9:-1e-9))/p; return Object.is(r,-0)?0:r; }
function fmt(v,d){ const r=rnd(v,d); return (r<0?MINUS:"")+String(Math.abs(r)); }
function nS(v,d){ const r=rnd(v,d); return r<0?t("neg",{n:String(-r)}):String(r); }
const N2 = (v,d)=>({h:fmt(v,d), s:nS(v,d)});
function FR(n,d){ const g=gcd(n,d); n/=g; d/=g; return {h:d===1?String(n):frH(n,d), s:d===1?String(n):t("frSay",{n,d}), v:n/d, n, d}; }
const PCT = v=>({h:fmt(v,0)+"%", s:fmt(v,0)+"%"});
const isRTL = ()=>(LANGS.find(x=>x.code===lang)||{}).dir==="rtl";
function rtlFix(str){ if(!isRTL()) return str;
  return str.replace(/[A-Za-z0-9({][A-Za-z0-9(){},.÷×=+−\-|√ ]*[A-Za-z0-9)}]/g,r=>/[=÷×−|]|\(\w+/.test(r)?`<bdi dir="ltr">${r}</bdi>`:r); }
function tm(key,vars){ const h={},s={}; vars=vars||{};
  for(const k in vars){ const v=vars[k]; if(v&&typeof v==="object"){ h[k]=v.raw?v.h:(v.h.indexOf("<bdi")===0?v.h:M(v.h)); s[k]=v.s; } else { h[k]=v; s[k]=v; } }
  return {h:rtlFix(t(key)).replace(/\{(\w+)\}/g,(m0,k)=>k in h?h[k]:m0), s:t(key,s)};
}
const cat = (...m)=>({h:m.map(x=>x.h).join(" "), s:m.map(x=>x.s).join(" ")});
const TX = k=>({h:rtlFix(t(k)), s:t(k)});
const W_ = s=>({h:s,s:s,raw:true}); // plain translated word (no math styling)
// "a × b" style calc strings
const calcS = s=>s.replace(/×/g," "+t("wTimes")+" ").replace(/ \+ /g," "+t("wPlus")+" ").replace(/ − /g," "+t("wMinus")+" ").replace(/=/g," "+t("wEq")+" ").replace(/ŷ/g,t("yhat")).replace(/−(\d)/g,(m,d)=>t("neg",{n:d}));

/* ---------- Statistics ---------- */
const sum = a=>a.reduce((x,y)=>x+y,0), mean = a=>sum(a)/a.length;
const srt = a=>a.slice().sort((x,y)=>x-y);
function med(a){ const s=srt(a), n=s.length, h=n>>1; return n%2?s[h]:(s[h-1]+s[h])/2; }
function five(a){ const s=srt(a), n=s.length, h=n>>1; return {min:s[0], q1:med(s.slice(0,h)), med:med(s), q3:med(s.slice(n-h)), max:s[n-1], s, h}; }
const madF = a=>{ const m=mean(a); return mean(a.map(x=>Math.abs(x-m))); };
const sdP = a=>{ const m=mean(a); return Math.sqrt(mean(a.map(x=>(x-m)**2))); };
const sdS = a=>{ const m=mean(a); return Math.sqrt(sum(a.map(x=>(x-m)**2))/(a.length-1)); };
function modeOf(a){ const c={}; a.forEach(v=>c[v]=(c[v]||0)+1); const mx=Math.max(...Object.values(c)); const ms=Object.keys(c).filter(k=>c[k]===mx).map(Number); return {ms, k:mx}; }
function linreg(P){ const n=P.length, mx=mean(P.map(p=>p[0])), my=mean(P.map(p=>p[1]));
  let sxy=0,sxx=0,syy=0; P.forEach(([x,y])=>{ sxy+=(x-mx)*(y-my); sxx+=(x-mx)**2; syy+=(y-my)**2; });
  const m=sxy/sxx; return {m, b:my-m*mx, r:sxy/Math.sqrt(sxx*syy), mx, my, sst:syy}; }
const sse = (P,m,b)=>sum(P.map(([x,y])=>(y-(m*x+b))**2));

/* ---------- Choice builders ---------- */
function numOpts(v,cands,d,neg){
  const out=[{...N2(v,d),ok:true,v}], seen=[fmt(v,d)], step=10**-(d==null?2:d);
  const more=cands.concat([v+1,v-1,v+2,v*2,v+.5,v-.5,v+3].map(x=>Math.abs(v)<3?v+(x-v)/2:x)).concat([v+step*3,v-step*3,v+step*7]);
  for(const c of more){ if(out.length>=4) break; if(c==null||!isFinite(c)) continue; if(c<0&&v>=0&&!neg) continue;
    const k=fmt(c,d); if(seen.includes(k)) continue; seen.push(k); out.push({...N2(c,d),ok:false,v:c}); }
  return shuffle(out);
}
function frOpts(n,d,cands){
  const c0=FR(n,d), out=[{...c0,ok:true}], seen=[c0.v];
  for(const [a,b] of cands.concat([[n+1,d],[Math.max(1,n-1),d],[n,d+1],[d-n,d],[1,d]])){ if(out.length>=4) break; if(!b||a<0||a>b) continue;
    const f=FR(a,b); if(seen.some(x=>Math.abs(x-f.v)<1e-9)) continue; seen.push(f.v); out.push({...f,ok:false}); }
  return shuffle(out);
}
const TCH = (k,ok,vars,extra)=>({...tm(k,vars),ok,txt:true,...(extra||{})});

function dotSize(data){ const k=modeOf(data).k; return Math.max(4.5,Math.min(9,62/k)); }

// Pointer + keyboard wiring for one interactive SVG (listeners survive redraws of its children).
function interactive(svg,cfg){ let act=null;
  const pt=e=>{ const r=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal; return {x:(e.clientX-r.left)/r.width*vb.width, y:(e.clientY-r.top)/r.height*vb.height}; };
  svg.addEventListener("pointerdown",e=>{ if(cfg.off()) return; act=cfg.down(pt(e)); if(act!=null){ try{ svg.setPointerCapture(e.pointerId); }catch(_){} } e.preventDefault(); });
  svg.addEventListener("pointermove",e=>{ if(act==null||cfg.off()) return; cfg.move(act,pt(e)); });
  const up=()=>{ act=null; }; svg.addEventListener("pointerup",up); svg.addEventListener("pointercancel",up);
  svg.addEventListener("keydown",e=>{ if(cfg.off()) return; if(cfg.key(e)) e.preventDefault(); });

/* ---------- Speech ---------- */
const speechOK = ("speechSynthesis" in window);
function bcpFor(l){ const m=LANGS.find(x=>x.code===l); return m?m.bcp:"en-US"; }
function pickWarmVoice(code){
  const vs = speechSynthesis.getVoices()||[];
  const want=code.toLowerCase(), two=want.slice(0,2);
  let best=null, bs=-1;
  for(const v of vs){
    const lc=(v.lang||'').toLowerCase().replace('_','-');
    if(lc!==want && lc.slice(0,2)!==two) continue;
    let s=(lc===want?100:60); const n=(v.name||'').toLowerCase();
    if(/google|natural|neural|online|premium|enhanced|siri/.test(n)) s+=40;
    if(/female|woman|samantha|karen|tessa|moira|fiona|serena|victoria|allison|ava|susan|zoe|amelie|amélie|paulina|monica|mónica|zira|hazel|catherine|linda|kanya|lekha|ting-ting|mei-jia|sin-ji|yu-shu|huihui|xiaoxiao/.test(n)) s+=18;
    if(/espeak|compact|festival|pico|robot|eloquence/.test(n)) s-=60;
    if(v.localService===false) s+=8;
    if(v.default) s+=2;
    if(s>bs){ bs=s; best=v; }
  }
  return best;
}
/* Speech queue. Fixes cut-off audio:
   - a new round no longer calls cancel() over the praise; rounds advance on onend
   - long text is split into sentences (Chrome stops utterances after ~15 s)
   - utterances are kept referenced so Chrome can't garbage-collect them mid-speech
   - after cancel(), the next speak() waits a beat (Chrome drops it otherwise) */
let speechGen=0, speechKeep=[], speechPendingDone=null, speechStarted=false;
function splitSpeech(text){
  // split after sentence punctuation (not inside decimals such as 3.14)
  const parts=String(text).split(/(?<=[.!?؟।۔])\s+|(?<=[。！？])/);
  return parts.map(x=>x.trim()).filter(Boolean);
}
function speechEstimateMs(text){ const per=/^(zh)$/.test(lang)?300:95; return 1200+String(text).length*per/0.9; }
function stopSpeech(){
  speechGen++; const d=speechPendingDone; speechPendingDone=null; speechKeep=[];
  if(speechOK){ try{ speechSynthesis.cancel(); }catch(e){} }
  if(d) setTimeout(d,0);
}
function speak(text,onDone){
  const prevDone=speechPendingDone; speechPendingDone=null;
  const gen=++speechGen; let fired=false;
  const done=()=>{ if(fired) return; fired=true; if(speechPendingDone===done) speechPendingDone=null; if(onDone) onDone(); };
  if(onDone) speechPendingDone=done;
  if(prevDone) setTimeout(prevDone,0);  // a superseded speech still lets its round advance
  if(!speechOK || !text || window.__MT_MUTED){ if(onDone) setTimeout(done,700); return; }
  let busy=false;
  try{ busy=speechSynthesis.speaking||speechSynthesis.pending; speechSynthesis.cancel(); }catch(e){}
  const parts=splitSpeech(text), bcp=bcpFor(lang), voice=pickWarmVoice(bcp);
  const start=()=>{
    if(gen!==speechGen) return;
    speechKeep=[];
    try{
      if(speechSynthesis.paused) speechSynthesis.resume();
      parts.forEach((p,i)=>{
        const u=new SpeechSynthesisUtterance(p);
        u.lang=bcp; if(voice) u.voice=voice; u.rate=0.9; u.pitch=1.15;
        u.onstart=()=>{ speechStarted=true; };
        if(i===parts.length-1){ u.onend=done; u.onerror=done; }
        speechKeep.push(u); speechSynthesis.speak(u);
      });
    }catch(e){ done(); }
  };
  if(busy) setTimeout(start,120); else start();
  // Safety net: some engines never fire onend.
  if(onDone) setTimeout(done,speechEstimateMs(text)+2500);
}
/* Speak praise, then start the next round once it finishes (never sooner than minMs). */
const roundIds={dist:0,cmp:0,scat:0,prob:0,two:0};
function afterPraise(msg,key,next,minMs){
  const id=roundIds[key], t0=Date.now();
  speak(msg,()=>{
    const wait=Math.max(450,(minMs||1200)-(Date.now()-t0));
    setTimeout(()=>{ if(roundIds[key]===id) next(); },wait);
  });
}

  document.removeEventListener("pointerdown",firstTap,true);

  if(e.target.closest("button,select,a,input,svg.chart")) return;

},true);

  $("#setSim").addEventListener("change",e=>{ settings.sim=+e.target.value; saveSettings(); resetRounds(); });
  $("#setSeed").addEventListener("change",e=>{ settings.seed=e.target.value.replace(/\D/g,"").slice(0,6); e.target.value=settings.seed; saveSettings(); resetRounds(); });
  $("#setAuto").addEventListener("change",e=>{ settings.autoRead=e.target.checked; saveSettings(); });
  $("#printCards").addEventListener("click",()=>{ buildPrintCards(); window.print(); });
}

/* ---------- Print cards ---------- */
function buildPrintCards(){
  const saveRng=rng; rng=mulberry32((Math.random()*1e9)>>>0);
  const c=CTX1[0], a=genData(9,c,"sym"), a2=genData(14,CTX1[2],rand(["right","left","sym"]));
  const X=lin(c.lo,c.hi,40,VW-30), axis=`<svg class="chart" viewBox="0 0 ${VW} 70">${axisX(c.lo,c.hi,X,20,1)}</svg>`;
  const cx=SC[0], P=genScatter(cx,9,null), v=scView(P,cx,null), sc=`<svg class="chart" viewBox="0 0 ${VW} ${v.H}">${scFrame(v,cx)}${P.map(p=>`<circle class="pt" cx="${v.X(p[0])}" cy="${v.Y(p[1])}" r="6"/>`).join("")}</svg>`;
  const S=SPACES.cd, ctx=TW[0], g=genTable(ctx,false), blank=new Set(["0,1","1,0","2,2"]);
  const bw=4, b0=Math.floor(Math.min(...a2)/bw)*bw, bins=[]; for(let x=b0;x<=Math.max(...a2);x+=bw) bins.push(`${x}–${x+bw-1}`);
  const blankL=`<span style="display:inline-block;min-width:6rem;border-bottom:2px solid #000">&nbsp;</span>`;
  const cards=[
    {title:t("mDist"), body:t("cardStats"), html:`${dataListHTML(a)}<p>${t("stMean")} ${blankL} · ${t("stMedian")} ${blankL} · ${t("stRange")} ${blankL} · IQR ${blankL}</p>${axis}`},
    {title:t("mDist"), body:t("cardHist"), html:`${dataListHTML(a2)}<p dir="ltr">${bins.join(" | ")}</p>`},
    {title:t("mScat"), body:t("cardFit",{x:fmt(cx.x1+2)}), html:sc},
    {title:t("mProb"), body:t("cardTree",{ex:t(S.ex),ev:t(S.ev[0][0])}), html:`<p>${blankL}${blankL}</p>`},
    {title:t("mProb"), body:t("cardSim"), html:`<p>${blankL}${blankL}${blankL}</p>`},
    {title:t("mTwo"), body:t("cardTwo",{r:t(ctx.r[0]),c:t(ctx.c[0])}), html:tblHTML(ctx,g,{blank}).replace(/<input[^>]*>/g,"&nbsp;")}
  ];
  rng=saveRng;
  $("#printArea").innerHTML=`<h1>${t("cardTitle")}</h1><p>${t("cardName")} ____________________</p>`+
    cards.map(c=>`<div class="card-print"><h2>${c.title}</h2><p style="font-size:1.15rem;line-height:1.8">${c.body}</p>${c.html}</div>`).join("")+
    `<p style="font-size:.85rem">${stdsHTML()}</p>`;
}
function stdsHTML(){ return t("stds").replace(/(TEKS|Common Core|HSS-[A-Z]{2}\.[A-C]\.\d(?:–\d)?|\d\.SP\.[A-C]\.\d(?:–\d)?|A1\.\d\([^)]*\)|\d\.\d+\([^)]*\))/g,'<bdi dir="ltr">$1</bdi>'); }

/* ---------- Language engine ---------- */
function resolveLang(){
  try{ const q=new URLSearchParams(location.search).get("lang"); if(q && T[q]) return q; }catch(e){}
  try{ const s=localStorage.getItem(LANG_KEY); if(s && T[s]) return s; }catch(e){}
  const n=(navigator.language||"en").slice(0,2).toLowerCase();
  if(T[n]) return n;
  return "en";
}
function applyLang(){
  const meta=LANGS.find(x=>x.code===lang)||LANGS[0];
  document.documentElement.lang=lang;
  document.documentElement.dir=meta.dir;
  document.title=t("appTitle");
  const sel=$("#langSelect"); if(sel) sel.value=lang;
  $$("[data-t]").forEach(el=>{ el.textContent=t(el.getAttribute("data-t")); });
  $$("[data-ta]").forEach(el=>{ const v=t(el.getAttribute("data-ta")); el.setAttribute("aria-label",v); el.title=v; });
  $("#stdsNote").innerHTML=stdsHTML();
  buildModeToggles();
  resetRounds();
}
function setLang(l){ if(!T[l]) l="en"; lang=l; try{ localStorage.setItem(LANG_KEY,l); }catch(e){} applyLang(); }
function buildLangSelect(){
  const sel=$("#langSelect"); sel.innerHTML="";
  LANGS.forEach(m=>{ const o=document.createElement("option"); o.value=m.code; o.textContent=m.name; sel.appendChild(o); });
  sel.value=lang;
  sel.addEventListener("change",()=>setLang(sel.value));
}

/* ---------- Init ---------- */
function buildUI(){
  $("#tabs").innerHTML=MODES.map(m=>`<button type="button" role="tab" id="tab-${m}" aria-controls="mode-${m}" aria-selected="false" data-mode="${m}"><span class="ic" aria-hidden="true">${MODE_IC[m]}</span><span data-t="${MODE_KEY[m]}"></span></button>`).join("");
  $("#panels").innerHTML=MODES.map(m=>`<section id="mode-${m}" class="panel modepanel hidden" role="tabpanel" aria-labelledby="tab-${m}">
    <div class="panelhead"><h2 data-t="${MODE_KEY[m]}"></h2><button type="button" class="btn ghost no-print" data-new="${m}">🔄 <span data-t="newRound"></span></button></div>
    <div class="prompt"><button type="button" class="speaker" data-speak="${m}" data-ta="readAloud" aria-label="Read aloud">🔊</button><span id="p-${m}">…</span></div>
    <div class="work" id="w-${m}"></div>
    <div class="acts no-print" id="a-${m}"></div>
    <div class="choices" id="c-${m}" role="group" data-ta="choicesLbl" aria-label="Answer choices"></div>
    <div class="feedback" id="f-${m}" role="status" aria-live="polite"></div></section>`).join("");
  $("#tabs").addEventListener("keydown",e=>{ const vis=$$(".tabs button").filter(b=>!b.classList.contains("hidden")), i=vis.indexOf(document.activeElement); if(i<0) return;
    const rtl=document.documentElement.dir==="rtl", stp={ArrowRight:rtl?-1:1,ArrowLeft:rtl?1:-1}[e.key]; if(!stp) return;
    const nb=vis[(i+stp+vis.length)%vis.length]; nb.focus(); showMode(nb.dataset.mode); e.preventDefault(); });
}
function init(){
  lang=resolveLang();
  buildUI();
  buildLangSelect();
  $$(".tabs button").forEach(b=>b.addEventListener("click",()=>showMode(b.dataset.mode)));
  $$(".speaker").forEach(b=>b.addEventListener("click",()=>speak(currentSpeech[b.dataset.speak])));
  $$("[data-new]").forEach(b=>b.addEventListener("click",()=>{ stopSpeech(); NEWFN[b.dataset.new](); }));
  initSettings();
  const f=firstMode();
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===f; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; b.classList.toggle("hidden",!settings.modes[b.dataset.mode]); });
  $$(".modepanel").forEach(p=>p.classList.toggle("hidden",p.id!=="mode-"+f));
  applyLang();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
</script>
<script>
/* Student mute toggle — shared across the Digital Math Tools. Self-contained,
   offline, stores no student data. Gates ALL speech by intercepting
   speechSynthesis.speak, so muting works regardless of each tool's internals.
   Reads the shared language preference only to localize its own label. */
(function(){
  "use strict";
  var LKEY='tcea.mathtools.lang', MKEY='tcea.mathtools.muted';
  var CODES=['en','es','vi','ar','hi','ur','zh'];
  var LAB={
    mute:{en:"Mute sound",es:"Silenciar sonido",vi:"Tắt âm thanh",ar:"كتم الصوت",hi:"आवाज़ बंद करें",ur:"آواز بند کریں",zh:"静音"},
    unmute:{en:"Turn sound on",es:"Activar sonido",vi:"Bật âm thanh",ar:"تشغيل الصوت",hi:"आवाज़ चालू करें",ur:"آواز چالو کریں",zh:"打开声音"}
  };
  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  window.__MT_MUTED = (get(MKEY)==='1');
  // Intercept every speech request; suppress while muted.
  try{
    if(window.speechSynthesis && typeof window.speechSynthesis.speak==='function'){
      var ss=window.speechSynthesis, orig=ss.speak.bind(ss);
      ss.speak=function(u){ if(!window.__MT_MUTED){ try{orig(u);}catch(e){} } };
    }
  }catch(e){}
  function curLang(){ var l=get(LKEY)||'en'; return LAB.mute[l]?l:'en'; }
  function label(el){
    var on=!window.__MT_MUTED, l=curLang(), txt=on?LAB.mute[l]:LAB.unmute[l];
    el.textContent=on?'🔊':'🔇';
    el.setAttribute('aria-label',txt); el.setAttribute('title',txt);
    el.setAttribute('aria-pressed', on?'false':'true');
  }
  function findLangSelect(){
    var sels=document.querySelectorAll('select');
    for(var i=0;i<sels.length;i++){ var o=sels[i].options, c=0;
      for(var j=0;j<o.length;j++){ if(CODES.indexOf((o[j].value||'').toLowerCase())>=0) c++; }
      if(c>=3) return sels[i];
    }
    return null;
  }
  function build(){
    if(document.getElementById('mtMuteBtn')) return;
    if(!(('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window))) return;
    var btn=document.createElement('button');
    btn.id='mtMuteBtn'; btn.type='button';
    btn.style.cssText='font:inherit;font-size:1.15rem;line-height:1;cursor:pointer;'+
      'min-width:44px;min-height:44px;padding:8px 12px;border:2px solid #e2dcf1;'+
      'border-radius:10px;background:#fff;color:#5b3fa5;font-weight:700;margin:0 4px;';
    btn.addEventListener('click',function(){
      window.__MT_MUTED=!window.__MT_MUTED;
      set(MKEY, window.__MT_MUTED?'1':'0');
      if(window.__MT_MUTED){ try{window.speechSynthesis.cancel();}catch(e){} }
      label(btn);
    });
    btn.addEventListener('focus',function(){btn.style.outline='3px solid #5b3fa5';btn.style.outlineOffset='2px';});
    btn.addEventListener('blur',function(){btn.style.outline='';});
    var sel=findLangSelect();
    if(sel && sel.parentNode){
      sel.parentNode.insertBefore(btn, sel);
      sel.addEventListener('change',function(){ setTimeout(function(){label(btn);},0); });
    }else{
      btn.style.position='fixed'; btn.style.top='10px'; btn.style.zIndex='9999';
      btn.style[(document.documentElement.dir==='rtl')?'left':'right']='10px';
      (document.body||document.documentElement).appendChild(btn);
    }
    label(btn);
  }
  if(document.readyState==='complete'){ build(); }
  else{ window.addEventListener('load', build); }
  window.addEventListener('storage',function(e){ if(e.key===LKEY){ var b=document.getElementById('mtMuteBtn'); if(b) label(b); } });
})();
</script>
