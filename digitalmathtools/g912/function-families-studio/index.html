<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Function Families Studio — a Grades 9–12 app for parent functions, transformations, exponential growth and decay, logarithms and inverses, and function operations with domain and range. Works offline. No data collected.">
<title>Function Families Studio</title>
<style>
  :root{
    --bg:#f4eff8;--panel:#ffffff;--ink:#1d1526;--muted:#55496a;--line:#d9cce6;
    --accent:#8e44ad;--accentD:#6c3483;--accent-ink:#ffffff;--good:#166534;--good-bg:#dcfce7;
    --hint:#7a4a00;--hint-bg:#fff4d6;--focus:#0a58ca;--tgt:#d35400;--par:#7f8c8d;
    --tap:48px;font-size:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-text-size-adjust:100%}
  h1,h2,h3{line-height:1.15;margin:0 0 .3em}
  button{font-family:inherit;font-size:1rem;cursor:pointer}
  button:disabled{cursor:default}

  .topbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--accentD);color:var(--accent-ink);padding:.55rem .8rem}
  .topbar .brand{font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:.4rem;margin-inline-end:auto}
  .topbar a.homebtn,.topbar button.tb{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.4rem .7rem;min-height:var(--tap);min-width:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:.35rem;text-decoration:none;font-weight:700;font-size:.95rem}
  .globe{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.2rem .5rem;min-height:var(--tap)}
  .globe span{font-size:1.2rem}
  .globe select{border:0;background:#fff;color:var(--ink);border-radius:8px;min-height:44px;font-weight:700;font-size:1rem;padding:.2rem .4rem}

  main{max-width:1200px;margin:0 auto;padding:.7rem}
  .tabsrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 .7rem}
  .tabs{display:flex;gap:.4rem;flex-wrap:wrap;flex:1 1 auto}
  .tabs button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.45rem .75rem;min-height:var(--tap);font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:.4rem}
  .tabs button[aria-selected="true"]{background:var(--accentD);color:#fff;border-color:var(--accentD)}
  .tabs button .ic{font-size:1.15rem}
  .stars{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.4rem .8rem;font-weight:800;font-size:1.1rem;min-height:48px;display:inline-flex;align-items:center;gap:.3rem}
  .stars.pop{animation:pop .5s ease}
  @keyframes pop{50%{transform:scale(1.15)}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:.9rem;margin-bottom:.8rem}
  .panelhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
  .panelhead h2{margin:0;font-size:1.25rem;margin-inline-end:auto}

  .prompt{display:flex;align-items:center;gap:.6rem;background:#f3eaf8;border:2px solid #d7bde6;border-radius:14px;padding:.6rem .8rem;margin-bottom:.7rem;font-size:1.08rem;font-weight:600;line-height:1.9}
  .prompt>span{min-width:0;overflow-wrap:anywhere}
  .speaker{background:var(--accentD);color:#fff;border:0;border-radius:50%;width:var(--tap);height:var(--tap);min-width:var(--tap);font-size:1.3rem;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}

  .btn{background:var(--accentD);color:#fff;border:2px solid var(--accentD);border-radius:12px;padding:.5rem .85rem;min-height:var(--tap);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
  .btn.ghost{background:var(--panel);color:var(--accentD)}
  .btn.on{background:#f3eaf8;color:var(--accentD)}
  .btn.sq{min-width:var(--tap);font-size:1.2rem;padding:.2rem .6rem}
  .btn:disabled{opacity:.45}

  .feedback{margin-top:.6rem;border-radius:12px;padding:.6rem .8rem;font-weight:600;display:none;line-height:1.95}
  .feedback.show{display:block}
  .feedback.good{background:var(--good-bg);color:var(--good);border:2px solid #86efac}
  .feedback.hint{background:var(--hint-bg);color:var(--hint);border:2px solid #f6d271}

  /* Math: always left-to-right, even inside Arabic/Urdu sentences */
  .math{unicode-bidi:isolate;direction:ltr;display:inline;font-weight:800;white-space:nowrap}
  .math i,i.v{font-family:Georgia,'Times New Roman',serif;font-weight:700}
  .math sup{font-size:.72em;line-height:0}
  .math sub{font-size:.72em;line-height:0}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:800;margin:0 .08em;white-space:nowrap;font-size:.9em}
  .fr>span{padding:0 .16em}
  .fr>span:first-child{border-bottom:.12em solid currentColor}
  .rad{white-space:nowrap}
  .rad>span{border-top:.1em solid currentColor;padding:0 .12em;margin-inline-start:.04em}
  .rad sup{font-size:.6em;margin-inline-end:-.35em;vertical-align:.55em}

  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-top:.7rem}
  .choices:empty{display:none}
  .choice{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:.5rem;min-height:64px;display:flex;align-items:center;justify-content:center;position:relative;font-size:1.2rem;font-weight:800;color:var(--ink);min-width:0}
  .choice .lbl{unicode-bidi:isolate;direction:ltr;overflow-wrap:anywhere}
  .choice.txt{font-size:1.02rem}
  .choice.txt .lbl{direction:inherit}
  .choice.gr{padding:.25rem;flex-direction:column}
  .choice.gr svg{width:100%;max-width:170px;height:auto;display:block}
  .choice.gr .gl{font-size:.95rem}
  .choices.grs{grid-template-columns:repeat(2,minmax(0,1fr))}
  @media (min-width:820px){ .choices.grs{grid-template-columns:repeat(4,minmax(0,1fr))} }
  .choice.correctpick{border-color:var(--good);background:var(--good-bg)}
  .choice.wrongpick{border-color:#e3b341;background:var(--hint-bg);opacity:.75}
  .choice .badge{position:absolute;top:4px;inset-inline-end:6px;font-size:1rem;display:none}
  .choice.correctpick .badge{display:block}

  .work:empty{display:none}
  .split{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem;align-items:start}
  @media (min-width:820px){ .split{grid-template-columns:minmax(0,1fr) minmax(0,440px)} }
  .side{display:flex;flex-direction:column;gap:.6rem;align-items:center;min-width:0}
  .pwrap{width:100%;max-width:440px;margin:0 auto}
  svg.plane,svg.nl{direction:ltr}
  .plane{width:100%;height:auto;display:block;touch-action:none;background:#fff;border:2px solid var(--line);border-radius:12px}
  .plane[tabindex]{cursor:crosshair}
  .plane:focus{outline:none}
  .plane:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  .gl{stroke:#e6ddef;stroke-width:1}
  .ax{stroke:#24192e;stroke-width:2.2}
  .tl{font:600 14px system-ui,sans-serif;fill:#5a4d6a}
  .axn{font:italic 700 18px Georgia,serif;fill:#24192e}
  .cv{fill:none;stroke:var(--accent);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
  .cv.par{stroke:var(--par);stroke-width:3;stroke-dasharray:9 7}
  .cv.tg{stroke:var(--tgt);stroke-width:4;stroke-dasharray:13 8}
  .cv.inv{stroke:#16a34a}
  .cv.idl{stroke:#9b8bab;stroke-width:2.5;stroke-dasharray:4 6}
  .cv.hl{stroke:#16a34a;stroke-width:7;opacity:.55}
  .mini .cv{stroke-width:7}
  .mini .cv.par{stroke-width:4}
  .asy{stroke:#c0392b;stroke-width:2.5;stroke-dasharray:8 7}
  .pt{fill:var(--accent);stroke:#fff;stroke-width:2.5}
  .pt.tg{fill:var(--tgt)}
  .pt.ok{fill:#16a34a}
  .pt.bad{fill:#e3a008}
  .pt.open{fill:#fff;stroke:var(--accent);stroke-width:3}
  .ptl{font:800 16px system-ui,sans-serif;fill:#1d1526;paint-order:stroke;stroke:#fff;stroke-width:4}
  .cur{fill:none;stroke:var(--focus);stroke-width:3;display:none}
  .plane:focus-visible .cur{display:inline}

  table.io{border-collapse:collapse;margin:.2rem auto;font-weight:800;font-size:1.1rem;direction:ltr}
  table.io th,table.io td{border:2px solid #c9b3da;padding:.35rem .5rem;min-width:2.5rem;text-align:center}
  table.io th{background:#f3eaf8;font-family:Georgia,serif;font-style:italic}
  table.io td.an{border:0;color:var(--accentD);font-size:.85rem;font-weight:800;padding:.1rem .2rem;white-space:nowrap}
  table.io td.an.b{color:#b45309}
  .tw{max-width:100%;overflow-x:auto}
  .rule{background:#f8f4fb;border:2px dashed #d7bde6;border-radius:12px;padding:.45rem .7rem;text-align:center;font-weight:700;line-height:2}
  .big{font-size:1.45rem;text-align:center;margin:.2rem 0;line-height:2}
  .readout{font-weight:700;text-align:center;line-height:2;min-height:2em}
  .acts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;margin:.5rem 0}
  .acts:empty{display:none}
  .sliders{display:grid;gap:.35rem;width:100%;max-width:440px}
  .sl{display:grid;grid-template-columns:2.2rem minmax(0,1fr) 3.2rem;align-items:center;gap:.5rem;direction:ltr}
  .sl b{font-family:Georgia,serif;font-style:italic;font-size:1.25rem;text-align:center}
  .sl input[type=range]{width:100%;min-height:44px;accent-color:var(--accentD)}
  .sl output{font-weight:800;font-size:1.1rem;text-align:center}
  .legend{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:.92rem}
  .legend .sw{display:inline-block;width:26px;height:5px;border-radius:3px;vertical-align:middle;margin-inline-end:.3rem;background:var(--accent)}
  .legend .sw.tg{background:repeating-linear-gradient(90deg,var(--tgt) 0 8px,transparent 8px 13px)}
  .legend .sw.par{background:repeating-linear-gradient(90deg,var(--par) 0 7px,transparent 7px 12px)}
  .legend .sw.inv{background:#16a34a}
  .legend .sw.asy{background:repeating-linear-gradient(90deg,#c0392b 0 7px,transparent 7px 12px)}
  .legend .sw.idl{background:repeating-linear-gradient(90deg,#9b8bab 0 4px,transparent 4px 9px)}
  .chain{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.4rem;direction:ltr;font-weight:800;font-size:1.15rem}
  .chain .box{border:2px solid var(--line);border-radius:10px;padding:.3rem .6rem;min-width:2.8rem;text-align:center;background:#fff}
  .chain .box.q{background:#fff8e1;color:#b45309}
  .chain .box.done{background:var(--good-bg);color:var(--good)}
  .chain .mach{background:var(--accentD);color:#fff;border-radius:12px;padding:.3rem .7rem;font-family:Georgia,serif;font-style:italic}
  .nl{width:100%;max-width:520px;height:auto;display:block;margin:0 auto;background:#fff;border:2px solid var(--line);border-radius:12px;touch-action:none}
  .nlt{font:600 15px system-ui,sans-serif;fill:#5a4d6a}
  .nlctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;width:100%;max-width:520px}
  .nlctl .grp{border:2px solid var(--line);border-radius:12px;padding:.35rem;display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;justify-content:center}
  .nlctl .grp .t{flex:1 1 100%;text-align:center;font-weight:700;font-size:.9rem}
  .nlctl .val{min-width:2.6rem;text-align:center;font-weight:800;font-size:1.15rem;direction:ltr}

  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:1rem}
  .drawer.open{display:flex}
  .drawer .card{background:var(--panel);border-radius:16px;max-width:600px;width:100%;padding:1rem;max-height:90vh;overflow:auto}
  .setrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0;padding:.5rem 0;border-bottom:1px solid var(--line)}
  .setrow .lab{font-weight:700;min-width:150px}
  .toggle{display:inline-flex;align-items:center;gap:.35rem;border:2px solid var(--line);border-radius:10px;padding:.35rem .55rem;background:#fff;min-height:44px}
  .toggle input{width:22px;height:22px}
  select.diff{font-size:1rem;padding:.4rem;border-radius:10px;border:2px solid var(--line);min-height:48px;max-width:100%}
  .wrapflex{display:flex;flex-wrap:wrap;gap:.4rem}

  footer{max-width:1200px;margin:.5rem auto 2rem;padding:.8rem;color:var(--muted);font-size:.9rem;text-align:center}
  footer a{color:var(--accentD);font-weight:700}
  .stds{font-size:.82rem;color:var(--muted);background:#f8f4fb;border:1px dashed var(--line);border-radius:12px;padding:.5rem .7rem;margin-top:.4rem}

  .hidden{display:none !important}
  :focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  @media (max-width:480px){ :root{font-size:16.5px} main{padding:.5rem} .panel{padding:.6rem} .tabs button{padding:.4rem .5rem;font-size:.9rem} table.io{font-size:.95rem} table.io th,table.io td{padding:.3rem .3rem;min-width:2rem} .choice{font-size:1.05rem} .choice.txt{font-size:.95rem} }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

  .printonly{display:none}
  @media print{
    .topbar,.tabsrow,footer,.modepanel,#stdsNote,.no-print,#mtMuteBtn{display:none !important}
    body{background:#fff}
    .printonly{display:block}
    .card-print{border:2px solid #000;border-radius:12px;padding:1rem;margin:0 0 1rem;page-break-inside:avoid}
    .card-print h2{margin:.2rem 0}
    .card-print svg.plane{max-width:250px;border:1px solid #000}
    main{max-width:100%}
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">🧬 <span data-t="appTitle">Function Families Studio</span></span>
  <a class="homebtn" href="../../index.html">🏠 <span data-t="home">Home</span></a>
  <label class="globe"><span aria-hidden="true">🌐</span>
    <select id="langSelect" aria-label="Language / Idioma"></select>
  </label>
  <button class="tb settingsbtn" id="openSettings" type="button">⚙️ <span data-t="teacher">Teacher</span></button>
</header>

<main>
  <div class="tabsrow">
    <div class="tabs" id="tabs" role="tablist" data-ta="modesLbl" aria-label="Modes"></div>
    <span class="stars" id="stars"><span aria-hidden="true">✔</span><span class="sr" data-t="stars">Correct answers</span> <b id="starCount">0</b></span>
  </div>
  <div id="panels"></div>
  <div class="stds" id="stdsNote"></div>
  <div class="printonly" id="printArea"></div>
</main>

<footer>
  <p data-t="footNote">No accounts · No data collected · Works offline</p>
  <p><a href="../../index.html" data-t="home">Home</a> · <a href="../../policy.html" data-t="privacy">Privacy</a></p>
</footer>

<!-- SETTINGS -->
<div class="drawer" id="settingsDrawer" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="card">
    <div class="panelhead"><h2 id="setTitle" data-t="teacherTitle">Teacher settings</h2>
      <button class="btn ghost" id="closeSettings" type="button" data-t="close">Close</button></div>
    <div class="setrow"><label class="lab" for="setLevel" data-t="setLevel">Course</label>
      <select class="diff" id="setLevel">
        <option value="1" data-t="lv1">Algebra I</option>
        <option value="2" data-t="lv2">Algebra II</option>
        <option value="3" data-t="lv3">Precalculus preview</option></select>
      <p class="stds" style="margin:0;flex:1 1 100%" data-t="levelNote"></p></div>
    <div class="setrow"><label class="lab" for="setRange" data-t="setRange">Grid size</label>
      <select class="diff" id="setRange">
        <option value="6">−6 … 6</option>
        <option value="8">−8 … 8</option>
        <option value="10">−10 … 10</option></select></div>
    <div class="setrow"><span class="lab" data-t="setOpts">Options</span>
      <label class="toggle"><input type="checkbox" id="setB"> <span data-t="bOn">Horizontal stretch b in f(b(x − h))</span></label>
      <label class="toggle"><input type="checkbox" id="setE"> <span data-t="eOn">Base e, ln, and continuous growth</span></label></div>
    <div class="setrow"><span class="lab" data-t="setModes">Modes</span>
      <div id="modeToggles" class="wrapflex"></div></div>
    <div class="setrow"><span class="lab" data-t="setSpeech">Speech</span>
      <label class="toggle"><input type="checkbox" id="setAuto"> <span data-t="autoRead">Auto-read directions</span></label></div>
    <div class="setrow" style="border:0"><button class="btn" id="printCards" type="button">🖨 <span data-t="printCards">Print challenge cards</span></button></div>
    <p class="stds" data-t="setStored">Settings are saved only on this device. No student information is ever stored.</p>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   Function Families Studio — single-file Grades 9–12 app: parent functions,
   transformations, exponential growth/decay, logarithms & inverses,
   function operations and domain/range. 7 languages. No frameworks,
   no network, no data collection.
   ========================================================================= */

  try{
    const raw = localStorage.getItem("ffs_settings");
    if(raw){ const o=JSON.parse(raw), s=Object.assign(clone(DEFAULTS), o, {modes:Object.assign({},DEFAULTS.modes,o.modes)});
      s.level=+s.level; if(!LEVELS[s.level]) s.level=DEFAULTS.level;

}

const rnd = (v,d)=>{ const p=Math.pow(10,d==null?3:d); return Math.round(v*p)/p; };

// Rational-looking numbers as stacked fractions (½, ⅓ …), otherwise decimals.
function qH(v){ if(Number.isInteger(rnd(v,9))) return nH(rnd(v,9)); const f=asFrac(Math.abs(v)); return f?(v<0?MINUS:"")+frH(f[0],f[1]):nH(v); }
function qS(v){ if(Number.isInteger(rnd(v,9))) return nS(rnd(v,9)); const f=asFrac(Math.abs(v)); if(!f) return nS(v); const s=t("frSay",{n:f[0],d:f[1]}); return v<0?t("neg",{n:s}):s; }

/* ---------- Mode switching ---------- */
const NEWFN={parent:newParent,trans:newTrans,growth:newGrowth,logs:newLogs,ops:newOps};
function firstMode(){ return MODES.find(m=>settings.modes[m])||"parent"; }
function currentMode(){ const b=$$(".tabs button").find(x=>x.getAttribute("aria-selected")==="true"); return b?b.dataset.mode:firstMode(); }
function showMode(mode){
  if(!settings.modes[mode]) mode=firstMode();
  const switching=currentMode()!==mode;
  if(switching) stopSpeech();
  const g0=speechGen;
  $$(".modepanel").forEach(p=>p.classList.add("hidden"));
  $("#mode-"+mode).classList.remove("hidden");
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===mode; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; });
  if(!made[mode]) NEWFN[mode]();
  if(switching && speechGen===g0) maybeAuto(mode);
}
function syncTabs(){
  $$(".tabs button").forEach(b=>b.classList.toggle("hidden",!settings.modes[b.dataset.mode]));
  if(!settings.modes[currentMode()]) showMode(firstMode());
}
function resetRounds(){ MODES.forEach(m=>made[m]=false); stopSpeech(); NEWFN[currentMode()](); }

/* ---------- Settings drawer ---------- */
function buildModeToggles(){
  const wrap=$("#modeToggles"); wrap.innerHTML="";
  MODES.forEach(m=>{ const l=document.createElement("label"); l.className="toggle";
    l.innerHTML=`<input type="checkbox" ${settings.modes[m]?"checked":""}> <span>${t(MODE_KEY[m])}</span>`;
    l.querySelector("input").addEventListener("change",e=>{ settings.modes[m]=e.target.checked;
      if(!MODES.some(k=>settings.modes[k])){ e.target.checked=true; settings.modes[m]=true; }
      saveSettings(); syncTabs(); });
    wrap.appendChild(l); });
}
function syncSettingsUI(){
  $("#setLevel").value=String(settings.level); $("#setRange").value=String(settings.R);
  $("#setB").checked=settings.b; $("#setE").checked=settings.e; $("#setAuto").checked=settings.autoRead; buildModeToggles();
  const p3=settings.level===3; $("#setB").disabled=!p3; $("#setE").disabled=!p3;
}
function closeSettings(){ $("#settingsDrawer").classList.remove("open"); $("#openSettings").focus(); }
function initSettings(){
  $("#openSettings").addEventListener("click",()=>{ syncSettingsUI(); $("#settingsDrawer").classList.add("open"); $("#closeSettings").focus(); });
  $("#closeSettings").addEventListener("click",closeSettings);
  $("#settingsDrawer").addEventListener("click",e=>{ if(e.target.id==="settingsDrawer") closeSettings(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#settingsDrawer").classList.contains("open")) closeSettings(); });
  $("#setLevel").addEventListener("change",e=>{ const g=+e.target.value; settings.level=g; Object.assign(settings,clone(LEVELS[g])); saveSettings(); syncSettingsUI(); resetRounds(); });
  $("#setRange").addEventListener("change",e=>{ settings.R=+e.target.value; saveSettings(); resetRounds(); });
  $("#setB").addEventListener("change",e=>{ settings.b=e.target.checked; saveSettings(); resetRounds(); });
  $("#setE").addEventListener("change",e=>{ settings.e=e.target.checked; saveSettings(); resetRounds(); });
  $("#setAuto").addEventListener("change",e=>{ settings.autoRead=e.target.checked; saveSettings(); });
  $("#printCards").addEventListener("click",()=>{ buildPrintCards(); window.print(); });
}

// Standards codes stay left-to-right inside Arabic/Urdu text.
function stdsHTML(){ return t("stds").replace(/(TEKS|Common Core|A[12]\.\d+\([A-L](?:[–,]\s?[A-L])*\)|HSF-[A-Z]{2}\.[A-C]\.\d[a-e]?(?:[–,]\s?\d[a-e]?)*)/g,'<bdi dir="ltr" style="white-space:nowrap">$1</bdi>'); }

/* ---------- Language engine ---------- */
function resolveLang(){
  try{ const q=new URLSearchParams(location.search).get("lang"); if(q && T[q]) return q; }catch(e){}
  try{ const s=localStorage.getItem(LANG_KEY); if(s && T[s]) return s; }catch(e){}
  const n=(navigator.language||"en").slice(0,2).toLowerCase();
  if(T[n]) return n;
  return "en";
}
function applyLang(){
  const meta=LANGS.find(x=>x.code===lang)||LANGS[0];
  document.documentElement.lang=lang;
  document.documentElement.dir=meta.dir;
  document.title=t("appTitle");
  const sel=$("#langSelect"); if(sel) sel.value=lang;
  $$("[data-t]").forEach(el=>{ el.textContent=t(el.getAttribute("data-t")); });
  $$("[data-ta]").forEach(el=>{ const v=t(el.getAttribute("data-ta")); el.setAttribute("aria-label",v); el.title=v; });
  $("#stdsNote").innerHTML=stdsHTML();
  buildModeToggles();
  resetRounds();
}
function setLang(l){ if(!T[l]) l="en"; lang=l; try{ localStorage.setItem(LANG_KEY,l); }catch(e){} applyLang(); }
function buildLangSelect(){
  const sel=$("#langSelect"); sel.innerHTML="";
  LANGS.forEach(m=>{ const o=document.createElement("option"); o.value=m.code; o.textContent=m.name; sel.appendChild(o); });
  sel.value=lang;
  sel.addEventListener("change",()=>setLang(sel.value));
}

/* ---------- Init ---------- */
function buildUI(){
  $("#tabs").innerHTML=MODES.map(m=>`<button type="button" role="tab" id="tab-${m}" aria-controls="mode-${m}" aria-selected="false" data-mode="${m}"><span class="ic" aria-hidden="true">${MODE_IC[m]}</span><span data-t="${MODE_KEY[m]}"></span></button>`).join("");
  $("#panels").innerHTML=MODES.map(m=>`<section id="mode-${m}" class="panel modepanel hidden" role="tabpanel" aria-labelledby="tab-${m}">
    <div class="panelhead"><h2 data-t="${MODE_KEY[m]}"></h2><button type="button" class="btn ghost no-print" data-new="${m}" data-t="newRound"></button></div>
    <div class="prompt"><button type="button" class="speaker" data-speak="${m}" data-ta="readAloud" aria-label="Read aloud">🔊</button><span id="p-${m}">…</span></div>
    <div class="work" id="w-${m}"></div>
    <div class="acts no-print" id="a-${m}"></div>
    <div class="choices" id="c-${m}" role="group" data-ta="choicesLbl" aria-label="Answer choices"></div>
    <div class="feedback" id="f-${m}" role="status" aria-live="polite"></div></section>`).join("");
  MODES.forEach(wirePlane);
  $("#tabs").addEventListener("keydown",e=>{ const vis=$$(".tabs button").filter(b=>!b.classList.contains("hidden")), i=vis.indexOf(document.activeElement); if(i<0) return;
    const rtl=document.documentElement.dir==="rtl", stp={ArrowRight:rtl?-1:1,ArrowLeft:rtl?1:-1}[e.key]; if(!stp) return;
    const nb=vis[(i+stp+vis.length)%vis.length]; nb.focus(); showMode(nb.dataset.mode); e.preventDefault(); });
}
function init(){
  lang=resolveLang();
  buildUI();
  buildLangSelect();
  $$(".tabs button").forEach(b=>b.addEventListener("click",()=>showMode(b.dataset.mode)));
  $$(".speaker").forEach(b=>b.addEventListener("click",()=>speak(currentSpeech[b.dataset.speak])));
  $$("[data-new]").forEach(b=>b.addEventListener("click",()=>{ stopSpeech(); NEWFN[b.dataset.new](); }));
  initSettings();
  const f=firstMode();
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===f; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; b.classList.toggle("hidden",!settings.modes[b.dataset.mode]); });
  $$(".modepanel").forEach(p=>p.classList.toggle("hidden",p.id!=="mode-"+f));
  applyLang();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
</script>
<script>
/* Student mute toggle — shared across the Digital Math Tools. Self-contained,
   offline, stores no student data. Gates ALL speech by intercepting
   speechSynthesis.speak, so muting works regardless of each tool's internals.
   Reads the shared language preference only to localize its own label. */
(function(){
  "use strict";
  var LKEY='tcea.mathtools.lang', MKEY='tcea.mathtools.muted';
  var CODES=['en','es','vi','ar','hi','ur','zh'];
  var LAB={
    mute:{en:"Mute sound",es:"Silenciar sonido",vi:"Tắt âm thanh",ar:"كتم الصوت",hi:"आवाज़ बंद करें",ur:"آواز بند کریں",zh:"静音"},
    unmute:{en:"Turn sound on",es:"Activar sonido",vi:"Bật âm thanh",ar:"تشغيل الصوت",hi:"आवाज़ चालू करें",ur:"آواز چالو کریں",zh:"打开声音"}
  };
  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  window.__MT_MUTED = (get(MKEY)==='1');
  // Intercept every speech request; suppress while muted.
  try{
    if(window.speechSynthesis && typeof window.speechSynthesis.speak==='function'){
      var ss=window.speechSynthesis, orig=ss.speak.bind(ss);
      ss.speak=function(u){ if(!window.__MT_MUTED){ try{orig(u);}catch(e){} } };
    }
  }catch(e){}
  function curLang(){ var l=get(LKEY)||'en'; return LAB.mute[l]?l:'en'; }
  function label(el){
    var on=!window.__MT_MUTED, l=curLang(), txt=on?LAB.mute[l]:LAB.unmute[l];
    el.textContent=on?'🔊':'🔇';
    el.setAttribute('aria-label',txt); el.setAttribute('title',txt);
    el.setAttribute('aria-pressed', on?'false':'true');
  }
  function findLangSelect(){
    var sels=document.querySelectorAll('select');
    for(var i=0;i<sels.length;i++){ var o=sels[i].options, c=0;
      for(var j=0;j<o.length;j++){ if(CODES.indexOf((o[j].value||'').toLowerCase())>=0) c++; }
      if(c>=3) return sels[i];
    }
    return null;
  }
  function build(){
    if(document.getElementById('mtMuteBtn')) return;
    if(!(('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window))) return;
    var btn=document.createElement('button');
    btn.id='mtMuteBtn'; btn.type='button';
    btn.style.cssText='font:inherit;font-size:1.15rem;line-height:1;cursor:pointer;'+
      'min-width:44px;min-height:44px;padding:8px 12px;border:2px solid #e2dcf1;'+
      'border-radius:10px;background:#fff;color:#5b3fa5;font-weight:700;margin:0 4px;';
    btn.addEventListener('click',function(){
      window.__MT_MUTED=!window.__MT_MUTED;
      set(MKEY, window.__MT_MUTED?'1':'0');
      if(window.__MT_MUTED){ try{window.speechSynthesis.cancel();}catch(e){} }
      label(btn);
    });
    btn.addEventListener('focus',function(){btn.style.outline='3px solid #5b3fa5';btn.style.outlineOffset='2px';});
    btn.addEventListener('blur',function(){btn.style.outline='';});
    var sel=findLangSelect();
    if(sel && sel.parentNode){
      sel.parentNode.insertBefore(btn, sel);
      sel.addEventListener('change',function(){ setTimeout(function(){label(btn);},0); });
    }else{
      btn.style.position='fixed'; btn.style.top='10px'; btn.style.zIndex='9999';
      btn.style[(document.documentElement.dir==='rtl')?'left':'right']='10px';
      (document.body||document.documentElement).appendChild(btn);
    }
    label(btn);
  }
  if(document.readyState==='complete'){ build(); }
  else{ window.addEventListener('load', build); }
  window.addEventListener('storage',function(e){ if(e.key===LKEY){ var b=document.getElementById('mtMuteBtn'); if(b) label(b); } });
})();
</script>
