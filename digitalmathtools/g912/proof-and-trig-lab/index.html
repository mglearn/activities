<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Proof &amp; Trig Lab — a high school Geometry app: triangle congruence and similarity, two-column proofs, right triangle trigonometry, the Laws of Sines and Cosines, the unit circle, circles, coordinate geometry, and compass-and-straightedge constructions. Works offline. No data collected.">
<title>Proof &amp; Trig Lab</title>
<style>
  :root{
    --bg:#eef6f4;--panel:#ffffff;--ink:#14231f;--muted:#44574f;--line:#c4dcd5;
    --accent:#16a085;--accentD:#0b6b58;--accent-ink:#ffffff;--good:#166534;--good-bg:#dcfce7;
    --hint:#7a4a00;--hint-bg:#fff4d6;--focus:#0a58ca;--tgt:#d35400;--l2:#8e44ad;
    --tap:48px;font-size:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-text-size-adjust:100%}
  h1,h2,h3{line-height:1.15;margin:0 0 .3em}
  button{font-family:inherit;font-size:1rem;cursor:pointer}
  button:disabled{cursor:default}

  .topbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--accentD);color:var(--accent-ink);padding:.55rem .8rem}
  .topbar .brand{font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:.4rem;margin-inline-end:auto}
  .topbar a.homebtn,.topbar button.tb{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.4rem .7rem;min-height:var(--tap);min-width:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:.35rem;text-decoration:none;font-weight:700;font-size:.95rem}
  .globe{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.2rem .5rem;min-height:var(--tap)}
  .globe span{font-size:1.2rem}
  .globe select{border:0;background:#fff;color:var(--ink);border-radius:8px;min-height:44px;font-weight:700;font-size:1rem;padding:.2rem .4rem}

  main{max-width:1200px;margin:0 auto;padding:.7rem}
  .tabsrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 .7rem}
  .tabs{display:flex;gap:.4rem;flex-wrap:wrap;flex:1 1 auto}
  .tabs button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.45rem .75rem;min-height:var(--tap);font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:.4rem}
  .tabs button[aria-selected="true"]{background:var(--accentD);color:#fff;border-color:var(--accentD)}
  .tabs button .ic{font-size:1.15rem}
  .stars{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.4rem .8rem;font-weight:800;font-size:1.1rem;min-height:48px;display:inline-flex;align-items:center;gap:.3rem}
  .stars.pop{animation:pop .5s ease}
  @keyframes pop{50%{transform:scale(1.15)}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:.9rem;margin-bottom:.8rem}
  .panelhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
  .panelhead h2{margin:0;font-size:1.25rem;margin-inline-end:auto}

  .prompt{display:flex;align-items:center;gap:.6rem;background:#e8f6f2;border:2px solid #b3dcd1;border-radius:14px;padding:.6rem .8rem;margin-bottom:.7rem;font-size:1.08rem;font-weight:600;line-height:1.75}
  .prompt>span{min-width:0;overflow-wrap:anywhere}
  .speaker{background:var(--accentD);color:#fff;border:0;border-radius:50%;width:var(--tap);height:var(--tap);min-width:var(--tap);font-size:1.3rem;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}

  .btn{background:var(--accentD);color:#fff;border:2px solid var(--accentD);border-radius:12px;padding:.5rem .85rem;min-height:var(--tap);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
  .btn.ghost{background:var(--panel);color:var(--accentD)}
  .btn:disabled{opacity:.45}

  .feedback{margin-top:.6rem;border-radius:12px;padding:.6rem .8rem;font-weight:600;display:none;line-height:1.8;overflow-wrap:anywhere}
  .feedback.show{display:block}
  .feedback.good{background:var(--good-bg);color:var(--good);border:2px solid #86efac}
  .feedback.hint{background:var(--hint-bg);color:var(--hint);border:2px solid #f6d271}

  /* Math: always left-to-right, even inside Arabic/Urdu sentences */
  .math{unicode-bidi:isolate;direction:ltr;display:inline;font-weight:800;white-space:nowrap}
  .math.mw{white-space:normal}
  .math i{font-family:Georgia,'Times New Roman',serif;font-weight:700}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:800;margin:0 .08em;white-space:nowrap;font-size:.9em}
  .fr>span{padding:0 .16em}
  .fr>span:first-child{border-bottom:.12em solid currentColor}
  .ov{text-decoration:overline;text-decoration-thickness:.09em}
  .rad{white-space:nowrap}
  .rad>span{border-top:.09em solid currentColor;padding:0 .08em;margin-inline-start:.02em}

  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem;margin-top:.7rem}
  .choices:empty{display:none}
  .choice{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:.5rem;min-height:64px;display:flex;align-items:center;justify-content:center;position:relative;font-size:1.2rem;font-weight:800;color:var(--ink)}
  .choice .lbl{unicode-bidi:isolate;direction:ltr}
  .choice.txt{font-size:1.02rem}
  .choice.txt .lbl{direction:inherit}
  .choice.correctpick{border-color:var(--good);background:var(--good-bg)}
  .choice.wrongpick{border-color:#e3b341;background:var(--hint-bg);opacity:.75}
  .choice .badge{position:absolute;top:4px;inset-inline-end:6px;font-size:1rem;display:none}
  .choice.correctpick .badge{display:block}

  .work:empty{display:none}
  .fig{width:100%;max-width:520px;height:auto;display:block;margin:0 auto;background:#fff;border:2px solid var(--line);border-radius:12px}
  .fig.sm{max-width:360px}
  .fig{direction:ltr} /* keep labels like 74° in order in Arabic/Urdu */
  .fig text{font:700 17px system-ui,sans-serif;fill:#14231f}
  .fig .vl{font:800 18px system-ui,sans-serif;fill:#14231f;paint-order:stroke;stroke:#fff;stroke-width:4}
  .fig .ml{font:800 16px system-ui,sans-serif;fill:#0b6b58;paint-order:stroke;stroke:#fff;stroke-width:4}
  .fig .xl{font:italic 800 18px Georgia,serif;fill:#c0392b;paint-order:stroke;stroke:#fff;stroke-width:4}
  .fig .emo{font-size:26px}
  .tr{fill:rgba(22,160,133,.10);stroke:#0b6b58;stroke-width:3;stroke-linejoin:round}
  .tr.t2{fill:rgba(142,68,173,.08);stroke:#6c3483}
  .sg{stroke:#14231f;stroke-width:3;stroke-linecap:round;fill:none}
  .sg.ac{stroke:var(--accent);stroke-width:5}
  .sg.dash{stroke-dasharray:7 6;stroke-width:2;stroke:#5d6d66}
  .sg.gr{stroke:#6b4f2a;stroke-width:3}
  .mk{stroke:#c0392b;stroke-width:2.5;fill:none;stroke-linecap:round}
  .mk.rt{stroke:#14231f;stroke-width:2}
  .cc{fill:none;stroke:#14231f;stroke-width:3}
  .arcHi{fill:none;stroke:var(--tgt);stroke-width:7;stroke-linecap:round}
  .dot{fill:#14231f}
  .side{cursor:pointer}
  .side .hit{stroke:transparent;stroke-width:26;stroke-linecap:round}
  .side .vis{stroke:#14231f;stroke-width:4;stroke-linecap:round}
  .side:hover .vis,.side:focus .vis{stroke:var(--focus)}
  .side:focus{outline:none}
  .side:focus-visible .hit{stroke:rgba(10,88,202,.25)}
  .side.ok .vis{stroke:#16a34a;stroke-width:6}
  .side.bad .vis{stroke:#e3a008}
  .slab{font:800 15px system-ui,sans-serif;fill:#166534;paint-order:stroke;stroke:#fff;stroke-width:4}

  .pwrap{width:100%;max-width:440px;margin:0 auto}
  .plane{width:100%;height:auto;display:block;touch-action:none;background:#fff;border:2px solid var(--line);border-radius:12px}
  .plane[tabindex]{cursor:crosshair}
  .plane:focus{outline:none}
  .plane:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  .gl{stroke:#dbe9e4;stroke-width:1}
  .ax{stroke:#1b2a26;stroke-width:2.2}
  .tl{font:600 14px system-ui,sans-serif;fill:#4a5a55}
  .axn{font:italic 700 18px Georgia,serif;fill:#1b2a26}
  .pseg{stroke:var(--accent);stroke-width:4;stroke-linecap:round}
  .pseg.dash{stroke:#7a8a85;stroke-dasharray:8 6;stroke-width:2.5}
  .pseg.t2{stroke:var(--l2)}
  .poly{fill:rgba(22,160,133,.12);stroke:var(--accentD);stroke-width:3.5;stroke-linejoin:round}
  .pcirc{fill:rgba(22,160,133,.08);stroke:var(--accentD);stroke-width:3.5}
  .pcirc.tg{fill:none;stroke:var(--tgt);stroke-dasharray:10 7}
  .pt{fill:var(--accent);stroke:#fff;stroke-width:2.5}
  .pt.ok{fill:#16a34a}
  .pt.bad{fill:#e3a008}
  .pt.dr{fill:#c0392b;stroke:#fff;stroke-width:3}
  .pt.dr.sel{stroke:#14231f;stroke-width:4}
  .ptl{font:800 16px system-ui,sans-serif;fill:#14231f;paint-order:stroke;stroke:#fff;stroke-width:4}
  .cur{fill:none;stroke:var(--focus);stroke-width:3;display:none}
  .plane:focus-visible .cur{display:inline}

  .split{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem;align-items:start}
  @media (min-width:820px){ .split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
  .given{background:#f4faf8;border:2px dashed #b3dcd1;border-radius:12px;padding:.5rem .7rem;line-height:1.9;overflow-wrap:anywhere}
  .given b{color:var(--accentD)}
  table.pf{border-collapse:collapse;width:100%;margin:.5rem 0;table-layout:fixed}
  table.pf th{background:#e8f6f2;text-align:start;padding:.35rem .5rem;border:2px solid #b3dcd1}
  table.pf td{border:2px solid #d4e6e0;padding:.35rem .5rem;vertical-align:top;line-height:1.6;overflow-wrap:anywhere}
  table.pf td.n{width:2.2rem;text-align:center;color:var(--muted);font-weight:800}
  table.pf th.n{width:2.2rem}
  table.pf tr.cur td{background:#fff8e1}
  table.pf td.q{color:#b45309;font-weight:800}
  .bank{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0}
  .bank:empty{display:none}
  .chip{background:#fff;border:2px solid var(--accentD);color:var(--ink);border-radius:12px;padding:.4rem .7rem;min-height:var(--tap);font-weight:700;max-width:100%;text-align:start;line-height:1.5}
  .chip.wrong{border-color:#e3b341;background:var(--hint-bg)}
  .chip.drag{opacity:.5}
  .banklab{font-weight:800;color:var(--muted);margin:.4rem 0 0}
  .rtab{border-collapse:collapse;margin:.4rem auto;font-weight:700;direction:ltr}
  .rtab th,.rtab td{border:2px solid #b3dcd1;padding:.25rem .5rem;text-align:center}
  .rtab th{background:#e8f6f2}
  .acts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;margin:.5rem 0}
  .acts:empty{display:none}
  .readout{font-weight:700;text-align:center;line-height:1.9;min-height:1.5em}

  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:1rem}
  .drawer.open{display:flex}
  .drawer .card{background:var(--panel);border-radius:16px;max-width:600px;width:100%;padding:1rem;max-height:90vh;overflow:auto}
  .setrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0;padding:.5rem 0;border-bottom:1px solid var(--line)}
  .setrow .lab{font-weight:700;min-width:150px}
  .toggle{display:inline-flex;align-items:center;gap:.35rem;border:2px solid var(--line);border-radius:10px;padding:.35rem .55rem;background:#fff;min-height:44px}
  .toggle input{width:22px;height:22px}
  select.diff{font-size:1rem;padding:.4rem;border-radius:10px;border:2px solid var(--line);min-height:48px;max-width:100%}
  .wrapflex{display:flex;flex-wrap:wrap;gap:.4rem}

  footer{max-width:1200px;margin:.5rem auto 2rem;padding:.8rem;color:var(--muted);font-size:.9rem;text-align:center}
  footer a{color:var(--accentD);font-weight:700}
  .stds{font-size:.82rem;color:var(--muted);background:#f4faf8;border:1px dashed var(--line);border-radius:12px;padding:.5rem .7rem;margin-top:.4rem}

  .ucp{cursor:pointer}
  .ucp .hit{fill:transparent}
  .ucp .vis{fill:#fff;stroke:#14231f;stroke-width:3}
  .ucp[tabindex]:hover .vis,.ucp:focus .vis{stroke:var(--focus);fill:#dbeafe}
  .ucp:focus{outline:none}
  .ucp:focus-visible .hit{fill:rgba(10,88,202,.22)}
  .ucp.ok .vis{fill:#16a34a;stroke:#166534}
  .ucp.bad .vis{fill:#e3a008}
  .carc{fill:none;stroke:#8e44ad;stroke-width:2.5;stroke-linecap:round}
  .csteps{margin:.3rem 0 .5rem;padding-inline-start:1.6rem;line-height:1.6}
  .csteps li{margin:.15rem 0}
  #c-cons{grid-template-columns:minmax(0,1fr)}
  #c-cons .choice{justify-content:flex-start;text-align:start;min-height:56px;padding:.5rem .8rem}

  .hidden{display:none !important}
  :focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  @media (max-width:480px){ :root{font-size:16.5px} main{padding:.5rem} .panel{padding:.6rem} .tabs button{padding:.4rem .5rem;font-size:.9rem} table.pf td,table.pf th{padding:.3rem .3rem} .choice{font-size:1.05rem} }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

  .printonly{display:none}
  @media print{
    .topbar,.tabsrow,footer,.modepanel,#stdsNote,.no-print,#mtMuteBtn{display:none !important}
    body{background:#fff}
    .printonly{display:block}
    .card-print{border:2px solid #000;border-radius:12px;padding:1rem;margin:0 0 1rem;page-break-inside:avoid}
    .card-print h2{margin:.2rem 0}
    .card-print svg{max-width:300px;border:1px solid #000}
    main{max-width:100%}
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">📏 <span data-t="appTitle">Proof &amp; Trig Lab</span></span>
  <a class="homebtn" href="../../index.html">🏠 <span data-t="home">Home</span></a>
  <label class="globe"><span aria-hidden="true">🌐</span>
    <select id="langSelect" aria-label="Language / Idioma"></select>
  </label>
  <button class="tb settingsbtn" id="openSettings" type="button">⚙️ <span data-t="teacher">Teacher</span></button>
</header>

<main>
  <div class="tabsrow">
    <div class="tabs" id="tabs" role="tablist" data-ta="modesLbl" aria-label="Modes"></div>
    <span class="stars" id="stars"><span aria-hidden="true">✔</span><span class="sr" data-t="stars">Correct answers</span> <b id="starCount">0</b></span>
  </div>
  <div id="panels"></div>
  <div class="stds" id="stdsNote"></div>
  <div class="printonly" id="printArea"></div>
</main>

<footer>
  <p data-t="footNote">No accounts · No data collected · Works offline</p>
  <p><a href="../../index.html" data-t="home">Home</a> · <a href="../../policy.html" data-t="privacy">Privacy</a></p>
</footer>

<!-- SETTINGS -->
<div class="drawer" id="settingsDrawer" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="card">
    <div class="panelhead"><h2 id="setTitle" data-t="teacherTitle">Teacher settings</h2>
      <button class="btn ghost" id="closeSettings" type="button" data-t="close">Close</button></div>
    <div class="setrow"><label class="lab" for="setLevel" data-t="setLevel">Course level</label>
      <select class="diff" id="setLevel">
        <option value="f" data-t="lvF">Foundations</option>
        <option value="g" data-t="lvG">Geometry</option>
        <option value="h" data-t="lvH">Honors</option></select>
      <p class="stds" style="margin:0;flex:1 1 100%" data-t="levelNote"></p></div>
    <div class="setrow"><label class="lab" for="setRange" data-t="setRange">Grid size</label>
      <select class="diff" id="setRange">
        <option value="6">−6 … 6</option>
        <option value="8">−8 … 8</option>
        <option value="10">−10 … 10</option></select></div>
    <div class="setrow"><label class="lab" for="setDp" data-t="setDp">Round trig answers to</label>
      <select class="diff" id="setDp">
        <option value="0" data-t="dp0">the nearest whole number</option>
        <option value="1" data-t="dp1">the nearest tenth</option></select></div>
    <div class="setrow"><span class="lab" data-t="setModes">Modes</span>
      <div id="modeToggles" class="wrapflex"></div></div>
    <div class="setrow"><span class="lab" data-t="setSpeech">Speech</span>
      <label class="toggle"><input type="checkbox" id="setAuto"> <span data-t="autoRead">Auto-read directions</span></label></div>
    <div class="setrow" style="border:0"><button class="btn" id="printCards" type="button">🖨 <span data-t="printCards">Print challenge cards</span></button></div>
    <p class="stds" data-t="setStored">Settings are saved only on this device. No student information is ever stored.</p>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   Proof & Trig Lab — single-file high school Geometry app.
   7 languages. No frameworks, no network, no data collection.
   ========================================================================= */

/* ---------- Language metadata ---------- */
const LANGS = [
  {code:"en", name:"English",     dir:"ltr", bcp:"en-US"},

let lang = "en";
function t(key, vars){
  let s = (T[lang] && T[lang][key]!==undefined) ? T[lang][key] : (T.en[key]!==undefined? T.en[key] : key);
  if(vars) for(const k in vars) s = s.replaceAll("{"+k+"}", vars[k]);
  return s;
}

/* ---------- Settings ---------- */
const MODES = ["cong","proof","trig","unit","circ","coord","cons"];
const MODE_KEY = {cong:"mCong",proof:"mProof",trig:"mTrig",unit:"mUnit",circ:"mCirc",coord:"mCoord",cons:"mCons"};
const MODE_IC = {cong:"🔺",proof:"🧾",trig:"📐",unit:"🕒",circ:"⭕",coord:"🗺️",cons:"✏️"};
const LEVELS = { f:{R:6,dp:1}, g:{R:8,dp:1}, h:{R:10,dp:1} };
const clone = o=>JSON.parse(JSON.stringify(o));
const DEFAULTS = {level:"g", R:8, dp:1, modes:{cong:true,proof:true,trig:true,unit:true,circ:true,coord:true,cons:true}, autoRead:false};
const SKEY = "ptl_settings";
let settings = loadSettings();
function loadSettings(){
  try{
    const raw = localStorage.getItem(SKEY);
    if(raw){ const o=JSON.parse(raw), s=Object.assign(clone(DEFAULTS), o, {modes:Object.assign({},DEFAULTS.modes,o.modes)});
      if(!LEVELS[s.level]) s.level=DEFAULTS.level;
      if(![6,8,10].includes(+s.R)) s.R=LEVELS[s.level].R; s.R=+s.R;
      s.dp=+s.dp===0?0:1;
      if(!MODES.some(m=>s.modes[m])) s.modes=clone(DEFAULTS.modes);
      return s; }
  }catch(e){}
  return clone(DEFAULTS);
}
function saveSettings(){ try{ localStorage.setItem(SKEY, JSON.stringify(settings)); }catch(e){} }

/* ---------- Utils ---------- */
const $ = s=>document.querySelector(s);
const $$ = s=>Array.from(document.querySelectorAll(s));
function rand(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const ri = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const gcd = (a,b)=>{ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a||1; };
const LV = ()=>settings.level;
const RR = ()=>+settings.R;

const M = s=>`<bdi class="math" dir="ltr">${s}</bdi>`;
const MW = s=>`<bdi class="math mw" dir="ltr">${s}</bdi>`; // long formulas may wrap (still left-to-right)
const frH = (n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const MINUS = "−";
const spell = s=>String(s).split("").join(" ");

/* ---------- Numbers: shown {h} and spoken {s} ---------- */
const nH = n=>n<0?MINUS+(-n):""+n;
function nS(n){ return n<0?t("neg",{n:-n}):""+n; }
const V = (h,s)=>({h,s:s===undefined?h:s});
const N2 = n=>V(nH(n),nS(n));
const fmt = (v,dp)=>{ const r=(+v).toFixed(dp===undefined?DP():dp); return /^-/.test(r)&&+r!==0?MINUS+r.slice(1):r.replace(/^-/,""); };
const DEG = n=>V(n+"°", t("degSay",{n}));
const FNW = f=>V(f, t("f"+f));
function Q(p,q){ q=q||1; if(q<0){ p=-p; q=-q; } const g=gcd(p,q); return {p:p/g, q:q/g}; }
function qH(r){ if(r.q===1) return nH(r.p); return (r.p<0?MINUS:"")+frH(Math.abs(r.p),r.q); }
function qS(r){ if(r.q===1) return nS(r.p); const f=t("frSay",{n:Math.abs(r.p),d:r.q}); return r.p<0?t("neg",{n:f}):f; }
const QV = r=>V(qH(r),qS(r));
const PT = (x,y)=>V("("+nH(x)+", "+nH(y)+")", t("ptSay",{x:nS(x),y:nS(y)}));
// Radicals: value (n/d)·√r, r square-free.
function RV(n,d,r){ d=d||1; r=r||1; let k=1; for(let i=2;i*i<=r;i++) while(r%(i*i)===0){ r/=i*i; k*=i; } n*=k; const g=gcd(n,d); return {n:n/g,d:d/g,r}; }
const rvMul = (a,b)=>RV(a.n*b.n, a.d*b.d, a.r*b.r);
const rvInv = a=>RV(a.d, a.n*a.r, a.r);
const rvEq = (a,b)=>a.n===b.n&&a.d===b.d&&a.r===b.r;
const radH = r=>`<span class="rad">√<span>${r}</span></span>`;
function rvH(a){ const num=a.r===1?""+a.n:(a.n===1?"":a.n)+radH(a.r); return a.d===1?num:frH(num,a.d); }
function rvT(a){ const num=a.r===1?""+a.n:(a.n===1?"":a.n)+"√"+a.r; return a.d===1?num:num+"/"+a.d; }
function rvS(a){ const num=a.r===1?""+a.n:(a.n===1?t("rootSay",{r:a.r}):t("cRootSay",{c:a.n,r:a.r})); return a.d===1?num:t("frSay",{n:num,d:a.d}); }
const RVV = a=>V(rvH(a),rvS(a));
const sqrtV = N=>RV(1,1,N);
// π multiples
function piH(r){ const p=r.p===1?"π":r.p+"π"; return r.q===1?p:frH(p,r.q); }
function piS(r){ const p=r.p===1?t("piSay"):r.p+" "+t("piSay"); return r.q===1?p:t("frSay",{n:p,d:r.q}); }
const PIV = r=>V(piH(r),piS(r));

// In Arabic/Urdu, keep literal math runs left-to-right.
const isRTL = ()=>(LANGS.find(x=>x.code===lang)||{}).dir==="rtl";
function rtlFix(str){ if(!isRTL()) return str;
  return str.replace(/[A-Za-z0-9({][A-Za-z0-9(){},.÷×=+−\- °]*[A-Za-z0-9)}°]/g,r=>/[=÷]|\(\w+, \w+\)/.test(r)?`<bdi dir="ltr">${r}</bdi>`:r); }
function tm(key,vars){ const h={},s={}; vars=vars||{};
  for(const k in vars){ const v=vars[k]; if(v&&typeof v==="object"){ h[k]=v.w||v.h.indexOf("<bdi")===0?v.h:M(v.h); s[k]=v.s; } else { h[k]=v; s[k]=v; } }
  return {h:rtlFix(t(key)).replace(/\{(\w+)\}/g,(m0,k)=>k in h?h[k]:m0), s:t(key,s)};
}
const cat = (...m)=>{ m=m.filter(Boolean); return {h:m.map(x=>x.h).join(" "), s:m.map(x=>x.s).join(" ")}; };
const TX = k=>({h:rtlFix(t(k)), s:t(k)});
const W = k=>({h:t(k), s:t(k), w:true});

/* ---------- Statement notation: "seg:AB =~ seg:CD" ---------- */
function mh(str){ return String(str).split(" ").map(tok=>{ let m;
  if((m=tok.match(/^seg:(\w+)$/))) return `<span class="ov">${m[1]}</span>`;
  if((m=tok.match(/^ang:(\w+)$/))) return "∠"+m[1];
  if((m=tok.match(/^tri:(\w+)$/))) return "△"+m[1];
  const R={"=~":"≅","||":"∥","_|_":"⊥","-":MINUS,"~":"∼"}; if(R[tok]) return R[tok];
  return tok.replace(/x/g,"<i>x</i>"); }).join(" "); }
function ms(str){ return String(str).split(" ").map(tok=>{ let m;
  if((m=tok.match(/^seg:(\w+)$/))) return t("sSeg")+" "+spell(m[1]);
  if((m=tok.match(/^ang:(\w+)$/))) return t("sAng")+" "+spell(m[1]);
  if((m=tok.match(/^tri:(\w+)$/))) return t("sTri")+" "+spell(m[1]);
  const R={"=~":"sCong","||":"sPar","_|_":"sPerp","=":"wEq","+":"wPlus","-":"wMinus","~":"sSim"}; if(R[tok]) return t(R[tok]);
  if(/^[A-Z]{2,3}$/.test(tok)) return spell(tok);
  return tok.replace(/[()]/g," "); }).join(" ").replace(/\s+/g," ").trim(); }
function ST(st){ if(typeof st==="string") return {h:M(mh(st)), s:ms(st)};
  const h={},s={}; for(const k in st.v){ h[k]=M(mh(st.v[k])); s[k]=ms(st.v[k]); }
  return {h:t(st.k).replace(/\{(\w+)\}/g,(a,k)=>k in h?h[k]:a), s:t(st.k,s)}; }

function ln(a,b,cls){ return `<line class="${cls||"sg"}" x1="${F(a[0])}" y1="${F(a[1])}" x2="${F(b[0])}" y2="${F(b[1])}"/>`; }

  while(d>Math.PI) d-=2*Math.PI; while(d<=-Math.PI) d+=2*Math.PI; const sw=d>0?1:0; let s="";
  for(let i=0;i<n;i++){ const r=(r0||20)+i*6; s+=`<path class="mk" d="M${F(V0[0]+r*Math.cos(a1))} ${F(V0[1]+r*Math.sin(a1))}A${r} ${r} 0 0 ${sw} ${F(V0[0]+r*Math.cos(a2))} ${F(V0[1]+r*Math.sin(a2))}"/>`; } return s; }
function rtM(V0,A,B,r){ r=r||14; const u=UNIT(SUB(A,V0)), w=UNIT(SUB(B,V0));
  return `<path class="mk rt" d="M${F(V0[0]+u[0]*r)} ${F(V0[1]+u[1]*r)}L${F(V0[0]+u[0]*r+w[0]*r)} ${F(V0[1]+u[1]*r+w[1]*r)}L${F(V0[0]+w[0]*r)} ${F(V0[1]+w[1]*r)}"/>`; }
function bisU(V0,A,B){ const u=UNIT(SUB(A,V0)), w=UNIT(SUB(B,V0)); return UNIT([u[0]+w[0],u[1]+w[1]]); }
function parM(a,b,n){ const u=UNIT(SUB(b,a)), p=[-u[1],u[0]], m=[(a[0]+b[0])/2,(a[1]+b[1])/2]; let s="";
  for(let i=0;i<n;i++){ const c=[m[0]+u[0]*(i*8-(n-1)*4+4),m[1]+u[1]*(i*8-(n-1)*4+4)];
    s+=`<path class="mk" d="M${F(c[0]-u[0]*8+p[0]*6)} ${F(c[1]-u[1]*8+p[1]*6)}L${F(c[0])} ${F(c[1])}L${F(c[0]-u[0]*8-p[0]*6)} ${F(c[1]-u[1]*8-p[1]*6)}"/>`; } return s; }
function outLab(p,c,txt,d,cls){ const u=UNIT(SUB(p,c)); d=d||16; return tx(p[0]+u[0]*d,p[1]+u[1]*d,txt,cls); }

  const off=10+String(txt).length*3.2; return tx(m[0]+n[0]*off,m[1]+n[1]*off,txt,cls||(txt==="x"?"xl":"ml")); }
const svgFig = (vb,inner,cls,lbl)=>`<svg class="fig ${cls||""}" viewBox="${vb}" role="img" aria-label="${lbl||t("figLbl")}">${inner}</svg>`;

/* ---------- Triangles ---------- */
// side i joins vertex i and vertex i+1; it is opposite vertex i+2.
function triS(L){ const [a,b,c]=L, x=(a*a+c*c-b*b)/(2*a), y=Math.sqrt(Math.max(0,c*c-x*x)); return [[0,0],[a,0],[x,y]]; }
const sinD = d=>Math.sin(d*Math.PI/180), cosD = d=>Math.cos(d*Math.PI/180), tanD = d=>Math.tan(d*Math.PI/180);
const lensA = A=>[0,1,2].map(i=>sinD(A[(i+2)%3]));
function angAt(L,i){ const p=L[i], q=L[(i+2)%3], o=L[(i+1)%3]; return Math.acos((p*p+q*q-o*o)/(2*p*q))*180/Math.PI; }
function xf(P,rot,refl,k){ const c=Math.cos(rot), s=Math.sin(rot); k=k||1; return P.map(([x,y])=>{ if(refl) x=-x; return [(x*c-y*s)*k,(x*s+y*c)*k]; }); }
function fitTo(P,box,sc){ const xs=P.map(p=>p[0]), ys=P.map(p=>-p[1]), x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
  const s=sc||Math.min(box[2]/((x1-x0)||1), box[3]/((y1-y0)||1));
  const ox=box[0]+(box[2]-(x1-x0)*s)/2-x0*s, oy=box[1]+(box[3]-(y1-y0)*s)/2-y0*s;
  return {Q:P.map(p=>[ox+p[0]*s, oy-p[1]*s]), s}; }
function triG(P,o){ const c=CEN(P); let s=`<path class="tr ${o.cls||""}" d="M${F(P[0][0])} ${F(P[0][1])}L${F(P[1][0])} ${F(P[1][1])}L${F(P[2][0])} ${F(P[2][1])}Z"/>`;
  for(let i=0;i<3;i++) s+=tickM(P[i],P[(i+1)%3],(o.tk||[])[i]);
  for(let i=0;i<3;i++){ if(o.rt===i) s+=rtM(P[i],P[(i+1)%3],P[(i+2)%3]); else s+=arcM(P[i],P[(i+1)%3],P[(i+2)%3],(o.ar||[])[i],18); }
  for(let i=0;i<3;i++) if(o.sl&&o.sl[i]!=null) s+=sideLab(P[i],P[(i+1)%3],c,o.sl[i]);
  for(let i=0;i<3;i++) if(o.al&&o.al[i]!=null){ const b=bisU(P[i],P[(i+1)%3],P[(i+2)%3]); s+=tx(P[i][0]+b[0]*42,P[i][1]+b[1]*42,o.al[i],"ml"); }
  for(let i=0;i<3;i++) s+=outLab(P[i],c,o.nm[i],15);
  return s; }
// Two triangles side by side; the second is turned/flipped and scaled by k.
function pairFig(P,o1,o2,k,P2){ const r1=(Math.random()-.5)*.8, r2=Math.random()*Math.PI*2, A=xf(P,r1,false), B=xf(P2||P,r2,Math.random()<.5,k||1);
  const b1=[34,30,170,170], b2=[262,30,170,170], s=Math.min(fitTo(A,b1).s, fitTo(B,b2).s)*.95;
  return svgFig("0 0 466 230", triG(fitTo(A,b1,s).Q,o1)+triG(fitTo(B,b2,s).Q,Object.assign({cls:"t2"},o2)), "", t("figTri")); }
const NAMES = ["ABC","DEF","PQR","XYZ","JKL","STU"];
const pickNames = ()=>shuffle(NAMES).slice(0,2).map(s=>s.split(""));

/* ---------- Coordinate plane (SVG 440×440, grid −R…R) ---------- */
const PL = {};
function plane(o){
  const R=o.R||RR(), u=200/R, X=x=>(220+x*u).toFixed(1), Y=y=>(220-y*u).toFixed(1); let s="";
  for(let i=-R;i<=R;i++) s+=`<line class="gl" x1="${X(i)}" y1="20" x2="${X(i)}" y2="420"/><line class="gl" x1="20" y1="${Y(i)}" x2="420" y2="${Y(i)}"/>`;
  s+=`<line class="ax" x1="12" y1="220" x2="428" y2="220"/><line class="ax" x1="220" y1="12" x2="220" y2="428"/>`;
  s+=`<text class="axn" x="424" y="210" text-anchor="end">x</text><text class="axn" x="230" y="24">y</text>`;
  const step=R>8?2:1;
  for(let i=-R;i<=R;i+=step){ if(!i) continue;
    s+=`<text class="tl" x="${X(i)}" y="237" text-anchor="middle">${nH(i)}</text><text class="tl" x="214" y="${(+Y(i)+5).toFixed(1)}" text-anchor="end">${nH(i)}</text>`; }
  (o.polys||[]).forEach(g=>{ s+=`<polygon class="poly" points="${g.map(p=>X(p[0])+","+Y(p[1])).join(" ")}"/>`; });
  (o.circs||[]).forEach(c=>{ s+=`<circle class="pcirc ${c.cls||""}" cx="${X(c.x)}" cy="${Y(c.y)}" r="${(c.r*u).toFixed(1)}"/>`; });
  (o.segs||[]).forEach(g=>{ s+=`<line class="pseg ${g.cls||""}" x1="${X(g.a[0])}" y1="${Y(g.a[1])}" x2="${X(g.b[0])}" y2="${Y(g.b[1])}"/>`; });
  (o.pts||[]).forEach(p=>{ s+=`<circle class="pt ${p.cls||""}" cx="${X(p.x)}" cy="${Y(p.y)}" r="${/\bdr\b/.test(p.cls||"")?11:8}"/>`;
    if(p.lab){ const o=p.lo||[11,-11]; s+=`<text class="ptl" x="${(+X(p.x)+o[0]).toFixed(1)}" y="${(+Y(p.y)+o[1]).toFixed(1)}" text-anchor="${p.lo?"middle":"start"}" dominant-baseline="${p.lo?"central":"auto"}">${p.lab}</text>`; } });
  if(o.cur) s+=`<circle class="cur" cx="${X(o.cur.x)}" cy="${Y(o.cur.y)}" r="15"/>`;
  return s;
}
function planeStatic(o){ return `<svg class="plane" viewBox="0 0 440 440" role="img" aria-label="${t("planeLbl")}">${plane(o)}</svg>`; }
// Interactive plane for mode m. cfg: {R, view(), tap(x,y)?, drag:{get(),set(i,x,y)}?}
function planeBox(m,cfg){
  cfg.R=cfg.R||RR(); cfg.cur=cfg.cur||{x:0,y:0}; cfg.sel=cfg.sel||0; PL[m]=cfg;
  const live=!!(cfg.tap||cfg.drag), lbl=cfg.drag?t("kbDrag"):live?t("kbTap"):t("planeLbl");
  return `<div class="pwrap" dir="ltr"><svg class="plane" viewBox="0 0 440 440" ${live?`tabindex="0" role="application"`:`role="img"`} aria-label="${lbl}">${plane(planeView(cfg))}</svg></div>`;
}
function planeView(cfg){ const o=Object.assign({R:cfg.R},cfg.view()); if(cfg.tap&&!cfg.drag) o.cur=cfg.cur; return o; }
function redraw(m){ const svg=$(`#w-${m} svg.plane`), c=PL[m]; if(svg&&c) svg.innerHTML=plane(planeView(c)); }
function wirePlane(m){
  const w=$("#w-"+m); let dragI=null;
  const at=(svg,e,R)=>{ const r=svg.getBoundingClientRect(), u=200/R, fx=((e.clientX-r.left)/r.width*440-220)/u, fy=(220-(e.clientY-r.top)/r.height*440)/u;
    const cl=v=>Math.max(-R,Math.min(R,Math.round(v))); return {x:cl(fx), y:cl(fy), fx, fy}; };
  w.addEventListener("pointerdown",e=>{ const svg=e.target.closest("svg.plane[tabindex]"), c=PL[m]; if(!svg||!c||!st[m]||st[m].done) return;
    const p=at(svg,e,c.R);
    if(c.drag){ const pts=c.drag.get(); let bi=0,bd=1e9; pts.forEach((q,i)=>{ const d=Math.hypot(q.x-p.fx,q.y-p.fy); if(d<bd){ bd=d; bi=i; } });
      dragI=bi; c.sel=bi; c.drag.set(bi,p.x,p.y); try{ svg.setPointerCapture(e.pointerId); }catch(_){} }
    else if(c.tap){ c.cur={x:p.x,y:p.y}; c.tap(p.x,p.y); }
    e.preventDefault(); });
  w.addEventListener("pointermove",e=>{ const c=PL[m], svg=e.target.closest("svg.plane"); if(!c||!svg||!st[m]||st[m].done) return;
    if(dragI!==null&&c.drag){ const p=at(svg,e,c.R); c.drag.set(dragI,p.x,p.y); } });
  const up=()=>{ dragI=null; }; w.addEventListener("pointerup",up); w.addEventListener("pointercancel",up);
  w.addEventListener("keydown",e=>{ const svg=e.target.closest("svg.plane[tabindex]"), c=PL[m]; if(!svg||!c||st[m].done) return;
    const K={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowUp:[0,1],ArrowDown:[0,-1]}[e.key], R=c.R, cl=v=>Math.max(-R,Math.min(R,v));
    if(c.drag){ if(K){ const q=c.drag.get()[c.sel]; c.drag.set(c.sel,cl(q.x+K[0]),cl(q.y+K[1])); e.preventDefault(); }
      else if(e.key===" "||e.key==="Enter"){ c.sel=(c.sel+1)%c.drag.get().length; redraw(m); e.preventDefault(); } }
    else if(c.tap){ if(K){ c.cur={x:cl(c.cur.x+K[0]),y:cl(c.cur.y+K[1])}; redraw(m); e.preventDefault(); }
      else if(e.key===" "||e.key==="Enter"){ c.tap(c.cur.x,c.cur.y); e.preventDefault(); } } });
}

/* ---------- Speech ---------- */
const speechOK = ("speechSynthesis" in window);
function bcpFor(l){ const m=LANGS.find(x=>x.code===l); return m?m.bcp:"en-US"; }
function pickWarmVoice(code){
  const vs = speechSynthesis.getVoices()||[];
  const want=code.toLowerCase(), two=want.slice(0,2);
  let best=null, bs=-1;
  for(const v of vs){
    const lc=(v.lang||'').toLowerCase().replace('_','-');
    if(lc!==want && lc.slice(0,2)!==two) continue;
    let s=(lc===want?100:60); const n=(v.name||'').toLowerCase();
    if(/google|natural|neural|online|premium|enhanced|siri/.test(n)) s+=40;
    if(/female|woman|samantha|karen|tessa|moira|fiona|serena|victoria|allison|ava|susan|zoe|amelie|amélie|paulina|monica|mónica|zira|hazel|catherine|linda|kanya|lekha|ting-ting|mei-jia|sin-ji|yu-shu|huihui|xiaoxiao/.test(n)) s+=18;
    if(/espeak|compact|festival|pico|robot|eloquence/.test(n)) s-=60;
    if(v.localService===false) s+=8;
    if(v.default) s+=2;
    if(s>bs){ bs=s; best=v; }
  }
  return best;
}
/* Speech queue. Fixes cut-off audio:
   - a new round no longer calls cancel() over the praise; rounds advance on onend
   - long text is split into sentences (Chrome stops utterances after ~15 s)
   - utterances are kept referenced so Chrome can't garbage-collect them mid-speech
   - after cancel(), the next speak() waits a beat (Chrome drops it otherwise) */
let speechGen=0, speechKeep=[], speechPendingDone=null, speechStarted=false;
function splitSpeech(text){
  const parts=String(text).match(/[^.!?。！？؟।۔]+[.!?。！？؟।۔]*\s*/g)||[text];
  return parts.map(x=>x.trim()).filter(Boolean);
}
function speechEstimateMs(text){ const per=/^(zh)$/.test(lang)?300:95; return 1200+String(text).length*per/0.9; }
function stopSpeech(){
  speechGen++; const d=speechPendingDone; speechPendingDone=null; speechKeep=[];
  if(speechOK){ try{ speechSynthesis.cancel(); }catch(e){} }
  if(d) setTimeout(d,0);
}
function speak(text,onDone){
  const prevDone=speechPendingDone; speechPendingDone=null;
  const gen=++speechGen; let fired=false;
  const done=()=>{ if(fired) return; fired=true; if(speechPendingDone===done) speechPendingDone=null; if(onDone) onDone(); };
  if(onDone) speechPendingDone=done;
  if(prevDone) setTimeout(prevDone,0);  // a superseded speech still lets its round advance
  if(!speechOK || !text || window.__MT_MUTED){ if(onDone) setTimeout(done,700); return; }
  let busy=false;
  try{ busy=speechSynthesis.speaking||speechSynthesis.pending; speechSynthesis.cancel(); }catch(e){}
  const parts=splitSpeech(text), bcp=bcpFor(lang), voice=pickWarmVoice(bcp);
  const start=()=>{
    if(gen!==speechGen) return;
    speechKeep=[];
    try{
      if(speechSynthesis.paused) speechSynthesis.resume();
      parts.forEach((p,i)=>{
        const u=new SpeechSynthesisUtterance(p);
        u.lang=bcp; if(voice) u.voice=voice; u.rate=0.9; u.pitch=1.15;
        u.onstart=()=>{ speechStarted=true; };
        if(i===parts.length-1){ u.onend=done; u.onerror=done; }
        speechKeep.push(u); speechSynthesis.speak(u);
      });
    }catch(e){ done(); }
  };
  if(busy) setTimeout(start,120); else start();
  // Safety net: some engines never fire onend.
  if(onDone) setTimeout(done,speechEstimateMs(text)+2500);
}
/* Speak praise, then start the next round once it finishes (never sooner than minMs). */
const roundIds={cong:0,proof:0,trig:0,unit:0,circ:0,coord:0,cons:0};
function afterPraise(msg,key,next,minMs){
  const id=roundIds[key], t0=Date.now();
  speak(msg,()=>{
    const wait=Math.max(450,(minMs||1200)-(Date.now()-t0));
    setTimeout(()=>{ if(roundIds[key]===id) next(); },wait);
  });
}
if(speechOK){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }
if(!speechOK){ document.addEventListener("DOMContentLoaded",()=>$$(".speaker").forEach(b=>b.style.display="none")); }

const currentSpeech = {cong:"",proof:"",trig:"",unit:"",circ:"",coord:"",cons:""};

// Only auto-read for the panel that is on screen (rounds can refresh in the background).
function maybeAuto(mode){ if(settings.autoRead && currentMode()===mode) speak(currentSpeech[mode]); }
// Browsers block speech until the first tap; read the directions then if nothing has played yet.
document.addEventListener("pointerdown",function firstTap(e){
  document.removeEventListener("pointerdown",firstTap,true);
  if(speechStarted || !settings.autoRead) return;
  if(e.target.closest("button,select,a,input,svg.plane,.side")) return;
  speak(currentSpeech[currentMode()]);
},true);

// Numeric choices: correct first, distinct by shown text, shuffled.
function numOpts(ans,cands,show){ show=show||(v=>V(fmt(v))); const out=[{...show(ans),ok:true}], seen=[out[0].h];
  for(const c of cands){ if(out.length>=4) break; if(c==null||!isFinite(c)||c<=0) continue; const o=show(c); if(seen.includes(o.h)) continue; seen.push(o.h); out.push({...o,ok:false}); }
  let k=1; while(out.length<4&&k<40){ const c=ans*(1+(k%2?1:-1)*(.15+.1*Math.floor(k/2))); const o=show(c); k++; if(c<=0||seen.includes(o.h)) continue; seen.push(o.h); out.push({...o,ok:false}); }
  return shuffle(out); }

/* =========================================================================
   1. CONGRUENCE & SIMILARITY
   ========================================================================= */
const CRIT = ["SSS","SAS","ASA","AAS","HL"];
function newCong(){ const lv=LV(), r=Math.random();
  if(lv==="f"||r<(lv==="g"?.4:.26)) return congRound();
  if(r<(lv==="g"?.6:.44)) return simCritRound();
  if(r<(lv==="g"?.75:.6)) return simFindRound();
  if(r<(lv==="g"?.9:.8)) return propRound();
  return gmRound(); }
function congRound(){
  const m="cong"; startRound(m); const lv=LV();
  const c=rand(lv==="f"?["SSS","SAS","ASA","AAS","SSS","SAS","ASA","AAS","AAA"]:["SSS","SAS","ASA","AAS","HL","HL","SSA","SSA","AAA"]);
  const r=ri(0,2), R1=(r+1)%3, R2=(r+2)%3; let A=null;
  if(c==="HL"){ const a=ri(28,62); A=[0,0,0]; A[r]=90; A[R1]=a; A[R2]=90-a; }
  else for(let k=0;k<800;k++){ const a0=ri(36,104), a1=ri(36,104), B=[a0,a1,180-a0-a1];
    if(!B.every(x=>x>=34&&x<=106&&Math.abs(x-90)>9)) continue; const L=lensA(B);
    if(c==="SSA"&&(B[r]>=78||L[R1]>=L[r]*.92)) continue; A=B; break; }
  if(!A) A=c==="SSA"?[0,0,0].map((_,i)=>[40,60,80][(i-r+3)%3]):[50,60,70];
  const L=lensA(A), mk={tk:[0,0,0],ar:[0,0,0],rt:-1};
  if(c==="SSS") mk.tk=[1,2,3];
  else if(c==="SAS"){ mk.tk[R2]=R2+1; mk.tk[r]=r+1; mk.ar[r]=r+1; }
  else if(c==="ASA"){ mk.ar[r]=r+1; mk.ar[R1]=R1+1; mk.tk[r]=r+1; }
  else if(c==="AAS"){ mk.ar[r]=r+1; mk.ar[R1]=R1+1; mk.tk[R1]=R1+1; }
  else if(c==="HL"){ mk.rt=r; mk.tk[R1]=R1+1; const lg=rand([r,R2]); mk.tk[lg]=lg+1; }

/* ---------- Mode switching ---------- */
const NEWFN={cong:newCong,proof:newProof,trig:newTrig,unit:newUnit,circ:newCirc,coord:newCoord,cons:newCons};
function firstMode(){ return MODES.find(m=>settings.modes[m])||"cong"; }
function currentMode(){ const b=$$(".tabs button").find(x=>x.getAttribute("aria-selected")==="true"); return b?b.dataset.mode:firstMode(); }
function showMode(mode){
  if(!settings.modes[mode]) mode=firstMode();
  const switching=currentMode()!==mode;
  if(switching) stopSpeech();
  const g0=speechGen;
  $$(".modepanel").forEach(p=>p.classList.add("hidden"));
  $("#mode-"+mode).classList.remove("hidden");
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===mode; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; });
  if(!made[mode]) NEWFN[mode]();
  if(switching && speechGen===g0) maybeAuto(mode);
}
function syncTabs(){
  $$(".tabs button").forEach(b=>b.classList.toggle("hidden",!settings.modes[b.dataset.mode]));
  if(!settings.modes[currentMode()]) showMode(firstMode());
}
function resetRounds(){ MODES.forEach(m=>made[m]=false); stopSpeech(); NEWFN[currentMode()](); }

/* ---------- Settings drawer ---------- */
function buildModeToggles(){
  const wrap=$("#modeToggles"); wrap.innerHTML="";
  MODES.forEach(m=>{ const l=document.createElement("label"); l.className="toggle";
    l.innerHTML=`<input type="checkbox" ${settings.modes[m]?"checked":""}> <span>${t(MODE_KEY[m])}</span>`;
    l.querySelector("input").addEventListener("change",e=>{ settings.modes[m]=e.target.checked;
      if(!MODES.some(k=>settings.modes[k])){ e.target.checked=true; settings.modes[m]=true; }
      saveSettings(); syncTabs(); });
    wrap.appendChild(l); });
}
function syncSettingsUI(){
  $("#setLevel").value=settings.level; $("#setRange").value=String(settings.R); $("#setDp").value=String(settings.dp);

}

function initSettings(){
  $("#openSettings").addEventListener("click",()=>{ syncSettingsUI(); $("#settingsDrawer").classList.add("open"); $("#closeSettings").focus(); });

  $("#settingsDrawer").addEventListener("click",e=>{ if(e.target.id==="settingsDrawer") closeSettings(); });

/* ---------- Language engine ---------- */
function resolveLang(){
  try{ const q=new URLSearchParams(location.search).get("lang"); if(q && T[q]) return q; }catch(e){}
  try{ const s=localStorage.getItem(LANG_KEY); if(s && T[s]) return s; }catch(e){}
  const n=(navigator.language||"en").slice(0,2).toLowerCase();
  if(T[n]) return n;
  return "en";
}
function applyLang(){
  const meta=LANGS.find(x=>x.code===lang)||LANGS[0];
  document.documentElement.lang=lang;
  document.documentElement.dir=meta.dir;
  document.title=t("appTitle");
  const sel=$("#langSelect"); if(sel) sel.value=lang;
  $$("[data-t]").forEach(el=>{ el.textContent=t(el.getAttribute("data-t")); });
  $$("[data-ta]").forEach(el=>{ const v=t(el.getAttribute("data-ta")); el.setAttribute("aria-label",v); el.title=v; });
  $("#stdsNote").innerHTML=stdsHTML();
  buildModeToggles();
  resetRounds();
}
function setLang(l){ if(!T[l]) l="en"; lang=l; try{ localStorage.setItem(LANG_KEY,l); }catch(e){} applyLang(); }
function buildLangSelect(){
  const sel=$("#langSelect"); sel.innerHTML="";
  LANGS.forEach(m=>{ const o=document.createElement("option"); o.value=m.code; o.textContent=m.name; sel.appendChild(o); });
  sel.value=lang;
  sel.addEventListener("change",()=>setLang(sel.value));
}

  $("#panels").innerHTML=MODES.map(m=>`<section id="mode-${m}" class="panel modepanel hidden" role="tabpanel" aria-labelledby="tab-${m}">
    <div class="panelhead"><h2 data-t="${MODE_KEY[m]}"></h2><button type="button" class="btn ghost no-print" data-new="${m}" data-t="newRound"></button></div>
    <div class="prompt"><button type="button" class="speaker" data-speak="${m}" data-ta="readAloud" aria-label="Read aloud">🔊</button><span id="p-${m}">…</span></div>
    <div class="work" id="w-${m}"></div>
    <div class="acts no-print" id="a-${m}"></div>
    <div class="choices" id="c-${m}" role="group" data-ta="choicesLbl" aria-label="Answer choices"></div>
    <div class="feedback" id="f-${m}" role="status" aria-live="polite"></div></section>`).join("");
  MODES.forEach(wirePlane);
  wireProof();
  const tw=$("#w-trig");
  tw.addEventListener("click",e=>{ const g=e.target.closest(".side"); if(g&&st.trig&&st.trig.onSide&&!st.trig.done) st.trig.onSide(g.dataset.k); });
  tw.addEventListener("keydown",e=>{ const g=e.target.closest(".side"); if(g&&(e.key==="Enter"||e.key===" ")&&st.trig&&st.trig.onSide&&!st.trig.done){ e.preventDefault(); st.trig.onSide(g.dataset.k); } });
  const uw=$("#w-unit");
  uw.addEventListener("click",e=>{ const g=e.target.closest(".ucp[data-a]"); if(g&&st.unit&&st.unit.onPt&&!st.unit.done) st.unit.onPt(+g.dataset.a); });
  uw.addEventListener("keydown",e=>{ const g=e.target.closest(".ucp[data-a]"); if(g&&(e.key==="Enter"||e.key===" ")&&st.unit&&st.unit.onPt&&!st.unit.done){ e.preventDefault(); st.unit.onPt(+g.dataset.a); } });
  $("#tabs").addEventListener("keydown",e=>{ const vis=$$(".tabs button").filter(b=>!b.classList.contains("hidden")), i=vis.indexOf(document.activeElement); if(i<0) return;
    const rtl=document.documentElement.dir==="rtl", stp={ArrowRight:rtl?-1:1,ArrowLeft:rtl?1:-1}[e.key]; if(!stp) return;
    const nb=vis[(i+stp+vis.length)%vis.length]; nb.focus(); showMode(nb.dataset.mode); e.preventDefault(); });
}
function init(){
  lang=resolveLang();
  buildUI();
  buildLangSelect();
  $$(".tabs button").forEach(b=>b.addEventListener("click",()=>showMode(b.dataset.mode)));
  $$(".speaker").forEach(b=>b.addEventListener("click",()=>speak(currentSpeech[b.dataset.speak])));
  $$("[data-new]").forEach(b=>b.addEventListener("click",()=>{ stopSpeech(); NEWFN[b.dataset.new](); }));
  initSettings();
  const f=firstMode();
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===f; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; b.classList.toggle("hidden",!settings.modes[b.dataset.mode]); });
  $$(".modepanel").forEach(p=>p.classList.toggle("hidden",p.id!=="mode-"+f));
  applyLang();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
</script>
<script>
/* Student mute toggle — shared across the Digital Math Tools. Self-contained,
   offline, stores no student data. Gates ALL speech by intercepting
   speechSynthesis.speak, so muting works regardless of each tool's internals.
   Reads the shared language preference only to localize its own label. */
(function(){
  "use strict";
  var LKEY='tcea.mathtools.lang', MKEY='tcea.mathtools.muted';
  var CODES=['en','es','vi','ar','hi','ur','zh'];
  var LAB={
    mute:{en:"Mute sound",es:"Silenciar sonido",vi:"Tắt âm thanh",ar:"كتم الصوت",hi:"आवाज़ बंद करें",ur:"آواز بند کریں",zh:"静音"},
    unmute:{en:"Turn sound on",es:"Activar sonido",vi:"Bật âm thanh",ar:"تشغيل الصوت",hi:"आवाज़ चालू करें",ur:"آواز چالو کریں",zh:"打开声音"}
  };
  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  window.__MT_MUTED = (get(MKEY)==='1');
  // Intercept every speech request; suppress while muted.
  try{
    if(window.speechSynthesis && typeof window.speechSynthesis.speak==='function'){
      var ss=window.speechSynthesis, orig=ss.speak.bind(ss);
      ss.speak=function(u){ if(!window.__MT_MUTED){ try{orig(u);}catch(e){} } };
    }
  }catch(e){}
  function curLang(){ var l=get(LKEY)||'en'; return LAB.mute[l]?l:'en'; }
  function label(el){
    var on=!window.__MT_MUTED, l=curLang(), txt=on?LAB.mute[l]:LAB.unmute[l];
    el.textContent=on?'🔊':'🔇';
    el.setAttribute('aria-label',txt); el.setAttribute('title',txt);
    el.setAttribute('aria-pressed', on?'false':'true');
  }
  function findLangSelect(){
    var sels=document.querySelectorAll('select');
    for(var i=0;i<sels.length;i++){ var o=sels[i].options, c=0;
      for(var j=0;j<o.length;j++){ if(CODES.indexOf((o[j].value||'').toLowerCase())>=0) c++; }
      if(c>=3) return sels[i];
    }
    return null;
  }
  function build(){
    if(document.getElementById('mtMuteBtn')) return;
    if(!(('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window))) return;
    var btn=document.createElement('button');
    btn.id='mtMuteBtn'; btn.type='button';
    btn.style.cssText='font:inherit;font-size:1.15rem;line-height:1;cursor:pointer;'+
      'min-width:44px;min-height:44px;padding:8px 12px;border:2px solid #e2dcf1;'+
      'border-radius:10px;background:#fff;color:#5b3fa5;font-weight:700;margin:0 4px;';
    btn.addEventListener('click',function(){
      window.__MT_MUTED=!window.__MT_MUTED;
      set(MKEY, window.__MT_MUTED?'1':'0');
      if(window.__MT_MUTED){ try{window.speechSynthesis.cancel();}catch(e){} }
      label(btn);
    });
    btn.addEventListener('focus',function(){btn.style.outline='3px solid #5b3fa5';btn.style.outlineOffset='2px';});
    btn.addEventListener('blur',function(){btn.style.outline='';});
    var sel=findLangSelect();
    if(sel && sel.parentNode){
      sel.parentNode.insertBefore(btn, sel);
      sel.addEventListener('change',function(){ setTimeout(function(){label(btn);},0); });
    }else{
      btn.style.position='fixed'; btn.style.top='10px'; btn.style.zIndex='9999';
      btn.style[(document.documentElement.dir==='rtl')?'left':'right']='10px';
      (document.body||document.documentElement).appendChild(btn);
    }
    label(btn);
  }
  if(document.readyState==='complete'){ build(); }
  else{ window.addEventListener('load', build); }
  window.addEventListener('storage',function(e){ if(e.key===LKEY){ var b=document.getElementById('mtMuteBtn'); if(b) label(b); } });
})();
</script>
