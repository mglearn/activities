<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Linear Systems Lab — a Grades 9–12 Algebra I app for forms of a line, systems by graphing, substitution and elimination, linear inequalities, and modeling with systems. Works offline. No data collected.">
<title>Linear Systems Lab</title>
<style>
  :root{
    --bg:#eef4f9;--panel:#ffffff;--ink:#14212d;--muted:#46576a;--line:#c6d7e6;
    --accent:#2980b9;--accentD:#1f618d;--accent-ink:#ffffff;--good:#166534;--good-bg:#dcfce7;
    --hint:#7a4a00;--hint-bg:#fff4d6;--focus:#0a58ca;--tgt:#d35400;--l2:#8e44ad;
    --tap:48px;font-size:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-text-size-adjust:100%}
  h1,h2,h3{line-height:1.15;margin:0 0 .3em}
  button{font-family:inherit;font-size:1rem;cursor:pointer}
  button:disabled{cursor:default}

  .topbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--accentD);color:var(--accent-ink);padding:.55rem .8rem}
  .topbar .brand{font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:.4rem;margin-inline-end:auto}
  .topbar a.homebtn,.topbar button.tb{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.4rem .7rem;min-height:var(--tap);min-width:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:.35rem;text-decoration:none;font-weight:700;font-size:.95rem}
  .globe{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.2rem .5rem;min-height:var(--tap)}
  .globe span{font-size:1.2rem}
  .globe select{border:0;background:#fff;color:var(--ink);border-radius:8px;min-height:44px;font-weight:700;font-size:1rem;padding:.2rem .4rem}

  main{max-width:1200px;margin:0 auto;padding:.7rem}
  .tabsrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 .7rem}
  .tabs{display:flex;gap:.4rem;flex-wrap:wrap;flex:1 1 auto}
  .tabs button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.45rem .75rem;min-height:var(--tap);font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:.4rem}
  .tabs button[aria-selected="true"]{background:var(--accentD);color:#fff;border-color:var(--accentD)}
  .tabs button .ic{font-size:1.15rem}
  .stars{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.4rem .8rem;font-weight:800;font-size:1.1rem;min-height:48px;display:inline-flex;align-items:center;gap:.3rem}
  .stars.pop{animation:pop .5s ease}
  @keyframes pop{50%{transform:scale(1.15)}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:.9rem;margin-bottom:.8rem}
  .panelhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
  .panelhead h2{margin:0;font-size:1.25rem;margin-inline-end:auto}

  .prompt{display:flex;align-items:center;gap:.6rem;background:#eaf3fa;border:2px solid #b9d5ea;border-radius:14px;padding:.6rem .8rem;margin-bottom:.7rem;font-size:1.08rem;font-weight:600;line-height:1.85}
  .prompt>span{min-width:0;overflow-wrap:anywhere}
  .speaker{background:var(--accentD);color:#fff;border:0;border-radius:50%;width:var(--tap);height:var(--tap);min-width:var(--tap);font-size:1.3rem;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}

  .btn{background:var(--accentD);color:#fff;border:2px solid var(--accentD);border-radius:12px;padding:.5rem .85rem;min-height:var(--tap);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
  .btn.ghost{background:var(--panel);color:var(--accentD)}
  .btn.ghost[aria-pressed="true"]{background:var(--accentD);color:#fff}
  .btn:disabled{opacity:.45}

  .feedback{margin-top:.6rem;border-radius:12px;padding:.6rem .8rem;font-weight:600;display:none;line-height:1.9;overflow-wrap:anywhere}
  .feedback.show{display:block}
  .feedback.good{background:var(--good-bg);color:var(--good);border:2px solid #86efac}
  .feedback.hint{background:var(--hint-bg);color:var(--hint);border:2px solid #f6d271}

  /* Math: always left-to-right, even inside Arabic/Urdu sentences */
  .math{unicode-bidi:isolate;direction:ltr;display:inline;font-weight:800;white-space:nowrap}
  .math i{font-family:Georgia,'Times New Roman',serif;font-weight:700}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:800;margin:0 .08em;white-space:nowrap;font-size:.85em}
  .fr>span{padding:0 .16em}
  .fr>span:first-child{border-bottom:.12em solid currentColor}

  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:.6rem;margin-top:.7rem}
  .choices:empty{display:none}
  .choice{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:.5rem;min-height:64px;display:flex;align-items:center;justify-content:center;position:relative;font-size:1.15rem;font-weight:800;color:var(--ink);min-width:0;line-height:1.7}
  .choice .lbl{unicode-bidi:isolate;direction:ltr;min-width:0}
  .choice.txt{font-size:1rem;font-weight:700;padding-inline:1.5rem}
  .choice.txt .lbl{direction:inherit}
  .choice.correctpick{border-color:var(--good);background:var(--good-bg)}
  .choice.wrongpick{border-color:#e3b341;background:var(--hint-bg);opacity:.75}
  .choice .badge{position:absolute;top:4px;inset-inline-end:6px;font-size:1rem;display:none}
  .choice.correctpick .badge{display:block}
  .sys2{display:inline-block;text-align:start;border-inline-start:3px solid currentColor;padding-inline-start:.5rem;line-height:1.9}

  .work:empty{display:none}
  .split{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem;align-items:start}
  @media (min-width:820px){ .split{grid-template-columns:minmax(0,1fr) minmax(0,440px)} }
  .side{display:flex;flex-direction:column;gap:.6rem;align-items:center;min-width:0}
  .pwrap{width:100%;max-width:440px;margin:0 auto}
  .plane{width:100%;height:auto;display:block;touch-action:none;background:#fff;border:2px solid var(--line);border-radius:12px}
  .plane[tabindex]{cursor:crosshair}
  .plane:focus{outline:none}
  .plane:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  .gl{stroke:#dde8f2;stroke-width:1}
  .ax{stroke:#1b2a38;stroke-width:2.2}
  .tl{font:600 14px system-ui,sans-serif;fill:#4a5a6a}
  .axn{font:italic 700 18px Georgia,serif;fill:#1b2a38}
  .ln{stroke:var(--accent);stroke-width:4;stroke-linecap:round}
  .ln.l2{stroke:var(--l2)}
  .ln.dash{stroke-dasharray:12 9;stroke-linecap:butt}
  .ln.pre{stroke:#7b8a99;stroke-width:3}
  .ln.pre.dash{stroke-dasharray:12 9}
  .sh{fill:rgba(41,128,185,.20)}
  .sh.l2{fill:rgba(142,68,173,.20)}
  .lnl{font:800 17px system-ui,sans-serif;fill:var(--accentD);paint-order:stroke;stroke:#fff;stroke-width:4}
  .lnl.l2{fill:var(--l2)}
  .pt{fill:var(--accent);stroke:#fff;stroke-width:2.5}
  .pt.bad{fill:#e3a008}
  .pt.ok{fill:#16a34a}
  .pt.tp{fill:var(--tgt)}
  .pt.dr{fill:var(--accent);stroke:#fff;stroke-width:3}
  .pt.dr.l2{fill:var(--l2)}
  .pt.dr.sel{stroke:#14212d;stroke-width:4}
  .ptl{font:800 16px system-ui,sans-serif;fill:#14212d;paint-order:stroke;stroke:#fff;stroke-width:4}
  .cur{fill:none;stroke:var(--focus);stroke-width:3;display:none}
  .plane:focus-visible .cur{display:inline}

  .rule{background:#f5f9fc;border:2px dashed #b9d5ea;border-radius:12px;padding:.45rem .7rem;font-weight:600;line-height:1.85;overflow-wrap:anywhere;width:100%}
  .big{font-size:1.4rem;text-align:center;margin:.2rem 0;line-height:2}
  .sys{display:block;width:max-content;max-width:100%;margin:.2rem auto;border-inline-start:4px solid var(--accentD);padding:.2rem .7rem;font-size:1.25rem;line-height:2.1}
  .tag{display:inline-block;min-width:2.2em;color:var(--muted);font-weight:800;font-size:.85em}
  ol.log{list-style:none;margin:.4rem auto;padding:.4rem .7rem;max-width:100%;width:max-content;font-size:1.1rem;line-height:2.1;border-radius:12px;background:#f5f9fc}
  ol.log:empty{display:none}
  .acts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;margin:.5rem 0}
  .acts:empty{display:none}
  .legend{display:flex;gap:.4rem 1rem;flex-wrap:wrap;justify-content:center;font-weight:700;line-height:2}
  .legend .sw{display:inline-block;width:26px;height:5px;border-radius:3px;vertical-align:middle;margin-inline-end:.3rem;background:var(--accent)}
  .legend .sw.l2{background:var(--l2)}
  .stylebar{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}

  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:1rem}
  .drawer.open{display:flex}
  .drawer .card{background:var(--panel);border-radius:16px;max-width:600px;width:100%;padding:1rem;max-height:90vh;overflow:auto}
  .setrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0;padding:.5rem 0;border-bottom:1px solid var(--line)}
  .setrow .lab{font-weight:700;min-width:150px}
  .toggle{display:inline-flex;align-items:center;gap:.35rem;border:2px solid var(--line);border-radius:10px;padding:.35rem .55rem;background:#fff;min-height:44px}
  .toggle input{width:22px;height:22px}
  select.diff{font-size:1rem;padding:.4rem;border-radius:10px;border:2px solid var(--line);min-height:48px;max-width:100%}
  .wrapflex{display:flex;flex-wrap:wrap;gap:.4rem}

  footer{max-width:1200px;margin:.5rem auto 2rem;padding:.8rem;color:var(--muted);font-size:.9rem;text-align:center}
  footer a{color:var(--accentD);font-weight:700}
  .stds{font-size:.82rem;color:var(--muted);background:#f5f9fc;border:1px dashed var(--line);border-radius:12px;padding:.5rem .7rem;margin-top:.4rem}

  .hidden{display:none !important}
  :focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  @media (max-width:480px){ :root{font-size:16.5px} main{padding:.5rem} .panel{padding:.6rem} .tabs button{padding:.4rem .5rem;font-size:.9rem} .sys{font-size:1.1rem;padding:.2rem .45rem} ol.log{font-size:1rem;padding:.3rem .45rem} .choice{font-size:1.05rem} .big{font-size:1.2rem} }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

  .printonly{display:none}
  @media print{
    .topbar,.tabsrow,footer,.modepanel,#stdsNote,.no-print,#mtMuteBtn{display:none !important}
    body{background:#fff}
    .printonly{display:block}
    .card-print{border:2px solid #000;border-radius:12px;padding:1rem;margin:0 0 1rem;page-break-inside:avoid}
    .card-print h2{margin:.2rem 0}
    .card-print svg.plane{max-width:260px;border:1px solid #000}
    main{max-width:100%}
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">📉 <span data-t="appTitle">Linear Systems Lab</span></span>
  <a class="homebtn" href="../../index.html">🏠 <span data-t="home">Home</span></a>
  <label class="globe"><span aria-hidden="true">🌐</span>
    <select id="langSelect" aria-label="Language / Idioma"></select>
  </label>
  <button class="tb settingsbtn" id="openSettings" type="button">⚙️ <span data-t="teacher">Teacher</span></button>
</header>

<main>
  <div class="tabsrow">
    <div class="tabs" id="tabs" role="tablist" data-ta="modesLbl" aria-label="Modes"></div>
    <span class="stars" id="stars"><span aria-hidden="true">✔</span><span class="sr" data-t="stars">Correct answers</span> <b id="starCount">0</b></span>
  </div>
  <div id="panels"></div>
  <div class="stds" id="stdsNote"></div>
  <div class="printonly" id="printArea"></div>
</main>

<footer>
  <p data-t="footNote">No accounts · No data collected · Works offline</p>
  <p><a href="../../index.html" data-t="home">Home</a> · <a href="../../policy.html" data-t="privacy">Privacy</a></p>
</footer>

<!-- SETTINGS -->
<div class="drawer" id="settingsDrawer" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="card">
    <div class="panelhead"><h2 id="setTitle" data-t="teacherTitle">Teacher settings</h2>
      <button class="btn ghost" id="closeSettings" type="button" data-t="close">Close</button></div>
    <div class="setrow"><label class="lab" for="setLevel" data-t="setLevel">Level</label>
      <select class="diff" id="setLevel">
        <option value="f" data-t="lvF">Foundations</option>
        <option value="a1" data-t="lvA1">Algebra I</option>
        <option value="adv" data-t="lvAdv">Advanced</option></select>
      <p class="stds" style="margin:0;flex:1 1 100%" data-t="levelNote"></p></div>
    <div class="setrow"><label class="lab" for="setRange" data-t="setRange">Grid size</label>
      <select class="diff" id="setRange">
        <option value="6">−6 … 6</option>
        <option value="8">−8 … 8</option>
        <option value="10">−10 … 10</option></select></div>
    <div class="setrow"><label class="lab" for="setMax" data-t="setMax">Largest solution value</label>
      <select class="diff" id="setMax">
        <option value="5">±5</option>
        <option value="8">±8</option>
        <option value="10">±10</option></select></div>
    <div class="setrow"><span class="lab" data-t="setNums">Numbers</span>
      <label class="toggle"><input type="checkbox" id="setFrac"> <span data-t="fracOn">Fraction slopes</span></label></div>
    <div class="setrow"><span class="lab" data-t="setModes">Modes</span>
      <div id="modeToggles" class="wrapflex"></div></div>
    <div class="setrow"><span class="lab" data-t="setSpeech">Speech</span>
      <label class="toggle"><input type="checkbox" id="setAuto"> <span data-t="autoRead">Auto-read directions</span></label></div>
    <div class="setrow" style="border:0"><button class="btn" id="printCards" type="button">🖨 <span data-t="printCards">Print challenge cards</span></button></div>
    <p class="stds" data-t="setStored">Settings are saved only on this device. No student information is ever stored.</p>
  </div>
</div>

<script>

    if(lc!==want && lc.slice(0,2)!==two) continue;
    let s=(lc===want?100:60); const n=(v.name||'').toLowerCase();
    if(/google|natural|neural|online|premium|enhanced|siri/.test(n)) s+=40;
    if(/female|woman|samantha|karen|tessa|moira|fiona|serena|victoria|allison|ava|susan|zoe|amelie|amélie|paulina|monica|mónica|zira|hazel|catherine|linda|kanya|lekha|ting-ting|mei-jia|sin-ji|yu-shu|huihui|xiaoxiao/.test(n)) s+=18;

      {q:tm("qSolveX",{eq:right}), opts:()=>numOpts(x0,[-x0,(c-k)/(a+b*mm),(c+b*k)/(a+b*mm)]).map(o=>({...o,hint:tm("hSolveSub",{dist})})),
        done:()=>({log:dist.h+"<br>"+comb1.h+"<br>"+M(`<i>x</i> = ${nH(x0)}`), msg:tm("goodX",{dist,eq:comb1,x:N2(x0)})})},
      {q:tm("qY",{x:N2(x0)}), opts:()=>{ const ev=evalH([[mm,x0]],k); return numOpts(y0,[-y0,mm*x0-k,mm+x0+k]).map(o=>({...o,hint:tm("hY",{calc:ev})})); },
        done:()=>({log:M(`<i>y</i> = ${nH(y0)}`), msg:tm("goodSolve",{p:PT(x0,y0),c1:chkE(eSI(L),x0,y0),c2:chkE(eST(a,b,c),x0,y0)})})}];
    runSteps(m,steps); return maybeAuto(m);
  }
  if(type==="check"){
    const {E1,E2,x0,y0}=elimSys(lv==="adv"?"a1":lv), ok=Math.random()<.45;
    let p=[x0,y0]; if(!ok){ const c=shuffle([[x0+1,y0],[x0,y0-1],[y0,x0],[x0-1,y0+1]]).find(q=>!(valE(eST(E1.a,E1.b,E1.c),q[0],q[1])&&valE(eST(E2.a,E2.b,E2.c),q[0],q[1]))); p=c||[x0+1,y0+1]; }
    const c1=chkE(eST(E1.a,E1.b,E1.c),p[0],p[1]), c2=chkE(eST(E2.a,E2.b,E2.c),p[0],p[1]), P_=PT(p[0],p[1]);
    w.innerHTML=sysBox(stdD(E1),stdD(E2));
    const why=ok?tm("whyChkY",{p:P_,c1,c2}):tm("whyChkN",{p:P_,c:c1.ok?c2:c1});
    choices(m,[TCH("ansYes",ok),TCH("ansNo",!ok)],it=>{ if(it.ok) return win(m,cat(TX("yes"),why)); nope(m,why); });
    setPrompt(m,tm("chkDir",{p:P_})); return maybeAuto(m);
  }
  if(type==="frac"){
    let S_, L_, F, n=0;
    do{ S_=elimSys("a1"); L_=rand([2,3,4,6]); F=[S_.E1.a,S_.E1.b,S_.E1.c].map(v=>Q(v,L_)); n++; }
    while(n<500&&F.map(f=>f.q).reduce((a,b)=>lcm(a,b),1)!==L_);
    const {E1,E2,x0,y0}=S_, dens=[...new Set(F.map(f=>f.q).filter(d=>d>1))];
    const E1f=EQN(lin([{c:F[0],v:"x"},{c:F[1],v:"y"}]),"=",lin([{c:F[2]}]));
    w.innerHTML=sysBox(E1f,stdD(E2))+`<ol class="log" id="lg-${m}"></ol>`;
    const pre=[{q:cat(TX("dirElim"),TX("qClear")), opts:()=>{ const prod=dens.reduce((a,b)=>a*b,1);
        return numOpts(L_,[prod!==L_?prod:2*L_,Math.min(...dens),L_*2,L_+1].filter(v=>v>1)).filter(o=>o.v>0).map(o=>({...o,hint:tm("hClear",{d:{h:dens.join(", "),s:dens.join(", ")}})})); },
      done:()=>({log:`<span class="tag">${L_}·(1)</span> `+stdD(E1).h, msg:tm("goodClear",{n:L_,eq:stdD(E1)})})}];
    runSteps(m,elimSteps(m,E1,E2,x0,y0,pre)); return maybeAuto(m);
  }
  const {E1,E2,x0,y0}=elimSys(lv);
  w.innerHTML=sysBox(stdD(E1),stdD(E2))+`<ol class="log" id="lg-${m}"></ol>`;
  const steps=elimSteps(m,E1,E2,x0,y0); steps[0].q=cat(TX("dirElim"),steps[0].q);
  runSteps(m,steps); maybeAuto(m);
}

/* =========================================================================
   4. LINEAR INEQUALITIES — graph the boundary (solid/dashed), shade with a
      test point; read an inequality from a graph; systems of inequalities.
   ========================================================================= */
function genIneq(f){ const R=RR(), Ls=slopes(3); let L;
  do{ L={m:rand(Ls),b:Q(ri(-R+3,R-3))}; }while(latPts(L,R-1).length<2);
  return {L,rel:rand(["<","≤",">","≥"]),f}; }
function ineqF(){ const lv=LV(); return lv==="f"?"si":lv==="a1"?(Math.random()<.3?"st":"si"):(Math.random()<.6?"st":"si"); }
function newIneq(){
  const m="ineq"; startRound(m); const s=st[m], lv=LV(), R=RR(), w=$("#w-"+m);
  const type=rand(lv==="f"?["draw","draw","test","pick"]:lv==="a1"?["draw","pick","sys","test"]:["draw","pick","sys","sys"]); s.type=type;
  const sty=I=>strict(I.rel)?"dash":"";
  if(type==="test"){
    const I=genIneq(ineqF()); let p;
    if(Math.random()<.3){ const pts=latPts(I.L,5); p=rand(pts.length?pts:[[0,0]]); } else p=[ri(-5,5),ri(-5,5)];
    const c=chkI(I,p[0],p[1]), P_=PT(p[0],p[1]), edge=onL(I.L,p[0],p[1]);
    const why=cat(tm(c.ok?"whyTestT":"whyTestF",{p:P_,calc:c}),...(edge?[TX("noteEdge")]:[]));
    choices(m,[TCH("ansYes",c.ok),TCH("ansNo",!c.ok)],it=>{ if(it.ok) return win(m,cat(TX("yes"),why)); nope(m,why); });
    setPrompt(m,tm("testDir",{p:P_,eq:dispI(I)})); return maybeAuto(m);
  }
  if(type==="pick"){
    const I=genIneq(lv==="adv"?"st":lv==="a1"&&Math.random()<.3?"st":"si"), abv=above(I.rel), str=strict(I.rel);
    w.innerHTML=planeStatic({R,shades:[{L:I.L,abv}],lines:[{...I.L,cls:sty(I)}]});
    const alts=[{L:I.L,rel:FLIP[I.rel]},{L:I.L,rel:TOG[I.rel]},{L:I.L,rel:FLIP[TOG[I.rel]]},{L:{m:qn(I.L.m),b:I.L.b},rel:I.rel}];
    const opts=[{...I,ok:true}].concat(shuffle(alts).slice(0,3).map(a=>({...a,f:I.f,ok:false}))).map(o=>({...dispI(o),...o}));
    const style=t(str?"dashedW":"solidW");
    choices(m,shuffle(opts),it=>{
      if(it.ok) return win(m,tm(abv?"goodPickA":"goodPickB",{eq:dispI(I),style}));
      if(!sameL(it.L,I.L)) return nope(m,tm("hLineP",{b:N2(I.L.b.p),m:QV(I.L.m)}));
      const sy=(a,b)=>({h:REL[a][0]+" "+t("or")+" "+REL[b][0], s:t(REL[a][1])+" "+t("or")+" "+t(REL[b][1])});
      if(above(it.rel)!==abv) return nope(m,cat(tm(abv?"hDirA":"hDirB",{sy:abv?sy(">","≥"):sy("<","≤")}),...(I.f==="st"?[TX("hFlip")]:[])));
      nope(m,tm(str?"hDashP":"hSolidP",{sy:str?sy("<",">"):sy("≤","≥")})); });
    setPrompt(m,TX("pickDir")); return maybeAuto(m);
  }
  if(type==="sys"){
    let I1,I2,n=0;
    do{ I1=genIneq(ineqF()); I2=genIneq(ineqF()); n++;
      if(qeq(I1.L.m,I2.L.m)) continue;
      let cnt=0; for(let x=-R+1;x<R;x++) for(let y=-R+1;y<R;y++) if(satI(I1,x,y)&&satI(I2,x,y)) cnt++;
      if(cnt>=6&&cnt<(2*R-1)*(2*R-1)*.45) break; }while(n<400);
    s.pt=null; const I=[I1,I2]; s.I=I;
    const legend=`<div class="legend"><span><span class="sw"></span>(1) ${dispI(I1).h}</span><span><span class="sw l2"></span>(2) ${dispI(I2).h}</span></div>`;
    w.innerHTML=`<div class="split"><div class="side">${legend}</div><div>${planeBox(m,{
      view:()=>({shades:[{L:I1.L,abv:above(I1.rel)},{L:I2.L,abv:above(I2.rel),cls:"l2"}],lines:[{...I1.L,cls:sty(I1),lab:"1"},{...I2.L,cls:"l2 "+sty(I2),lab:"2"}],pts:s.pt?[{...s.pt}]:[]}),
      tap:(x,y)=>{ s.pt={x,y,cls:"tp"}; hideFb($("#f-"+m)); redraw(m); } })}</div></div>`;
    checkBtn(m,()=>{ const p=s.pt; if(!p) return nope(m,TX("hTapFirst"));
      const c=I.map(J=>chkI(J,p.x,p.y)), P_=PT(p.x,p.y);
      if(c[0].ok&&c[1].ok){ p.cls="ok"; redraw(m); return win(m,tm("goodSys",{p:P_,c1:c[0],c2:c[1]})); }
      p.cls="bad"; redraw(m); const i=c[0].ok?1:0;
      nope(m,onL(I[i].L,p.x,p.y)&&strict(I[i].rel)?tm("hSysEdge",{p:P_,n:i+1}):tm("hSysFail",{p:P_,n:i+1,calc:c[i]})); });
    setPrompt(m,TX("sysDir")); return maybeAuto(m);
  }
  // draw: boundary by dragging two points, choose solid/dashed, then shade by tapping a side
  const I=genIneq(ineqF()), E=dispI(I);
  Object.assign(s,{I,phase:1,solid:null,tp:null,H:[{x:-R+1,y:-R+1},{x:-R+3,y:-R+1}]});
  w.innerHTML=`<div class="split"><div class="side"><p class="big">${E.h}</p><div class="stylebar">
      <button type="button" class="btn ghost" id="stS" aria-pressed="false">━ ${t("solidB")}</button>
      <button type="button" class="btn ghost" id="stD" aria-pressed="false">╍ ${t("dashedB")}</button></div></div><div>${planeBox(m,{
    view:()=>s.phase===1?{lines:[(L=>L&&{...L,cls:(s.solid===false?"dash":"")+(s.solid===null?" pre":"")})(lineFrom(s.H[0],s.H[1]))],
        pts:s.H.map((p,i)=>({...p,cls:"dr"+(PL[m]&&PL[m].sel===i?" sel":"")}))}
      :{shades:s.tp?[{L:I.L,abv:qv(qs(Q(s.tp.y),at(I.L,s.tp.x)))>0}]:[],lines:[{...I.L,cls:sty(I)}],pts:s.tp?[{...s.tp}]:[]},
    drag:{get:()=>s.H,set:(i,x,y)=>{ s.H[i]={x,y}; hideFb($("#f-"+m)); redraw(m); }},
    tap:(x,y)=>{ if(s.phase!==2) return; if(onL(I.L,x,y)) return nope(m,TX("hOnLine")); s.tp={x,y,cls:"tp"}; hideFb($("#f-"+m)); redraw(m); } })}</div></div>`;
  const setSty=v=>{ if(s.phase!==1) return; s.solid=v; $("#stS").setAttribute("aria-pressed",v?"true":"false"); $("#stD").setAttribute("aria-pressed",v?"false":"true"); hideFb($("#f-"+m)); redraw(m); };
  $("#stS").addEventListener("click",()=>setSty(true)); $("#stD").addEventListener("click",()=>setSty(false));
  checkBtn(m,()=>{
    if(s.phase===1){
      const [A,B]=s.H;
      if(!handlesOn(I.L,A,B)) return nope(m,A.x===B.x&&A.y===B.y?TX("hSame"):drawHint(I.L,I.f,t("boundL")));
      if(s.solid===null) return nope(m,TX("hStyleNone"));
      if(s.solid===strict(I.rel)) return nope(m,TX(strict(I.rel)?"hStyleD":"hStyleS"));
      s.phase=2; $("#stS").disabled=true; $("#stD").disabled=true; toTap(m); setPrompt(m,TX("shadeDir"));
      return step(m,tm("goodBound",{style:t(s.solid?"solidW":"dashedW")}));
    }
    const p=s.tp; if(!p) return nope(m,TX("hTapSide"));
    const c=chkI(I,p.x,p.y), P_=PT(p.x,p.y);
    if(c.ok) return win(m,tm("goodShade",{p:P_,calc:c}));
    nope(m,tm("hShade",{p:P_,calc:c})); });
  setPrompt(m,tm("ineqDir",{eq:E})); maybeAuto(m);
}

/* =========================================================================
   5. MODELING — set up the system from a word problem, solve it, and
      interpret the solution (tickets, mixtures, plans, break-even).
   ========================================================================= */
function newModel(){
  const m="model"; startRound(m); const s=st[m], lv=LV(), w=$("#w-"+m), big=lv==="adv";
  const type=rand(lv==="f"?["tix","plan"]:["tix","mix","plan","brk"]); s.type=type;
  let ctx, E, wrongSys, x0, y0, wrongPairs, interp, hInt;
  const siE=(mm,b)=>eSI({m:Q(mm),b:Q(b)});
  if(type==="tix"||type==="mix"){
    const tix=type==="tix", a=tix?rand([8,10,12,15]):rand([8,9,10,12]), b=tix?rand([4,5,6]):rand([3,4,5]);
    x0=tix?ri(big?40:10,big?150:60):ri(2,big?20:12); do{ y0=tix?ri(big?40:10,big?150:60):ri(2,big?20:12); }while(y0===x0);
    const n=x0+y0, T_=a*x0+b*y0, xn=t(tix?"xnTix":"xnMix"), yn=t(tix?"ynTix":"ynMix");
    E=[eST(1,1,n),eST(a,b,T_)]; ctx=tm(tix?"pTix":"pMix",{n,T:T_,a,b});
    wrongSys=[[eST(1,1,T_),eST(a,b,n),tm("hTot",{n,T:T_})],[eST(1,1,n),eST(b,a,T_),tm("hSwap",{xn,a})]];
    wrongPairs=[[y0,x0],[x0+1,y0-1],[x0+2,y0]];
    interp=[[tm(tix?"iTix":"iMix",{x:x0,y:y0}),true],[tm(tix?"iTix":"iMix",{x:y0,y:x0}),false],[tm(tix?"iTixW":"iMixW",{x:x0,y:y0}),false]];
    hInt=tm("hIntXY",{xn,yn});
  } else if(type==="plan"){
    const r2=ri(big?20:10,big?40:25), r1=r2+ri(big?5:3,big?15:10), x0_=ri(2,12), f1=ri(1,5)*10, f2=f1+(r1-r2)*x0_;
    x0=x0_; y0=f1+r1*x0;
    E=[siE(r1,f1),siE(r2,f2)]; ctx=tm("pPlan",{f1,r1,f2,r2});
    wrongSys=[[siE(f1,r1),siE(f2,r2),TX("hPlanA")],[siE(r1,f2),siE(r2,f1),TX("hPlanB")]];
    wrongPairs=[[y0,x0],[x0+1,f1+r1*(x0+1)],[x0,y0+r1]];
    interp=[[tm("iPlan",{x:x0,y:y0,g:t("gymB")}),true],[tm("iPlan",{x:x0,y:y0,g:t("gymA")}),false],[tm("iPlanW",{x:x0,y:y0}),false]];
    hInt=TX("hIntPlan");
  } else {
    const v=ri(2,6), p=v+ri(3,8); x0=ri(big?20:10,big?80:40); const F=(p-v)*x0; y0=p*x0;
    E=[siE(v,F),siE(p,0)]; ctx=tm("pBrk",{F,v,p});
    wrongSys=[[siE(F,v),siE(p,0),tm("hBrkA",{F})],[siE(v,F),siE(p,F),TX("hBrkB")]];
    wrongPairs=[[y0,x0],[x0+5,p*(x0+5)],[x0+2,v*(x0+2)+F]];
    interp=[[tm("iBrk",{x:x0,y:y0}),true],[tm("iBrkL",{x:x0,y:y0}),false],[tm("iBrkW",{x:y0}),false]];
    hInt=tm("hIntBrk",{p,v});
  }
  const D=E.map(dispE), sysH=(A,B)=>{ const a=dispE(A), b=dispE(B); return {h:`<span class="sys2">${a.h}<br>${b.h}</span>`, s:a.s+"; "+b.s}; };
  w.innerHTML=`<div class="rule">${ctx.h}</div><div id="mSys"></div>`;
  const q1=TX("q1Sys");
  runSteps(m,[
    {q:{h:q1.h,s:ctx.s+" "+q1.s}, opts:()=>shuffle([{...sysH(E[0],E[1]),ok:true}].concat(wrongSys.map(([A,B,h])=>({...sysH(A,B),ok:false,hint:h})))),
      done:()=>{ $("#mSys").innerHTML=sysBox(D[0],D[1]); return {msg:tm("goodSys1",{e1:D[0],e2:D[1]})}; }},
    {q:TX("q2Pair"), opts:()=>shuffle([[x0,y0]].concat(wrongPairs.filter((p,i)=>p[0]>=0&&p[1]>=0&&!(p[0]===x0&&p[1]===y0)&&wrongPairs.findIndex(q=>q[0]===p[0]&&q[1]===p[1])===i))).map(([x,y])=>{
        const ok=x===x0&&y===y0, i=valE(E[0],x,y)?1:0;
        return {...PTM(x,y),ok,hint:ok?null:cat(tm("hPairFail",{p:PT(x,y),n:i+1,calc:chkE(E[i],x,y)}),TX("hPairHow"))}; }),
      done:()=>({msg:tm("goodPair",{p:PT(x0,y0),c1:chkE(E[0],x0,y0),c2:chkE(E[1],x0,y0)})})},
    {q:TX("q3Int"), opts:()=>shuffle(interp.map(([x,ok])=>({...x,ok,txt:true,hint:hInt}))),
      done:()=>({msg:cat(TX("yes"),interp[0][0])})}]);
  maybeAuto(m);
}

/* ---------- Mode switching ---------- */
const NEWFN={forms:newForms,graph:newGraph,solve:newSolve,ineq:newIneq,model:newModel};
function firstMode(){ return MODES.find(m=>settings.modes[m])||"forms"; }
function currentMode(){ const b=$$(".tabs button").find(x=>x.getAttribute("aria-selected")==="true"); return b?b.dataset.mode:firstMode(); }
function showMode(mode){
  if(!settings.modes[mode]) mode=firstMode();
  const switching=currentMode()!==mode;
  if(switching) stopSpeech();
  const g0=speechGen;
  $$(".modepanel").forEach(p=>p.classList.add("hidden"));
  $("#mode-"+mode).classList.remove("hidden");
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===mode; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; });
  if(!made[mode]) NEWFN[mode]();
  if(switching && speechGen===g0) maybeAuto(mode);
}
function syncTabs(){
  $$(".tabs button").forEach(b=>b.classList.toggle("hidden",!settings.modes[b.dataset.mode]));
  if(!settings.modes[currentMode()]) showMode(firstMode());
}
function resetRounds(){ MODES.forEach(m=>made[m]=false); stopSpeech(); NEWFN[currentMode()](); }

/* ---------- Settings drawer ---------- */
function buildModeToggles(){
  const wrap=$("#modeToggles"); wrap.innerHTML="";
  MODES.forEach(m=>{ const l=document.createElement("label"); l.className="toggle";
    l.innerHTML=`<input type="checkbox" ${settings.modes[m]?"checked":""}> <span>${t(MODE_KEY[m])}</span>`;
    l.querySelector("input").addEventListener("change",e=>{ settings.modes[m]=e.target.checked;
      if(!MODES.some(k=>settings.modes[k])){ e.target.checked=true; settings.modes[m]=true; }
      saveSettings(); syncTabs(); });
    wrap.appendChild(l); });
}
function syncSettingsUI(){
  $("#setLevel").value=settings.level; $("#setRange").value=String(settings.R); $("#setMax").value=String(settings.max);
  $("#setFrac").checked=settings.frac; $("#setAuto").checked=settings.autoRead; buildModeToggles();
}
function closeSettings(){ $("#settingsDrawer").classList.remove("open"); $("#openSettings").focus(); }
function initSettings(){
  $("#openSettings").addEventListener("click",()=>{ syncSettingsUI(); $("#settingsDrawer").classList.add("open"); $("#closeSettings").focus(); });
  $("#closeSettings").addEventListener("click",closeSettings);
  $("#settingsDrawer").addEventListener("click",e=>{ if(e.target.id==="settingsDrawer") closeSettings(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#settingsDrawer").classList.contains("open")) closeSettings(); });
  $("#setLevel").addEventListener("change",e=>{ settings.level=e.target.value; Object.assign(settings,clone(LEVELS[settings.level])); saveSettings(); syncSettingsUI(); resetRounds(); });
  $("#setRange").addEventListener("change",e=>{ settings.R=+e.target.value; saveSettings(); resetRounds(); });
  $("#setMax").addEventListener("change",e=>{ settings.max=+e.target.value; saveSettings(); resetRounds(); });
  $("#setFrac").addEventListener("change",e=>{ settings.frac=e.target.checked; saveSettings(); resetRounds(); });

/* ---------- Print cards ---------- */

  const R=RR(), Ls=slopes(2).filter(r=>r.p);
  let L; do{ L={m:rand(Ls),b:Q(ri(-4,4))}; }while(latPts(L,5).filter(p=>p[0]).length<2);
  const P=latPts(L,5).filter(p=>p[0]), A=P[0], B=P[P.length-1];
  const G_=gPair("one"), S_=elimSys(LV()), I=genIneq("si");
  const a=rand([8,10,12]), b=rand([4,5,6]), x0=ri(10,40), y0=ri(10,40);
  const cards=[
    {title:t("mForms"), body:t("cardForms"), html:`<p class="big">${PS(L.m,A[0],A[1]).h}</p>`},
    {title:t("mForms"), body:t("cardTwo"), html:`<p class="big">${M(PT(A[0],A[1]).h)} &nbsp; ${M(PT(B[0],B[1]).h)}</p>`},
    {title:t("mGraph"), body:t("cardGraph"), html:`<p class="big">${SI(G_.L1).h} &nbsp; ${SI(G_.L2).h}</p>${planeStatic({R})}`},
    {title:t("mSolve"), body:t("cardElim"), html:sysBox(stdD(S_.E1),stdD(S_.E2))},
    {title:t("mIneq"), body:t("cardIneq"), html:`<p class="big">${dispI(I).h}</p>${planeStatic({R})}`},
    {title:t("mModel"), body:t("cardModel"), html:`<p style="font-size:1.1rem;line-height:1.8">${tm("pTix",{n:x0+y0,T:a*x0+b*y0,a,b}).h}</p>`}
  ];

// Standards codes stay left-to-right inside Arabic/Urdu text.
function stdsHTML(){ return t("stds").replace(/(TEKS|Common Core|A1\.\d+\([^)]*\)|HS[A-Z]-[A-Z]+\.[A-Z]\.\d+)/g,'<bdi dir="ltr">$1</bdi>'); }

/* ---------- Language engine ---------- */
function resolveLang(){
  try{ const q=new URLSearchParams(location.search).get("lang"); if(q && T[q]) return q; }catch(e){}
  try{ const s=localStorage.getItem(LANG_KEY); if(s && T[s]) return s; }catch(e){}
  const n=(navigator.language||"en").slice(0,2).toLowerCase();
  if(T[n]) return n;
  return "en";
}
function applyLang(){
  const meta=LANGS.find(x=>x.code===lang)||LANGS[0];
  document.documentElement.lang=lang;
  document.documentElement.dir=meta.dir;
  document.title=t("appTitle");
  const sel=$("#langSelect"); if(sel) sel.value=lang;
  $$("[data-t]").forEach(el=>{ el.textContent=t(el.getAttribute("data-t")); });
  $$("[data-ta]").forEach(el=>{ const v=t(el.getAttribute("data-ta")); el.setAttribute("aria-label",v); el.title=v; });
  $("#stdsNote").innerHTML=stdsHTML();
  buildModeToggles();
  resetRounds();
}
function setLang(l){ if(!T[l]) l="en"; lang=l; try{ localStorage.setItem(LANG_KEY,l); }catch(e){} applyLang(); }
function buildLangSelect(){
  const sel=$("#langSelect"); sel.innerHTML="";
  LANGS.forEach(m=>{ const o=document.createElement("option"); o.value=m.code; o.textContent=m.name; sel.appendChild(o); });
  sel.value=lang;
  sel.addEventListener("change",()=>setLang(sel.value));
}

/* ---------- Init ---------- */
function buildUI(){
  $("#tabs").innerHTML=MODES.map(m=>`<button type="button" role="tab" id="tab-${m}" aria-controls="mode-${m}" aria-selected="false" data-mode="${m}"><span class="ic" aria-hidden="true">${MODE_IC[m]}</span><span data-t="${MODE_KEY[m]}"></span></button>`).join("");
  $("#panels").innerHTML=MODES.map(m=>`<section id="mode-${m}" class="panel modepanel hidden" role="tabpanel" aria-labelledby="tab-${m}">
    <div class="panelhead"><h2 data-t="${MODE_KEY[m]}"></h2><button type="button" class="btn ghost no-print" data-new="${m}" data-t="newRound"></button></div>
    <div class="prompt"><button type="button" class="speaker" data-speak="${m}" data-ta="readAloud" aria-label="Read aloud">🔊</button><span id="p-${m}">…</span></div>
    <div class="work" id="w-${m}"></div>
    <div class="acts no-print" id="a-${m}"></div>
    <div class="choices" id="c-${m}" role="group" data-ta="choicesLbl" aria-label="Answer choices"></div>
    <div class="feedback" id="f-${m}" role="status" aria-live="polite"></div></section>`).join("");
  MODES.forEach(wirePlane);
  $("#tabs").addEventListener("keydown",e=>{ const vis=$$(".tabs button").filter(b=>!b.classList.contains("hidden")), i=vis.indexOf(document.activeElement); if(i<0) return;
    const rtl=document.documentElement.dir==="rtl", stp={ArrowRight:rtl?-1:1,ArrowLeft:rtl?1:-1}[e.key]; if(!stp) return;
    const nb=vis[(i+stp+vis.length)%vis.length]; nb.focus(); showMode(nb.dataset.mode); e.preventDefault(); });
}
function init(){
  lang=resolveLang();
  buildUI();
  buildLangSelect();
  $$(".tabs button").forEach(b=>b.addEventListener("click",()=>showMode(b.dataset.mode)));
  $$(".speaker").forEach(b=>b.addEventListener("click",()=>speak(currentSpeech[b.dataset.speak])));
  $$("[data-new]").forEach(b=>b.addEventListener("click",()=>{ stopSpeech(); NEWFN[b.dataset.new](); }));
  initSettings();
  const f=firstMode();
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===f; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; b.classList.toggle("hidden",!settings.modes[b.dataset.mode]); });
  $$(".modepanel").forEach(p=>p.classList.toggle("hidden",p.id!=="mode-"+f));
  applyLang();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
</script>

<script>
/* Student mute toggle — shared across the Digital Math Tools. Self-contained,
   offline, stores no student data. Gates ALL speech by intercepting
   speechSynthesis.speak, so muting works regardless of each tool's internals.
   Reads the shared language preference only to localize its own label. */
(function(){
  "use strict";
  var LKEY='tcea.mathtools.lang', MKEY='tcea.mathtools.muted';
  var CODES=['en','es','vi','ar','hi','ur','zh'];
  var LAB={
    mute:{en:"Mute sound",es:"Silenciar sonido",vi:"Tắt âm thanh",ar:"كتم الصوت",hi:"आवाज़ बंद करें",ur:"آواز بند کریں",zh:"静音"},
    unmute:{en:"Turn sound on",es:"Activar sonido",vi:"Bật âm thanh",ar:"تشغيل الصوت",hi:"आवाज़ चालू करें",ur:"آواز چالو کریں",zh:"打开声音"}
  };
  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  window.__MT_MUTED = (get(MKEY)==='1');
  // Intercept every speech request; suppress while muted.
  try{
    if(window.speechSynthesis && typeof window.speechSynthesis.speak==='function'){
      var ss=window.speechSynthesis, orig=ss.speak.bind(ss);
      ss.speak=function(u){ if(!window.__MT_MUTED){ try{orig(u);}catch(e){} } };
    }
  }catch(e){}
  function curLang(){ var l=get(LKEY)||'en'; return LAB.mute[l]?l:'en'; }
  function label(el){
    var on=!window.__MT_MUTED, l=curLang(), txt=on?LAB.mute[l]:LAB.unmute[l];
    el.textContent=on?'🔊':'🔇';
    el.setAttribute('aria-label',txt); el.setAttribute('title',txt);
    el.setAttribute('aria-pressed', on?'false':'true');
  }
  function findLangSelect(){
    var sels=document.querySelectorAll('select');
    for(var i=0;i<sels.length;i++){ var o=sels[i].options, c=0;
      for(var j=0;j<o.length;j++){ if(CODES.indexOf((o[j].value||'').toLowerCase())>=0) c++; }
      if(c>=3) return sels[i];
    }
    return null;
  }
  function build(){
    if(document.getElementById('mtMuteBtn')) return;
    if(!(('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window))) return;
    var btn=document.createElement('button');
    btn.id='mtMuteBtn'; btn.type='button';
    btn.style.cssText='font:inherit;font-size:1.15rem;line-height:1;cursor:pointer;'+
      'min-width:44px;min-height:44px;padding:8px 12px;border:2px solid #e2dcf1;'+
      'border-radius:10px;background:#fff;color:#5b3fa5;font-weight:700;margin:0 4px;';
    btn.addEventListener('click',function(){
      window.__MT_MUTED=!window.__MT_MUTED;
      set(MKEY, window.__MT_MUTED?'1':'0');
      if(window.__MT_MUTED){ try{window.speechSynthesis.cancel();}catch(e){} }
      label(btn);
    });
    btn.addEventListener('focus',function(){btn.style.outline='3px solid #5b3fa5';btn.style.outlineOffset='2px';});
    btn.addEventListener('blur',function(){btn.style.outline='';});
    var sel=findLangSelect();
    if(sel && sel.parentNode){
      sel.parentNode.insertBefore(btn, sel);
      sel.addEventListener('change',function(){ setTimeout(function(){label(btn);},0); });
    }else{
      btn.style.position='fixed'; btn.style.top='10px'; btn.style.zIndex='9999';
      btn.style[(document.documentElement.dir==='rtl')?'left':'right']='10px';
      (document.body||document.documentElement).appendChild(btn);
    }
    label(btn);
  }
  if(document.readyState==='complete'){ build(); }
  else{ window.addEventListener('load', build); }
  window.addEventListener('storage',function(e){ if(e.key===LKEY){ var b=document.getElementById('mtMuteBtn'); if(b) label(b); } });
})();
</script>
