<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Integer &amp; Rational Number Lab — a Grades 6–8 app for number lines, opposites and absolute value, integer and rational operations with counters and number-line moves, sorting real numbers, and temperature, elevation and money stories. Works offline. No data collected.">
<title>Integer &amp; Rational Number Lab</title>
<style>
  :root{
    --bg:#f8f1f0;--panel:#ffffff;--ink:#2a1a18;--muted:#5a4644;--line:#e2cfcc;
    --accent:#c0392b;--accentD:#a93226;--accent-ink:#ffffff;--good:#166534;--good-bg:#dcfce7;
    --hint:#7a4a00;--hint-bg:#fff4d6;--focus:#0a58ca;--pos:#f4c430;--neg:#d64541;
    --tap:52px;font-size:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-text-size-adjust:100%}
  h1,h2,h3{line-height:1.15;margin:0 0 .3em}
  button{font-family:inherit;font-size:1rem;cursor:pointer}

  .topbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--accentD);color:var(--accent-ink);padding:.55rem .8rem}
  .topbar .brand{font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:.4rem;margin-inline-end:auto}
  .topbar a.homebtn,.topbar button.tb{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.55);border-radius:12px;padding:.4rem .7rem;min-height:var(--tap);min-width:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:.35rem;text-decoration:none;font-weight:700;font-size:.95rem}
  .globe{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55);border-radius:12px;padding:.2rem .5rem;min-height:var(--tap)}
  .globe span{font-size:1.2rem}
  .globe select{border:0;background:#fff;color:var(--ink);border-radius:8px;min-height:44px;font-weight:700;font-size:1rem;padding:.2rem .4rem}

  main{max-width:1200px;margin:0 auto;padding:.7rem}
  .tabsrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 .7rem}
  .tabs{display:flex;gap:.4rem;flex-wrap:wrap;flex:1 1 auto}
  .tabs button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.45rem .75rem;min-height:var(--tap);font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:.4rem}
  .tabs button[aria-selected="true"]{background:var(--accentD);color:#fff;border-color:var(--accentD)}
  .tabs button .ic{font-size:1.15rem}
  .stars{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.4rem .8rem;font-weight:800;font-size:1.15rem;min-height:48px;display:inline-flex;align-items:center;gap:.3rem}
  .stars.pop{animation:pop .5s ease}
  @keyframes pop{50%{transform:scale(1.15)}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:.9rem;margin-bottom:.8rem}
  .panelhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
  .panelhead h2{margin:0;font-size:1.25rem;margin-inline-end:auto}

  .prompt{display:flex;align-items:center;gap:.6rem;background:#fbeeec;border:2px solid #efc9c4;border-radius:14px;padding:.6rem .8rem;margin-bottom:.7rem;font-size:1.12rem;font-weight:600;line-height:1.7}
  .speaker{background:var(--accentD);color:#fff;border:0;border-radius:50%;width:var(--tap);height:var(--tap);min-width:var(--tap);font-size:1.4rem;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}

  .btn{background:var(--accentD);color:#fff;border:2px solid var(--accentD);border-radius:12px;padding:.5rem .85rem;min-height:var(--tap);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
  .btn.ghost{background:var(--panel);color:var(--accentD)}
  .btn:disabled{opacity:.45}

  .feedback{margin-top:.6rem;border-radius:12px;padding:.6rem .8rem;font-weight:600;display:none;line-height:1.8}
  .feedback.show{display:block}
  .feedback.good{background:var(--good-bg);color:var(--good);border:2px solid #86efac}
  .feedback.hint{background:var(--hint-bg);color:var(--hint);border:2px solid #f6d271}

  /* Math: always left-to-right, even inside Arabic/Urdu sentences */
  .math{unicode-bidi:isolate;direction:ltr;display:inline;font-weight:800;white-space:nowrap}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:800;margin:0 .08em;white-space:nowrap;font-size:.92em}
  .fr>span{padding:0 .16em}
  .fr>span:first-child{border-bottom:.12em solid currentColor}
  .feedback .math,.prompt .math{white-space:normal}
  .rep{text-decoration:overline;text-decoration-thickness:.1em}
  .rad{border-top:.1em solid currentColor;padding:0 .1em}
  .big{font-size:1.9rem;text-align:center;margin:.2rem 0 .6rem}

  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.6rem;margin-top:.7rem}
  .choices.syms{grid-template-columns:repeat(3,1fr);max-width:420px;margin-inline:auto}
  .choices:empty{display:none}
  .choice{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:.5rem;min-height:72px;display:flex;align-items:center;justify-content:center;position:relative;font-size:1.4rem;font-weight:800;color:var(--ink)}
  .choice .lbl{unicode-bidi:isolate;direction:ltr}
  .choice.wide{font-size:1.15rem}
  .choice.correctpick{border-color:var(--good);background:var(--good-bg)}
  .choice.wrongpick{border-color:#e3b341;background:var(--hint-bg);opacity:.75}
  .choice .badge{position:absolute;top:4px;inset-inline-end:6px;font-size:1.1rem;display:none}
  .choice.correctpick .badge{display:block}

  .work:empty{display:none}
  .acts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;margin:.5rem 0}
  .acts:empty{display:none}
  .nlwrap{display:flex;justify-content:center}
  .nl{width:100%;max-width:760px;display:block;margin:0 auto;touch-action:none;height:auto}
  .nl.v{width:240px;max-width:70vw}
  .nlax{stroke:#2a1a18;stroke-width:4;stroke-linecap:round}
  .tk{stroke:#2a1a18;stroke-width:3}
  .tk.mn{stroke-width:1.6;stroke:#6b5552}
  .nlt{font-size:24px;font-weight:800;text-anchor:middle;fill:#2a1a18;font-family:system-ui,sans-serif}
  .nl.v .nlt{text-anchor:end;font-size:20px}
  .nlm{font-size:20px;font-weight:800;text-anchor:middle;font-family:system-ui,sans-serif}
  .nls{font-size:15px;font-weight:700;fill:#1f4f6b;font-family:system-ui,sans-serif}
  .pin line{stroke:#1d4ed8;stroke-width:5;stroke-linecap:round}
  .pin circle{fill:#3b82f6;stroke:#1e3a8a;stroke-width:3}
  .pin[tabindex]{cursor:grab}
  .pin:focus{outline:none}
  .pin:focus circle{stroke:var(--focus);stroke-width:6}

  .ctrs{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;align-items:stretch}
  .ctrbox{border:2px dashed var(--line);border-radius:14px;padding:.5rem;display:flex;flex-wrap:wrap;gap:.35rem;max-width:300px;justify-content:center;align-content:flex-start;min-height:60px}
  .ctrbox .cap{flex:1 1 100%;text-align:center;font-weight:800}
  .ctr{width:48px;height:48px;border-radius:50%;border:3px solid #6b4f00;background:var(--pos);font-size:1.5rem;font-weight:900;color:#3a2a00;display:inline-flex;align-items:center;justify-content:center;padding:0;transition:opacity .25s,transform .25s}
  .ctr.n{background:var(--neg);border-color:#7b1d1a;color:#fff}
  .ctr.sel{outline:4px solid var(--focus);outline-offset:2px;transform:scale(1.08)}
  .ctr.gone{opacity:.15;pointer-events:none}
  .ctrnote{text-align:center;font-weight:700;margin:.4rem 0;color:var(--muted)}
  .grps{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center}
  .grp{border:2px dashed #b9837d;border-radius:12px;padding:.35rem;display:flex;flex-wrap:wrap;gap:.25rem;max-width:120px;justify-content:center}
  .dot{width:24px;height:24px;border-radius:50%;background:var(--neg);border:2px solid #7b1d1a;display:inline-block}
  .dot.p{background:var(--pos);border-color:#6b4f00}
  table.pat{border-collapse:collapse;margin:.2rem auto;font-size:1.25rem;font-weight:800}
  table.pat td{padding:.25rem .6rem;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  table.pat tr.q td{background:var(--hint-bg)}
  table.pat tr.blank td{color:#bbb}
  .venn{width:100%;max-width:520px;display:block;margin:0 auto;height:auto}
  .vr rect{stroke-width:3;cursor:pointer}
  .vr:focus{outline:none}
  .vr:focus>rect{stroke:var(--focus);stroke-width:6}
  .vr.hit>rect{fill:#bbf7d0}
  .vr.miss>rect{fill:#fde68a}
  .vt{font-size:21px;font-weight:800;font-family:system-ui,sans-serif;pointer-events:none}
  .chips{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin:.4rem 0}
  .chip{min-width:84px;min-height:64px;border:3px solid var(--line);border-radius:14px;background:#fff;font-size:1.35rem;font-weight:800;padding:.3rem .6rem;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
  .chip.used{opacity:.25;pointer-events:none}
  .ordrow{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;align-items:center;min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:.4rem;margin:.4rem 0}
  .ordrow .lab{font-weight:700;color:var(--muted)}
  .ordrow .chip{border-color:var(--good);background:var(--good-bg);pointer-events:none}
  .box{display:inline-flex;width:1.6em;height:1.6em;border:3px dashed #d39a93;border-radius:12px;align-items:center;justify-content:center;color:var(--accentD);vertical-align:middle}

  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:1rem}
  .drawer.open{display:flex}
  .drawer .card{background:var(--panel);border-radius:16px;max-width:600px;width:100%;padding:1rem;max-height:90vh;overflow:auto}
  .setrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0;padding:.5rem 0;border-bottom:1px solid var(--line)}
  .setrow .lab{font-weight:700;min-width:150px}
  .toggle{display:inline-flex;align-items:center;gap:.35rem;border:2px solid var(--line);border-radius:10px;padding:.35rem .55rem;background:#fff;min-height:44px}
  .toggle input{width:22px;height:22px}
  select.diff{font-size:1rem;padding:.4rem;border-radius:10px;border:2px solid var(--line);min-height:48px}
  .wrapflex{display:flex;flex-wrap:wrap;gap:.4rem}

  footer{max-width:1200px;margin:.5rem auto 2rem;padding:.8rem;color:var(--muted);font-size:.9rem;text-align:center}
  footer a{color:var(--accentD);font-weight:700}
  .stds{font-size:.82rem;color:var(--muted);background:#fcf5f4;border:1px dashed var(--line);border-radius:12px;padding:.5rem .7rem;margin-top:.4rem}

  .hidden{display:none !important}
  :focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  @media (max-width:480px){ :root{font-size:17px} .big{font-size:1.6rem} .tabs button{padding:.4rem .55rem;font-size:.92rem} .ctr{width:44px;height:44px} .choice{font-size:1.25rem} }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

  .printonly{display:none}
  @media print{
    .topbar,.tabsrow,footer,.modepanel,#stdsNote,.no-print,#mtMuteBtn{display:none !important}
    body{background:#fff}
    .printonly{display:block}
    .card-print{border:2px solid #000;border-radius:12px;padding:1rem;margin:0 0 1rem;page-break-inside:avoid}
    .card-print h2{margin:.2rem 0}
    .card-print svg{max-height:200px;max-width:100%}
    main{max-width:100%}
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">🌡️ <span data-t="appTitle">Integer &amp; Rational Number Lab</span></span>
  <a class="homebtn" href="../../index.html">🏠 <span data-t="home">Home</span></a>
  <label class="globe"><span aria-hidden="true">🌐</span>
    <select id="langSelect" aria-label="Language / Idioma"></select>
  </label>
  <button class="tb settingsbtn" id="openSettings" type="button">⚙️ <span data-t="teacher">Teacher</span></button>
</header>

<main>
  <div class="tabsrow">
    <div class="tabs" id="tabs" role="tablist" data-ta="modesLbl" aria-label="Modes"></div>
    <span class="stars" id="stars"><span aria-hidden="true">✔</span><span class="sr" data-t="solved">Problems solved</span> <b id="starCount">0</b></span>
  </div>
  <div id="panels"></div>
  <div class="stds" id="stdsNote"></div>
  <div class="printonly" id="printArea"></div>
</main>

<footer>
  <p data-t="footNote">No accounts · No data collected · Works offline</p>
  <p><a href="../../index.html" data-t="home">Home</a> · <a href="../../policy.html" data-t="privacy">Privacy</a></p>
</footer>

<!-- SETTINGS -->
<div class="drawer" id="settingsDrawer" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="card">
    <div class="panelhead"><h2 id="setTitle" data-t="teacherTitle">Teacher settings</h2>
      <button class="btn ghost" id="closeSettings" type="button" data-t="close">Close</button></div>
    <div class="setrow"><label class="lab" for="setGrade" data-t="setGrade">Grade level</label>
      <select class="diff" id="setGrade">
        <option value="6" data-t="g6">Grade 6</option>
        <option value="7" data-t="g7">Grade 7</option>
        <option value="8" data-t="g8">Grade 8</option></select>
      <p class="stds" style="margin:0;flex:1 1 100%" data-t="gradeNote"></p></div>
    <div class="setrow"><label class="lab" for="setRange" data-t="setRange">Integer range</label>
      <select class="diff" id="setRange">
        <option value="10">−10 … 10</option>
        <option value="20">−20 … 20</option>
        <option value="50">−50 … 50</option></select></div>
    <div class="setrow"><span class="lab" data-t="setRat">Rational numbers</span>
      <label class="toggle"><input type="checkbox" id="setRatIn"> <span data-t="ratOn">Include fractions and decimals</span></label></div>
    <div class="setrow"><span class="lab" data-t="setModes">Modes</span>
      <div id="modeToggles" class="wrapflex"></div></div>
    <div class="setrow"><span class="lab" data-t="setSpeech">Speech</span>
      <label class="toggle"><input type="checkbox" id="setAuto"> <span data-t="autoRead">Auto-read directions</span></label></div>
    <div class="setrow" style="border:0"><button class="btn" id="printCards" type="button">🖨 <span data-t="printCards">Print challenge cards</span></button></div>
    <p class="stds" data-t="setStored">Settings are saved only on this device. No student information is ever stored.</p>
  </div>
</div>

  const want=code.toLowerCase(), two=want.slice(0,2);
  let best=null, bs=-1;
  for(const v of vs){
    const lc=(v.lang||'').toLowerCase().replace('_','-');
    if(lc!==want && lc.slice(0,2)!==two) continue;
    let s=(lc===want?100:60); const n=(v.name||'').toLowerCase();
    if(/google|natural|neural|online|premium|enhanced|siri/.test(n)) s+=40;
    if(/female|woman|samantha|karen|tessa|moira|fiona|serena|victoria|allison|ava|susan|zoe|amelie|amélie|paulina|monica|mónica|zira|hazel|catherine|linda|kanya|lekha|ting-ting|mei-jia|sin-ji|yu-shu|huihui|xiaoxiao/.test(n)) s+=18;
    if(/espeak|compact|festival|pico|robot|eloquence/.test(n)) s-=60;
    if(v.localService===false) s+=8;

   5. CONTEXT STORIES — temperature, elevation, money
   ========================================================================= */
function storyGen(){
  const g=G(), r7=R7(), types=["temp","temp","elev","money","cmp"]; if(g>=6) types.push("fee"); if(g>=7) types.push("share");
  const type=rand(types);
  const half=()=>r7&&Math.random()<.5;
  if(type==="temp"){ const h=half(), sub=h?2:1, a=Q(ri(-12*sub,10*sub),sub,"d"), up=Math.random()<.5;
    let c=Q(ri(3*sub,14*sub),sub,"d"); let r=qAdd(a,up?c:qNeg(c)); if(Math.abs(r.v)>20){ c=Q(ri(2*sub,5*sub),sub,"d"); r=qAdd(a,up?c:qNeg(c)); }
    const A=U(a,"C"), C=U(c,"C"), cc=up?c:qNeg(c);
    return {type,pin:true,o:Object.assign(winFor([a.v,r.v],2),{vert:true,kind:"thermo",sub,sty:"d",marks:[{q:a,c:"#7c3aed"}],pin:a.v,fill:a.v}),target:r,
      q:tm(up?"tempRise":"tempFall",{a:A,c:C}), good:tm("tempGood",{eq:X(QV(a),"+",QV(cc,true),"=",QV(r)),r:U(r,"C")}), hint:tm("tempHint",{a:A,c:C,dir:t(up?"wUp":"wDown")})}; }
  if(type==="elev"){ const k=rand(["dist","rise","dive"]);
    if(k==="dist"){ const h=half(), a=Q(-ri(2,30)*(h?2:1)-(h?1:0),h?2:1,"d"), b=I(ri(3,40)); const d=qAdd(b,qNeg(a));
      return {type,o:Object.assign(winFor([a.v,b.v],3),{vert:true,kind:"sea",marks:[{q:a,c:"#c0392b"},{q:b,c:"#1d4ed8"}]}),
        q:tm("elevDist",{a:U(a,"m"),b:U(b,"m")}), r:d, unit:"m", cands:[qAbs(qAdd(a,b)),qAdd(d,I(10)),qNeg(d)],
        good:tm("elevDistGood",{e:absX(X(QV(b),"−",QV(a,true))),r:U(d,"m")}), hint:tm("elevDistHint",{da:U(qAbs(a),"m"),db:U(b,"m")}),
        spans:[{a:a.v,b:b.v,lab:qT(d)}]}; }
    const up=k==="rise", h=half(), a=Q(-ri(10,60)*(h?2:1)-(h?1:0),h?2:1,"d"); let c=I(ri(5,25)); if(!up) c=I(ri(4,15)); const cc=up?c:qNeg(c), r=qAdd(a,cc);
    return {type,o:Object.assign(winFor([a.v,r.v,0],3),{vert:true,kind:"sea",marks:[{q:a,c:"#c0392b"}]}),
      q:tm(up?"elevRise":"elevDive",{a:U(a,"m"),c:U(c,"m")}), r, unit:"m", cands:[qAdd(a,up?qNeg(c):c),qNeg(r),qAbs(qAdd(qAbs(a),c))],
      good:tm("elevGood",{eq:X(QV(a),"+",QV(cc,true),"=",QV(r)),r:U(r,"m")}), hint:tm("elevHint",{a:U(a,"m")}), after:[{q:r,c:"#1d4ed8"}]}; }
  if(type==="money"){ const dep=Math.random()<.5, cents=r7&&Math.random()<.6, D=cents?100:1;
    const mk=(lo,hi)=>Q(ri(lo,hi)*D+(cents?rand([25,50,75,0,5,95,40]):0)*(1),D,"d");
    let a=dep?qNeg(mk(5,60)):mk(5,40), c=mk(5,60); if(!dep && c.v<=a.v) c=qAdd(a,mk(3,20));
    const cc=dep?c:qNeg(c), r=qAdd(a,cc), fm=x=>U(Q(x.n,x.d,"d"),"$");
    return {type,q:tm(dep?"moneyDep":"moneyWd",{a:U(a,"$"),c:U(c,"$")}), r, unit:"$", fmt:fm, cands:[qAdd(a,dep?qNeg(c):c),qNeg(r),qAdd(qAbs(a),c)],
      good:tm("moneyGood",{eq:X(U(a,"$"),"+",(x=>({h:x.v<0?"("+fm(x).h+")":fm(x).h,s:fm(x).s}))(cc),"=",U(r,"$")),r:U(r,"$")}), hint:tm("moneyHint",{a:U(a,"$")})}; }
  if(type==="fee"){ const n=ri(2,8), c=r7&&Math.random()<.5?Q(ri(2,15)*100+rand([25,50,75]),100,"d"):I(ri(2,15)), nc=qNeg(c), r=qMul(I(n),nc);
    const fm=x=>U(Q(x.n,x.d,"d"),"$");
    return {type,q:tm("feeDir",{c:U(c,"$"),n}), r, unit:"$", fmt:fm, cands:[qNeg(r),qAdd(r,nc),Q(nc.n-n*nc.d,nc.d)],
      good:tm("feeGood",{eq:X(QV(I(n)),"×",{h:"("+U(nc,"$").h+")",s:U(nc,"$").s},"=",U(r,"$"))}), hint:tm("feeHint",{nc:U(nc,"$"),n})}; }
  if(type==="share"){ const n=ri(2,6), each=r7&&Math.random()<.5?Q(ri(2,20)*100+rand([25,50,75]),100,"d"):I(ri(2,25)), a=qNeg(qMul(each,I(n))), r=qDiv(a,I(n));
    const fm=x=>U(Q(x.n,x.d,"d"),"$");
    return {type,q:tm("shareDir",{n,a:U(a,"$")}), r, unit:"$", fmt:fm, cands:[qNeg(r),qMul(a,I(1)),qDiv(qNeg(a),I(n+1))],
      good:tm("shareGood",{eq:X(U(a,"$"),"÷",QV(I(n)),"=",U(r,"$")),r:U(r,"$")}), hint:W("shareHint")}; }
  // cmp: colder / deeper
  const cold=Math.random()<.5, u=cold?"C":"m", L=cold?20:60; let a=I(-ri(1,L)), b=I(Math.random()<.7?-ri(1,L):ri(0,L)); if(a.v===b.v) b=I(b.v+3);
  if(r7&&cold&&Math.random()<.5){ a=Q(a.n*2-1,2,"d"); }
  const lo=a.v<b.v?a:b, hi=lo===a?b:a, X1=U(lo,u), X2=U(hi,u);
  return {type,cmp:true,q:W(cold?"coldDir":"deepDir"), items:[a,b], lo, u, o:Object.assign(winFor([a.v,b.v],2),{vert:true,kind:cold?"thermo":"sea",fill:cold?Math.max(a.v,b.v):null,marks:[{q:a,c:"#c0392b"},{q:b,c:"#1d4ed8"}]}),
    good:tm(cold?"coldGood":"deepGood",{stmt:S3(QV(lo),"<",QV(hi)),x:X1}), hint:W(cold?"coldHint":"deepHint")};
}
function newStory(){
  const m="story"; startRound(m); const S=storyGen(), w=$("#w-"+m);
  if(S.pin) pinTask(m,S.o,S.target,()=>S.good,{extra:S.hint});
  else if(S.cmp){ if(S.o.kind==="thermo") S.o.fill=Math.max(...S.items.map(x=>x.v));
    w.innerHTML=NL(S.o).html;
    choices(m,S.items.map(q=>({...U(q,S.u),ok:q===S.lo})),it=>{ if(it.ok) return win(m,S.good,w.innerHTML); nope(m,cat(tm("youPicked",{x:it}),S.hint)); }); }
  else { const fmt=S.fmt||(x=>U(x,S.unit));
    if(S.o){ w.innerHTML=NL(S.o).html; }
    else w.innerHTML=`<div class="big" aria-hidden="true">${S.type==="fee"||S.type==="share"?"🧾":"💳"}</div>`;
    const vis=S.o?NL(Object.assign({},S.o,{spans:S.spans||[],marks:S.o.marks.concat(S.after||[])})).html:null;
    choices(m,qOpts(S.r,S.cands,fmt),it=>{ if(it.ok) return win(m,S.good,vis); nope(m,cat(tm("youPicked",{x:it}),S.hint)); }); }
  setPrompt(m,S.q);
  maybeAuto(m);
}

/* ---------- Mode switching ---------- */
const NEWFN={line:newLine,addsub:newAdd,muldiv:newMul,real:newReal,story:newStory};
function firstMode(){ return MODES.find(m=>settings.modes[m])||"line"; }
function currentMode(){ const b=$$(".tabs button").find(x=>x.getAttribute("aria-selected")==="true"); return b?b.dataset.mode:firstMode(); }
function showMode(mode){
  if(!settings.modes[mode]) mode=firstMode();
  const switching=currentMode()!==mode;
  if(switching) stopSpeech();
  const g0=speechGen;
  $$(".modepanel").forEach(p=>p.classList.add("hidden"));
  $("#mode-"+mode).classList.remove("hidden");
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===mode; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; });
  if(!made[mode]) NEWFN[mode]();
  if(switching && speechGen===g0) maybeAuto(mode);
}
function syncTabs(){
  $$(".tabs button").forEach(b=>b.classList.toggle("hidden",!settings.modes[b.dataset.mode]));
  if(!settings.modes[currentMode()]) showMode(firstMode());
}
function resetRounds(){ MODES.forEach(m=>made[m]=false); stopSpeech(); NEWFN[currentMode()](); }

/* ---------- Settings drawer ---------- */
function buildModeToggles(){
  const wrap=$("#modeToggles"); wrap.innerHTML="";
  MODES.forEach(m=>{ const l=document.createElement("label"); l.className="toggle";
    l.innerHTML=`<input type="checkbox" ${settings.modes[m]?"checked":""}> <span>${MODE_IC[m]} ${t(MODE_KEY[m])}</span>`;
    l.querySelector("input").addEventListener("change",e=>{ settings.modes[m]=e.target.checked;
      if(!MODES.some(k=>settings.modes[k])){ e.target.checked=true; settings.modes[m]=true; }
      saveSettings(); syncTabs(); });
    wrap.appendChild(l); });
}
function syncSettingsUI(){
  $("#setGrade").value=String(settings.grade); $("#setRange").value=String(settings.range); $("#setRatIn").checked=settings.rat;
  $("#setAuto").checked=settings.autoRead; buildModeToggles();
}
function closeSettings(){ $("#settingsDrawer").classList.remove("open"); $("#openSettings").focus(); }
function initSettings(){
  $("#openSettings").addEventListener("click",()=>{ syncSettingsUI(); $("#settingsDrawer").classList.add("open"); $("#closeSettings").focus(); });
  $("#closeSettings").addEventListener("click",closeSettings);
  $("#settingsDrawer").addEventListener("click",e=>{ if(e.target.id==="settingsDrawer") closeSettings(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#settingsDrawer").classList.contains("open")) closeSettings(); });
  $("#setGrade").addEventListener("change",e=>{ const g=+e.target.value; settings.grade=g;
    Object.assign(settings,{range:GRADES[g].range,rat:GRADES[g].rat}); saveSettings(); syncSettingsUI(); resetRounds(); });
  $("#setRange").addEventListener("change",e=>{ settings.range=+e.target.value; saveSettings(); resetRounds(); });
  $("#setRatIn").addEventListener("change",e=>{ settings.rat=e.target.checked; saveSettings(); resetRounds(); });
  $("#setAuto").addEventListener("change",e=>{ settings.autoRead=e.target.checked; saveSettings(); });
  $("#printCards").addEventListener("click",()=>{ buildPrintCards(); window.print(); });
}

/* ---------- Print cards ---------- */
function buildPrintCards(){
  const blank=`<span style="display:inline-block;min-width:4rem;border-bottom:2px solid #000">&nbsp;</span>`;
  const pts=[I(-ri(2,6)),I(ri(1,5)),RAT()?Q(-ri(1,3)*2-1,2,"d"):I(-1),RAT()?Q(sgn()*ri(1,3),4,"f"):I(3)];
  const a1=nz(-9,-2), b1=ri(2,9), a2=nz(-9,9), b2=-ri(2,9);
  const f1=-ri(2,9), f2=-ri(2,9), dv=nz(-9,9)*ri(2,8), dd=nz(2,9)*sgn();
  const vi=[vennItem(),vennItem(),vennItem(),vennItem()];
  const S=storyGen();
  const lineSvg=NL({min:-6,max:6,sub:RAT()?2:1}).html;
  const cards=[
    {title:t("mLine"), body:t("cardLine"), html:`<p style="font-size:1.4rem">${pts.map(q=>M(qH(q))).join(" , ")}</p>${lineSvg}`},
    {title:t("mAdd"), body:t("cardAdd"), html:`<p style="font-size:1.5rem;line-height:2">${X(QV(I(a1)),"+",QV(I(b1)),"=","____").h}<br>${X(QV(I(a2)),"−",QV(I(b2),true),"=","____").h}</p>${lineSvg}`},
    {title:t("mMul"), body:t("cardMul"), html:`<p style="font-size:1.5rem;line-height:2">${X(QV(I(f1)),"×",QV(I(f2),true),"=","____").h}<br>${X(QV(I(dv*dd)),"÷",QV(I(dd),true),"=","____").h}</p>`},
    {title:t("mReal"), body:t("cardReal"), html:`<p style="font-size:1.4rem">${vi.map(x=>M(x.h)).join(" , ")}</p>${vennSVG(G()>=8)}`},
    {title:t("mStory"), body:S.q.h, html:`<p>${t("cardStory")} ${blank}</p>`}
  ];
  $("#printArea").innerHTML=`<h1>${t("cardTitle")}</h1><p>${t("cardName")} ____________________</p>`+
    cards.map(c=>`<div class="card-print"><h2>${c.title}</h2><p style="font-size:1.2rem;line-height:1.8">${c.body}</p>${c.html}</div>`).join("")+
    `<p style="font-size:.85rem">${stdsHTML()}</p>`;
}

// Standards codes stay left-to-right inside Arabic/Urdu text.
function stdsHTML(){ return t("stds").replace(/(TEKS|Common Core|\d\.(?:NS\.)?\d+[a-z]?(?:[–-][a-z])?(?:\([^)]*\))?)/g,'<bdi dir="ltr">$1</bdi>'); }

/* ---------- Language engine ---------- */
function resolveLang(){
  try{ const q=new URLSearchParams(location.search).get("lang"); if(q && T[q]) return q; }catch(e){}
  try{ const s=localStorage.getItem(LANG_KEY); if(s && T[s]) return s; }catch(e){}
  const n=(navigator.language||"en").slice(0,2).toLowerCase();
  if(T[n]) return n;
  return "en";
}
function applyLang(){
  const meta=LANGS.find(x=>x.code===lang)||LANGS[0];
  document.documentElement.lang=lang;
  document.documentElement.dir=meta.dir;
  document.title=t("appTitle");
  const sel=$("#langSelect"); if(sel) sel.value=lang;
  $$("[data-t]").forEach(el=>{ el.textContent=t(el.getAttribute("data-t")); });
  $$("[data-ta]").forEach(el=>{ const v=t(el.getAttribute("data-ta")); el.setAttribute("aria-label",v); el.title=v; });
  $("#stdsNote").innerHTML=stdsHTML();
  buildModeToggles();
  resetRounds();
}
function setLang(l){ if(!T[l]) l="en"; lang=l; try{ localStorage.setItem(LANG_KEY,l); }catch(e){} applyLang(); }
function buildLangSelect(){
  const sel=$("#langSelect"); sel.innerHTML="";
  LANGS.forEach(m=>{ const o=document.createElement("option"); o.value=m.code; o.textContent=m.name; sel.appendChild(o); });
  sel.value=lang;
  sel.addEventListener("change",()=>setLang(sel.value));
}

/* ---------- Init ---------- */
function buildUI(){
  $("#tabs").innerHTML=MODES.map(m=>`<button type="button" role="tab" id="tab-${m}" aria-controls="mode-${m}" aria-selected="false" data-mode="${m}"><span class="ic" aria-hidden="true">${MODE_IC[m]}</span><span data-t="${MODE_KEY[m]}"></span></button>`).join("");
  $("#panels").innerHTML=MODES.map(m=>`<section id="mode-${m}" class="panel modepanel hidden" role="tabpanel" aria-labelledby="tab-${m}">
    <div class="panelhead"><h2 data-t="${MODE_KEY[m]}"></h2><button type="button" class="btn ghost no-print" data-new="${m}" data-t="newRound"></button></div>
    <div class="prompt"><button type="button" class="speaker" data-speak="${m}" data-ta="readAloud" aria-label="Read aloud">🔊</button><span id="p-${m}">…</span></div>
    <div class="work" id="w-${m}"></div>
    <div class="acts no-print" id="a-${m}"></div>
    <div class="choices" id="c-${m}" role="group" data-ta="choicesLbl" aria-label="Answer choices"></div>
    <div class="feedback" id="f-${m}" role="status" aria-live="polite"></div></section>`).join("");
  // Arrow keys move between tabs (WAI-ARIA tabs pattern).
  $("#tabs").addEventListener("keydown",e=>{ const vis=$$(".tabs button").filter(b=>!b.classList.contains("hidden")), i=vis.indexOf(document.activeElement); if(i<0) return;
    const rtl=document.documentElement.dir==="rtl", step={ArrowRight:rtl?-1:1,ArrowLeft:rtl?1:-1}[e.key]; if(!step) return;
    const nb=vis[(i+step+vis.length)%vis.length]; nb.focus(); showMode(nb.dataset.mode); e.preventDefault(); });
}
function init(){
  lang=resolveLang();
  buildUI();
  buildLangSelect();
  $$(".tabs button").forEach(b=>b.addEventListener("click",()=>showMode(b.dataset.mode)));
  $$(".speaker").forEach(b=>b.addEventListener("click",()=>speak(currentSpeech[b.dataset.speak])));
  $$("[data-new]").forEach(b=>b.addEventListener("click",()=>{ stopSpeech(); NEWFN[b.dataset.new](); }));
  initSettings();
  const f=firstMode();
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===f; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; b.classList.toggle("hidden",!settings.modes[b.dataset.mode]); });
  $$(".modepanel").forEach(p=>p.classList.toggle("hidden",p.id!=="mode-"+f));
  applyLang();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
</script>
<script>
/* Student mute toggle — shared across the Digital Math Tools. Self-contained,
   offline, stores no student data. Gates ALL speech by intercepting
   speechSynthesis.speak, so muting works regardless of each tool's internals.
   Reads the shared language preference only to localize its own label. */
(function(){
  "use strict";
  var LKEY='tcea.mathtools.lang', MKEY='tcea.mathtools.muted';
  var CODES=['en','es','vi','ar','hi','ur','zh'];
  var LAB={
    mute:{en:"Mute sound",es:"Silenciar sonido",vi:"Tắt âm thanh",ar:"كتم الصوت",hi:"आवाज़ बंद करें",ur:"آواز بند کریں",zh:"静音"},
    unmute:{en:"Turn sound on",es:"Activar sonido",vi:"Bật âm thanh",ar:"تشغيل الصوت",hi:"आवाज़ चालू करें",ur:"آواز چالو کریں",zh:"打开声音"}
  };
  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  window.__MT_MUTED = (get(MKEY)==='1');
  // Intercept every speech request; suppress while muted.
  try{
    if(window.speechSynthesis && typeof window.speechSynthesis.speak==='function'){
      var ss=window.speechSynthesis, orig=ss.speak.bind(ss);
      ss.speak=function(u){ if(!window.__MT_MUTED){ try{orig(u);}catch(e){} } };
    }
  }catch(e){}
  function curLang(){ var l=get(LKEY)||'en'; return LAB.mute[l]?l:'en'; }
  function label(el){
    var on=!window.__MT_MUTED, l=curLang(), txt=on?LAB.mute[l]:LAB.unmute[l];
    el.textContent=on?'🔊':'🔇';
    el.setAttribute('aria-label',txt); el.setAttribute('title',txt);
    el.setAttribute('aria-pressed', on?'false':'true');
  }
  function findLangSelect(){
    var sels=document.querySelectorAll('select');
    for(var i=0;i<sels.length;i++){ var o=sels[i].options, c=0;
      for(var j=0;j<o.length;j++){ if(CODES.indexOf((o[j].value||'').toLowerCase())>=0) c++; }
      if(c>=3) return sels[i];
    }
    return null;
  }
  function build(){
    if(document.getElementById('mtMuteBtn')) return;
    if(!(('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window))) return;
    var btn=document.createElement('button');
    btn.id='mtMuteBtn'; btn.type='button';
    btn.style.cssText='font:inherit;font-size:1.15rem;line-height:1;cursor:pointer;'+
      'min-width:44px;min-height:44px;padding:8px 12px;border:2px solid #e2dcf1;'+
      'border-radius:10px;background:#fff;color:#5b3fa5;font-weight:700;margin:0 4px;';
    btn.addEventListener('click',function(){
      window.__MT_MUTED=!window.__MT_MUTED;
      set(MKEY, window.__MT_MUTED?'1':'0');
      if(window.__MT_MUTED){ try{window.speechSynthesis.cancel();}catch(e){} }
      label(btn);
    });
    btn.addEventListener('focus',function(){btn.style.outline='3px solid #5b3fa5';btn.style.outlineOffset='2px';});
    btn.addEventListener('blur',function(){btn.style.outline='';});
    var sel=findLangSelect();
    if(sel && sel.parentNode){
      sel.parentNode.insertBefore(btn, sel);
      sel.addEventListener('change',function(){ setTimeout(function(){label(btn);},0); });
    }else{
      btn.style.position='fixed'; btn.style.top='10px'; btn.style.zIndex='9999';
      btn.style[(document.documentElement.dir==='rtl')?'left':'right']='10px';
      (document.body||document.documentElement).appendChild(btn);
    }
    label(btn);
  }
  if(document.readyState==='complete'){ build(); }
  else{ window.addEventListener('load', build); }
  window.addEventListener('storage',function(e){ if(e.key===LKEY){ var b=document.getElementById('mtMuteBtn'); if(b) label(b); } });
})();
</script>
