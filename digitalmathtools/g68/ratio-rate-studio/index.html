<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Ratio & Rate Studio — a Grades 6–8 app for ratios, rates, proportional relationships, percent, scale drawings and unit conversions. Works offline. No data collected.">
<title>Ratio &amp; Rate Studio</title>
<style>
  :root{
    --bg:#eef7f4;--panel:#ffffff;--ink:#14281f;--muted:#43584f;--line:#c3e0d6;
    --accent:#16a085;--accentT:#117a65;--accentD:#0e6655;--accent-ink:#ffffff;--good:#166534;--good-bg:#dcfce7;
    --hint:#7a4a00;--hint-bg:#fff4d6;--focus:#0a58ca;--sh:#48c9b0;--sh2:#f5b041;--pinc:#c0392b;
    --tap:52px;font-size:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-text-size-adjust:100%}
  h1,h2,h3{line-height:1.15;margin:0 0 .3em}
  button{font-family:inherit;font-size:1rem;cursor:pointer}
  button:disabled{cursor:default}

  .topbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--accentT);color:var(--accent-ink);padding:.55rem .8rem}
  .topbar .brand{font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:.4rem;margin-inline-end:auto}
  .topbar a.homebtn,.topbar button.tb{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.4rem .7rem;min-height:var(--tap);min-width:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:.35rem;text-decoration:none;font-weight:700;font-size:.95rem}
  .globe{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.2rem .5rem;min-height:var(--tap)}
  .globe span{font-size:1.2rem}
  .globe select{border:0;background:#fff;color:var(--ink);border-radius:8px;min-height:44px;font-weight:700;font-size:1rem;padding:.2rem .4rem}

  main{max-width:1200px;margin:0 auto;padding:.7rem}
  .tabsrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 .7rem}
  .tabs{display:flex;gap:.4rem;flex-wrap:wrap;flex:1 1 auto}
  .tabs button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.45rem .75rem;min-height:var(--tap);font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:.4rem}
  .tabs button[aria-selected="true"]{background:var(--accentD);color:#fff;border-color:var(--accentD)}
  .tabs button .ic{font-size:1.15rem}
  .stars{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.4rem .8rem;font-weight:800;font-size:1.05rem;min-height:48px;display:inline-flex;align-items:center;gap:.35rem}
  .stars.pop{animation:pop .5s ease}
  @keyframes pop{50%{transform:scale(1.12)}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:.9rem;margin-bottom:.8rem}
  .panelhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
  .panelhead h2{margin:0;font-size:1.25rem;margin-inline-end:auto}

  .prompt{display:flex;align-items:center;gap:.6rem;background:#e7f6f1;border:2px solid #b3ddd0;border-radius:14px;padding:.6rem .8rem;margin-bottom:.7rem;font-size:1.1rem;font-weight:600;line-height:1.75}
  .speaker{background:var(--accentD);color:#fff;border:0;border-radius:50%;width:var(--tap);height:var(--tap);min-width:var(--tap);font-size:1.4rem;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}

  .btn{background:var(--accentD);color:#fff;border:2px solid var(--accentD);border-radius:12px;padding:.5rem .85rem;min-height:var(--tap);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
  .btn.ghost{background:var(--panel);color:var(--accentD)}
  .btn.sq{min-width:var(--tap);font-size:1.4rem;padding:.2rem .6rem}
  .btn.sm{min-height:46px;min-width:46px;padding:.3rem .55rem;font-size:1rem}
  .btn:disabled{opacity:.45}

  .feedback{margin-top:.6rem;border-radius:12px;padding:.6rem .8rem;font-weight:600;display:none;line-height:1.85}
  .feedback.show{display:block}
  .feedback.good{background:var(--good-bg);color:var(--good);border:2px solid #86efac}
  .feedback.hint{background:var(--hint-bg);color:var(--hint);border:2px solid #f6d271}

  /* Math: always left-to-right, even inside Arabic/Urdu sentences */
  .math{unicode-bidi:isolate;direction:ltr;display:inline;font-weight:800}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:800;margin:0 .08em;white-space:nowrap;font-size:.9em}
  .fr>span{padding:0 .16em}
  .fr>span:first-child{border-bottom:.12em solid currentColor}
  .mx{direction:ltr;display:inline-flex;align-items:center;gap:.08em;white-space:nowrap;vertical-align:middle}
  .big{font-size:1.9rem;text-align:center;margin:.2rem 0 .6rem}
  .built{font-weight:700;text-align:center;margin:.35rem 0;font-size:1.05rem;line-height:1.9}

  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-top:.7rem}
  .choices:empty{display:none}
  .choice{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:.5rem;min-height:68px;display:flex;align-items:center;justify-content:center;position:relative;font-size:1.35rem;font-weight:800;color:var(--ink);text-align:center}
  .choice .lbl{unicode-bidi:isolate}
  .choice.wide{font-size:1.02rem;font-weight:700;line-height:1.35}
  .choices.wide{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .choice.correctpick{border-color:var(--good);background:var(--good-bg)}
  .choice.wrongpick{border-color:#e3b341;background:var(--hint-bg);opacity:.75}
  .choice .badge{position:absolute;top:4px;inset-inline-end:6px;font-size:1.1rem;display:none}
  .choice.correctpick .badge{display:block}

  .work:empty{display:none}
  .acts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;margin:.5rem 0}
  .acts:empty{display:none}

  /* Ratio table */
  .rtbox{margin:.3rem 0}
  .rt-wrap{overflow-x:auto;max-width:100%;padding:.2rem 0}
  table.rt{border-collapse:separate;border-spacing:0;margin:0 auto;font-size:1.15rem}
  table.rt th,table.rt td{border:2px solid var(--line);padding:.35rem .55rem;text-align:center;min-width:3.2rem;height:2.6rem}
  table.rt th{background:#f2faf7;font-size:.9rem;max-width:8rem;font-weight:700;text-align:start}
  table.rt td.given{background:#e1f3ee;font-weight:800}
  table.rt td.work{background:#fff}
  table.rt td.hit{background:var(--good-bg);border-color:#86efac}
  table.rt td.tgt{border-style:dashed;border-color:#7fbfab;font-weight:800}
  table.rt tr.ops th{border:0;background:none}
  table.rt tr.ops td{border:0;font-size:.85rem;color:var(--accentD);font-weight:800;height:auto;padding:.1rem}
  .rt-ops{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin:.4rem 0}
  .rt-tip{font-size:.9rem;color:var(--muted);text-align:center;margin:.2rem 0}

  /* Tape diagram */
  .tapes{display:grid;grid-template-columns:minmax(0,7.5rem) 1fr auto;gap:.45rem .6rem;align-items:center;max-width:640px;margin:.4rem auto}
  .tlab{font-weight:700;font-size:.9rem}
  .tape{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0}
  .tu{border:2px solid #2c4a3e;margin-inline-start:-2px;height:42px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;overflow:hidden}
  .tu.ta{background:var(--sh)}
  .tu.tb{background:var(--sh2)}
  .tsum{font-weight:800;min-width:2.5rem;text-align:center}
  .ttot{grid-column:1/-1;text-align:center;font-weight:800;padding:.3rem;border-radius:10px;background:#f2faf7}
  .ttot.hit{background:var(--good-bg);color:var(--good)}
  .uval{font-weight:800;min-width:6rem;text-align:center}

  /* Double number line, grids, graphs, maps */
  .dnlbox{margin:.2rem auto;max-width:760px}
  svg.dnl{width:100%;height:auto;display:block;touch-action:none}
  .nlax{stroke:#1f3d33;stroke-width:4;stroke-linecap:round}
  .tk{stroke:#1f3d33;stroke-width:3}
  .dl-link{stroke:#7fbfab;stroke-width:2;stroke-dasharray:4 4}
  .dl-name{font-size:17px;font-weight:700;fill:#43584f;font-family:system-ui,sans-serif}
  .dl-num,.dl-giv,.dl-pin,.dl-q{font-size:19px;font-weight:800;fill:#14281f;font-family:system-ui,sans-serif}
  .dl-giv{fill:var(--accentD)}
  .dl-pin{fill:var(--pinc)}
  .dl-bar{stroke-width:2}
  .qbox{fill:#fff;stroke:#7fbfab;stroke-width:2;stroke-dasharray:4 3}
  .pin line{stroke:var(--pinc);stroke-width:4;stroke-linecap:round}
  .pin circle{fill:#e74c3c;stroke:#7b241c;stroke-width:3}
  svg.dnl[role=slider]{cursor:grab}
  svg.dnl:focus{outline:none}
  svg.dnl:focus-visible{outline:4px solid var(--focus);outline-offset:2px;border-radius:8px}
  .pgbox{text-align:center}
  svg.pgrid{width:min(100%,300px);height:auto;touch-action:none}
  .gc{fill:#fff;stroke:#5b8a7a;stroke-width:1.2}
  .gc.on{fill:var(--sh)}
  svg.pgrid:focus{outline:none}
  svg.pgrid:focus-visible{outline:4px solid var(--focus);outline-offset:3px}
  svg.graph{width:min(100%,380px);height:auto;display:block;margin:0 auto}
  .ggrid{stroke:#d6ebe4;stroke-width:1}
  .gax{stroke:#1f3d33;stroke-width:2.5}
  .gtx{font-size:13px;font-family:system-ui,sans-serif;fill:#43584f;font-weight:700}
  .gln{stroke:var(--accentD);stroke-width:3;fill:none}
  .gray{stroke:#c0392b;stroke-width:2.5;stroke-dasharray:7 5;fill:none}
  .gpt{fill:var(--accentD);stroke:#fff;stroke-width:2}
  .ghi{fill:#e74c3c;stroke:#7b241c;stroke-width:2}
  .pt-wrap{overflow-x:auto;max-width:100%}
  .pt{display:flex;gap:.35rem;justify-content:center;margin:.3rem auto;width:max-content;max-width:100%}
  .pth,.ptc{display:grid;grid-template-rows:2.4rem 2.4rem 2.6rem;border:2px solid var(--line);border-radius:12px;overflow:hidden;min-width:3.4rem}
  .pth span,.ptc span{display:flex;align-items:center;justify-content:center;padding:0 .35rem;font-weight:800;font-size:1.05rem;border-bottom:1px solid var(--line)}
  .pth{background:#f2faf7}
  .ptc{background:#fff;padding:0;color:var(--ink)}
  .ptc .q{color:var(--accentD);background:#f7fcfa;font-size:.95rem}
  .ptc.shown .q{background:#e1f3ee}
  svg.map,svg.plan{width:100%;max-width:700px;height:auto;display:block;margin:0 auto}
  .mtx{font-size:24px;font-weight:800;font-family:system-ui,sans-serif;fill:#14281f}
  .side{stroke:transparent;stroke-width:22;cursor:pointer}
  .side:focus{outline:none;stroke:rgba(10,88,202,.35)}
  .eqs{color:var(--muted);margin:0 .3em}

  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:1rem}
  .drawer.open{display:flex}
  .drawer .card{background:var(--panel);border-radius:16px;max-width:600px;width:100%;padding:1rem;max-height:90vh;overflow:auto}
  .setrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0;padding:.5rem 0;border-bottom:1px solid var(--line)}
  .setrow .lab{font-weight:700;min-width:150px}
  .toggle{display:inline-flex;align-items:center;gap:.35rem;border:2px solid var(--line);border-radius:10px;padding:.35rem .55rem;background:#fff;min-height:44px}
  .toggle input{width:22px;height:22px}
  select.diff{font-size:1rem;padding:.4rem;border-radius:10px;border:2px solid var(--line);min-height:48px;max-width:100%}
  .wrapflex{display:flex;flex-wrap:wrap;gap:.4rem}

  footer{max-width:1200px;margin:.5rem auto 2rem;padding:.8rem;color:var(--muted);font-size:.9rem;text-align:center}
  footer a{color:var(--accentD);font-weight:700}
  .stds{font-size:.82rem;color:var(--muted);background:#f4fbf8;border:1px dashed var(--line);border-radius:12px;padding:.5rem .7rem;margin-top:.4rem}

  .hidden{display:none !important}
  :focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  @media (max-width:480px){ :root{font-size:17px} .big{font-size:1.5rem} .tabs button{padding:.4rem .55rem;font-size:.9rem} .tapes{grid-template-columns:minmax(0,5.2rem) 1fr auto} table.rt{font-size:1rem} table.rt th,table.rt td{min-width:2.6rem;padding:.3rem .35rem} .choice{font-size:1.2rem} }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

  .printonly{display:none}
  @media print{
    .topbar,.tabsrow,footer,.modepanel,#stdsNote,.no-print,#mtMuteBtn{display:none !important}
    body{background:#fff}
    .printonly{display:block}
    .card-print{border:2px solid #000;border-radius:12px;padding:1rem;margin:0 0 1rem;page-break-inside:avoid}
    .card-print h2{margin:.2rem 0}
    .card-print svg{max-height:200px;max-width:100%}
    main{max-width:100%}
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">⚖️ <span data-t="appTitle">Ratio &amp; Rate Studio</span></span>
  <a class="homebtn" href="../../index.html">🏠 <span data-t="home">Home</span></a>
  <label class="globe"><span aria-hidden="true">🌐</span>
    <select id="langSelect" aria-label="Language / Idioma"></select>
  </label>
  <button class="tb settingsbtn" id="openSettings" type="button">⚙️ <span data-t="teacher">Teacher</span></button>
</header>

<main>
  <div class="tabsrow">
    <div class="tabs" id="tabs" role="tablist" data-ta="modesLbl" aria-label="Modes"></div>
    <span class="stars" id="stars"><span aria-hidden="true">✔</span><span data-t="solved">Solved</span> <b id="starCount">0</b></span>
  </div>
  <div id="panels"></div>
  <div class="stds" id="stdsNote"></div>
  <div class="printonly" id="printArea"></div>
</main>

<footer>
  <p data-t="footNote">No accounts · No data collected · Works offline</p>
  <p><a href="../../index.html" data-t="home">Home</a> · <a href="../../policy.html" data-t="privacy">Privacy</a></p>
</footer>

<!-- SETTINGS -->
<div class="drawer" id="settingsDrawer" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="card">
    <div class="panelhead"><h2 id="setTitle" data-t="teacherTitle">Teacher settings</h2>
      <button class="btn ghost" id="closeSettings" type="button" data-t="close">Close</button></div>
    <div class="setrow"><label class="lab" for="setGrade" data-t="setGrade">Grade level</label>
      <select class="diff" id="setGrade">
        <option value="6" data-t="g6">Grade 6</option>
        <option value="7" data-t="g7">Grade 7</option>
        <option value="8" data-t="g8">Grade 8</option></select>
      <p class="stds" style="margin:0;flex:1 1 100%" data-t="gradeNote"></p></div>
    <div class="setrow"><label class="lab" for="setSize" data-t="setSize">Number size</label>
      <select class="diff" id="setSize">
        <option value="1" data-t="size1">Smaller numbers</option>
        <option value="2" data-t="size2">Medium numbers</option>
        <option value="3" data-t="size3">Larger numbers</option></select></div>
    <div class="setrow"><span class="lab" data-t="setFrac">Fractions</span>
      <label class="toggle"><input type="checkbox" id="setFrac"> <span data-t="fracOn">Fraction scale factors, rates with fractions, and half units</span></label></div>
    <div class="setrow"><span class="lab" data-t="setModes">Modes</span>
      <div id="modeToggles" class="wrapflex"></div></div>
    <div class="setrow"><span class="lab" data-t="setSpeech">Speech</span>
      <label class="toggle"><input type="checkbox" id="setAuto"> <span data-t="autoRead">Auto-read directions</span></label></div>
    <div class="setrow" style="border:0"><button class="btn" id="printCards" type="button">🖨 <span data-t="printCards">Print challenge cards</span></button></div>
    <p class="stds" data-t="setStored">Settings are saved only on this device. No student information is ever stored.</p>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   Ratio & Rate Studio — single-file Grades 6–8 ratios, rates, proportional
   relationships, percent and scale. 7 languages. No frameworks, no network,
   no data collection.
   ========================================================================= */

/* ---------- Language metadata ---------- */
const LANGS = [

/* ---------- Rational numbers (exact) ---------- */
const Q = (n,d)=>{ d=d===undefined?1:d; if(d<0){ n=-n; d=-d; } const g=gcd(n,d)||1; return {n:n/g,d:d/g}; };
const Z = x=>typeof x==="number"?Q(x):x;
const qa=(a,b)=>{a=Z(a);b=Z(b);return Q(a.n*b.d+b.n*a.d,a.d*b.d);}, qs=(a,b)=>{a=Z(a);b=Z(b);return Q(a.n*b.d-b.n*a.d,a.d*b.d);};
const qm=(a,b)=>{a=Z(a);b=Z(b);return Q(a.n*b.n,a.d*b.d);}, qd=(a,b)=>{a=Z(a);b=Z(b);return Q(a.n*b.d,a.d*b.n);};
const qv=a=>{a=Z(a);return a.n/a.d;}, qe=(a,b)=>{a=Z(a);b=Z(b);return a.n===b.n&&a.d===b.d;};
const isQ = x=>x&&typeof x==="object"&&x.n!==undefined&&x.d!==undefined&&x.h===undefined;
const decS = v=>String(+(+v).toFixed(4));

/* ---------- Numbers: shown nicely, spoken in words ----------
   Every message is a pair {h: HTML to show, s: plain text to speak}. */
const ORD = {
  en:{2:["half","halves"],3:["third","thirds"],4:["fourth","fourths"],5:["fifth","fifths"],6:["sixth","sixths"],7:["seventh","sevenths"],
      8:["eighth","eighths"],9:["ninth","ninths"],10:["tenth","tenths"],11:["eleventh","elevenths"],12:["twelfth","twelfths"],
      20:["twentieth","twentieths"],25:["twenty-fifth","twenty-fifths"],50:["fiftieth","fiftieths"],100:["hundredth","hundredths"]},
  es:{2:["medio","medios"],3:["tercio","tercios"],4:["cuarto","cuartos"],5:["quinto","quintos"],6:["sexto","sextos"],7:["séptimo","séptimos"],
      8:["octavo","octavos"],9:["noveno","novenos"],10:["décimo","décimos"],11:["onceavo","onceavos"],12:["doceavo","doceavos"],
      20:["veinteavo","veinteavos"],25:["veinticincoavo","veinticincoavos"],50:["cincuentavo","cincuentavos"],100:["centésimo","centésimos"]}
};
function fracSay(n,d){ const o=ORD[lang]&&ORD[lang][d];
  if(o) return (n===1?(lang==="es"?"un":"one"):n)+" "+o[n===1?0:1]; return t("frSay",{n,d}); }
// A value. k: "" (whole / fraction / mixed number), "$" money, "%" percent, "d" decimal.
function V(q,k){ q=Z(q); const v=qv(q);
  if(k==="$"){ const x=v.toFixed(2); return {h:"$"+x, s:t("moneySay",{v:x})}; }
  if(k==="%"){ const x=decS(v); return {h:x+"%", s:t("pctSay",{v:x})}; }
  if(k==="d"){ const x=decS(v); return {h:x, s:x}; }
  if(q.d===1) return {h:""+q.n, s:""+q.n};
  if(q.n>q.d){ const w=Math.floor(q.n/q.d), r=q.n%q.d;
    return {h:`<span class="mx">${w}${frH(r,q.d)}</span>`, s:t("mixSay",{w,f:fracSay(r,q.d)})}; }
  return {h:frH(q.n,q.d), s:fracSay(q.n,q.d)};
}
const P100 = p=>({h:frH(p,100), s:fracSay(p,100)});   // p/100 shown unreduced
const OPS = {"+":"wPlus","−":"wMinus","×":"wTimes","÷":"wDiv","=":"wEq","≈":"wApprox"};
// An expression: X(Q(1,4),"+",2,"=",...)
function X(...p){ const h=[],s=[];
  p.forEach(x=>{ if(isQ(x)) x=V(x);
    if(typeof x==="string"&&OPS[x]){ h.push(x); s.push(t(OPS[x])); }
    else if(x&&typeof x==="object"){ h.push(x.h); s.push(x.s); } else { h.push(""+x); s.push(""+x); } });
  return {h:M(h.join(" ")), s:s.join(" ")};
}
function R(a,b){ const A=V(a),B=V(b); return {h:M(A.h+" : "+B.h), s:t("ratioSay",{a:A.s,b:B.s})}; }
function tm(key,vars){ const h={},s={}; vars=vars||{};
  for(const k in vars){ let v=vars[k]; if(isQ(v)) v=V(v);
    if(v&&typeof v==="object"){ h[k]=v.h.indexOf("<bdi")===0?v.h:M(v.h); s[k]=v.s; } else { h[k]=v; s[k]=v; } }
  return {h:t(key,h), s:t(key,s)};
}
const cat = (...m)=>({h:m.map(x=>x.h).join(" "), s:m.map(x=>x.s).join(" ")});
const plain = key=>({h:t(key), s:t(key)});
// Up to 4 numeric choices with distinct values; first candidates are the likeliest mistakes. cands: Q or [Q,tag]
function qOpts(ans,k,cands){ ans=Z(ans); const VM=(q,k)=>{ const v=V(q,k); return {h:M(v.h),s:v.s}; }, out=[{...VM(ans,k),ok:true,q:ans}], seen=[qv(ans)];
  const add=(q,tag)=>{ if(out.length>=4) return; q=Z(q); const v=qv(q);
    if(!(v>0)||!isFinite(v)||seen.some(x=>Math.abs(x-v)<1e-9)) return;
    if(k==="$"&&Math.abs(v*100-Math.round(v*100))>1e-6) return;
    if((k==="d"||k==="%")&&Math.abs(v*1e4-Math.round(v*1e4))>1e-6) return;
    seen.push(v); out.push({...VM(q,k),ok:false,q,tag}); };
  (cands||[]).forEach(c=>Array.isArray(c)?add(c[0],c[1]):add(c));
  const st_=k==="$"?Q(1,4):k==="%"?Q(5):Q(1);
  [1,-1,2,3,-2,4,5,6].forEach(j=>add(qa(ans,qm(st_,Q(j)))));
  return shuffle(out);
}

/* ---------- Speech ---------- */
const speechOK = ("speechSynthesis" in window);
function bcpFor(l){ const m=LANGS.find(x=>x.code===l); return m?m.bcp:"en-US"; }
// Prefer warm, natural voices; avoid harsh robotic engines.
function pickWarmVoice(code){
  const vs = speechSynthesis.getVoices()||[];
  const want=code.toLowerCase(), two=want.slice(0,2);
  let best=null, bs=-1;
  for(const v of vs){
    const lc=(v.lang||'').toLowerCase().replace('_','-');
    if(lc!==want && lc.slice(0,2)!==two) continue;
    let s=(lc===want?100:60); const n=(v.name||'').toLowerCase();
    if(/google|natural|neural|online|premium|enhanced|siri/.test(n)) s+=40;
    if(/female|woman|samantha|karen|tessa|moira|fiona|serena|victoria|allison|ava|susan|zoe|amelie|amélie|paulina|monica|mónica|zira|hazel|catherine|linda|kanya|lekha|ting-ting|mei-jia|sin-ji|yu-shu|huihui|xiaoxiao/.test(n)) s+=18;
    if(/espeak|compact|festival|pico|robot|eloquence/.test(n)) s-=60;
    if(v.localService===false) s+=8;
    if(v.default) s+=2;
    if(s>bs){ bs=s; best=v; }
  }
  return best;
}
/* Speech queue. Fixes cut-off audio:
   - a new round no longer calls cancel() over the praise; rounds advance on onend
   - long text is split into sentences (Chrome stops utterances after ~15 s)
   - utterances are kept referenced so Chrome can't garbage-collect them mid-speech
   - after cancel(), the next speak() waits a beat (Chrome drops it otherwise) */
let speechGen=0, speechKeep=[], speechPendingDone=null, speechStarted=false;
function splitSpeech(text){
  // A period between digits (3.50, 2.54) is a decimal point, not the end of a sentence.
  const parts=String(text).match(/(?:[^.!?。！？؟।۔]|\.(?=\d))+[.!?。！？؟।۔]*\s*/g)||[text];
  return parts.map(x=>x.trim()).filter(Boolean);
}
function speechEstimateMs(text){ const per=/^(zh)$/.test(lang)?300:95; return 1200+String(text).length*per/0.9; }
function stopSpeech(){
  speechGen++; const d=speechPendingDone; speechPendingDone=null; speechKeep=[];
  if(speechOK){ try{ speechSynthesis.cancel(); }catch(e){} }
  if(d) setTimeout(d,0);
}
function speak(text,onDone){
  const prevDone=speechPendingDone; speechPendingDone=null;
  const gen=++speechGen; let fired=false;
  const done=()=>{ if(fired) return; fired=true; if(speechPendingDone===done) speechPendingDone=null; if(onDone) onDone(); };
  if(onDone) speechPendingDone=done;
  if(prevDone) setTimeout(prevDone,0);  // a superseded speech still lets its round advance
  if(!speechOK || !text || window.__MT_MUTED){ if(onDone) setTimeout(done,700); return; }
  let busy=false;
  try{ busy=speechSynthesis.speaking||speechSynthesis.pending; speechSynthesis.cancel(); }catch(e){}
  const parts=splitSpeech(text), bcp=bcpFor(lang), voice=pickWarmVoice(bcp);
  const start=()=>{
    if(gen!==speechGen) return;
    speechKeep=[];
    try{
      if(speechSynthesis.paused) speechSynthesis.resume();
      parts.forEach((p,i)=>{
        const u=new SpeechSynthesisUtterance(p);
        u.lang=bcp; if(voice) u.voice=voice; u.rate=0.9; u.pitch=1.05;
        u.onstart=()=>{ speechStarted=true; };
        if(i===parts.length-1){ u.onend=done; u.onerror=done; }
        speechKeep.push(u); speechSynthesis.speak(u);
      });
    }catch(e){ done(); }
  };
  if(busy) setTimeout(start,120); else start();
  // Safety net: some engines never fire onend.
  if(onDone) setTimeout(done,speechEstimateMs(text)+2500);
}
/* Speak praise, then start the next round once it finishes (never sooner than minMs). */
const roundIds={ratio:0,rates:0,prop:0,pct:0,scale:0};
function afterPraise(msg,key,next,minMs){
  const id=roundIds[key], t0=Date.now();
  speak(msg,()=>{
    const wait=Math.max(450,(minMs||1200)-(Date.now()-t0));
    setTimeout(()=>{ if(roundIds[key]===id) next(); },wait);
  });
}
if(speechOK){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }
if(!speechOK){ document.addEventListener("DOMContentLoaded",()=>$$(".speaker").forEach(b=>b.style.display="none")); }

const currentSpeech = {ratio:"",rates:"",prop:"",pct:"",scale:""};

// Only auto-read for the panel that is on screen (rounds can refresh in the background).
function maybeAuto(mode){ if(settings.autoRead && currentMode()===mode) speak(currentSpeech[mode]); }
// Browsers block speech until the first tap; read the directions then if nothing has played yet.
document.addEventListener("pointerdown",function firstTap(e){
  document.removeEventListener("pointerdown",firstTap,true);
  if(speechStarted || !settings.autoRead) return;
  if(e.target.closest("button,select,a,input,svg")) return;
  speak(currentSpeech[currentMode()]);
},true);

/* ---- Ratio table: build equivalent-ratio columns with ×, ÷ and + ---- */
function rtable(m,o){ const s=st[m]; o.cols=[{a:Z(o.base[0]),b:Z(o.base[1]),op:""}]; o.kA=o.kA||""; o.kB=o.kB||""; s.rt=o;
  const box=addBox(m,"rtbox"); box.removeAttribute("dir");
  box.innerHTML=`<div class="rt-wrap" dir="ltr"><table class="rt" aria-label="${esc(t("rtLbl"))}"></table></div><p class="rt-tip">${esc(t("rtTip"))}</p><div class="rt-ops" dir="ltr"></div>`;
  o.tbl=box.querySelector("table"); const ops=box.querySelector(".rt-ops");
  [["×",2],["×",3],["×",5],["×",10],["÷",2],["÷",3],["÷",5]].forEach(([op,k])=>ops.appendChild(mkBtn(op+k,()=>rtOp(m,op,k),"ghost sm",t(op==="×"?"opMul":"opDiv",{k}))));
  ops.appendChild(mkBtn("+ "+M(V(o.cols[0].a).h+" : "+V(o.cols[0].b).h),()=>rtOp(m,"+"),"ghost sm",t("opAdd")));
  ops.appendChild(mkBtn("↶",()=>rtOp(m,"u"),"ghost sm",t("undo")));
  rtDraw(m);
}
function rtOp(m,op,k){ const s=st[m], o=s.rt; if(s.done) return;
  if(op==="u"){ if(o.cols.length>1) o.cols.pop(); return rtDraw(m); }
  if(o.cols.length>=7) return;
  const L=o.cols[o.cols.length-1], f=o.cols[0];
  if(op==="+") o.cols.push({a:qa(L.a,f.a),b:qa(L.b,f.b),op:"+"});
  else if(op==="×") o.cols.push({a:qm(L.a,k),b:qm(L.b,k),op:"×"+k});
  else o.cols.push({a:qd(L.a,k),b:qd(L.b,k),op:"÷"+k});
  rtDraw(m);
}
function rtDraw(m){ const o=st[m].rt, tg=o.target;
  const hit=c=>tg&&((tg[0]&&qe(c.a,tg[0]))||(tg[1]&&qe(c.b,tg[1])));
  const cell=(q,k,cls)=>`<td class="${cls}">${q?M(V(q,k).h):"?"}</td>`;
  let r0=`<tr class="ops"><th></th>`, r1=`<tr><th scope="row">${esc(o.la)}</th>`, r2=`<tr><th scope="row">${esc(o.lb)}</th>`;
  o.cols.forEach((c,i)=>{ const cls=i===0?"given":(hit(c)?"work hit":"work"); r0+=`<td>${i?esc(c.op):""}</td>`; r1+=cell(c.a,o.kA,cls); r2+=cell(c.b,o.kB,cls); });
  if(tg){ r0+="<td></td>"; r1+=cell(tg[0],o.kA,"tgt"); r2+=cell(tg[1],o.kB,"tgt"); }
  o.tbl.innerHTML=r0+"</tr>"+r1+"</tr>"+r2+"</tr>";
}

/* ---- Tape diagram with a unit-value stepper ---- */
function tape(m,a,b,T_,la,lb){ const s=st[m], n=Math.max(a,b); s.uv=1;

    box.innerHTML=row(la,a,"ta")+row(lb,b,"tb")+`<div class="ttot${tot===T_?" hit":""}">${tm("tapeTotal",{x:tot,T:T_}).h}</div>`;
    if(lbl) lbl.innerHTML=tm("unitIs",{u}).h; };
  actBtn(m,"−",()=>{ if(!s.done&&s.uv>1){ s.uv--; draw(); } },"ghost sq",t("unitDown"));

  actBtn(m,"+",()=>{ if(!s.done&&s.uv<99){ s.uv++; draw(); } },"ghost sq",t("unitUp"));
  draw();
}

/* ---- Double number line with a draggable marker ----
   o: {N ticks, stT/stB (value per tick), kT/kB kinds, labT/labB, given:[i], allT/allB, ask, askLine, pin} */
const DX0=40, DYT=74, DYB=154;
function svgQ(x,y,q,k,cls,an){ q=Z(q); an=an||"middle";
  if(k||q.d===1) return `<text class="${cls}" x="${x.toFixed(1)}" y="${y+7}" text-anchor="${an}">${esc(V(q,k).h)}</text>`;
  const w=Math.floor(q.n/q.d), r=q.n%q.d, wW=w?String(w).length*11+3:0, fW=Math.max(String(r).length,String(q.d).length)*11+6, tot=wW+fW;
  const x0=an==="middle"?x-tot/2:an==="start"?x:x-tot, fc=x0+wW+fW/2;

    `<text class="${cls}" x="${fc.toFixed(1)}" y="${y-3}" text-anchor="middle" style="font-size:15px">${r}</text>`+

    `<text class="${cls}" x="${fc.toFixed(1)}" y="${y+16}" text-anchor="middle" style="font-size:15px">${q.d}</text>`;
}
const qbox=(x,y)=>`<rect class="qbox" x="${(x-17).toFixed(1)}" y="${y-15}" width="34" height="30" rx="6"/><text class="dl-q" x="${x.toFixed(1)}" y="${y+7}" text-anchor="middle">?</text>`;

    if(giv||(o.full&&i===o.ask)) s+=`<line class="dl-link" x1="${X_.toFixed(1)}" y1="${DYT+13}" x2="${X_.toFixed(1)}" y2="${DYB-13}"/>`;

    const cands=P.mul?[[qd(P.x,P.f),"dir"],qa(P.x,P.f),qm(P.x,qa(P.f,1)),qm(P.ans,10)]:[[qm(P.giv,P.f),"dir"],qs(P.giv,P.f),qa(P.ans,1),qm(P.ans,2)];
    choices(m,qOpts(P.ans,P.k,cands),it=>{
      if(it.ok) return win(m,tm(P.mul?"goodConvMul":"goodConvDiv",{u1:U1(P.u1),u2:U(P.u2),f:V(P.f,P.k),e:P.mul?X(P.x,"×",V(P.f,P.k),P.ap?"≈":"=",V(P.ans,P.k)):X(P.giv,"÷",P.f,"=",P.ans)}));
      nope(m,cat(tm("youPicked",{x:it}),tm(P.mul?"hintConvMul":"hintConvDiv",{f:V(P.f,P.k)}))); });
    setPrompt(m,convQ(P));
  }else{ const P=genMulti(); Object.assign(s,P);
    rtable(m,{la:t("mc"+P.c+"a"),lb:t("mc"+P.c+"b"),base:P.base,kA:P.kA,kB:P.kB,target:P.target});
    const add=P.c===1?qa(P.ob,P.giv-P.gb):qa(P.ob,P.giv-P.gb);
    choices(m,qOpts(P.ans,P.k,[[add,"add"],qm(P.ans,2),qa(P.ans,P.k==="$"?5:1),qs(P.ans,P.k==="$"?5:1)]),it=>{
      if(it.ok) return win(m,tm("goodMulti",{e1:P.e1,e2:P.e2}));
      nope(m,cat(tm("youPicked",{x:it}),plain(it.tag==="add"?"hintAdd":"hintMulti"))); });
    setPrompt(m,P.q);
  }
  maybeAuto(m);
}

/* ---------- Mode switching ---------- */
const NEWFN={ratio:newRatio,rates:newRates,prop:newProp,pct:newPct,scale:newScale};
function firstMode(){ return MODES.find(m=>settings.modes[m])||"ratio"; }
function currentMode(){ const b=$$(".tabs button").find(x=>x.getAttribute("aria-selected")==="true"); return b?b.dataset.mode:firstMode(); }
function showMode(mode){
  if(!settings.modes[mode]) mode=firstMode();
  const switching=currentMode()!==mode;
  if(switching) stopSpeech();
  const g0=speechGen;
  $$(".modepanel").forEach(p=>p.classList.add("hidden"));
  $("#mode-"+mode).classList.remove("hidden");
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===mode; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; });
  if(!made[mode]) NEWFN[mode]();
  // Returning to a tab: read its current directions (unless a new round just did).
  if(switching && speechGen===g0) maybeAuto(mode);
}
function syncTabs(){
  $$(".tabs button").forEach(b=>b.classList.toggle("hidden",!settings.modes[b.dataset.mode]));
  if(!settings.modes[currentMode()]) showMode(firstMode());
}
function resetRounds(){ MODES.forEach(m=>made[m]=false); stopSpeech(); NEWFN[currentMode()](); }

/* ---------- Settings drawer ---------- */
function buildModeToggles(){
  const wrap=$("#modeToggles"); wrap.innerHTML="";
  MODES.forEach(m=>{ const l=document.createElement("label"); l.className="toggle";
    l.innerHTML=`<input type="checkbox" ${settings.modes[m]?"checked":""}> <span>${esc(t(MODE_KEY[m]))}</span>`;
    l.querySelector("input").addEventListener("change",e=>{ settings.modes[m]=e.target.checked;
      if(!MODES.some(k=>settings.modes[k])){ e.target.checked=true; settings.modes[m]=true; }
      saveSettings(); syncTabs(); });
    wrap.appendChild(l); });
}
function syncSettingsUI(){
  $("#setGrade").value=String(settings.grade); $("#setSize").value=String(settings.size); $("#setFrac").checked=settings.frac;
  $("#setAuto").checked=settings.autoRead; buildModeToggles();
}
function closeSettings(){ $("#settingsDrawer").classList.remove("open"); $("#openSettings").focus(); }
function initSettings(){
  $("#openSettings").addEventListener("click",()=>{ syncSettingsUI(); $("#settingsDrawer").classList.add("open"); $("#closeSettings").focus(); });
  $("#closeSettings").addEventListener("click",closeSettings);
  $("#settingsDrawer").addEventListener("click",e=>{ if(e.target.id==="settingsDrawer") closeSettings(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#settingsDrawer").classList.contains("open")) closeSettings(); });
  $("#setGrade").addEventListener("change",e=>{ const g=+e.target.value; settings.grade=g; Object.assign(settings,GRADES[g]); saveSettings(); syncSettingsUI(); resetRounds(); });
  $("#setSize").addEventListener("change",e=>{ settings.size=+e.target.value; saveSettings(); resetRounds(); });
  $("#setFrac").addEventListener("change",e=>{ settings.frac=e.target.checked; saveSettings(); resetRounds(); });
  $("#setAuto").addEventListener("change",e=>{ settings.autoRead=e.target.checked; saveSettings(); });
  $("#printCards").addEventListener("click",()=>{ buildPrintCards(); window.print(); });
}

/* ---------- Print cards ---------- */
function buildPrintCards(){
  const blank=`<span style="display:inline-block;min-width:5rem;border-bottom:2px solid #000">&nbsp;</span>`;
  const P=genRatioTable(), la=t("rc"+P.c+"a"), lb=t("rc"+P.c+"b"), cell=q=>`<td style="border:2px solid #000;padding:.4rem .8rem;text-align:center">${q?M(V(q).h):"?"}</td>`;
  const tbl=`<table style="border-collapse:collapse;font-size:1.2rem" dir="ltr"><tr><th style="border:2px solid #000;padding:.4rem;text-align:start">${esc(la)}</th>${cell(Q(P.a))}<td style="border:2px solid #000;width:4rem"></td>${cell(P.askB?P.A:null)}</tr>`+
    `<tr><th style="border:2px solid #000;padding:.4rem;text-align:start">${esc(lb)}</th>${cell(Q(P.b))}<td style="border:2px solid #000"></td>${cell(P.askB?null:P.B)}</tr></table>`;
  const RT=genRate("more"), FR=genFracRate(), PT=genPropTable(Math.random()<.5), PC=genPct(rand(["part","whole","pct"])), CH=G()>=7?genChg():genPct("whole"), CV=genConv(), MU=genMulti();
  const ptbl=`<table style="border-collapse:collapse;font-size:1.2rem" dir="ltr"><tr><th style="border:2px solid #000;padding:.4rem">x</th>${PT.xs.map(x=>cell(Q(x))).join("")}</tr><tr><th style="border:2px solid #000;padding:.4rem">y</th>${PT.ys.map(y=>cell(y)).join("")}</tr></table>`;
  const cards=[
    {title:t("mRatio"), body:P.q.h+"<br>"+t("cardTable"), html:tbl},
    {title:t("mRates"), body:RT.q.h, html:`<p>${t("cardShow")}</p>`},
    G()>=7?{title:t("mRates"), body:tm("rf"+FR.c+"s",{name:FR.name,a:FR.a,b:FR.b}).h, html:""}:null,
    {title:t("mProp"), body:t("cardProp"), html:ptbl},
    {title:t("mPct"), body:PC.q.h, html:`<p>${t("cardShow")}</p>`},
    {title:t("mPct"), body:CH.q.h, html:""},
    {title:t("mScale"), body:convQ(CV).h, html:""},
    {title:t("mScale"), body:MU.q.h, html:""}
  ].filter(Boolean);
  $("#printArea").innerHTML=`<h1>${esc(t("cardTitle"))}</h1><p>${esc(t("cardName"))} ____________________</p>`+
    cards.map(c=>`<div class="card-print"><h2>${esc(c.title)}</h2><p style="font-size:1.2rem;line-height:1.9">${c.body}</p>${c.html}<p>${esc(t("cardAns"))} ${blank}</p></div>`).join("")+
    `<p style="font-size:.85rem">${stdsHTML()}</p>`;
}

// Standards codes stay left-to-right inside Arabic/Urdu text.
function stdsHTML(){ return esc(t("stds")).replace(/(TEKS|Common Core|\d\.(?:RP\.|G\.|EE\.)?\d+(?:\([^)]*\))?)/g,'<bdi dir="ltr">$1</bdi>'); }

/* ---------- Language engine ---------- */
function resolveLang(){
  try{ const q=new URLSearchParams(location.search).get("lang"); if(q && T[q]) return q; }catch(e){}
  try{ const s=localStorage.getItem(LANG_KEY); if(s && T[s]) return s; }catch(e){}
  const n=(navigator.language||"en").slice(0,2).toLowerCase();
  if(T[n]) return n;
  return "en";
}
function applyLang(){
  const meta=LANGS.find(x=>x.code===lang)||LANGS[0];
  document.documentElement.lang=lang;
  document.documentElement.dir=meta.dir;
  document.title=t("appTitle");
  const sel=$("#langSelect"); if(sel) sel.value=lang;
  $$("[data-t]").forEach(el=>{ el.textContent=t(el.getAttribute("data-t")); });
  $$("[data-ta]").forEach(el=>{ const v=t(el.getAttribute("data-ta")); el.setAttribute("aria-label",v); el.title=v; });
  $("#stdsNote").innerHTML=stdsHTML();
  buildModeToggles();
  // refresh dynamic content: current mode now, the others when they are next opened
  resetRounds();
}
function setLang(l){ if(!T[l]) l="en"; lang=l; try{ localStorage.setItem(LANG_KEY,l); }catch(e){} applyLang(); }
function buildLangSelect(){
  const sel=$("#langSelect"); sel.innerHTML="";
  LANGS.forEach(m=>{ const o=document.createElement("option"); o.value=m.code; o.textContent=m.name; sel.appendChild(o); });
  sel.value=lang;
  sel.addEventListener("change",()=>setLang(sel.value));
}

/* ---------- Init ---------- */
function buildUI(){
  $("#tabs").innerHTML=MODES.map(m=>`<button type="button" role="tab" id="tab-${m}" aria-controls="mode-${m}" aria-selected="false" data-mode="${m}"><span class="ic" aria-hidden="true">${MODE_IC[m]}</span><span data-t="${MODE_KEY[m]}"></span></button>`).join("");
  $("#panels").innerHTML=MODES.map(m=>`<section id="mode-${m}" class="panel modepanel hidden" role="tabpanel" aria-labelledby="tab-${m}">
    <div class="panelhead"><h2 data-t="${MODE_KEY[m]}"></h2><button type="button" class="btn ghost no-print" data-new="${m}" data-t="newRound"></button></div>
    <div class="prompt"><button type="button" class="speaker" data-speak="${m}" data-ta="readAloud" aria-label="Read aloud">🔊</button><span id="p-${m}">…</span></div>
    <div class="work" id="w-${m}"></div>
    <div class="acts no-print" id="a-${m}"></div>
    <div class="choices" id="c-${m}" role="group" data-ta="choicesLbl" aria-label="Answer choices"></div>
    <div class="feedback" id="f-${m}" role="status" aria-live="polite"></div></section>`).join("");
  // Arrow keys move between tabs (WAI-ARIA tabs pattern).
  $("#tabs").addEventListener("keydown",e=>{ const vis=$$(".tabs button").filter(b=>!b.classList.contains("hidden")), i=vis.indexOf(document.activeElement); if(i<0) return;
    const rtl=document.documentElement.dir==="rtl", step={ArrowRight:rtl?-1:1,ArrowLeft:rtl?1:-1}[e.key]; if(!step) return;
    const nb=vis[(i+step+vis.length)%vis.length]; nb.focus(); showMode(nb.dataset.mode); e.preventDefault(); });
}
function init(){
  lang=resolveLang();
  buildUI();
  buildLangSelect();
  $$(".tabs button").forEach(b=>b.addEventListener("click",()=>showMode(b.dataset.mode)));
  $$(".speaker").forEach(b=>b.addEventListener("click",()=>speak(currentSpeech[b.dataset.speak])));
  $$("[data-new]").forEach(b=>b.addEventListener("click",()=>{ stopSpeech(); NEWFN[b.dataset.new](); }));
  initSettings();
  const f=firstMode();
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===f; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; b.classList.toggle("hidden",!settings.modes[b.dataset.mode]); });
  $$(".modepanel").forEach(p=>p.classList.toggle("hidden",p.id!=="mode-"+f));
  applyLang();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
</script>
<script>
/* Student mute toggle — shared across the Digital Math Tools. Self-contained,
   offline, stores no student data. Gates ALL speech by intercepting
   speechSynthesis.speak, so muting works regardless of each tool's internals.
   Reads the shared language preference only to localize its own label. */
(function(){
  "use strict";
  var LKEY='tcea.mathtools.lang', MKEY='tcea.mathtools.muted';
  var CODES=['en','es','vi','ar','hi','ur','zh'];
  var LAB={
    mute:{en:"Mute sound",es:"Silenciar sonido",vi:"Tắt âm thanh",ar:"كتم الصوت",hi:"आवाज़ बंद करें",ur:"آواز بند کریں",zh:"静音"},
    unmute:{en:"Turn sound on",es:"Activar sonido",vi:"Bật âm thanh",ar:"تشغيل الصوت",hi:"आवाज़ चालू करें",ur:"آواز چالو کریں",zh:"打开声音"}
  };
  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  window.__MT_MUTED = (get(MKEY)==='1');
  // Intercept every speech request; suppress while muted.
  try{
    if(window.speechSynthesis && typeof window.speechSynthesis.speak==='function'){
      var ss=window.speechSynthesis, orig=ss.speak.bind(ss);
      ss.speak=function(u){ if(!window.__MT_MUTED){ try{orig(u);}catch(e){} } };
    }
  }catch(e){}
  function curLang(){ var l=get(LKEY)||'en'; return LAB.mute[l]?l:'en'; }
  function label(el){
    var on=!window.__MT_MUTED, l=curLang(), txt=on?LAB.mute[l]:LAB.unmute[l];
    el.textContent=on?'🔊':'🔇';
    el.setAttribute('aria-label',txt); el.setAttribute('title',txt);
    el.setAttribute('aria-pressed', on?'false':'true');
  }
  function findLangSelect(){
    var sels=document.querySelectorAll('select');
    for(var i=0;i<sels.length;i++){ var o=sels[i].options, c=0;
      for(var j=0;j<o.length;j++){ if(CODES.indexOf((o[j].value||'').toLowerCase())>=0) c++; }
      if(c>=3) return sels[i];
    }
    return null;
  }
  function build(){
    if(document.getElementById('mtMuteBtn')) return;
    if(!(('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window))) return;
    var btn=document.createElement('button');
    btn.id='mtMuteBtn'; btn.type='button';
    btn.style.cssText='font:inherit;font-size:1.15rem;line-height:1;cursor:pointer;'+
      'min-width:44px;min-height:44px;padding:8px 12px;border:2px solid #e2dcf1;'+
      'border-radius:10px;background:#fff;color:#5b3fa5;font-weight:700;margin:0 4px;';
    btn.addEventListener('click',function(){
      window.__MT_MUTED=!window.__MT_MUTED;
      set(MKEY, window.__MT_MUTED?'1':'0');
      if(window.__MT_MUTED){ try{window.speechSynthesis.cancel();}catch(e){} }
      label(btn);
    });
    btn.addEventListener('focus',function(){btn.style.outline='3px solid #5b3fa5';btn.style.outlineOffset='2px';});
    btn.addEventListener('blur',function(){btn.style.outline='';});
    var sel=findLangSelect();
    if(sel && sel.parentNode){
      sel.parentNode.insertBefore(btn, sel);
      sel.addEventListener('change',function(){ setTimeout(function(){label(btn);},0); });
    }else{
      btn.style.position='fixed'; btn.style.top='10px'; btn.style.zIndex='9999';
      btn.style[(document.documentElement.dir==='rtl')?'left':'right']='10px';
      (document.body||document.documentElement).appendChild(btn);
    }
    label(btn);
  }
  if(document.readyState==='complete'){ build(); }
  else{ window.addEventListener('load', build); }
  window.addEventListener('storage',function(e){ if(e.key===LKEY){ var b=document.getElementById('mtMuteBtn'); if(b) label(b); } });
})();
</script>
