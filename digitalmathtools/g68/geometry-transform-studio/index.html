<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Geometry Transform Studio — a Grades 6–8 geometry app: area by decomposing and rearranging, circles and solids, transformations on the coordinate plane, angle relationships, and the Pythagorean theorem. Works offline. No data collected.">
<title>Geometry Transform Studio</title>
<style>
  :root{
    --bg:#fbf1ea;--panel:#ffffff;--ink:#24170e;--muted:#5a4637;--line:#ecd3c1;
    --accent:#d35400;--accentD:#a33f00;--accent-ink:#ffffff;--good:#166534;--good-bg:#dcfce7;
    --hint:#7a4a00;--hint-bg:#fff4d6;--focus:#0a58ca;
    --tap:52px;font-size:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-text-size-adjust:100%}
  h1,h2,h3{line-height:1.15;margin:0 0 .3em}
  button{font-family:inherit;font-size:1rem;cursor:pointer}
  button:disabled{cursor:default}

  .topbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--accentD);color:var(--accent-ink);padding:.55rem .8rem}
  .topbar .brand{font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:.4rem;margin-inline-end:auto}
  .topbar a.homebtn,.topbar button.tb{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.4rem .7rem;min-height:var(--tap);min-width:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:.35rem;text-decoration:none;font-weight:700;font-size:.95rem}
  .globe{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.2rem .5rem;min-height:var(--tap)}
  .globe span{font-size:1.2rem}
  .globe select{border:0;background:#fff;color:var(--ink);border-radius:8px;min-height:44px;font-weight:700;font-size:1rem;padding:.2rem .4rem}

  main{max-width:1200px;margin:0 auto;padding:.7rem}
  .tabsrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 .7rem}
  .tabs{display:flex;gap:.4rem;flex-wrap:wrap;flex:1 1 auto}
  .tabs button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.45rem .75rem;min-height:var(--tap);font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:.4rem}
  .tabs button[aria-selected="true"]{background:var(--accentD);color:#fff;border-color:var(--accentD)}
  .tabs button .ic{font-size:1.15rem}
  .stars{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.4rem .8rem;font-weight:800;font-size:1.15rem;min-height:48px;display:inline-flex;align-items:center;gap:.3rem;color:var(--good)}
  .stars.pop{animation:pop .5s ease}
  @keyframes pop{50%{transform:scale(1.18)}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:.9rem;margin-bottom:.8rem}
  .panelhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
  .panelhead h2{margin:0;font-size:1.25rem;margin-inline-end:auto}

  .prompt{display:flex;align-items:center;gap:.6rem;background:#fdf0e6;border:2px solid #f0c9ab;border-radius:14px;padding:.6rem .8rem;margin-bottom:.7rem;font-size:1.08rem;font-weight:600;line-height:1.7}
  .prompt>span{min-width:0;overflow-wrap:anywhere}
  .speaker{background:var(--accentD);color:#fff;border:0;border-radius:50%;width:var(--tap);height:var(--tap);min-width:var(--tap);font-size:1.4rem;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}

  .btn{background:var(--accentD);color:#fff;border:2px solid var(--accentD);border-radius:12px;padding:.5rem .85rem;min-height:var(--tap);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
  .btn.ghost{background:var(--panel);color:var(--accentD)}
  .btn:disabled{opacity:.45}

  .feedback{margin-top:.6rem;border-radius:12px;padding:.6rem .8rem;font-weight:600;display:none;line-height:1.8}
  .feedback.show{display:block}
  .feedback.good{background:var(--good-bg);color:var(--good);border:2px solid #86efac}
  .feedback.hint{background:var(--hint-bg);color:var(--hint);border:2px solid #f6d271}

  /* Math: always left-to-right, even inside Arabic/Urdu sentences */
  .math{unicode-bidi:isolate;direction:ltr;display:inline;font-weight:800;white-space:nowrap}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:800;margin:0 .08em;white-space:nowrap;font-size:.85em;font-style:normal}
  .fr>b{padding:0 .14em}
  .fr>b:first-child{border-bottom:.11em solid currentColor}
  i.sx{font-style:normal}

  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-top:.7rem}
  .choices:empty{display:none}
  .choice{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:.5rem;min-height:64px;display:flex;align-items:center;justify-content:center;position:relative;font-size:1.2rem;font-weight:800;color:var(--ink);text-align:center}
  .choice.wide{font-size:1.05rem}
  .choice.correctpick{border-color:var(--good);background:var(--good-bg)}
  .choice.wrongpick{border-color:#e3b341;background:var(--hint-bg);opacity:.75}
  .choice .badge{position:absolute;top:4px;inset-inline-end:6px;font-size:1rem;display:none}
  .choice.correctpick .badge{display:block}

  .work:empty{display:none}
  .vz{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;align-items:flex-end}
  .viz{display:block;width:100%;height:auto;direction:ltr;touch-action:manipulation}
  .viz text{pointer-events:none;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  .cap{text-align:center;font-weight:600;color:var(--muted);margin:.4rem auto 0;max-width:640px;line-height:1.7}
  .cap:empty{display:none}
  .readout{text-align:center;font-weight:800;min-height:1.4em;color:var(--accentD)}
  .acts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;margin:.5rem 0}
  .acts:empty{display:none}

  /* SVG styles */
  .gl{stroke:#eedfd3;stroke-width:1}
  .ax{stroke:#7d5f49;stroke-width:2}
  .ed{stroke:#2c1a0e;stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
  .thin{stroke:#2c1a0e;stroke-width:1.5;fill:none}
  .dsh{stroke:#5a4637;stroke-width:2;stroke-dasharray:6 5;fill:none}
  .hid{stroke:#8a7464;stroke-width:1.6;stroke-dasharray:5 4;fill:none}
  .sh1{fill:#aed6f1;stroke:#1b4f72;stroke-width:2.5;stroke-linejoin:round}
  .sh2{fill:#f8c471;stroke:#a04000;stroke-width:2.5;stroke-linejoin:round}
  .sh3{fill:#a9dfbf;stroke:#1e8449;stroke-width:2.5;stroke-linejoin:round}
  .sh4{fill:#d7bde2;stroke:#6c3483;stroke-width:2.5;stroke-linejoin:round}
  .shg{fill:#ececec;stroke:#8a7464;stroke-width:2;stroke-linejoin:round}
  .fo{fill-opacity:.55}
  .liq{fill:#5dade2;fill-opacity:.75;stroke:none}
  .rd{stroke:#c0392b;stroke-width:5;stroke-linecap:round;fill:none}
  .dot{fill:#1b4f72}
  .doto{fill:#d35400;stroke:#fff;stroke-width:1.5}
  .lb{font-size:15px;font-weight:800;fill:#24170e}
  .lbs{font-size:11px;font-weight:700;fill:#7d5f49}
  .lbb{font-size:15px;font-weight:800;fill:#1b4f72}
  .lbo{font-size:15px;font-weight:800;fill:#a33f00}
  .lbg{font-size:15px;font-weight:800;fill:#166534}
  .lbi{font-size:14px;font-style:italic;font-weight:700;fill:#5a4637}
  .arc{stroke:#a33f00;stroke-width:2.2;fill:none}
  .wg{fill:transparent;stroke:none}
  .wg.given{fill:#f8c471;fill-opacity:.8}
  .wg.ask{fill:#aed6f1;fill-opacity:.9}
  .wg.hot{cursor:pointer}
  .wg.hot:hover{fill:#fdebd0}
  .wg.picked{fill:#a9dfbf}
  .wg.wrong{fill:#fff4d6}
  .wg:focus{outline:none;stroke:var(--focus);stroke-width:3}
  .cur{display:none;fill:none;stroke:var(--focus);stroke-width:3}
  .viz:focus{outline:4px solid var(--focus);outline-offset:2px}
  .viz:focus .cur{display:inline}
  .gridbox{cursor:crosshair}

  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:1rem}
  .drawer.open{display:flex}
  .drawer .card{background:var(--panel);border-radius:16px;max-width:600px;width:100%;padding:1rem;max-height:90vh;overflow:auto}
  .setrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0;padding:.5rem 0;border-bottom:1px solid var(--line)}
  .setrow .lab{font-weight:700;min-width:150px}
  .toggle{display:inline-flex;align-items:center;gap:.35rem;border:2px solid var(--line);border-radius:10px;padding:.35rem .55rem;background:#fff;min-height:44px}
  .toggle input{width:22px;height:22px}
  select.diff{font-size:1rem;padding:.4rem;border-radius:10px;border:2px solid var(--line);min-height:48px;max-width:100%}
  .wrapflex{display:flex;flex-wrap:wrap;gap:.4rem}

  footer{max-width:1200px;margin:.5rem auto 2rem;padding:.8rem;color:var(--muted);font-size:.9rem;text-align:center}
  footer a{color:var(--accentD);font-weight:700}
  .stds{font-size:.82rem;color:var(--muted);background:#fdf6f1;border:1px dashed var(--line);border-radius:12px;padding:.5rem .7rem;margin-top:.4rem}

  .hidden{display:none !important}
  :focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  @media (max-width:480px){ :root{font-size:17px} main{padding:.5rem} .panel{padding:.6rem} .tabs button{padding:.4rem .55rem;font-size:.92rem} .prompt{font-size:1rem;padding:.5rem .6rem} }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

  .printonly{display:none}
  @media print{
    .topbar,.tabsrow,footer,.modepanel,#stdsNote,.no-print,#mtMuteBtn{display:none !important}
    body{background:#fff}
    .printonly{display:block}
    .card-print{border:2px solid #000;border-radius:12px;padding:1rem;margin:0 0 1rem;page-break-inside:avoid}
    .card-print h2{margin:.2rem 0}
    .card-print svg{max-height:230px;max-width:100%;width:auto}
    .card-print ol{display:flex;flex-wrap:wrap;gap:.5rem 2rem;font-weight:700}
    main{max-width:100%}
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">📐 <span data-t="appTitle">Geometry Transform Studio</span></span>
  <a class="homebtn" href="../../index.html">🏠 <span data-t="home">Home</span></a>
  <label class="globe"><span aria-hidden="true">🌐</span>
    <select id="langSelect" aria-label="Language / Idioma"></select>
  </label>
  <button class="tb settingsbtn" id="openSettings" type="button">⚙️ <span data-t="teacher">Teacher</span></button>
</header>

<main>
  <div class="tabsrow">
    <div class="tabs" id="tabs" role="tablist" data-ta="modesLbl" aria-label="Modes"></div>
    <span class="stars" id="stars"><span aria-hidden="true">✔</span><span class="sr" data-t="score">Correct answers</span> <b id="starCount">0</b></span>
  </div>
  <div id="panels"></div>
  <div class="stds" id="stdsNote"></div>
  <div class="printonly" id="printArea"></div>
</main>

<footer>
  <p data-t="footNote">No accounts · No data collected · Works offline</p>
  <p><a href="../../index.html" data-t="home">Home</a> · <a href="../../policy.html" data-t="privacy">Privacy</a></p>
</footer>

<!-- SETTINGS -->
<div class="drawer" id="settingsDrawer" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="card">
    <div class="panelhead"><h2 id="setTitle" data-t="teacherTitle">Teacher settings</h2>
      <button class="btn ghost" id="closeSettings" type="button" data-t="close">Close</button></div>
    <div class="setrow"><label class="lab" for="setGrade" data-t="setGrade">Grade level</label>
      <select class="diff" id="setGrade">
        <option value="6" data-t="g6">Grade 6</option>
        <option value="7" data-t="g7">Grade 7</option>
        <option value="8" data-t="g8">Grade 8</option></select>
      <p class="stds" style="margin:0;flex:1 1 100%" data-t="gradeNote"></p></div>
    <div class="setrow"><label class="lab" for="setMax" data-t="setMax">Largest side length</label>
      <select class="diff" id="setMax"></select></div>
    <div class="setrow"><label class="lab" for="setPi" data-t="setPi">Answers with π</label>
      <select class="diff" id="setPi">
        <option value="314" data-t="pi314">Use 3.14 for π</option>
        <option value="pi" data-t="piPi">Leave answers in terms of π</option></select></div>
    <div class="setrow"><span class="lab" data-t="setModes">Modes</span>
      <div id="modeToggles" class="wrapflex"></div></div>
    <div class="setrow"><span class="lab" data-t="setSpeech">Speech</span>
      <label class="toggle"><input type="checkbox" id="setAuto"> <span data-t="autoRead">Auto-read directions</span></label></div>
    <div class="setrow" style="border:0"><button class="btn" id="printCards" type="button">🖨 <span data-t="printCards">Print challenge cards</span></button></div>
    <p class="stds" data-t="setStored">Settings are saved only on this device. No student information is ever stored.</p>
  </div>
</div>

// Prefer warm, natural voices; avoid harsh robotic engines.
function pickWarmVoice(code){
  const vs = speechSynthesis.getVoices()||[];
  const want=code.toLowerCase(), two=want.slice(0,2);
  let best=null, bs=-1;
  for(const v of vs){
    const lc=(v.lang||'').toLowerCase().replace('_','-');
    if(lc!==want && lc.slice(0,2)!==two) continue;
    let s=(lc===want?100:60); const n=(v.name||'').toLowerCase();
    if(/google|natural|neural|online|premium|enhanced|siri/.test(n)) s+=40;
    if(/female|woman|samantha|karen|tessa|moira|fiona|serena|victoria|allison|ava|susan|zoe|amelie|amélie|paulina|monica|mónica|zira|hazel|catherine|linda|kanya|lekha|ting-ting|mei-jia|sin-ji|yu-shu|huihui|xiaoxiao/.test(n)) s+=18;
    if(/espeak|compact|festival|pico|robot|eloquence/.test(n)) s-=60;
    if(v.localService===false) s+=8;
    if(v.default) s+=2;
    if(s>bs){ bs=s; best=v; }
  }
  return best;
}

  return parts.map(x=>x.trim()).filter(Boolean);

  };
  if(busy) setTimeout(start,120); else start();

/* Speak praise, then start the next round once it finishes (never sooner than minMs). */
const roundIds={area:0,circles:0,transform:0,angles:0,pyth:0};
function afterPraise(msg,key,next,minMs){
  const id=roundIds[key], t0=Date.now();
  speak(msg,()=>{
    const wait=Math.max(450,(minMs||1200)-(Date.now()-t0));
    setTimeout(()=>{ if(roundIds[key]===id) next(); },wait);
  });
}
if(speechOK){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }
if(!speechOK){ document.addEventListener("DOMContentLoaded",()=>$$(".speaker").forEach(b=>b.style.display="none")); }

const currentSpeech = {area:"",circles:"",transform:"",angles:"",pyth:""};
function setSpeech(mode,text){ currentSpeech[mode]=text; }
// Only auto-read for the panel that is on screen (rounds can refresh in the background).
function maybeAuto(mode){ if(settings.autoRead && currentMode()===mode) speak(currentSpeech[mode]); }
// Browsers block speech until the first tap; read the directions then if nothing has played yet.
document.addEventListener("pointerdown",function firstTap(e){
  document.removeEventListener("pointerdown",firstTap,true);
  if(speechStarted || !settings.autoRead) return;
  if(e.target.closest("button,select,a,input,.viz")) return;
  speak(currentSpeech[currentMode()]);
},true);

/* ---------- Feedback & round helpers ---------- */
function showFb(el,type,msg){ el.className="feedback show "+type; el.innerHTML=(type==="good"?"✅ ":"💡 ")+msg; }
function hideFb(el){ el.className="feedback"; el.innerHTML=""; }
const made={}, st={};
function startRound(m){ roundIds[m]++; made[m]=true; st[m]={done:false,k:0,tries:0};
  ["w","a","c"].forEach(p=>{ $("#"+p+"-"+m).innerHTML=""; }); hideFb($("#f-"+m)); }
function setPrompt(m,msg){ $("#p-"+m).innerHTML=msg.h; setSpeech(m,msg.s); }
function win(m,msg){ const s=st[m]; if(s.done) return; s.done=true;
  $$(`#c-${m} button,#a-${m} button.chk`).forEach(b=>b.disabled=true);
  addStar(); showFb($("#f-"+m),"good",msg.h); afterPraise(msg.s,m,NEWFN[m],3200); }
function nope(m,msg){ st[m].tries++; showFb($("#f-"+m),"hint",msg.h); speak(msg.s); }
function actBtn(m,html,fn,cls){ const b=document.createElement("button"); b.type="button"; b.className="btn"+(cls?" "+cls:""); b.innerHTML=html;
  b.addEventListener("click",fn); $("#a-"+m).appendChild(b); return b; }
// Work area: one drawing (re-rendered from state on every animation frame) and a caption.
function setWork(m){ $("#w-"+m).innerHTML=`<div class="vz" id="vz-${m}"></div><p class="cap" id="cap-${m}" aria-live="polite"></p>`; redraw(m); }
function redraw(m){ const s=st[m], box=$("#vz-"+m); if(!box||!s.draw) return;
  const a=document.activeElement, f=a&&box.contains(a)?a.getAttribute("data-f"):null;
  box.innerHTML=s.draw(s.k);
  if(f){ const n=box.querySelector(`[data-f="${f}"]`); if(n) n.focus(); } }
function setCap(m,h){ const c=$("#cap-"+m); if(c) c.innerHTML=h||""; }
function animTo(m,to,ms,done){ const s=st[m], from=s.k, id=roundIds[m];
  anim(ms||1000,e=>{ if(roundIds[m]!==id) return false; s.k=from+(to-from)*e; redraw(m); },()=>{ if(roundIds[m]===id && done) done(); }); }
// A two-state manipulative button: animates the drawing to k=1 and back, showing a caption at the end.
function toggleBtn(m,label,cap){ const s=st[m]; let busy=false;
  const b=actBtn(m,label,()=>{ if(busy) return; busy=true; const to=s.k<.5?1:0; setCap(m,"");
    animTo(m,to,1100,()=>{ busy=false; b.innerHTML=to?"↺ "+t("bBack"):label; if(to) setCap(m,typeof cap==="function"?cap():cap); }); },"ghost");
  return b; }
// Choice buttons; wrong picks are greyed out and explained.
function choices(m,items,pick){
  const g=$("#c-"+m); g.innerHTML="";
  items.forEach(it=>{ const b=document.createElement("button"); b.type="button"; b.className="choice"+(it.wide?" wide":"");
    b.innerHTML=`<span class="badge" aria-hidden="true">✅</span><span>${it.h}</span>`; b.setAttribute("aria-label",say(it.h));
    b.addEventListener("click",()=>{ if(st[m].done) return; if(it.ok) b.classList.add("correctpick"); else { b.classList.add("wrongpick"); b.disabled=true; } pick(it,b); });
    g.appendChild(b); });
}
// Four numeric choices: the answer plus likely mistakes (each with its own explanation key).
function nOpts(ans,list,fmt){
  const out=[{h:fmt(ans),ok:true,v:ans}], seen=[ans], ok=v=>v>0&&isFinite(v)&&!seen.some(x=>Math.abs(x-v)<1e-6);
  for(const [v,why] of list){ if(out.length>=4) break; const w=r2(v); if(!ok(w)) continue; seen.push(w); out.push({h:fmt(w),ok:false,v:w,why}); }
  for(let k=1;out.length<4&&k<40;k++){ const step=Math.max(1,Math.round(ans*.12)), v=r2(ans+(k%2?1:-1)*Math.ceil(k/2)*step);
    if(ok(v)){ seen.push(v); out.push({h:fmt(v),ok:false,v}); } }
  return shuffle(out);
}
// Standard multiple-choice handler: praise, or "You chose …" + the mistake's reason + the general hint.
function pickNum(m,good,hint){ return it=>{ if(it.ok) return win(m,good);
  nope(m,cat(tm("youPicked",{x:it.h}), it.why?tm(it.why,st[m].hv||{}):null, hint)); }; }

/* =========================================================================
   1. AREA DECOMPOSER — parallelograms, triangles, trapezoids, composite figures
   ========================================================================= */
function newArea(){
  const m="area"; startRound(m); const s=st[m], g=G(), mx=Math.max(6,Math.min(MX(),14));
  const type=rand(g===6?["par","tri","trap","comp"]:g===7?["par","tri","trap","comp","comp"]:["tri","trap","comp","comp","par"]); s.type=type;
  let ans, eq, opts, hint, nameK, capH;
  s.shapes=[]; s.lb=[]; s.lb2=[]; s.hl=null;
  if(type==="par"){
    const b=ri(3,mx), h=ri(2,Math.min(8,mx)), o=ri(1,Math.min(3,b-1));
    s.ext=[0,b+o,0,h]; ans=b*h; nameK="nPar"; hint="hPar";
    s.whole=[[0,0],[b,0],[b+o,h],[o,h]];
    s.shapes=[{p:[[o,0],[b,0],[b+o,h],[o,h]],c:"sh1"},{p:[[0,0],[o,0],[o,h]],c:"sh2",mv:[b,0]}];
    s.hl=[[o,0],[o,h]]; s.lb=[[b/2,0,b,"b"],[o,h/2,h,"r"]];

    opts=[[b*h/2,"hHalfPar"],[b+h,"hAdd"],[2*(b+h),"hPerim"],[b*(h+o),null]];
  }else if(type==="tri"){
    const b=ri(3,mx); let h=ri(2,Math.min(8,mx)); if(b*h%2) h=h<8?h+1:h-1; const p=ri(0,b);
    s.ext=[0,b+p,0,h]; ans=b*h/2; nameK="nTri"; hint="hTri";
    s.shapes=[{p:[[0,0],[b,0],[p,h]],c:"sh1"},{p:[[0,0],[b,0],[p,h]],c:"sh2",rot:[(b+p)/2,h/2]}];
    s.hl=[[p,0],[p,h]]; s.lb=[[b/2,0,b,"b"],[p,h/2,h,p>b/2?"l":"r"]];
    eq=`A = ${HALF()} × b × h = ${HALF()} × ${b} × ${h} = ${ans}`; capH=()=>t("capTri",{b:M(b),h:M(h),bh:M(b*h)});
    opts=[[b*h,"hNoHalf"],[b+h,"hAdd"],[b*h/2+b,null],[b*h/4,null]];
  }else if(type==="trap"){
    const b1=ri(4,mx), b2=ri(2,b1-1); let h=ri(2,Math.min(8,mx)); if((b1+b2)*h%2) h=h<8?h+1:h-1; const p=ri(0,b1-b2);
    s.ext=[0,b1+b2+p,0,h]; ans=(b1+b2)*h/2; nameK="nTrap"; hint="hTrap";
    s.shapes=[{p:[[0,0],[b1,0],[p+b2,h],[p,h]],c:"sh1"},{p:[[0,0],[b1,0],[p+b2,h],[p,h]],c:"sh2",rot:[(b1+p+b2)/2,h/2]}];
    s.hl=[[p+b2/2,0],[p+b2/2,h]]; s.lb=[[b1/2,0,b1,"b"],[p+b2/2,h,b2,"t"],[p+b2/2,h/2,h,"r"]];
    eq=`A = ${HALF()} × (b₁ + b₂) × h = ${HALF()} × (${b1} + ${b2}) × ${h} = ${ans}`;
    capH=()=>t("capTrap",{b1:M(b1),b2:M(b2),s:M(b1+b2),h:M(h)});
    opts=[[(b1+b2)*h,"hNoHalf"],[b1*h,"hOneBase"],[b1*b2*h/2,null],[b1+b2+h,"hAdd"]];
  }else if(Math.random()<.5){ // L-shape: two rectangles
    const W=ri(4,mx), H=ri(4,Math.min(10,mx)), w1=ri(1,W-2)+0, h1=ri(1,H-2);
    s.ext=[0,W+1,0,H]; const a1=w1*H, a2=(W-w1)*h1; ans=a1+a2; nameK="nComp"; hint="hL";

    eq=`A = ${w1} × ${H} + ${W-w1} × ${h1} = ${a1} + ${a2} = ${ans}`;
    capH=()=>t("capL",{r1:M(w1+" × "+H),r2:M((W-w1)+" × "+h1)});

    const W=ri(3,mx), H=ri(2,Math.min(7,mx)); let th=ri(2,5); if(W*th%2) th++; const p=W%2?ri(0,W):W/2;

    s.whole=[[0,0],[W,0],[W,H],[p,H+th],[0,H]];
    s.shapes=[{p:[[0,0],[W,0],[W,H],[0,H]],c:"sh1"},{p:[[0,H],[W,H],[p,H+th]],c:"sh2",mv:[0,1]}];
    s.hl=[[p,H],[p,H+th]]; s.hlmv=[0,1]; s.lb=[[W/2,0,W,"b"],[0,H/2,H,"l"],[p,H+th/2,th,p>W/2?"l":"r",1]];

}

/* =========================================================================
   2. CIRCLES & SOLIDS — circumference, circle area, volume, surface area
   ========================================================================= */
const OB=[.5,-.32]; // oblique depth direction for 3-D sketches
function boxSVG(x,y,L,H,D,fr,lab,layers){ // x,y = front-bottom-left (px)
  const dx=OB[0]*D, dy=OB[1]*D; let z="";

    if(layers) for(let i=1;i<layers&&i/layers<fr-1e-6;i++){ const yy=y-H*i/layers; z+=Ln(x,yy,x+L,yy,"thin")+Ln(x+L,yy,x+L+dx,yy+dy,"thin"); } }
  z+=PG([[x,y],[x+L,y],[x+L,y-H],[x,y-H]],"ed")+PG([[x,y-H],[x+L,y-H],[x+L+dx,y-H+dy],[x+dx,y-H+dy]],"ed")+PG([[x+L,y],[x+L+dx,y+dy],[x+L+dx,y-H+dy],[x+L,y-H]],"ed");
  if(lab){ z+=TX(x+L/2,y+19,lab[0])+TX(x-7,y-H/2+5,lab[2],"lb","end")+TX(x+L+dx/2+8,y+dy/2+14,lab[1],"lb","start"); }
  return z; }
function cylSVG(cx,y,R,H,fr,lab){ const ry=R*.3; let z="";
  if(fr>0){ const f=H*fr; z+=`<path d="M${f1(cx-R)} ${f1(y)} A${f1(R)} ${f1(ry)} 0 0 0 ${f1(cx+R)} ${f1(y)} L${f1(cx+R)} ${f1(y-f)} A${f1(R)} ${f1(ry)} 0 0 1 ${f1(cx-R)} ${f1(y-f)} Z" class="liq"/><ellipse cx="${f1(cx)}" cy="${f1(y-f)}" rx="${f1(R)}" ry="${f1(ry)}" class="liq"/>`; }
  z+=`<path d="M${f1(cx-R)} ${f1(y)} A${f1(R)} ${f1(ry)} 0 0 1 ${f1(cx+R)} ${f1(y)}" class="hid"/><path d="M${f1(cx-R)} ${f1(y)} A${f1(R)} ${f1(ry)} 0 0 0 ${f1(cx+R)} ${f1(y)}" class="ed"/>`+
    Ln(cx-R,y,cx-R,y-H)+Ln(cx+R,y,cx+R,y-H)+`<ellipse cx="${f1(cx)}" cy="${f1(y-H)}" rx="${f1(R)}" ry="${f1(ry)}" class="ed"/>`;
  if(lab){ z+=Ln(cx,y-H,cx+R,y-H,"thin")+`<circle cx="${f1(cx)}" cy="${f1(y-H)}" r="2.5" class="dot"/>`+TX(cx+R/2,y-H-6,lab[0])+TX(cx+R+7,y-H/2+5,lab[1],"lb","start"); }
  return z; }
function coneSVG(cx,y,R,H,lab){ const ry=R*.3;
  return `<path d="M${f1(cx-R)} ${f1(y)} A${f1(R)} ${f1(ry)} 0 0 1 ${f1(cx+R)} ${f1(y)}" class="hid"/><path d="M${f1(cx-R)} ${f1(y)} A${f1(R)} ${f1(ry)} 0 0 0 ${f1(cx+R)} ${f1(y)}" class="ed"/>`+
    PG([[cx-R,y],[cx,y-H],[cx+R,y]],"ed","fill='#fdebd0' fill-opacity='.5'")+Ln(cx,y-H,cx,y,"dsh")+Ln(cx,y,cx+R,y,"thin")+
    (lab?TX(cx+R/2,y+18,lab[0])+TX(cx-6,y-H/2+5,lab[1],"lb","end"):""); }
function pyrSVG(x,y,L,D,H,lab){ const dx=OB[0]*D, dy=OB[1]*D, A=[x+L/2+dx/2,y+dy/2-H];
  return Ln(x+dx,y+dy,x+L+dx,y+dy,"hid")+Ln(x,y,x+dx,y+dy,"hid")+Ln(A[0],A[1],x+dx,y+dy,"hid")+Ln(A[0],A[1],A[0],y+dy/2,"dsh")+
    PG([[x,y],[x+L,y],A],"ed","fill='#fdebd0' fill-opacity='.5'")+PG([[x+L,y],[x+L+dx,y+dy],A],"ed","fill='#fdebd0' fill-opacity='.3'")+
    (lab?TX(x+L/2,y+19,lab[0])+TX(x+L+dx/2+8,y+dy/2+14,lab[1],"lb","start")+TX(A[0]-6,(A[1]+y+dy/2)/2+5,lab[2],"lb","end"):""); }
function sphSVG(cx,cy,R,lab){
  return `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(R)}" class="ed" fill="#fdebd0" fill-opacity=".5"/><path d="M${f1(cx-R)} ${f1(cy)} A${f1(R)} ${f1(R*.3)} 0 0 1 ${f1(cx+R)} ${f1(cy)}" class="hid"/><path d="M${f1(cx-R)} ${f1(cy)} A${f1(R)} ${f1(R*.3)} 0 0 0 ${f1(cx+R)} ${f1(cy)}" class="thin"/>`+
    Ln(cx,cy,cx+R,cy,"ed")+`<circle cx="${f1(cx)}" cy="${f1(cy)}" r="3" class="dot"/>`+(lab?TX(cx+R/2,cy-7,lab):""); }
function triPrismSVG(x,y,b,ht,ap,D,fr,lab){ const dx=OB[0]*D, dy=OB[1]*D, F=[[x,y],[x+b,y],[x+ap,y-ht]], Bk=F.map(p=>[p[0]+dx,p[1]+dy]); let z="";
  z+=Ln(Bk[0][0],Bk[0][1],Bk[1][0],Bk[1][1],"hid")+Ln(Bk[0][0],Bk[0][1],Bk[2][0],Bk[2][1],"hid")+Ln(F[0][0],F[0][1],Bk[0][0],Bk[0][1],"hid");

  z+=Ln(F[1][0],F[1][1],Bk[1][0],Bk[1][1])+Ln(F[2][0],F[2][1],Bk[2][0],Bk[2][1])+Ln(Bk[1][0],Bk[1][1],Bk[2][0],Bk[2][1])+PG(F,"sh2","fill-opacity='.6'")+Ln(x+ap,y,x+ap,y-ht,"dsh");
  z+=TX(x+b/2,y+19,lab[0])+TX(x+ap+6,y-ht/2+5,lab[1],"lb","start")+TX(x+b+dx/2+8,y+dy/2+14,lab[2],"lb","start");
  return z; }
function newCircles(){
  const m="circles"; startRound(m); const s=st[m], g=G(), mx=Math.min(MX(),12), pi=PI();
  const type=rand(g===6?["prism","prism","prismSA","prismSA"]:g===7?["circ","circA","circ","circA","triPrism","pyr","prismSA","prismLat"]:["cyl","cone","sphere","cylSA","circA","circ"]); s.type=type;

    const r=ri(2,Math.min(10,mx)), d=2*r, gd=Math.random()<.5, given=gd?t("withD",{d:M("d = "+d)}):t("withR",{r:M("r = "+r)});

      s.hv={r:M(r),d:M(d)};
      // rolling circle: one full turn unrolls the circumference
      s.draw=k=>{ const u=Math.min(300/((Math.PI+1.1)*d),26), R=r*u, x0=16, yb=H-48, th=k*2*Math.PI, cx=x0+R+th*R, cy=yb-R; let z="";
        z+=Ln(x0,yb,x0+Math.PI*d*u+2*R+6,yb,"thin");
        for(let i=1;i<=3;i++) z+=Ln(x0+i*d*u,yb-6,x0+i*d*u,yb+6,"thin")+TX(x0+i*d*u,yb+22,i+"d","lbs");
        if(k>0) z+=Ln(x0,yb,x0+th*R,yb,"rd");
        if(k>=.99) z+=TX(x0+Math.PI*d*u,yb+38,"C ≈ 3.14d","lbo");

/* =========================================================================
   3. TRANSFORMATIONS on the coordinate plane
   ========================================================================= */
const GR=6, CS=24, GPD=20, GW=2*GPD+2*GR*CS;
const gx=x=>GPD+(x+GR)*CS, gy=y=>GPD+(GR-y)*CS;
const sg=x=>nf(x);
const P2=p=>`(${sg(p[0])}, ${sg(p[1])})`;
function applyT(type,p,a,b){ switch(type){
  case "tr": return [p[0]+a,p[1]+b]; case "rx": return [p[0],-p[1]]; case "ry": return [-p[0],p[1]];
  case "r90": return [-p[1],p[0]]; case "r180": return [-p[0],-p[1]]; case "r270": return [p[1],-p[0]];
  case "dil": return [p[0]*a,p[1]*a]; } }
function ruleH(type,a,b){ const term=(v,n)=>n===0?v:`${v} ${n<0?"−":"+"} ${Math.abs(n)}`;
  switch(type){ case "tr": return `(x, y) → (${term("x",a)}, ${term("y",b)})`; case "rx": return "(x, y) → (x, −y)"; case "ry": return "(x, y) → (−x, y)";
    case "r90": return "(x, y) → (−y, x)"; case "r180": return "(x, y) → (−x, −y)"; case "r270": return "(x, y) → (y, −x)";
    case "dil": return a===.5?`(x, y) → (${HALF()}x, ${HALF()}y)`:`(x, y) → (${a}x, ${a}y)`; } }

function triMarks(P,cls,prime,lc){ const c=[(P[0][0]+P[1][0]+P[2][0])/3,(P[0][1]+P[1][1]+P[2][1])/3];
  let z=PG(P.map(p=>[gx(p[0]),gy(p[1])]),cls,"fill-opacity='.6'");
  P.forEach((p,i)=>{ const dx=p[0]-c[0], dy=p[1]-c[1], n=Math.hypot(dx,dy)||1;
    z+=`<circle cx="${gx(p[0])}" cy="${gy(p[1])}" r="4" class="${prime?"doto":"dot"}"/>`+TX(gx(p[0])+dx/n*14,gy(p[1])-dy/n*14+5,NM[i]+(prime?"′":""),lc||(prime?"lbo":"lbb")); });
  return z; }
function gridSVG(inner,focusable){ let z=`<rect x="0" y="0" width="${GW}" height="${GW}" fill="#fff"/>`;
  for(let i=-GR;i<=GR;i++){ z+=Ln(gx(i),gy(GR),gx(i),gy(-GR),"gl")+Ln(gx(-GR),gy(i),gx(GR),gy(i),"gl"); }
  z+=Ln(gx(-GR),gy(0),gx(GR),gy(0),"ax")+Ln(gx(0),gy(-GR),gx(0),gy(GR),"ax");
  for(let i=-GR;i<=GR;i++) if(i&&i%2===0) z+=TX(gx(i),gy(0)+14,sg(i),"lbs")+TX(gx(0)-4,gy(i)+4,sg(i),"lbs","end");
  z+=TX(gx(GR)-2,gy(0)-6,"x","lbi","end")+TX(gx(0)+6,gy(GR)+10,"y","lbi","start");
  return SV(GW,GW,focusable?t("gridLbl"):t("diagram"),z+inner,focusable?`tabindex="0" data-f="grid"`:"",focusable?"gridbox":""); }
const inG=p=>Math.abs(p[0])<=GR-1&&Math.abs(p[1])<=GR-1;
// A random triangle whose image under the transformation also fits on the grid.
function genTri(type,a,b,lim,even){
  for(let n=0;n<500;n++){ let P=[0,1,2].map(()=>[ri(-lim,lim),ri(-lim,lim)]); if(even) P=P.map(p=>[p[0]*2,p[1]*2]);
    const ar=Math.abs((P[1][0]-P[0][0])*(P[2][1]-P[0][1])-(P[2][0]-P[0][0])*(P[1][1]-P[0][1]));

}
function trDesc(type,a,b){ const pts=P=>"";
  if(type==="tr"){ const parts=[]; const U=n=>n===1?t("oneUnit",{n:M(1)}):t("nUnits",{n:M(n)});

function newTransform(){

const TRIPLES=[[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[12,16,20],[7,24,25],[15,20,25],[20,21,29]];
function triple(maxC){ const L=TRIPLES.filter(x=>x[2]<=maxC); const t_=rand(L.length?L:[TRIPLES[0]]); return Math.random()<.5?t_:[t_[1],t_[0],t_[2]]; }
// Right triangle (legs a horizontal, b vertical) with squares drawn outward on each side.
function sqTriSVG(a,b,k,lab){ const W=340,H=260, c=Math.hypot(a,b);
  const ext=[-b,a+b,-a,a+b], V=view(ext[0],ext[1],ext[2],ext[3],W-20,H-20,10,30);
  const O=[0,0], A=[a,0], B=[0,b]; let z="";
  if(k>0){ const op=f1(k); z+=PG(VP(V,[[0,0],[a,0],[a,-a],[0,-a]]),"sh2",`opacity="${op}"`)+PG(VP(V,[[0,0],[0,b],[-b,b],[-b,0]]),"sh4",`opacity="${op}"`)+PG(VP(V,[[a,0],[0,b],[b,a+b],[a+b,a]]),"sh3",`opacity="${op}"`);
    if(k>=.99){ z+=TX(V.X(a/2),V.Y(-a/2)+5,lab[3])+TX(V.X(-b/2),V.Y(b/2)+5,lab[4])+TX(V.X((a+b)/2),V.Y((a+b)/2)+5,lab[5]); } }
  z+=PG(VP(V,[O,A,B]),"sh1")+rightMark([V.X(0),V.Y(0)],[V.X(a),V.Y(0)],[V.X(0),V.Y(b)],10);
  z+=TX(V.X(a/2),V.Y(0)+(k>0?-6:18),lab[0])+TX(V.X(0)+(k>0?8:-8),V.Y(b/2)+5,lab[1],"lb",k>0?"start":"end")+TX(V.X(a/2)+10,V.Y(b/2)-6,lab[2],"lb","start");
  return SV(V.w,V.h,t("diagram"),z); }
// Visual proof: the same (a+b) square holding 4 copies of the triangle, rearranged by sliding.
function proofSVG(a,b,k){ const s=a+b, V=view(0,s,0,s,300,230,14,40);
  const T=[[[0,0],[a,0],[0,b]],[[a,0],[s,0],[s,a]],[[s,a],[s,s],[b,s]],[[b,s],[0,s],[0,b]]], mv=[[0,a],[0,0],[-b,0],[a,-b]];
  let z=`<rect x="${f1(V.X(0))}" y="${f1(V.Y(s))}" width="${f1(s*V.u)}" height="${f1(s*V.u)}" fill="#fff" class="ed"/>`;
  if(k<=.02) z+=PG(VP(V,[[a,0],[s,a],[b,s],[0,b]]),"sh3")+TX(V.X(s/2),V.Y(s/2)+6,"c²");
  if(k>=.98) z+=PG(VP(V,[[0,0],[a,0],[a,a],[0,a]]),"sh2")+PG(VP(V,[[a,a],[s,a],[s,s],[a,s]]),"sh4")+TX(V.X(a/2),V.Y(a/2)+6,"a²")+TX(V.X(a+b/2),V.Y(a+b/2)+6,"b²");
  T.forEach((tr,i)=>{ z+=PG(VP(V,tr.map(p=>[p[0]+mv[i][0]*k,p[1]+mv[i][1]*k])),"sh1"); });
  z+=TX(V.X(a/2),V.Y(0)+12,"a","lbi")+TX(V.X(a+b/2),V.Y(0)+12,"b","lbi");

  let ans, opts, good, hint, dir, kind=1, fmt;

    setWork(m); toggleBtn(m,"🔀 "+t("bProof"),()=>t("capProof"));
    good=tm("gSq",{e:M(`${a}² + ${b}² = ${a*a} + ${b*b} = ${S}`)});
    opts=[[(a+b)*(a+b),"hSqSum"],[a*b,null],[2*(a+b),null],[a*a+b,null]];
    dir=tm("dirSq",{a:M(a),b:M(b),a2:M(a*a),b2:M(b*b)});

    const cr=r1(c);
    if(type==="leg"){ ans=b; good=tm("gLeg",{e:M(`b² = ${c}² − ${a}² = ${c*c} − ${a*a} = ${c*c-a*a}`),r:M(`b = √${c*c-a*a} = ${b}`)});
      opts=[[r1(Math.hypot(a,c)),"hLegAdd"],[c-a,"hSubLen"],[c*c-a*a,"hNoRoot"],[c+a,null]]; hint="hLeg"; dir=tm("dirLeg",{a:M(a),c:M(c)}); }
    else { ans=exact?c:cr;

      opts=[[a+b,"hAddLegs"],[a*a+b*b,"hNoRoot"],[r1(Math.sqrt(Math.abs(a*a-b*b)))||a+1,"hSubSq"],[r1((a*a+b*b)/2),null]]; hint="hHyp";

        TX((gx(Pp[0])+gx(Qp[0]))/2,gy(Pp[1])+(sy>0?18:-8),dx,"lbo")+TX(gx(Qp[0])+(sx>0?8:-8),(gy(Pp[1])+gy(Qp[1]))/2+5,dy,"lbo",sx>0?"start":"end")+"</g>"; }
      z+=Ln(gx(Pp[0]),gy(Pp[1]),gx(Qp[0]),gy(Qp[1]),"ed")+`<circle cx="${gx(Pp[0])}" cy="${gy(Pp[1])}" r="5" class="dot"/><circle cx="${gx(Qp[0])}" cy="${gy(Qp[1])}" r="5" class="dot"/>`+
        TX(gx(Pp[0])-8,gy(Pp[1])-8,"P","lbb","end")+TX(gx(Qp[0])+8,gy(Qp[1])-8,"Q","lbb","start");

    opts=[[dx+dy,"hAddLegs"],[S,"hNoRoot"],[r1(Math.sqrt(Math.abs(dx*dx-dy*dy)))||dx+dy+1,"hSubSq"],[Math.max(dx,dy)+1,null]]; hint="hDist";

  initSettings();
  const f=firstMode();
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===f; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; b.classList.toggle("hidden",!settings.modes[b.dataset.mode]); });
  $$(".modepanel").forEach(p=>p.classList.toggle("hidden",p.id!=="mode-"+f));
  applyLang();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
</script>
<script>
/* Student mute toggle — shared across the Digital Math Tools. Self-contained,
   offline, stores no student data. Gates ALL speech by intercepting
   speechSynthesis.speak, so muting works regardless of each tool's internals.
   Reads the shared language preference only to localize its own label. */
(function(){
  "use strict";
  var LKEY='tcea.mathtools.lang', MKEY='tcea.mathtools.muted';
  var CODES=['en','es','vi','ar','hi','ur','zh'];
  var LAB={
    mute:{en:"Mute sound",es:"Silenciar sonido",vi:"Tắt âm thanh",ar:"كتم الصوت",hi:"आवाज़ बंद करें",ur:"آواز بند کریں",zh:"静音"},
    unmute:{en:"Turn sound on",es:"Activar sonido",vi:"Bật âm thanh",ar:"تشغيل الصوت",hi:"आवाज़ चालू करें",ur:"آواز چالو کریں",zh:"打开声音"}
  };
  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  window.__MT_MUTED = (get(MKEY)==='1');
  // Intercept every speech request; suppress while muted.
  try{
    if(window.speechSynthesis && typeof window.speechSynthesis.speak==='function'){
      var ss=window.speechSynthesis, orig=ss.speak.bind(ss);
      ss.speak=function(u){ if(!window.__MT_MUTED){ try{orig(u);}catch(e){} } };
    }
  }catch(e){}
  function curLang(){ var l=get(LKEY)||'en'; return LAB.mute[l]?l:'en'; }
  function label(el){
    var on=!window.__MT_MUTED, l=curLang(), txt=on?LAB.mute[l]:LAB.unmute[l];
    el.textContent=on?'🔊':'🔇';
    el.setAttribute('aria-label',txt); el.setAttribute('title',txt);
    el.setAttribute('aria-pressed', on?'false':'true');
  }
  function findLangSelect(){
    var sels=document.querySelectorAll('select');
    for(var i=0;i<sels.length;i++){ var o=sels[i].options, c=0;
      for(var j=0;j<o.length;j++){ if(CODES.indexOf((o[j].value||'').toLowerCase())>=0) c++; }
      if(c>=3) return sels[i];
    }
    return null;
  }
  function build(){
    if(document.getElementById('mtMuteBtn')) return;
    if(!(('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window))) return;
    var btn=document.createElement('button');
    btn.id='mtMuteBtn'; btn.type='button';
    btn.style.cssText='font:inherit;font-size:1.15rem;line-height:1;cursor:pointer;'+
      'min-width:44px;min-height:44px;padding:8px 12px;border:2px solid #e2dcf1;'+
      'border-radius:10px;background:#fff;color:#5b3fa5;font-weight:700;margin:0 4px;';
    btn.addEventListener('click',function(){
      window.__MT_MUTED=!window.__MT_MUTED;
      set(MKEY, window.__MT_MUTED?'1':'0');
      if(window.__MT_MUTED){ try{window.speechSynthesis.cancel();}catch(e){} }
      label(btn);
    });
    btn.addEventListener('focus',function(){btn.style.outline='3px solid #5b3fa5';btn.style.outlineOffset='2px';});
    btn.addEventListener('blur',function(){btn.style.outline='';});
    var sel=findLangSelect();
    if(sel && sel.parentNode){
      sel.parentNode.insertBefore(btn, sel);
      sel.addEventListener('change',function(){ setTimeout(function(){label(btn);},0); });
    }else{
      btn.style.position='fixed'; btn.style.top='10px'; btn.style.zIndex='9999';
      btn.style[(document.documentElement.dir==='rtl')?'left':'right']='10px';
      (document.body||document.documentElement).appendChild(btn);
    }
    label(btn);
  }
  if(document.readyState==='complete'){ build(); }
  else{ window.addEventListener('load', build); }
  window.addEventListener('storage',function(e){ if(e.key===LKEY){ var b=document.getElementById('mtMuteBtn'); if(b) label(b); } });
})();
</script>
