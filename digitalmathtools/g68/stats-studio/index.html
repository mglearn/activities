<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Stats Studio: Data Distributions — a Grades 6–8 statistics app: statistical questions, mean, median, MAD, box plots, histograms, random samples, comparing populations, scatterplots, trend lines and two-way tables. Works offline. No data collected.">
<title>Stats Studio: Data Distributions</title>
<style>
  :root{
    --bg:#edf2f6;--panel:#ffffff;--ink:#14212d;--muted:#46576a;--line:#c5d4e0;
    --accent:#1a5276;--accentD:#123a54;--accent-ink:#ffffff;--good:#166534;--good-bg:#dcfce7;
    --hint:#7a4a00;--hint-bg:#fff4d6;--focus:#0a58ca;--tgt:#d35400;--c2:#d35400;--dot:#2471a3;
    --tap:48px;font-size:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-text-size-adjust:100%}
  h1,h2,h3{line-height:1.15;margin:0 0 .3em}
  button{font-family:inherit;font-size:1rem;cursor:pointer}
  button:disabled{cursor:default}

  .topbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--accentD);color:var(--accent-ink);padding:.55rem .8rem}
  .topbar .brand{font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:.4rem;margin-inline-end:auto}
  .topbar a.homebtn,.topbar button.tb{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.4rem .7rem;min-height:var(--tap);min-width:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:.35rem;text-decoration:none;font-weight:700;font-size:.95rem}
  .globe{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.2rem .5rem;min-height:var(--tap)}
  .globe span{font-size:1.2rem}
  .globe select{border:0;background:#fff;color:var(--ink);border-radius:8px;min-height:44px;font-weight:700;font-size:1rem;padding:.2rem .4rem}

  main{max-width:1200px;margin:0 auto;padding:.7rem}
  .tabsrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 .7rem}
  .tabs{display:flex;gap:.4rem;flex-wrap:wrap;flex:1 1 auto}
  .tabs button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.45rem .75rem;min-height:var(--tap);font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:.4rem}
  .tabs button[aria-selected="true"]{background:var(--accentD);color:#fff;border-color:var(--accentD)}
  .tabs button .ic{font-size:1.15rem}
  .stars{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.4rem .8rem;font-weight:800;font-size:1.1rem;min-height:48px;display:inline-flex;align-items:center;gap:.3rem}
  .stars.pop{animation:pop .5s ease}
  @keyframes pop{50%{transform:scale(1.15)}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:.9rem;margin-bottom:.8rem}
  .panelhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
  .panelhead h2{margin:0;font-size:1.25rem;margin-inline-end:auto}

  .prompt{display:flex;align-items:center;gap:.6rem;background:#e8f0f6;border:2px solid #b5cde0;border-radius:14px;padding:.6rem .8rem;margin-bottom:.7rem;font-size:1.08rem;font-weight:600;line-height:1.75}
  .speaker{background:var(--accentD);color:#fff;border:0;border-radius:50%;width:var(--tap);height:var(--tap);min-width:var(--tap);font-size:1.3rem;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}

  .btn{background:var(--accentD);color:#fff;border:2px solid var(--accentD);border-radius:12px;padding:.5rem .85rem;min-height:var(--tap);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
  .btn.ghost{background:var(--panel);color:var(--accentD)}
  .btn:disabled{opacity:.45}

  .feedback{margin-top:.6rem;border-radius:12px;padding:.6rem .8rem;font-weight:600;display:none;line-height:1.8}
  .feedback.show{display:block}
  .feedback.good{background:var(--good-bg);color:var(--good);border:2px solid #86efac}
  .feedback.hint{background:var(--hint-bg);color:var(--hint);border:2px solid #f6d271}

  .math{unicode-bidi:isolate;direction:ltr;display:inline;font-weight:800;white-space:nowrap}
  .math.wr{white-space:normal}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:800;margin:0 .08em;white-space:nowrap;font-size:.9em}
  .fr>span{padding:0 .16em}
  .fr>span:first-child{border-bottom:.12em solid currentColor}

  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-top:.7rem}
  .choices:empty{display:none}
  .choices.wide{grid-template-columns:minmax(0,1fr)}
  @media (min-width:700px){ .choices.wide{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .choice{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:.5rem .7rem;min-height:60px;display:flex;align-items:center;justify-content:center;position:relative;font-size:1.25rem;font-weight:800;color:var(--ink)}
  .choice .lbl{unicode-bidi:isolate;direction:ltr}
  .choice.txt{font-size:1.02rem;font-weight:700;text-align:start;justify-content:flex-start;line-height:1.35}
  .choice.txt .lbl{direction:inherit}
  .choice.correctpick{border-color:var(--good);background:var(--good-bg)}
  .choice.wrongpick{border-color:#e3b341;background:var(--hint-bg);opacity:.75}
  .choice .badge{position:absolute;top:4px;inset-inline-end:6px;font-size:1rem;display:none}
  .choice.correctpick .badge{display:block}

  .work:empty{display:none}
  .ctitle{font-weight:800;margin:.1rem 0 .4rem;text-align:center}
  .pw{width:100%;max-width:560px;margin:0 auto}
  .np{width:100%;height:auto;display:block;background:#fff;border:2px solid var(--line);border-radius:12px}
  .np.lv{touch-action:none;cursor:pointer}
  .np:focus{outline:none}
  .np:focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  .axl{stroke:#1b2a38;stroke-width:2.2}
  .tk{stroke:#1b2a38;stroke-width:1.6}
  .tl{font:600 14px system-ui,sans-serif;fill:#3c4c5c}
  .gt{font:800 15px system-ui,sans-serif;fill:#14212d}
  .gl{stroke:#e1e9f0;stroke-width:1}
  .dot{fill:var(--dot);stroke:#fff;stroke-width:1.5}
  .dot.b{fill:var(--c2)}
  .dot.out{fill:#c0392b}
  .dot.rev{fill:#16a34a}
  .dot.sel{stroke:#14212d;stroke-width:3.5}
  .np:not(:focus-visible) .dot.kb{stroke:#fff;stroke-width:1.5}
  .din{font:800 11px system-ui,sans-serif;fill:#fff;pointer-events:none}
  .medl{stroke:#7d3c98;stroke-width:3;stroke-dasharray:7 5}
  .meanl{stroke:var(--tgt);stroke-width:3;stroke-dasharray:7 5}
  .mkt{font:800 14px system-ui,sans-serif;paint-order:stroke;stroke:#fff;stroke-width:4}
  .mkt.med{fill:#6c3483}
  .mkt.mean{fill:#a04000}
  .fulc{fill:var(--tgt)}
  .seg{stroke:#16a34a;stroke-width:3}
  .bx line{stroke:#14212d;stroke-width:3}
  .bx rect{fill:rgba(36,113,163,.18);stroke:#14212d;stroke-width:3}
  .bx.b rect{fill:rgba(211,84,0,.18)}
  .bx .bm{stroke:#7d3c98;stroke-width:4}
  .hd{fill:#fff;stroke:var(--accent);stroke-width:4}
  .hd.sel{fill:#fde68a;stroke:#14212d}
  .hdl{font:800 14px system-ui,sans-serif;fill:#14212d}
  .vl{font:700 13px system-ui,sans-serif;fill:#14212d}
  .bar{fill:var(--dot);stroke:#0e3a57;stroke-width:1.5}
  .bar.sel{stroke:#14212d;stroke-width:3.5;fill:#3b8dc4}
  .bcol{fill:transparent}
  .sp{fill:var(--dot);stroke:#fff;stroke-width:1.5}
  .sp.sel{stroke:#14212d;stroke-width:3.5}
  .sp.bad{fill:#e3a008}
  .sp.hit{fill:#c0392b}
  .tln{stroke:var(--tgt);stroke-width:4;stroke-linecap:round}
  .res{stroke:#7d3c98;stroke-width:2;stroke-dasharray:4 3}
  .cell{fill:#c9d3dc}
  .cell.y{fill:var(--dot)}
  .cell.n{fill:#f5b041}
  .cell.dim{opacity:.55}
  .cell.hl{stroke:#14212d;stroke-width:2.5}

  .readout{font-weight:700;text-align:center;line-height:1.9;min-height:1.9em;margin:.3rem 0}
  .acts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;margin:.5rem 0}
  .acts:empty{display:none}
  .qcard{font-size:1.25rem;font-weight:700;font-style:italic;text-align:center;background:#f5f9fc;border:2px dashed #b5cde0;border-radius:14px;padding:.8rem 1rem;margin:.2rem auto;max-width:700px}
  .goal{font-weight:700;background:#f5f9fc;border:2px dashed #b5cde0;border-radius:14px;padding:.6rem .9rem;max-width:760px;margin:0 auto}
  .chips{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;margin:.2rem 0 .5rem;direction:ltr}
  .chips span{background:#eef4f9;border:2px solid #b5cde0;border-radius:10px;padding:.15rem .5rem;font-weight:800;min-width:2.2rem;text-align:center}
  .legend{display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center;font-weight:700;font-size:.92rem;margin:.3rem 0}
  .legend i{display:inline-block;width:16px;height:16px;border-radius:4px;vertical-align:middle;margin-inline-end:.3rem}
  .twocol{display:grid;grid-template-columns:minmax(0,1fr);gap:.7rem;align-items:start}
  @media (min-width:860px){ .twocol{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }

  .stacks{display:flex;gap:.45rem;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:.3rem 0}
  .stack{background:#fff;border:3px solid var(--line);border-radius:14px;min-width:56px;min-height:60px;padding:.35rem .3rem .25rem;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.25rem;color:var(--ink)}
  .stack.sel{border-color:var(--tgt);background:#fff5ec}
  .stack .cubes{display:flex;flex-direction:column-reverse;gap:2px}
  .stack .cubes i{display:block;width:36px;height:21px;border-radius:4px;background:var(--dot);border:1px solid #0e3a57}
  .stack b{font-size:1.1rem}

  table.tw{border-collapse:collapse;margin:.3rem auto;font-weight:700;font-size:1.05rem}
  table.tw caption{font-weight:800;margin-bottom:.35rem}
  table.tw th,table.tw td{border:2px solid #9fbcd6;padding:.4rem .65rem;text-align:center}
  table.tw th{background:#eaf3fa}
  table.tw td.tot,table.tw th.tot{background:#f5f9fc;color:#33475b}

  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:1rem}
  .drawer.open{display:flex}
  .drawer .card{background:var(--panel);border-radius:16px;max-width:600px;width:100%;padding:1rem;max-height:90vh;overflow:auto}
  .setrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0;padding:.5rem 0;border-bottom:1px solid var(--line)}
  .setrow .lab{font-weight:700;min-width:150px}
  .toggle{display:inline-flex;align-items:center;gap:.35rem;border:2px solid var(--line);border-radius:10px;padding:.35rem .55rem;background:#fff;min-height:44px}
  .toggle input{width:22px;height:22px}
  select.diff{font-size:1rem;padding:.4rem;border-radius:10px;border:2px solid var(--line);min-height:48px;max-width:100%}
  .wrapflex{display:flex;flex-wrap:wrap;gap:.4rem}

  footer{max-width:1200px;margin:.5rem auto 2rem;padding:.8rem;color:var(--muted);font-size:.9rem;text-align:center}
  footer a{color:var(--accentD);font-weight:700}
  .stds bdi{white-space:nowrap}
  .stds{font-size:.82rem;color:var(--muted);background:#f5f9fc;border:1px dashed var(--line);border-radius:12px;padding:.5rem .7rem;margin-top:.4rem}

  .hidden{display:none !important}
  :focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  @media (max-width:480px){ :root{font-size:16.5px} main{padding:.5rem} .panel{padding:.6rem} .tabs button{padding:.4rem .5rem;font-size:.9rem} .stack{min-width:44px} .stack .cubes i{width:26px;height:15px} table.tw th,table.tw td{padding:.3rem .4rem} .qcard{font-size:1.1rem} }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

  .printonly{display:none}
  @media print{
    .topbar,.tabsrow,footer,.modepanel,#stdsNote,.no-print,#mtMuteBtn{display:none !important}
    body{background:#fff}
    .printonly{display:block}
    .card-print{border:2px solid #000;border-radius:12px;padding:1rem;margin:0 0 1rem;page-break-inside:avoid}
    .card-print h2{margin:.2rem 0}
    .card-print svg.np{max-width:420px;border:1px solid #000}
    main{max-width:100%}
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">📊 <span data-t="appTitle">Stats Studio: Data Distributions</span></span>
  <a class="homebtn" href="../../index.html">🏠 <span data-t="home">Home</span></a>
  <label class="globe"><span aria-hidden="true">🌐</span>
    <select id="langSelect" aria-label="Language / Idioma"></select>
  </label>
  <button class="tb settingsbtn" id="openSettings" type="button">⚙️ <span data-t="teacher">Teacher</span></button>
</header>

<main>
  <div class="tabsrow">
    <div class="tabs" id="tabs" role="tablist" data-ta="modesLbl" aria-label="Modes"></div>
    <span class="stars" id="stars"><span aria-hidden="true">✔</span><span class="sr" data-t="stars">Correct answers</span> <b id="starCount">0</b></span>
  </div>
  <div id="panels"></div>
  <div class="stds" id="stdsNote"></div>
  <div class="printonly" id="printArea"></div>
</main>

<footer>
  <p data-t="footNote">No accounts · No data collected · Works offline</p>
  <p><a href="../../index.html" data-t="home">Home</a> · <a href="../../policy.html" data-t="privacy">Privacy</a></p>
</footer>

<!-- SETTINGS -->
<div class="drawer" id="settingsDrawer" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="card">
    <div class="panelhead"><h2 id="setTitle" data-t="teacherTitle">Teacher settings</h2>
      <button class="btn ghost" id="closeSettings" type="button" data-t="close">Close</button></div>
    <div class="setrow"><label class="lab" for="setGrade" data-t="setGrade">Grade level</label>
      <select class="diff" id="setGrade">
        <option value="6" data-t="g6">Grade 6</option>
        <option value="7" data-t="g7">Grade 7</option>
        <option value="8" data-t="g8">Grade 8</option></select>
      <p class="stds" style="margin:0;flex:1 1 100%" data-t="gradeNote"></p></div>
    <div class="setrow"><label class="lab" for="setSize" data-t="setSize">Data set size</label>
      <select class="diff" id="setSize">
        <option value="s" data-t="sizeS">Small</option>
        <option value="m" data-t="sizeM">Medium</option>
        <option value="l" data-t="sizeL">Large</option></select></div>
    <div class="setrow"><span class="lab" data-t="setNums">Numbers</span>
      <label class="toggle"><input type="checkbox" id="setDec"> <span data-t="decOn">Means and MADs in tenths</span></label></div>
    <div class="setrow"><span class="lab" data-t="setModes">Modes</span>
      <div id="modeToggles" class="wrapflex"></div></div>
    <div class="setrow"><span class="lab" data-t="setSpeech">Speech</span>
      <label class="toggle"><input type="checkbox" id="setAuto"> <span data-t="autoRead">Auto-read directions</span></label></div>
    <div class="setrow" style="border:0"><button class="btn" id="printCards" type="button">🖨 <span data-t="printCards">Print challenge cards</span></button></div>
    <p class="stds" data-t="setStored">Settings are saved only on this device. No student information is ever stored.</p>
  </div>
</div>

<script>

/* =========================================================================
   Stats Studio: Data Distributions — single-file Grades 6–8 statistics app.
   7 languages. No frameworks, no network, no data collection.
   ========================================================================= */

let lang = "en";
function t(key, vars){
  let s = (T[lang] && T[lang][key]!==undefined) ? T[lang][key] : (T.en[key]!==undefined? T.en[key] : key);
  if(vars) for(const k in vars) s = s.replaceAll("{"+k+"}", vars[k]);
  return s;
}

/* ---------- Settings ---------- */
const MODES = ["center","spread","sample","compare","bivar"];
const MODE_KEY = {center:"mCenter",spread:"mSpread",sample:"mSample",compare:"mCompare",bivar:"mBivar"};
const MODE_IC = {center:"⚖️",spread:"📦",sample:"🎯",compare:"🆚",bivar:"📈"};
const GRADES = { 6:{size:"s",dec:false}, 7:{size:"m",dec:true}, 8:{size:"m",dec:true} };
const clone = o=>JSON.parse(JSON.stringify(o));
const DEFAULTS = {grade:7, size:"m", dec:true, modes:{center:true,spread:true,sample:true,compare:true,bivar:true}, autoRead:false};
let settings = loadSettings();
function loadSettings(){
  try{
    const raw = localStorage.getItem("sst_settings");
    if(raw){ const o=JSON.parse(raw), s=Object.assign(clone(DEFAULTS), o, {modes:Object.assign({},DEFAULTS.modes,o.modes)});
      if(!GRADES[s.grade]) s.grade=DEFAULTS.grade; s.grade=+s.grade;
      if(!["s","m","l"].includes(s.size)) s.size=GRADES[s.grade].size; s.dec=!!s.dec; s.autoRead=!!s.autoRead;
      if(!MODES.some(m=>s.modes[m])) s.modes=clone(DEFAULTS.modes);
      return s; }
  }catch(e){}
  return clone(DEFAULTS);
}
function saveSettings(){ try{ localStorage.setItem("sst_settings", JSON.stringify(settings)); }catch(e){} }

const ri = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const range = (a,b)=>{ const o=[]; for(let i=a;i<=b;i++) o.push(i); return o; };
const sum = a=>a.reduce((x,y)=>x+y,0);
const mean = a=>sum(a)/a.length;
const srt = a=>a.slice().sort((x,y)=>x-y);

const r1 = v=>Math.round(v*10)/10;
const fmt = v=>{ v=Math.round(v*100)/100; return (v<0?"−":"")+Math.abs(v); };
const clampR = (v,a,b)=>Math.max(a,Math.min(b,Math.round(v)));

/* ---------- Messages: shown {h} and spoken {s} ---------- */
const isRTL = ()=>(LANGS.find(x=>x.code===lang)||{}).dir==="rtl";
function rtlFix(str){ if(!isRTL()) return str;
  return str.replace(/[A-Za-z0-9({][A-Za-z0-9(){},.÷×=+−\- ]*[A-Za-z0-9)}]/g,r=>/[=÷×−]|\(\w+, \w+\)/.test(r)?`<bdi dir="ltr">${r}</bdi>`:r); }
function tm(key,vars){ const h={},s={}; vars=vars||{};
  for(const k in vars){ const v=vars[k]; if(v&&typeof v==="object"){ h[k]=v.h.indexOf("<bdi")===0||v.raw?v.h:M(v.h); s[k]=v.s; } else { h[k]=v; s[k]=v; } }
  return {h:rtlFix(t(key)).replace(/\{(\w+)\}/g,(m0,k)=>k in h?h[k]:m0), s:t(key,s), raw:1};
}
const cat = (...m)=>({h:m.map(x=>x.h).join(" "), s:m.map(x=>x.s).join(" ")});
const TX = k=>({h:rtlFix(t(k)), s:t(k), raw:1});
const cap = s=>s.charAt(0).toUpperCase()+s.slice(1);
const RW = k=>({h:esc(t(k)), s:t(k), raw:1});   // plain translated words used inside other messages
const ex = (h,s)=>({h,s});
const dvE = (a,b,c)=>ex(`${fmt(a)} ÷ ${fmt(b)} = ${fmt(c)}`, `${fmt(a)} ${t("wDiv")} ${fmt(b)} ${t("wEq")} ${fmt(c)}`);
const sbE = (a,b,c)=>ex(`${fmt(a)} − ${fmt(b)} = ${fmt(c)}`, `${fmt(a)} ${t("wMinus")} ${fmt(b)} ${t("wEq")} ${fmt(c)}`);
const frE = (n,d)=>ex(frH(n,d), t("frSay",{n,d}));

const lsE = a=>ex(a.map(fmt).join(", "), a.map(fmt).join(", "));
function eqE(m,b){ const mm=r1(m), bb=r1(b), h=`y = ${fmt(mm)}x ${bb<0?"−":"+"} ${fmt(Math.abs(bb))}`; return ex(h, h.replace("−","-")); }

const CTX = { sleep:{lo:4,hi:12,e:"😴"}, plant:{lo:6,hi:22,e:"🌱"}, game:{lo:8,hi:24,e:"🎮"}, travel:{lo:4,hi:20,e:"🚌"}, books:{lo:0,hi:12,e:"📚"}, temp:{lo:18,hi:34,e:"🌡️"} };
const CK = Object.keys(CTX);
function ctitle(ck,n){ return `<p class="ctitle">${CTX[ck].e} ${esc(t("cx_"+ck))} (${esc(t("u_"+ck))})${n?" · "+esc(t("nVals",{n})):""}</p>`; }
function genVals(lo,hi,n,wf){ const sp=hi-lo, ctr=lo+sp*(.35+Math.random()*.3), w=sp*(wf||.42);
  return Array.from({length:n},()=>clampR(ctr+(Math.random()+Math.random()-1)*w,lo,hi)); }
function niceMean(V,lo,hi,d){ const n=V.length, ok=s=>d?(s*10)%n===0:s%n===0;
  for(let k=0;k<400&&!ok(sum(V));k++){ const i=ri(0,n-1), e=rand([1,-1]); if(V[i]+e>=lo&&V[i]+e<=hi) V[i]+=e; } return V; }

/* ---------- SVG: number line, dot plot, box plot ---------- */
const PW=440, PX0=26, PX1=414;
const sx = (lo,hi)=>v=>+(PX0+(v-lo)/(hi-lo)*(PX1-PX0)).toFixed(1);
const ix = (lo,hi)=>x=>lo+(x-PX0)/(PX1-PX0)*(hi-lo);
const lstep = sp=>sp<=14?1:sp<=30?2:sp<=70?5:10;
const cxl = x=>Math.max(52,Math.min(PW-52,x));
function gAxis(lo,hi,y){ const X=sx(lo,hi), ls=lstep(hi-lo), tk=hi-lo>40?ls:1;
  let s=`<line class="axl" x1="${PX0-14}" x2="${PX1+14}" y1="${y}" y2="${y}"/>`;
  for(let v=Math.ceil(lo/tk)*tk; v<=hi; v+=tk){ const lab=v%ls===0;
    s+=`<line class="tk" x1="${X(v)}" x2="${X(v)}" y1="${y-(lab?7:4)}" y2="${y+(lab?7:4)}"/>`;
    if(lab) s+=`<text class="tl" x="${X(v)}" y="${y+24}" text-anchor="middle">${v}</text>`; }
  return s; }
// o: {lo,hi,V,step,cls(i),inner(i),mean,median,meanLine,minRows,title,segs,after(X,H)}
function dotPlot(o){
  const X=sx(o.lo,o.hi), u=(PX1-PX0)/(o.hi-o.lo)*(o.step||1), r=Math.max(4.5,Math.min(9.5,u/2-1)), dy=2*r+2;
  const idx=o.V.map((v,i)=>i).sort((a,b)=>o.V[a]-o.V[b]||a-b), cnt={}; let mx=0; const P=[];
  idx.forEach(i=>{ const v=o.V[i], j=cnt[v]=(cnt[v]||0)+1; mx=Math.max(mx,j); P[i]=[X(v),0,j-1]; });
  const top=(o.title?24:6)+(o.median!=null||o.meanLine!=null?26:4), rows=Math.max(mx,o.minRows||3), AY=top+rows*dy+6;
  P.forEach(p=>p[1]=+(AY-r-3-p[2]*dy).toFixed(1));
  let s=o.title?gTitle(o.title,18):"";
  if(o.median!=null){ const x=X(o.median); s+=`<line class="medl" x1="${x}" x2="${x}" y1="${top-6}" y2="${AY}"/><text class="mkt med" x="${cxl(x)}" y="${top-10}" text-anchor="middle">${esc(t("medW"))} ${fmt(o.median)}</text>`; }
  if(o.meanLine!=null){ const x=X(o.meanLine); s+=`<line class="meanl" x1="${x}" x2="${x}" y1="${top-6}" y2="${AY}"/><text class="mkt mean" x="${cxl(x)}" y="${top-10}" text-anchor="middle">${esc(t("meanW"))} ${fmt(o.meanLine)}</text>`; }
  if(o.segs) s+=o.segs(P,X);
  P.forEach((p,i)=>{ s+=`<circle class="${o.cls?o.cls(i):"dot"}" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="${r}"/>`;
    const tx=o.inner?o.inner(i):""; if(tx!=="") s+=`<text class="din" x="${p[0]}" y="${p[1]+4}" text-anchor="middle">${tx}</text>`; });
  s+=gAxis(o.lo,o.hi,AY);
  let H=AY+32;
  if(o.mean!=null){ const x=X(o.mean); s+=`<path class="fulc" d="M${x} ${AY+30}l-11 17h22z"/><text class="mkt mean" x="${cxl(x)}" y="${AY+64}" text-anchor="middle">▲ ${esc(t("meanW"))} ${fmt(r1(o.mean))}</text>`; H=AY+72; }
  if(o.after){ const a=o.after(X,H); s+=a.s; H=a.h; }
  return {vb:`0 0 ${PW} ${H}`, inner:s, P, X, r, AY, H};
}
// Group titles inside SVGs: right-aligned and right-to-left in Arabic/Urdu.
function gTitle(txt,y){ return isRTL()?`<text class="gt" x="${PW-8}" y="${y}" text-anchor="start" direction="rtl">${esc(txt)}</text>`:`<text class="gt" x="8" y="${y}">${esc(txt)}</text>`; }
function gBox(X,f,cy,cls){ const [a,b,c,d,e]=f.map(X), q1=Math.min(b,d), q3=Math.max(b,d), lo=Math.min(a,e), hi=Math.max(a,e);
  return `<g class="bx ${cls||""}"><line x1="${lo}" x2="${q1}" y1="${cy}" y2="${cy}"/><line x1="${q3}" x2="${hi}" y1="${cy}" y2="${cy}"/>`+
    `<line x1="${a}" x2="${a}" y1="${cy-12}" y2="${cy+12}"/><line x1="${e}" x2="${e}" y1="${cy-12}" y2="${cy+12}"/>`+
    `<rect x="${q1}" y="${cy-20}" width="${Math.max(0,q3-q1)}" height="40"/><line class="bm" x1="${c}" x2="${c}" y1="${cy-20}" y2="${cy+20}"/></g>`; }
function gVals(X,f,cy){ return f.map((v,i)=>`<text class="vl" x="${X(v)}" y="${i%2?cy+38:cy-27}" text-anchor="middle">${fmt(v)}</text>`).join(""); }
// rows: [{f,lab,cls}]
function boxesSVG(lo,hi,rows,vals){ const X=sx(lo,hi); let s="", y=0;
  rows.forEach(r=>{ if(r.lab) s+=gTitle(r.lab,y+18); const cy=y+(r.lab?66:48); s+=gBox(X,r.f,cy,r.cls)+(vals?gVals(X,r.f,cy):""); y=cy+48; });
  s+=gAxis(lo,hi,y+4); return {vb:`0 0 ${PW} ${y+38}`, inner:s, X}; }
function svgPt(svg,e){ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
function svgEl(id,d,label,live){ return `<div class="pw" dir="ltr"><svg class="np${live?" lv":""}" id="${id}" viewBox="${d.vb}" ${live?`tabindex="0" role="application"`:`role="img"`} aria-label="${esc(label)}">${d.inner}</svg></div>`; }
function paint(id,d){ const sv=$("#"+id); if(!sv) return; sv.setAttribute("viewBox",d.vb); sv.innerHTML=d.inner; }
// Pointer + keyboard wiring on an interactive SVG wrapper (survives repaints).
function live(m,el,o){
  el.addEventListener("pointerdown",e=>{ const svg=el.querySelector("svg"); if(!svg||!st[m]||st[m].done||!o.down) return;
    if(o.down(svgPt(svg,e))===false) return; e.preventDefault();
    if(!o.move) return;
    const mv=ev=>{ const s2=el.querySelector("svg"); if(s2&&!st[m].done) o.move(svgPt(s2,ev)); };
    const up=()=>{ removeEventListener("pointermove",mv); removeEventListener("pointerup",up); removeEventListener("pointercancel",up); };
    addEventListener("pointermove",mv); addEventListener("pointerup",up); addEventListener("pointercancel",up); });
  if(o.key) el.addEventListener("keydown",e=>{ if(!st[m]||st[m].done) return; if(o.key(e)) e.preventDefault(); });
}

/* ---------- Speech ---------- */
const speechOK = ("speechSynthesis" in window);
function bcpFor(l){ const m=LANGS.find(x=>x.code===l); return m?m.bcp:"en-US"; }
function pickWarmVoice(code){
  const vs = speechSynthesis.getVoices()||[];
  const want=code.toLowerCase(), two=want.slice(0,2);
  let best=null, bs=-1;
  for(const v of vs){
    const lc=(v.lang||'').toLowerCase().replace('_','-');
    if(lc!==want && lc.slice(0,2)!==two) continue;
    let s=(lc===want?100:60); const n=(v.name||'').toLowerCase();
    if(/google|natural|neural|online|premium|enhanced|siri/.test(n)) s+=40;
    if(/female|woman|samantha|karen|tessa|moira|fiona|serena|victoria|allison|ava|susan|zoe|amelie|amélie|paulina|monica|mónica|zira|hazel|catherine|linda|kanya|lekha|ting-ting|mei-jia|sin-ji|yu-shu|huihui|xiaoxiao/.test(n)) s+=18;
    if(/espeak|compact|festival|pico|robot|eloquence/.test(n)) s-=60;
    if(v.localService===false) s+=8;
    if(v.default) s+=2;
    if(s>bs){ bs=s; best=v; }
  }
  return best;
}
/* Speech queue. Fixes cut-off audio:
   - a new round no longer calls cancel() over the praise; rounds advance on onend
   - long text is split into sentences (Chrome stops utterances after ~15 s)
   - utterances are kept referenced so Chrome can't garbage-collect them mid-speech
   - after cancel(), the next speak() waits a beat (Chrome drops it otherwise) */
let speechGen=0, speechKeep=[], speechPendingDone=null, speechStarted=false;
function splitSpeech(text){
  const parts=String(text).match(/[^.!?。！？؟।۔]+[.!?。！？؟।۔]*\s*/g)||[text];
  return parts.map(x=>x.trim()).filter(Boolean);
}
function speechEstimateMs(text){ const per=/^(zh)$/.test(lang)?300:95; return 1200+String(text).length*per/0.9; }
function stopSpeech(){
  speechGen++; const d=speechPendingDone; speechPendingDone=null; speechKeep=[];
  if(speechOK){ try{ speechSynthesis.cancel(); }catch(e){} }
  if(d) setTimeout(d,0);
}
function speak(text,onDone){
  const prevDone=speechPendingDone; speechPendingDone=null;
  const gen=++speechGen; let fired=false;
  const done=()=>{ if(fired) return; fired=true; if(speechPendingDone===done) speechPendingDone=null; if(onDone) onDone(); };
  if(onDone) speechPendingDone=done;
  if(prevDone) setTimeout(prevDone,0);  // a superseded speech still lets its round advance
  if(!speechOK || !text || window.__MT_MUTED){ if(onDone) setTimeout(done,700); return; }
  let busy=false;
  try{ busy=speechSynthesis.speaking||speechSynthesis.pending; speechSynthesis.cancel(); }catch(e){}
  const parts=splitSpeech(text), bcp=bcpFor(lang), voice=pickWarmVoice(bcp);
  const start=()=>{
    if(gen!==speechGen) return;
    speechKeep=[];
    try{
      if(speechSynthesis.paused) speechSynthesis.resume();
      parts.forEach((p,i)=>{
        const u=new SpeechSynthesisUtterance(p);
        u.lang=bcp; if(voice) u.voice=voice; u.rate=0.9; u.pitch=1.15;
        u.onstart=()=>{ speechStarted=true; };
        if(i===parts.length-1){ u.onend=done; u.onerror=done; }
        speechKeep.push(u); speechSynthesis.speak(u);
      });
    }catch(e){ done(); }
  };
  if(busy) setTimeout(start,120); else start();
  // Safety net: some engines never fire onend.
  if(onDone) setTimeout(done,speechEstimateMs(text)+2500);
}
/* Speak praise, then start the next round once it finishes (never sooner than minMs). */
const roundIds={center:0,spread:0,sample:0,compare:0,bivar:0};
function afterPraise(msg,key,next,minMs){
  const id=roundIds[key], t0=Date.now();
  speak(msg,()=>{
    const wait=Math.max(450,(minMs||1200)-(Date.now()-t0));
    setTimeout(()=>{ if(roundIds[key]===id) next(); },wait);
  });
}
if(speechOK){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>{}; }catch(e){} }
if(!speechOK){ document.addEventListener("DOMContentLoaded",()=>$$(".speaker").forEach(b=>b.style.display="none")); }

const currentSpeech = {center:"",spread:"",sample:"",compare:"",bivar:""};
function setSpeech(mode,text){ currentSpeech[mode]=text; }
// Only auto-read for the panel that is on screen (rounds can refresh in the background).
function maybeAuto(mode){ if(settings.autoRead && currentMode()===mode) speak(currentSpeech[mode]); }
// Browsers block speech until the first tap; read the directions then if nothing has played yet.
document.addEventListener("pointerdown",function firstTap(e){
  document.removeEventListener("pointerdown",firstTap,true);
  if(speechStarted || !settings.autoRead) return;
  if(e.target.closest("button,select,a,input,svg.np")) return;
  speak(currentSpeech[currentMode()]);
},true);

/* ---------- Feedback & round helpers ---------- */
function showFb(el,type,msg){ el.className="feedback show "+type; el.innerHTML=(type==="good"?"✅ ":"💡 ")+msg; }
function hideFb(el){ el.className="feedback"; el.innerHTML=""; }
const made={}, st={};
window.__sst=st;
function startRound(m){ roundIds[m]++; made[m]=true; st[m]={done:false};
  ["w","a","c"].forEach(p=>{ $("#"+p+"-"+m).innerHTML=""; }); $("#c-"+m).classList.remove("wide"); hideFb($("#f-"+m)); }
function setPrompt(m,msg){ $("#p-"+m).innerHTML=msg.h; setSpeech(m,msg.s); }
function win(m,msg){ if(st[m].done) return; st[m].done=true;
  $$(`#c-${m} button,#a-${m} button,#w-${m} button`).forEach(b=>b.disabled=true);
  $$(`#w-${m} svg[tabindex]`).forEach(s=>s.removeAttribute("tabindex"));
  addStar(); showFb($("#f-"+m),"good",msg.h); afterPraise(msg.s,m,NEWFN[m],2000); }
function nope(m,msg){ showFb($("#f-"+m),"hint",msg.h); speak(msg.s); }
function step(m,msg){ showFb($("#f-"+m),"good",msg.h); speak(msg.s); }
function actBtn(m,html,fn,cls){ const b=document.createElement("button"); b.type="button"; b.className="btn"+(cls?" "+cls:""); b.innerHTML=html;
  b.addEventListener("click",fn); $("#a-"+m).appendChild(b); return b; }
function checkBtn(m,fn){ return actBtn(m,"✔ "+esc(t("check")),fn); }
// Choice buttons. pick(item) is called for every tap; wrong picks are greyed out.
function choices(m,items,pick){
  const g=$("#c-"+m); g.innerHTML=""; g.classList.toggle("wide",items.some(it=>it.txt&&it.s.length>34));
  st[m].items=items;
  items.forEach(it=>{ const b=document.createElement("button"); b.type="button"; b.className="choice"+(it.txt?" txt":"");
    b.innerHTML=`<span class="badge" aria-hidden="true">✅</span><span class="lbl">${it.txt?it.h:M(it.h)}</span>`; b.setAttribute("aria-label",it.s);
    b.addEventListener("click",()=>{ if(st[m].done) return; if(it.ok) b.classList.add("correctpick"); else { b.classList.add("wrongpick"); b.disabled=true; } pick(it,b); });
    g.appendChild(b); });
}
const TCH = (k,ok,vars)=>({...(vars?tm(k,vars):TX(k)),ok,txt:true});
// Four distinct numeric choices; candidates first, then neighbours.
function numCh(ans,cands,pct){ const f=v=>fmt(v)+(pct?"%":""), o=[{h:f(ans),s:f(ans),ok:true,v:ans}], seen=[f(ans)];
  const add=v=>{ if(o.length>=4||!isFinite(v)||v<0||(pct&&v>100)) return; v=r1(v); const k=f(v); if(seen.includes(k)) return; seen.push(k); o.push({h:k,s:k,ok:false,v}); };
  cands.forEach(add); for(let d=1;o.length<4&&d<60;d++){ add(ans+d*(pct?5:1)); add(ans-d*(pct?5:1)); }
  return shuffle(o); }
function pickNum(m,ans,cands,good,hint,pct){
  choices(m,numCh(ans,cands,pct),it=>{ if(it.ok) return win(m,good); nope(m,cat(tm("youPicked",{x:it.h}),hint)); }); }

/* =========================================================================
   1. QUESTIONS & CENTER — statistical questions, mean / median / mode,
      fair share, drag dots to set the mean (balance point) or median.
   ========================================================================= */
const SQ=[["sq1",1],["sq2",0],["sq3",1],["sq4",0],["sq5",1],["sq6",0],["sq7",1],["sq8",0],["sq9",1],["sq10",0],["sq11",1],["sq12",0]];
function newCenter(){
  const m="center"; startRound(m); const s=st[m];
  s.type=rand(G()===6?["statq","statq","calc","calc","fair","balance"]:["statq","calc","calc","fair","balance","balance"]);
  ({statq:cStat,calc:cCalc,fair:cFair,balance:cBal})[s.type](m,s);
  maybeAuto(m);
}
function cStat(m,s){ const [k,isS]=rand(SQ);
  $("#w-"+m).innerHTML=`<div class="qcard">${esc(t(k))}</div>`;
  choices(m,[TCH("isStat",!!isS),TCH("notStat",!isS)],it=>{ const why=TX(isS?"whyStat":"whyNot"); if(it.ok) return win(m,cat(TX("yes"),why)); nope(m,why); });
  setPrompt(m,TX("statqDir")); }
function cCalc(m,s){ const ck=rand(CK), c=CTX[ck], n=nPick(); let V;
  for(let k=0;k<300;k++){ V=niceMean(genVals(c.lo,c.hi,n),c.lo,c.hi,dec()); if(modeOf(V)!==null) break; }
  const so=srt(V), tot=sum(V), mn=tot/n, md=med(V), mo=modeOf(V), kind=s.kind=mo===null?rand(["mean","median"]):rand(["mean","median","mode"]);
  $("#w-"+m).innerHTML=ctitle(ck,n)+svgEl("sv-"+m,dotPlot({lo:c.lo,hi:c.hi,V}),t("dpLbl"));
  if(kind==="mean") pickNum(m,mn,[tot/(n-1),md,mo,tot/(n+1)],tm("goodMean",{e:dvE(tot,n,mn),m:fmt(mn)}),tm("hintMean",{n}));
  else if(kind==="median") pickNum(m,md,[r1(mn),(so[0]+so[n-1])/2,mo,so[Math.floor(n/2)+1]],
    n%2?tm("goodMedO",{k:(n+1)/2,n,m:fmt(md)}):tm("goodMedE",{a:so[n/2-1],b:so[n/2],m:fmt(md)}), n%2?tm("hintMedO",{k:(n+1)/2,n}):tm("hintMedE",{n,k:n/2,k1:n/2+1}));
  else pickNum(m,mo,[so[n-1],md,Math.round(mn)],tm("goodMode",{m:mo,c:V.filter(v=>v===mo).length}),TX("hintMode"));
  setPrompt(m,TX(kind==="mean"?"calcMean":kind==="median"?"calcMed":"calcMode")); }
function cFair(m,s){ const n=G()===6?ri(4,5):ri(4,6), lv=ri(3,6); let h;

  const q=rand(["pred","pred","slope","int"]);
  if(q==="pred"){ const x0=ri(2,c.xm-1), a=sl*x0+b; pickNum(m,a,[sl*x0,x0+b,a+sl,a-sl,b],tm("goodPredM",{x:x0,e:ex(`${sl} × ${x0} + ${b} = ${a}`,`${sl} ${t("wTimes")} ${x0} ${t("wPlus")} ${b} ${t("wEq")} ${a}`)}),tm("hintPredM",{x:x0}));
    setPrompt(m,tm("pq_"+ck,{x:x0})); }
  else if(q==="slope"){ const good=tm("sm_"+ck,{v:sl});
    choices(m,shuffle([{...good,ok:true,txt:true},TCH("im_"+ck,false,{v:b}),TCH("sm_"+ck,false,{v:b}),TCH("wrS1",false,{v:sl})]),it=>{ if(it.ok) return win(m,tm("goodSlopeM",{mean:{...good,raw:1}})); nope(m,TX("hintSlopeM")); });
    setPrompt(m,tm("slopeDirM",{eq,m:sl})); }
  else { const good=tm("im_"+ck,{v:b});
    choices(m,shuffle([{...good,ok:true,txt:true},TCH("sm_"+ck,false,{v:sl}),TCH("im_"+ck,false,{v:sl}),TCH("wrI1",false,{v:b})]),it=>{ if(it.ok) return win(m,tm("goodIntM",{mean:{...good,raw:1}})); nope(m,TX("hintIntM")); });
    setPrompt(m,tm("intDirM",{eq,b})); }
}
function bTwo(m,s){ const qk=rand(["q_inst","q_team","q_lunch","q_read"]), assoc=Math.random()<.5; let R1,R2,p1,p2;
  for(let z=0;z<500;z++){ R1=rand([20,25,40,50]); R2=rand([20,25,40,50]); p1=5*ri(4,16); p2=5*ri(4,16);

    `<tr><th scope="row">${esc(cap(t("r7")))}</th><td>${y1}</td><td>${n1}</td><td class="tot">${R1}</td></tr><tr><th scope="row">${esc(cap(t("r8")))}</th><td>${y2}</td><td>${n2}</td><td class="tot">${R2}</td></tr>`+
    `<tr><th scope="row" class="tot">${esc(t("total"))}</th><td class="tot">${y1+y2}</td><td class="tot">${n1+n2}</td><td class="tot">${R1+R2}</td></tr></table></div>`;
  if(Math.random()<.5){ const r=rand([1,2]), y=r===1?y1:y2, R=r===1?R1:R2, p=r===1?p1:p2, row=RW(r===1?"r7":"r8");
    pickNum(m,p,[Math.round(y*100/(y1+y2)),Math.round(y*100/(R1+R2)),100-p,y],tm("goodTwPct",{y,R,row,f:frE(y,R),p}),tm("hintTwPct",{row,R}),true);
    setPrompt(m,tm("twPctDir",{row})); }
  else { choices(m,[TCH("twYes",assoc),TCH("twNo",!assoc)],it=>{ if(it.ok) return win(m,tm("goodTw",{p1,p2,note:TX(assoc?"twNoteY":"twNoteN")})); nope(m,TX("hintTw")); });
    setPrompt(m,TX("twAssocDir")); }

/* ---------- Mode switching ---------- */
const NEWFN={center:newCenter,spread:newSpread,sample:newSample,compare:newCompare,bivar:newBivar};
function firstMode(){ return MODES.find(m=>settings.modes[m])||"center"; }
function currentMode(){ const b=$$(".tabs button").find(x=>x.getAttribute("aria-selected")==="true"); return b?b.dataset.mode:firstMode(); }
function showMode(mode){
  if(!settings.modes[mode]) mode=firstMode();
  const switching=currentMode()!==mode;
  if(switching) stopSpeech();
  const g0=speechGen;
  $$(".modepanel").forEach(p=>p.classList.add("hidden"));
  $("#mode-"+mode).classList.remove("hidden");
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===mode; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; });
  if(!made[mode]) NEWFN[mode]();
  if(switching && speechGen===g0) maybeAuto(mode);
}
function syncTabs(){
  $$(".tabs button").forEach(b=>b.classList.toggle("hidden",!settings.modes[b.dataset.mode]));
  if(!settings.modes[currentMode()]) showMode(firstMode());
}
function resetRounds(){ MODES.forEach(m=>made[m]=false); stopSpeech(); NEWFN[currentMode()](); }

/* ---------- Settings drawer ---------- */
function buildModeToggles(){
  const wrap=$("#modeToggles"); wrap.innerHTML="";
  MODES.forEach(m=>{ const l=document.createElement("label"); l.className="toggle";
    l.innerHTML=`<input type="checkbox" ${settings.modes[m]?"checked":""}> <span>${esc(t(MODE_KEY[m]))}</span>`;
    l.querySelector("input").addEventListener("change",e=>{ settings.modes[m]=e.target.checked;
      if(!MODES.some(k=>settings.modes[k])){ e.target.checked=true; settings.modes[m]=true; }
      saveSettings(); syncTabs(); });
    wrap.appendChild(l); });
}
function syncSettingsUI(){
  $("#setGrade").value=String(settings.grade); $("#setSize").value=settings.size;
  $("#setDec").checked=settings.dec; $("#setAuto").checked=settings.autoRead; buildModeToggles();
}
function closeSettings(){ $("#settingsDrawer").classList.remove("open"); $("#openSettings").focus(); }
function initSettings(){
  $("#openSettings").addEventListener("click",()=>{ syncSettingsUI(); $("#settingsDrawer").classList.add("open"); $("#closeSettings").focus(); });
  $("#closeSettings").addEventListener("click",closeSettings);
  $("#settingsDrawer").addEventListener("click",e=>{ if(e.target.id==="settingsDrawer") closeSettings(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#settingsDrawer").classList.contains("open")) closeSettings(); });
  $("#setGrade").addEventListener("change",e=>{ const g=+e.target.value; settings.grade=g; Object.assign(settings,clone(GRADES[g])); saveSettings(); syncSettingsUI(); resetRounds(); });
  $("#setSize").addEventListener("change",e=>{ settings.size=e.target.value; saveSettings(); resetRounds(); });
  $("#setDec").addEventListener("change",e=>{ settings.dec=e.target.checked; saveSettings(); resetRounds(); });
  $("#setAuto").addEventListener("change",e=>{ settings.autoRead=e.target.checked; saveSettings(); });
  $("#printCards").addEventListener("click",()=>{ buildPrintCards(); window.print(); });
}

/* ---------- Print cards ---------- */
function buildPrintCards(){
  const svg=d=>`<svg class="np" viewBox="${d.vb}" role="img">${d.inner}</svg>`;
  const ck=rand(CK), c=CTX[ck]; let V; for(let k=0;k<100;k++){ V=niceMean(genVals(c.lo,c.hi,9),c.lo,c.hi,dec()); if(modeOf(V)!==null) break; }
  const ck2=rand(CK), c2=CTX[ck2], V2=genVals(c2.lo,c2.hi,11);
  const ck3=rand(["sleep","books","game"]), c3=CTX[ck3]; let V3; for(let k=0;k<200;k++){ V3=niceMean(genVals(c3.lo,c3.lo+12,8),c3.lo,c3.lo+12,false); const mn=mean(V3), D=sum(V3.map(v=>Math.abs(v-mn))); if((D*10)%8===0) break; }
  const d=genSurvey(), cats=SURV[d.sv], P=linCloud(rand([1,-1]),12,.8);
  let R1=20,R2=25,y1=12,y2=5;
  const blank=`<span style="display:inline-block;min-width:6rem;border-bottom:2px solid #000">&nbsp;</span>`;
  const cards=[
    {title:t("mCenter"), body:t("cardCenter"), html:`<p><b>${esc(t("cx_"+ck))} (${esc(t("u_"+ck))})</b></p>${svg(dotPlot({lo:c.lo,hi:c.hi,V}))}<p>${esc(t("meanW"))} ${blank} ${esc(t("medW"))} ${blank} ${blank}</p>`},
    {title:t("mSpread"), body:t("cardBox"), html:`<p><b>${esc(t("cx_"+ck2))} (${esc(t("u_"+ck2))})</b></p><p class="chips">${V2.map(v=>`<span>${v}</span>`).join("")}</p>${svg({vb:"0 0 440 60",inner:gAxis(c2.lo,c2.hi,20)})}`},
    {title:t("mSample"), body:t("cardPred",{n:d.n,N:d.N,q:t("q_"+d.sv),cat:t("c_"+cats[d.ci])}), html:svg(barD(cats,d.cnt,-1))+`<p>${blank}</p>`},
    {title:t("mCompare"), body:t("cardMad"), html:`<p><b>${esc(t("cx_"+ck3))} (${esc(t("u_"+ck3))})</b></p><p class="chips">${shuffle(V3).map(v=>`<span>${v}</span>`).join("")}</p><p>${esc(t("meanW"))} ${blank} MAD ${blank}</p>`},
    {title:t("mBivar"), body:t("cardScat"), html:svg(scatD({xm:10,ym:10,xt:1,yt:1,P}))+`<p>${blank}${blank}</p>`},
    {title:t("mBivar"), body:t("cardTw"), html:`<table class="tw"><caption>${esc(t("q_team"))}</caption><tr><th></th><th>${esc(t("lgYes"))}</th><th>${esc(t("lgNo"))}</th><th>${esc(t("total"))}</th></tr><tr><th>${esc(cap(t("r7")))}</th><td>${y1}</td><td>${R1-y1}</td><td>${R1}</td></tr><tr><th>${esc(cap(t("r8")))}</th><td>${y2}</td><td>${R2-y2}</td><td>${R2}</td></tr></table>`}
  ];
  $("#printArea").innerHTML=`<h1>${esc(t("cardTitle"))}</h1><p>${esc(t("cardName"))} ____________________</p>`+
    cards.map(c=>`<div class="card-print"><h2>${esc(c.title)}</h2><p style="font-size:1.15rem;line-height:1.8">${esc(c.body)}</p>${c.html}</div>`).join("")+
    `<p style="font-size:.85rem">${stdsHTML()}</p>`;
}

// Standards codes stay left-to-right inside Arabic/Urdu text.
function stdsHTML(){ return esc(t("stds")).replace(/(TEKS|Common Core|\d\.(?:[A-Z]{1,2}\.)?\d+[a-z]?(?:\([^)]*\))?)/g,'<bdi dir="ltr">$1</bdi>'); }

/* ---------- Language engine ---------- */
function resolveLang(){
  try{ const q=new URLSearchParams(location.search).get("lang"); if(q && T[q]) return q; }catch(e){}
  try{ const s=localStorage.getItem(LANG_KEY); if(s && T[s]) return s; }catch(e){}
  const n=(navigator.language||"en").slice(0,2).toLowerCase();
  if(T[n]) return n;
  return "en";
}
function applyLang(){
  const meta=LANGS.find(x=>x.code===lang)||LANGS[0];
  document.documentElement.lang=lang;
  document.documentElement.dir=meta.dir;
  document.title=t("appTitle");
  const sel=$("#langSelect"); if(sel) sel.value=lang;
  $$("[data-t]").forEach(el=>{ el.textContent=t(el.getAttribute("data-t")); });
  $$("[data-ta]").forEach(el=>{ const v=t(el.getAttribute("data-ta")); el.setAttribute("aria-label",v); el.title=v; });
  $("#stdsNote").innerHTML=stdsHTML();
  buildModeToggles();
  resetRounds();
}
function setLang(l){ if(!T[l]) l="en"; lang=l; try{ localStorage.setItem(LANG_KEY,l); }catch(e){} applyLang(); }
function buildLangSelect(){
  const sel=$("#langSelect"); sel.innerHTML="";
  LANGS.forEach(m=>{ const o=document.createElement("option"); o.value=m.code; o.textContent=m.name; sel.appendChild(o); });
  sel.value=lang;
  sel.addEventListener("change",()=>setLang(sel.value));
}

/* ---------- Init ---------- */
function buildUI(){
  $("#tabs").innerHTML=MODES.map(m=>`<button type="button" role="tab" id="tab-${m}" aria-controls="mode-${m}" aria-selected="false" data-mode="${m}"><span class="ic" aria-hidden="true">${MODE_IC[m]}</span><span data-t="${MODE_KEY[m]}"></span></button>`).join("");
  $("#panels").innerHTML=MODES.map(m=>`<section id="mode-${m}" class="panel modepanel hidden" role="tabpanel" aria-labelledby="tab-${m}">
    <div class="panelhead"><h2 data-t="${MODE_KEY[m]}"></h2><button type="button" class="btn ghost no-print" data-new="${m}" data-t="newRound"></button></div>
    <div class="prompt"><button type="button" class="speaker" data-speak="${m}" data-ta="readAloud" aria-label="Read aloud">🔊</button><span id="p-${m}">…</span></div>
    <div class="work" id="w-${m}"></div>
    <div class="acts no-print" id="a-${m}"></div>
    <div class="choices" id="c-${m}" role="group" data-ta="choicesLbl" aria-label="Answer choices"></div>
    <div class="feedback" id="f-${m}" role="status" aria-live="polite"></div></section>`).join("");
  $("#tabs").addEventListener("keydown",e=>{ const vis=$$(".tabs button").filter(b=>!b.classList.contains("hidden")), i=vis.indexOf(document.activeElement); if(i<0) return;
    const rtl=document.documentElement.dir==="rtl", stp={ArrowRight:rtl?-1:1,ArrowLeft:rtl?1:-1}[e.key]; if(!stp) return;
    const nb=vis[(i+stp+vis.length)%vis.length]; nb.focus(); showMode(nb.dataset.mode); e.preventDefault(); });
}
function init(){
  lang=resolveLang();
  buildUI();
  buildLangSelect();
  $$(".tabs button").forEach(b=>b.addEventListener("click",()=>showMode(b.dataset.mode)));
  $$(".speaker").forEach(b=>b.addEventListener("click",()=>speak(currentSpeech[b.dataset.speak])));
  $$("[data-new]").forEach(b=>b.addEventListener("click",()=>{ stopSpeech(); NEWFN[b.dataset.new](); }));
  initSettings();
  const f=firstMode();
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===f; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; b.classList.toggle("hidden",!settings.modes[b.dataset.mode]); });
  $$(".modepanel").forEach(p=>p.classList.toggle("hidden",p.id!=="mode-"+f));
  applyLang();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
</script>
<script>
/* Student mute toggle — shared across the Digital Math Tools. Self-contained,
   offline, stores no student data. Gates ALL speech by intercepting
   speechSynthesis.speak, so muting works regardless of each tool's internals.
   Reads the shared language preference only to localize its own label. */
(function(){
  "use strict";
  var LKEY='tcea.mathtools.lang', MKEY='tcea.mathtools.muted';
  var CODES=['en','es','vi','ar','hi','ur','zh'];
  var LAB={
    mute:{en:"Mute sound",es:"Silenciar sonido",vi:"Tắt âm thanh",ar:"كتم الصوت",hi:"आवाज़ बंद करें",ur:"آواز بند کریں",zh:"静音"},
    unmute:{en:"Turn sound on",es:"Activar sonido",vi:"Bật âm thanh",ar:"تشغيل الصوت",hi:"आवाज़ चालू करें",ur:"آواز چالو کریں",zh:"打开声音"}
  };
  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  window.__MT_MUTED = (get(MKEY)==='1');
  // Intercept every speech request; suppress while muted.
  try{
    if(window.speechSynthesis && typeof window.speechSynthesis.speak==='function'){
      var ss=window.speechSynthesis, orig=ss.speak.bind(ss);
      ss.speak=function(u){ if(!window.__MT_MUTED){ try{orig(u);}catch(e){} } };
    }
  }catch(e){}
  function curLang(){ var l=get(LKEY)||'en'; return LAB.mute[l]?l:'en'; }
  function label(el){
    var on=!window.__MT_MUTED, l=curLang(), txt=on?LAB.mute[l]:LAB.unmute[l];
    el.textContent=on?'🔊':'🔇';
    el.setAttribute('aria-label',txt); el.setAttribute('title',txt);
    el.setAttribute('aria-pressed', on?'false':'true');
  }
  function findLangSelect(){
    var sels=document.querySelectorAll('select');
    for(var i=0;i<sels.length;i++){ var o=sels[i].options, c=0;
      for(var j=0;j<o.length;j++){ if(CODES.indexOf((o[j].value||'').toLowerCase())>=0) c++; }
      if(c>=3) return sels[i];
    }
    return null;
  }
  function build(){
    if(document.getElementById('mtMuteBtn')) return;
    if(!(('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window))) return;
    var btn=document.createElement('button');
    btn.id='mtMuteBtn'; btn.type='button';
    btn.style.cssText='font:inherit;font-size:1.15rem;line-height:1;cursor:pointer;'+
      'min-width:44px;min-height:44px;padding:8px 12px;border:2px solid #e2dcf1;'+
      'border-radius:10px;background:#fff;color:#5b3fa5;font-weight:700;margin:0 4px;';
    btn.addEventListener('click',function(){
      window.__MT_MUTED=!window.__MT_MUTED;
      set(MKEY, window.__MT_MUTED?'1':'0');
      if(window.__MT_MUTED){ try{window.speechSynthesis.cancel();}catch(e){} }
      label(btn);
    });
    btn.addEventListener('focus',function(){btn.style.outline='3px solid #5b3fa5';btn.style.outlineOffset='2px';});
    btn.addEventListener('blur',function(){btn.style.outline='';});
    var sel=findLangSelect();
    if(sel && sel.parentNode){
      sel.parentNode.insertBefore(btn, sel);
      sel.addEventListener('change',function(){ setTimeout(function(){label(btn);},0); });
    }else{
      btn.style.position='fixed'; btn.style.top='10px'; btn.style.zIndex='9999';
      btn.style[(document.documentElement.dir==='rtl')?'left':'right']='10px';
      (document.body||document.documentElement).appendChild(btn);
    }
    label(btn);
  }
  if(document.readyState==='complete'){ build(); }
  else{ window.addEventListener('load', build); }
  window.addEventListener('storage',function(e){ if(e.key===LKEY){ var b=document.getElementById('mtMuteBtn'); if(b) label(b); } });
})();
</script>
