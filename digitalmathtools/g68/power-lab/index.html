<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Power Lab: Exponents &amp; Scientific Notation — a Grades 6–8 app for whole-number powers and prime factorization, exponent laws with tap-to-cancel factors, square and cube roots, sliding the decimal point into scientific notation, and computing and comparing in scientific notation. Works offline. No data collected.">
<title>Power Lab: Exponents &amp; Scientific Notation</title>
<style>
  :root{
    --bg:#eef1f4;--panel:#ffffff;--ink:#1b2631;--muted:#4a5866;--line:#cfd8e0;
    --accent:#2c3e50;--accentD:#22313f;--accent-ink:#ffffff;--good:#166534;--good-bg:#dcfce7;
    --hint:#7a4a00;--hint-bg:#fff4d6;--focus:#0a58ca;--hot:#d97706;--cool:#2563eb;
    --tap:52px;font-size:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-text-size-adjust:100%}
  h1,h2,h3{line-height:1.15;margin:0 0 .3em}
  button{font-family:inherit;font-size:1rem;cursor:pointer}

  .topbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--accentD);color:var(--accent-ink);padding:.55rem .8rem}
  .topbar .brand{font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:.4rem;margin-inline-end:auto}
  .topbar a.homebtn,.topbar button.tb{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.55);border-radius:12px;padding:.4rem .7rem;min-height:var(--tap);min-width:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:.35rem;text-decoration:none;font-weight:700;font-size:.95rem}
  .globe{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.55);border-radius:12px;padding:.2rem .5rem;min-height:var(--tap)}
  .globe span{font-size:1.2rem}
  .globe select{border:0;background:#fff;color:var(--ink);border-radius:8px;min-height:44px;font-weight:700;font-size:1rem;padding:.2rem .4rem}

  main{max-width:1200px;margin:0 auto;padding:.7rem}
  .tabsrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 .7rem}
  .tabs{display:flex;gap:.4rem;flex-wrap:wrap;flex:1 1 auto}
  .tabs button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.45rem .75rem;min-height:var(--tap);font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:.4rem}
  .tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tabs button .ic{font-size:1.15rem}
  .stars{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.4rem .8rem;font-weight:800;font-size:1.15rem;min-height:48px;display:inline-flex;align-items:center;gap:.3rem}
  .stars.pop{animation:pop .5s ease}
  @keyframes pop{50%{transform:scale(1.15)}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:.9rem;margin-bottom:.8rem}
  .panelhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
  .panelhead h2{margin:0;font-size:1.25rem;margin-inline-end:auto}

  .prompt{display:flex;align-items:center;gap:.6rem;background:#e9eef3;border:2px solid #c3cfda;border-radius:14px;padding:.6rem .8rem;margin-bottom:.7rem;font-size:1.12rem;font-weight:600;line-height:1.7}
  .speaker{background:var(--accent);color:#fff;border:0;border-radius:50%;width:var(--tap);height:var(--tap);min-width:var(--tap);font-size:1.4rem;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
  .ctx{background:#fffbea;border:2px dashed #e5c76b;border-radius:12px;padding:.45rem .7rem;margin:0 0 .6rem;font-weight:600;line-height:1.7}

  .btn{background:var(--accent);color:#fff;border:2px solid var(--accent);border-radius:12px;padding:.5rem .85rem;min-height:var(--tap);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
  .btn.ghost{background:var(--panel);color:var(--accent)}
  .btn:disabled{opacity:.45}

  .feedback{margin-top:.6rem;border-radius:12px;padding:.6rem .8rem;font-weight:600;display:none;line-height:1.9}
  .feedback.show{display:block}
  .feedback.good{background:var(--good-bg);color:var(--good);border:2px solid #86efac}
  .feedback.hint{background:var(--hint-bg);color:var(--hint);border:2px solid #f6d271}

  /* Math: always left-to-right, even inside Arabic/Urdu sentences */
  .math{unicode-bidi:isolate;direction:ltr;display:inline;font-weight:800;white-space:nowrap}
  sup{font-size:.68em;line-height:0;vertical-align:.62em;margin-inline-start:.04em}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:800;margin:0 .08em;white-space:nowrap;font-size:.92em}
  .fr>span{padding:0 .16em}
  .fr>span:first-child{border-bottom:.12em solid currentColor}
  .feedback .math,.prompt .math,.ctx .math,.choice .math,.big .math{white-space:normal}
  .rad{border-top:.1em solid currentColor;padding:0 .1em}
  .big{font-size:1.9rem;text-align:center;margin:.2rem 0 .6rem}

  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-top:.7rem}
  .choices:empty{display:none}
  .choice{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:.5rem;min-height:72px;display:flex;align-items:center;justify-content:center;position:relative;font-size:1.35rem;font-weight:800;color:var(--ink)}
  .choice .lbl{unicode-bidi:isolate;direction:ltr}
  .choice.wide{font-size:1.1rem}
  .choice.correctpick{border-color:var(--good);background:var(--good-bg)}
  .choice.wrongpick{border-color:#e3b341;background:var(--hint-bg);opacity:.75}
  .choice .badge{position:absolute;top:4px;inset-inline-end:6px;font-size:1.1rem;display:none}
  .choice.correctpick .badge{display:block}
  .choice sup{font-size:.68em;line-height:0;vertical-align:.62em}

  .work:empty{display:none}
  .acts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;margin:.5rem 0}
  .acts:empty{display:none}
  .note{text-align:center;font-weight:700;margin:.4rem 0;color:var(--muted)}

  /* repeated-multiplication tiles */
  .facs{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;align-items:center;direction:ltr;margin:.3rem 0}
  .fac{min-width:52px;min-height:52px;border:3px solid #7f8c9a;border-radius:12px;background:#f4f7fa;font-size:1.35rem;font-weight:800;color:var(--ink);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:.15rem .35rem;line-height:1.05;transition:opacity .25s,background .25s}
  .fac small{font-size:.7rem;color:var(--muted);font-weight:700}
  .fac.on{background:#dbeafe;border-color:var(--cool)}
  .fac.gone{opacity:.35;text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:#b91c1c}
  .opx{font-size:1.3rem;font-weight:800;color:var(--muted)}
  .grpbox{display:inline-flex;flex-wrap:wrap;gap:.3rem;border:2px dashed #94a3b8;border-radius:12px;padding:.3rem;align-items:center;justify-content:center}
  .grpbox.a{border-color:var(--cool);background:#eff6ff}.grpbox.b{border-color:var(--hot);background:#fff7ed}
  .frac{display:flex;flex-direction:column;align-items:center;gap:.3rem;direction:ltr}
  .frac .bar{height:4px;background:var(--ink);width:min(100%,460px);border-radius:2px}
  .runprod{text-align:center;font-size:1.25rem;font-weight:800;margin:.3rem 0;min-height:1.8em}
  table.pat{border-collapse:collapse;margin:.2rem auto;font-size:1.3rem;font-weight:800;direction:ltr}
  table.pat td{padding:.2rem .6rem;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
  table.pat td.ar{color:var(--hot);font-size:1rem}
  table.pat tr.q td{background:var(--hint-bg)}
  table.pat tr.blank td{color:#9aa5b1}

  /* factor tree */
  .tree{display:flex;justify-content:center;direction:ltr;overflow-x:auto;padding:.3rem 0}
  .ft{display:flex;flex-direction:column;align-items:center}
  .fn{min-width:52px;min-height:52px;border:3px solid #7f8c9a;border-radius:12px;background:#fff;font-size:1.3rem;font-weight:800;color:var(--ink);padding:.1rem .4rem}
  .fn.prime{border-radius:50%;border-color:var(--good);background:var(--good-bg);color:var(--good)}
  .fn.sel{outline:4px solid var(--focus);outline-offset:2px}
  .kids{display:flex;gap:.4rem;margin-top:.15rem;position:relative;padding-top:14px}
  .kids::before{content:"";position:absolute;top:0;left:25%;right:25%;height:12px;border:3px solid #7f8c9a;border-bottom:0;border-radius:8px 8px 0 0}
  .splits{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center}

  /* decimal-point slider */
  .stripwrap{display:flex;justify-content:center;margin:.4rem 0}
  .strip{display:flex;align-items:flex-end;direction:ltr;touch-action:none;user-select:none;-webkit-user-select:none;font-size:clamp(1.15rem,5.6vw,2.1rem);font-weight:800;padding:.2rem .2rem 1.5rem;position:relative;cursor:ew-resize}
  .cell{width:1.02em;text-align:center;border-bottom:3px solid var(--line);font-variant-numeric:tabular-nums}
  .cell.ph{color:#64748b}
  .cell.bl{border-color:transparent;color:transparent}
  .pt{width:.5em;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;outline:none}
  .pt::before{content:"";width:.36em;height:.36em;border-radius:50%;background:#dc2626;margin-bottom:.05em}
  .pt::after{content:"";position:absolute;bottom:-1.25em;border:.42em solid transparent;border-bottom:.6em solid #dc2626}
  .pt:focus-visible{outline:4px solid var(--focus);outline-offset:2px;border-radius:6px}
  .readout{text-align:center;font-size:1.35rem;font-weight:800;margin:.2rem 0}
  .moved{text-align:center;font-weight:700;color:var(--muted)}
  #a-sci{direction:ltr}

  /* number line */
  .nlwrap{display:flex;justify-content:center}
  .nl{width:100%;max-width:760px;display:block;margin:0 auto;touch-action:none;height:auto}
  .nlax{stroke:#1b2631;stroke-width:4;stroke-linecap:round}
  .tk{stroke:#1b2631;stroke-width:3}.tk.mn{stroke-width:1.5;stroke:#64748b}
  .nlt{font-size:26px;font-weight:800;text-anchor:middle;fill:#1b2631;font-family:system-ui,sans-serif}
  .nlm{font-size:22px;font-weight:800;text-anchor:middle;font-family:system-ui,sans-serif}
  .pin line{stroke:#1d4ed8;stroke-width:5;stroke-linecap:round}
  .pin circle{fill:#3b82f6;stroke:#1e3a8a;stroke-width:3}
  .pin[tabindex]{cursor:grab}.pin:focus{outline:none}.pin:focus circle{stroke:var(--focus);stroke-width:6}
  .pic{display:block;margin:0 auto;max-width:100%;height:auto}

  .chips{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin:.4rem 0}
  .chip{min-width:84px;min-height:64px;border:3px solid var(--line);border-radius:14px;background:#fff;font-size:1.25rem;font-weight:800;padding:.3rem .6rem;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
  .chip.used{opacity:.25;pointer-events:none}
  .chip sup{font-size:.68em;line-height:0;vertical-align:.62em}
  .ordrow{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;align-items:center;min-height:64px;border:2px dashed var(--line);border-radius:14px;padding:.4rem;margin:.4rem 0}
  .ordrow .lab{font-weight:700;color:var(--muted)}
  .ordrow .chip{border-color:var(--good);background:var(--good-bg);pointer-events:none}
  .calc{display:inline-block;background:#1f2937;color:#a7f3d0;font-family:ui-monospace,Consolas,monospace;font-size:1.8rem;padding:.4rem 1rem;border-radius:10px;border:4px solid #4b5563;direction:ltr;letter-spacing:.05em}

  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:1rem}
  .drawer.open{display:flex}
  .drawer .card{background:var(--panel);border-radius:16px;max-width:600px;width:100%;padding:1rem;max-height:90vh;overflow:auto}
  .setrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0;padding:.5rem 0;border-bottom:1px solid var(--line)}
  .setrow .lab{font-weight:700;min-width:150px}
  .toggle{display:inline-flex;align-items:center;gap:.35rem;border:2px solid var(--line);border-radius:10px;padding:.35rem .55rem;background:#fff;min-height:44px}
  .toggle input{width:22px;height:22px}
  select.diff{font-size:1rem;padding:.4rem;border-radius:10px;border:2px solid var(--line);min-height:48px}
  .wrapflex{display:flex;flex-wrap:wrap;gap:.4rem}

  footer{max-width:1200px;margin:.5rem auto 2rem;padding:.8rem;color:var(--muted);font-size:.9rem;text-align:center}
  footer a{color:var(--accent);font-weight:700}
  .stds{font-size:.82rem;color:var(--muted);background:#f6f8fa;border:1px dashed var(--line);border-radius:12px;padding:.5rem .7rem;margin-top:.4rem}

  .hidden{display:none !important}
  :focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  @media (max-width:480px){ :root{font-size:17px} .big{font-size:1.55rem} .tabs button{padding:.4rem .55rem;font-size:.92rem} .choice{font-size:1.2rem} .fac{min-width:46px;min-height:48px;font-size:1.2rem} }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

  .printonly{display:none}
  @media print{
    .topbar,.tabsrow,footer,.modepanel,#stdsNote,.no-print,#mtMuteBtn{display:none !important}
    body{background:#fff}
    .printonly{display:block}
    .card-print{border:2px solid #000;border-radius:12px;padding:1rem;margin:0 0 1rem;page-break-inside:avoid}
    .card-print h2{margin:.2rem 0}
    main{max-width:100%}
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">⚡ <span data-t="appTitle">Power Lab: Exponents &amp; Scientific Notation</span></span>
  <a class="homebtn" href="../../index.html">🏠 <span data-t="home">Home</span></a>
  <label class="globe"><span aria-hidden="true">🌐</span>
    <select id="langSelect" aria-label="Language / Idioma"></select>
  </label>
  <button class="tb settingsbtn" id="openSettings" type="button">⚙️ <span data-t="teacher">Teacher</span></button>
</header>

<main>
  <div class="tabsrow">
    <div class="tabs" id="tabs" role="tablist" data-ta="modesLbl" aria-label="Modes"></div>
    <span class="stars" id="stars"><span aria-hidden="true">✔</span><span class="sr" data-t="solved">Problems solved</span> <b id="starCount">0</b></span>
  </div>
  <div id="panels"></div>
  <div class="stds" id="stdsNote"></div>
  <div class="printonly" id="printArea"></div>
</main>

<footer>
  <p data-t="footNote">No accounts · No data collected · Works offline</p>
  <p><a href="../../index.html" data-t="home">Home</a> · <a href="../../policy.html" data-t="privacy">Privacy</a></p>
</footer>

<!-- SETTINGS -->
<div class="drawer" id="settingsDrawer" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="card">
    <div class="panelhead"><h2 id="setTitle" data-t="teacherTitle">Teacher settings</h2>
      <button class="btn ghost" id="closeSettings" type="button" data-t="close">Close</button></div>
    <div class="setrow"><label class="lab" for="setGrade" data-t="setGrade">Grade level</label>
      <select class="diff" id="setGrade">
        <option value="6" data-t="g6">Grade 6</option>
        <option value="7" data-t="g7">Grade 7</option>
        <option value="8" data-t="g8">Grade 8</option></select>
      <p class="stds" style="margin:0;flex:1 1 100%" data-t="gradeNote"></p></div>
    <div class="setrow"><label class="lab" for="setExp" data-t="setExp">Largest power of 10</label>
      <select class="diff" id="setExp">
        <option value="6">10⁶</option>
        <option value="9">10⁹</option>
        <option value="12">10¹²</option></select></div>
    <div class="setrow"><span class="lab" data-t="setNeg">Negative exponents</span>
      <label class="toggle"><input type="checkbox" id="setNegIn"> <span data-t="negOn">Include zero and negative exponents</span></label></div>
    <div class="setrow"><span class="lab" data-t="setModes">Modes</span>
      <div id="modeToggles" class="wrapflex"></div></div>
    <div class="setrow"><span class="lab" data-t="setSpeech">Speech</span>
      <label class="toggle"><input type="checkbox" id="setAuto"> <span data-t="autoRead">Auto-read directions</span></label></div>
    <div class="setrow" style="border:0"><button class="btn" id="printCards" type="button">🖨 <span data-t="printCards">Print challenge cards</span></button></div>
    <p class="stds" data-t="setStored">Settings are saved only on this device. No student information is ever stored.</p>
  </div>
</div>

<script>

/* ---------- Math objects {h:html, s:speech, v:value} ---------- */
const N = v=>({h:sN(v), s:v<0?t("negSay",{x:Math.abs(v)}):String(v), v});
const eS = e=>e<0?t("negSay",{x:-e}):String(e);
// A power b^e. b may be a number or a letter; negative/fraction bases get parentheses.
function P(b,e){ const bh=(typeof b==="number"&&b<0)?"("+sN(b)+")":String(b), bs=typeof b==="number"?N(b).s:b;
  return {h:`${bh}<sup>${sN(e)}</sup>`, s:e===2?t("sqW",{b:bs}):e===3?t("cubeW",{b:bs}):t("powSay",{b:bs,e:eS(e)}), v:typeof b==="number"?Math.pow(b,e):NaN}; }

// 1/b^k as a stacked fraction with a power in the denominator
const RP = (b,k)=>({h:frH(1,P(b,k).h), s:t("frSay",{n:1,d:P(b,k).s}), v:1/Math.pow(b,k)});
// Value of an integer power as {h,s}: whole number or unit fraction
function PV(b,e){ return e>=0?N(Math.pow(b,e)):F(1,Math.pow(b,-e)); }
const SCI = (c,e)=>({h:`${fmt(c)} × 10<sup>${sN(e)}</sup>`, s:t("sciSay",{c:fmt(c),e:eS(e)}), v:c*Math.pow(10,e), c, e});
const OPS = {"+":"wPlus","−":"wMinus","×":"wTimes","·":"wTimes","÷":"wDiv","=":"wEq","<":"ltW",">":"gtW"};
function X(...p){ const h=[],s=[];
  p.forEach(x=>{ if(typeof x==="string"&&OPS[x]){ h.push(x==="<"?"&lt;":x===">"?"&gt;":x); s.push(t(OPS[x])); }
    else if(x&&typeof x==="object"){ h.push(x.h); s.push(x.s); } else { h.push(""+x); s.push(""+x); } });
  return {h:M(h.join(" ")), s:s.join(" ")};
}
// General rules with letters (built in code so they stay LTR and are spoken well)
const PS = (b,e)=>t("powSay",{b,e});
function RULE(k){ const ex=(x,y,op)=>x+" "+t(op)+" "+y;
  if(k==="prod") return {h:"a<sup>m</sup> · a<sup>n</sup> = a<sup>m+n</sup>", s:[PS("a","m"),t("wTimes"),PS("a","n"),t("wEq"),PS("a",ex("m","n","wPlus"))].join(" ")};
  if(k==="quo") return {h:"a<sup>m</sup> ÷ a<sup>n</sup> = a<sup>m−n</sup>", s:[PS("a","m"),t("wDiv"),PS("a","n"),t("wEq"),PS("a",ex("m","n","wMinus"))].join(" ")};
  if(k==="pp") return {h:"(a<sup>m</sup>)<sup>n</sup> = a<sup>mn</sup>", s:[PS(PS("a","m"),"n"),t("wEq"),PS("a",ex("m","n","wTimes"))].join(" ")};
  if(k==="zero") return {h:"a<sup>0</sup> = 1", s:PS("a","0")+" "+t("wEq")+" 1"};
  return {h:"a<sup>−n</sup> = "+frH(1,"a<sup>n</sup>"), s:PS("a",t("negSay",{x:"n"}))+" "+t("wEq")+" "+t("frSay",{n:1,d:PS("a","n")})}; }
const ONE = ()=>({h:"10<sup>0</sup>", s:PS(10,0)});

const XL = (items,sep)=>X(...items.flatMap((x,i)=>i?[sep||"×",x]:[x]));
function tm(key,vars){ const h={},s={}; vars=vars||{};
  for(const k in vars){ const v=vars[k]; if(v&&typeof v==="object"){ h[k]=String(v.h).indexOf("<bdi")===0?v.h:M(v.h); s[k]=v.s; } else { h[k]=v; s[k]=v; } }
  return {h:t(key,h), s:t(key,s).replace(/<[^>]+>/g," ").replace(/\s+/g," ")};
}

const speechOK = ("speechSynthesis" in window);
function bcpFor(l){ const m=LANGS.find(x=>x.code===l); return m?m.bcp:"en-US"; }
// Prefer warm, natural voices for young learners; avoid harsh robotic engines.
function pickWarmVoice(code){
  const vs = speechSynthesis.getVoices()||[];
  const want=code.toLowerCase(), two=want.slice(0,2);
  let best=null, bs=-1;
  for(const v of vs){
    const lc=(v.lang||'').toLowerCase().replace('_','-');
    if(lc!==want && lc.slice(0,2)!==two) continue;
    let s=(lc===want?100:60); const n=(v.name||'').toLowerCase();
    if(/google|natural|neural|online|premium|enhanced|siri/.test(n)) s+=40;
    if(/female|woman|samantha|karen|tessa|moira|fiona|serena|victoria|allison|ava|susan|zoe|amelie|amélie|paulina|monica|mónica|zira|hazel|catherine|linda|kanya|lekha|ting-ting|mei-jia|sin-ji|yu-shu|huihui|xiaoxiao/.test(n)) s+=18;
    if(/espeak|compact|festival|pico|robot|eloquence/.test(n)) s-=60;
    if(v.localService===false) s+=8;
    if(v.default) s+=2;
    if(s>bs){ bs=s; best=v; }
  }
  return best;
}
/* Speech queue. Fixes cut-off audio:
   - a new round no longer calls cancel() over the praise; rounds advance on onend
   - long text is split into sentences (Chrome stops utterances after ~15 s)
   - utterances are kept referenced so Chrome can't garbage-collect them mid-speech
   - after cancel(), the next speak() waits a beat (Chrome drops it otherwise) */
let speechGen=0, speechKeep=[], speechPendingDone=null, speechStarted=false;
function splitSpeech(text){
  const parts=String(text).match(/[^.!?。！？؟।۔]+[.!?。！？؟।۔]*\s*/g)||[text];
  return parts.map(x=>x.trim()).filter(Boolean);
}
function speechEstimateMs(text){ const per=/^(zh)$/.test(lang)?300:95; return 1200+String(text).length*per/0.9; }
function stopSpeech(){
  speechGen++; const d=speechPendingDone; speechPendingDone=null; speechKeep=[];
  if(speechOK){ try{ speechSynthesis.cancel(); }catch(e){} }
  if(d) setTimeout(d,0);
}
function speak(text,onDone){
  const prevDone=speechPendingDone; speechPendingDone=null;
  const gen=++speechGen; let fired=false;
  const done=()=>{ if(fired) return; fired=true; if(speechPendingDone===done) speechPendingDone=null; if(onDone) onDone(); };
  if(onDone) speechPendingDone=done;
  if(prevDone) setTimeout(prevDone,0);  // a superseded speech still lets its round advance
  if(!speechOK || !text || window.__MT_MUTED){ if(onDone) setTimeout(done,700); return; }
  let busy=false;
  try{ busy=speechSynthesis.speaking||speechSynthesis.pending; speechSynthesis.cancel(); }catch(e){}
  // Decimal points inside numbers must not be read as sentence ends.
  const parts=splitSpeech(String(text).replace(/(\d)\.(\d)/g,"$1․$2")).map(p=>p.replace(/․/g,".")), bcp=bcpFor(lang), voice=pickWarmVoice(bcp);
  const start=()=>{
    if(gen!==speechGen) return;
    speechKeep=[];
    try{
      if(speechSynthesis.paused) speechSynthesis.resume();
      parts.forEach((p,i)=>{
        const u=new SpeechSynthesisUtterance(p);
        u.lang=bcp; if(voice) u.voice=voice; u.rate=0.9; u.pitch=1.15;
        u.onstart=()=>{ speechStarted=true; };
        if(i===parts.length-1){ u.onend=done; u.onerror=done; }
        speechKeep.push(u); speechSynthesis.speak(u);
      });
    }catch(e){ done(); }
  };
  if(busy) setTimeout(start,120); else start();
  // Safety net: some engines never fire onend.
  if(onDone) setTimeout(done,speechEstimateMs(text)+2500);
}
/* Speak praise, then start the next round once it finishes (never sooner than minMs). */

    const wait=Math.max(450,(minMs||1200)-(Date.now()-t0));
    setTimeout(()=>{ if(roundIds[key]===id) next(); },wait);
  });
}

function pfac(n){ const f={}; for(let p=2;p*p<=n;p++) while(n%p===0){ f[p]=(f[p]||0)+1; n/=p; } if(n>1) f[n]=(f[n]||0)+1; return f; }
let nid=0;

  return `<div class="ft"><button type="button" class="fn${pr?" prime":""}" data-id="${x.id}" aria-label="${x.v}">${x.v}</button>`+(x.kids?`<div class="kids">${x.kids.map(treeHTML).join("")}</div>`:"")+`</div>`; }

  }else if(type==="times"){
    const cs=ri(1,4), es=re(), k=rand([1,2,3,4,5].filter(x=>x*cs<10)), d=ri(1,G()===6?3:4), B=SCI(cs,es), A=SCI(cs*k,es+d), rv=k*Math.pow(10,d);
    const R=N(rv), r={...R,h:grp(String(rv))};
    w.innerHTML=`<div class="big">${M(A.h)}<br>${M(B.h)}</div>`;
    const wr=[N(k*Math.pow(10,d+1)),N(k*Math.pow(10,d-1)),N(Math.pow(10,d)*(k+1)),N((es+d)*k)].map(x=>({...x,h:grp(x.h)}));
    pickRound(m,opts(r,wr),()=>tm("timesGood",{a:CX(A,B,"÷"),cc:{h:`${cs*k} ÷ ${cs}`,s:cs*k+" "+t("wDiv")+" "+cs},pp:{h:`10<sup>${sN(es+d)}</sup> ÷ 10<sup>${sN(es)}</sup>`,s:P(10,es+d).s+" "+t("wDiv")+" "+P(10,es).s},r:{h:grp(String(rv))+" = "+k+" × 10<sup>"+d+"</sup>",s:String(rv)}}),()=>tm("timesHint",{e1:sN(es+d),e2:es<0?"("+sN(es)+")":sN(es)}));
    setPrompt(m,tm("timesDir",{a:A,b:B}));
  }else if(type==="ord"){
    const items=[]; let guard=0; const e0=re();
    while(items.length<4&&guard++<80){ const e=Math.random()<.5?e0:e0+ri(-2,2); if(!NEG()&&e<1) continue; const c=rand([1.5,2,2.5,3,4,6,7.5,8,9,1.2]); const v=c*Math.pow(10,e);
      if(items.some(x=>near(x.v,v))) continue; const it=SCI(c,e); if(G()>=8&&items.length===3&&Math.random()<.5&&e>=-4&&e<=6){ const sstr=grp(fmt(v).replace(MINUS,"")); items.push({h:sstr,s:sstr,v}); } else items.push(it); }
    const sorted=items.slice().sort((a,b)=>a.v-b.v); s.k=0; s.sorted=sorted;
    w.innerHTML=`<div class="ordrow" id="ordRow"><span class="lab">${t("ordRow")}</span></div><div class="chips" dir="ltr">`+items.map((it,i)=>`<button type="button" class="chip" data-i="${i}" aria-label="${it.s}">${M(it.h)}</button>`).join("")+`</div>`;
    w.addEventListener("click",ev=>{ const c=ev.target.closest(".chip"); if(!c||s.done||c.classList.contains("used")) return; const it=items[+c.dataset.i];
      if(near(it.v,sorted[s.k].v)){ c.classList.add("used"); c.disabled=true; $("#ordRow").insertAdjacentHTML("beforeend",`<span class="chip">${M(it.h)}</span>`); s.k++; hideFb($("#f-"+m));
        if(s.k===4) return win(m,tm("ordGood",{list:{h:sorted.map(x=>M(x.h)).join(" &lt; "),s:sorted.map(x=>x.s).join(", ")}}),$("#ordRow").outerHTML); return; }
      nope(m,tm("ordHint",{x:it,y:sorted[s.k]})); });
    actBtn(m,"↺ "+t("startOver"),()=>{ if(s.done) return; s.k=0; $$("#w-ops .chip").forEach(c=>{ c.classList.remove("used"); c.disabled=false; }); $$("#ordRow .chip").forEach(c=>c.remove()); hideFb($("#f-"+m)); },"ghost");
    setPrompt(m,W("ordDir"));
  }else{ // calculator E-notation
    let D=rndD(); if(D.length<2) D+=String(ri(1,9)); const e=NEG()&&Math.random()<.45?-ri(2,Math.min(7,EX())):ri(4,Math.min(9,EX())), p=e+1;
    const cs=coefStr(D)+"E"+(e<0?"-":"")+Math.abs(e), sc=SCID(D,p), n=STD(D,p);
    w.innerHTML=`<div class="big"><span class="calc" aria-label="${cs}">${cs}</span></div>`;
    const wr=[STD(D,p+1),STD(D,p-1),{h:`${coefStr(D)}<sup>${sN(e)}</sup>`,s:P(coefStr(D),e).s},{h:`${coefStr(D)} × ${sN(e)}`,s:coefStr(D)+" "+t("wTimes")+" "+N(e).s}];
    pickRound(m,opts({...n,h:M(n.h)},wr.map(x=>({...x,h:M(x.h)}))),()=>tm("calcGood",{c:cs,e:sN(e),s:sc,n,p:{h:"× 10<sup>"+sN(e)+"</sup>",s:t("wTimes")+" "+P(10,e).s}}),()=>tm("calcHint",{c:cs,s:sc,k:Math.abs(e),dir:t(e>0?"dirR":"dirL")}));
    setPrompt(m,W("calcDir"));
  }
  maybeAuto(m);
}

/* ---------- Mode switching ---------- */
const NEWFN={pow:newPow,laws:newLaws,root:newRoot,sci:newSci,ops:newOps};
function firstMode(){ return MODES.find(m=>settings.modes[m])||"pow"; }
function currentMode(){ const b=$$(".tabs button").find(x=>x.getAttribute("aria-selected")==="true"); return b?b.dataset.mode:firstMode(); }
function showMode(mode){
  if(!settings.modes[mode]) mode=firstMode();
  const switching=currentMode()!==mode;
  if(switching) stopSpeech();
  const g0=speechGen;
  $$(".modepanel").forEach(p=>p.classList.add("hidden"));
  $("#mode-"+mode).classList.remove("hidden");
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===mode; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; });
  if(!made[mode]) NEWFN[mode]();
  if(switching && speechGen===g0) maybeAuto(mode);
}
function syncTabs(){
  $$(".tabs button").forEach(b=>b.classList.toggle("hidden",!settings.modes[b.dataset.mode]));
  if(!settings.modes[currentMode()]) showMode(firstMode());
}
function resetRounds(){ MODES.forEach(m=>made[m]=false); stopSpeech(); NEWFN[currentMode()](); }

/* ---------- Settings drawer ---------- */
function buildModeToggles(){
  const wrap=$("#modeToggles"); wrap.innerHTML="";
  MODES.forEach(m=>{ const l=document.createElement("label"); l.className="toggle";
    l.innerHTML=`<input type="checkbox" ${settings.modes[m]?"checked":""}> <span>${MODE_IC[m]} ${t(MODE_KEY[m])}</span>`;
    l.querySelector("input").addEventListener("change",e=>{ settings.modes[m]=e.target.checked;
      if(!MODES.some(k=>settings.modes[k])){ e.target.checked=true; settings.modes[m]=true; }
      saveSettings(); syncTabs(); });
    wrap.appendChild(l); });
}
function syncSettingsUI(){
  $("#setGrade").value=String(settings.grade); $("#setExp").value=String(settings.exp); $("#setNegIn").checked=settings.neg;
  $("#setAuto").checked=settings.autoRead; buildModeToggles();
}
function closeSettings(){ $("#settingsDrawer").classList.remove("open"); $("#openSettings").focus(); }
function initSettings(){
  $("#openSettings").addEventListener("click",()=>{ syncSettingsUI(); $("#settingsDrawer").classList.add("open"); $("#closeSettings").focus(); });
  $("#closeSettings").addEventListener("click",closeSettings);
  $("#settingsDrawer").addEventListener("click",e=>{ if(e.target.id==="settingsDrawer") closeSettings(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#settingsDrawer").classList.contains("open")) closeSettings(); });
  $("#setGrade").addEventListener("change",e=>{ const g=+e.target.value; settings.grade=g;
    Object.assign(settings,{exp:GRADES[g].exp,neg:GRADES[g].neg}); saveSettings(); syncSettingsUI(); resetRounds(); });
  $("#setExp").addEventListener("change",e=>{ settings.exp=+e.target.value; saveSettings(); resetRounds(); });
  $("#setNegIn").addEventListener("change",e=>{ settings.neg=e.target.checked; saveSettings(); resetRounds(); });
  $("#setAuto").addEventListener("change",e=>{ settings.autoRead=e.target.checked; saveSettings(); });
  $("#printCards").addEventListener("click",()=>{ buildPrintCards(); window.print(); });
}

/* ---------- Print cards ---------- */
function buildPrintCards(){
  const bl=`<span style="display:inline-block;min-width:3.5rem;border-bottom:2px solid #000">&nbsp;</span>`, line=(...x)=>x.map(e=>e.h+" = "+bl).join("<br>");
  const fn=rand([24,36,48,60,72,90,108]), b=rand([2,3,5]), sq=ri(4,12), cb=ri(2,5);
  let n1; do n1=ri(10,90); while(Number.isInteger(Math.sqrt(n1)));
  const D1=rndD(), D2=rndD(), D3=rndD(), D4=rndD(), e1=ri(4,Math.min(9,EX())), e2=NEG()?-ri(2,6):ri(3,6), e3=ri(3,Math.min(8,EX())), e4=NEG()?-ri(2,5):ri(2,5);
  const cards=[
    {title:t("mPow"), body:t("cardPow"), html:line(X(P(ri(2,6),3)),X(P(2,ri(4,6))),X(N(ri(2,9)),"+",P(ri(2,5),2)))+`<br>${M(fn)} = ${bl}`},
    {title:t("mLaws"), body:t("cardLaws"), html:line(X(P(b,ri(2,4)),"·",P(b,ri(2,3))),{h:M(frH(P(b,5).h,P(b,2).h))},{h:M(`(${P(b,2).h})<sup>3</sup>`)})+(NEG()?"<br>"+line(X(P(b,0)),X(P(b,-2))):"")},
    {title:t("mRoot"), body:t("cardRoot"), html:[sq*sq,cb*cb*cb].map((v,i)=>M(`x<sup>${i+2}</sup> = ${v}`)+" → "+M("x = ")+bl).join("<br>")+`<br>${M(sqH(n1))} ≈ ${bl}`+NL({min:Math.floor(Math.sqrt(n1))-1,max:Math.floor(Math.sqrt(n1))+2}).html},
    {title:t("mSci"), body:t("cardSci"), html:[STD(D1,e1+1),STD(D2,e2+1),SCID(D3,e3+1),SCID(D4,e4+1)].map(x=>M(x.h)+" → "+bl).join("<br>")},
    {title:t("mOps"), body:t("cardOps"), html:line(X(CX(SCI(3,4),SCI(2.5,3),"×")),X(CX(SCI(8,9),SCI(2,4),"÷")),X(SCI(4.2,5),"+",SCI(3.1,5)))}
  ];
  $("#printArea").innerHTML=`<h1>${t("cardTitle")}</h1><p>${t("cardName")} ____________________</p>`+
    cards.map(c=>`<div class="card-print"><h2>${c.title}</h2><p style="font-size:1.1rem">${c.body}</p><p style="font-size:1.4rem;line-height:2.2">${c.html}</p></div>`).join("")+
    `<p style="font-size:.85rem">${stdsHTML()}</p>`;
}

// Standards codes stay left-to-right inside Arabic/Urdu text.
function stdsHTML(){ return t("stds").replace(/(TEKS|Common Core|\d\.(?:EE|NS)\.\d+|\d\.\d+\([A-Z]\))/g,'<bdi dir="ltr">$1</bdi>'); }

/* ---------- Language engine ---------- */
function resolveLang(){
  try{ const q=new URLSearchParams(location.search).get("lang"); if(q && T[q]) return q; }catch(e){}
  try{ const s=localStorage.getItem(LANG_KEY); if(s && T[s]) return s; }catch(e){}
  const n=(navigator.language||"en").slice(0,2).toLowerCase();
  if(T[n]) return n;
  return "en";
}
function applyLang(){
  const meta=LANGS.find(x=>x.code===lang)||LANGS[0];
  document.documentElement.lang=lang;
  document.documentElement.dir=meta.dir;
  document.title=t("appTitle");
  const sel=$("#langSelect"); if(sel) sel.value=lang;
  $$("[data-t]").forEach(el=>{ el.textContent=t(el.getAttribute("data-t")); });
  $$("[data-ta]").forEach(el=>{ const v=t(el.getAttribute("data-ta")); el.setAttribute("aria-label",v); el.title=v; });
  $("#stdsNote").innerHTML=stdsHTML();
  buildModeToggles();
  resetRounds();
}
function setLang(l){ if(!T[l]) l="en"; lang=l; try{ localStorage.setItem(LANG_KEY,l); }catch(e){} applyLang(); }
function buildLangSelect(){
  const sel=$("#langSelect"); sel.innerHTML="";
  LANGS.forEach(m=>{ const o=document.createElement("option"); o.value=m.code; o.textContent=m.name; sel.appendChild(o); });
  sel.value=lang;
  sel.addEventListener("change",()=>setLang(sel.value));
}

/* ---------- Init ---------- */
function buildUI(){
  $("#tabs").innerHTML=MODES.map(m=>`<button type="button" role="tab" id="tab-${m}" aria-controls="mode-${m}" aria-selected="false" data-mode="${m}"><span class="ic" aria-hidden="true">${MODE_IC[m]}</span><span data-t="${MODE_KEY[m]}"></span></button>`).join("");
  $("#panels").innerHTML=MODES.map(m=>`<section id="mode-${m}" class="panel modepanel hidden" role="tabpanel" aria-labelledby="tab-${m}">
    <div class="panelhead"><h2 data-t="${MODE_KEY[m]}"></h2><button type="button" class="btn ghost no-print" data-new="${m}" data-t="newRound"></button></div>
    <div class="prompt"><button type="button" class="speaker" data-speak="${m}" data-ta="readAloud" aria-label="Read aloud">🔊</button><span id="p-${m}">…</span></div>
    <div class="ctx hidden" id="x-${m}"></div>
    <div class="work" id="w-${m}"></div>
    <div class="acts no-print" id="a-${m}"></div>
    <div class="choices" id="c-${m}" role="group" data-ta="choicesLbl" aria-label="Answer choices"></div>
    <div class="feedback" id="f-${m}" role="status" aria-live="polite"></div></section>`).join("");
  // Arrow keys move between tabs (WAI-ARIA tabs pattern).
  $("#tabs").addEventListener("keydown",e=>{ const vis=$$(".tabs button").filter(b=>!b.classList.contains("hidden")), i=vis.indexOf(document.activeElement); if(i<0) return;
    const rtl=document.documentElement.dir==="rtl", step={ArrowRight:rtl?-1:1,ArrowLeft:rtl?1:-1}[e.key]; if(!step) return;
    const nb=vis[(i+step+vis.length)%vis.length]; nb.focus(); showMode(nb.dataset.mode); e.preventDefault(); });
}
function init(){
  lang=resolveLang();
  buildUI();
  buildLangSelect();
  $$(".tabs button").forEach(b=>b.addEventListener("click",()=>showMode(b.dataset.mode)));
  $$(".speaker").forEach(b=>b.addEventListener("click",()=>speak(currentSpeech[b.dataset.speak])));
  $$("[data-new]").forEach(b=>b.addEventListener("click",()=>{ stopSpeech(); NEWFN[b.dataset.new](); }));
  initSettings();
  const f=firstMode();
  $$(".tabs button").forEach(b=>{ const on=b.dataset.mode===f; b.setAttribute("aria-selected",on?"true":"false"); b.tabIndex=on?0:-1; b.classList.toggle("hidden",!settings.modes[b.dataset.mode]); });
  $$(".modepanel").forEach(p=>p.classList.toggle("hidden",p.id!=="mode-"+f));
  applyLang();
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();
</script>
<script>
/* Student mute toggle — shared across the Digital Math Tools. Self-contained,
   offline, stores no student data. Gates ALL speech by intercepting
   speechSynthesis.speak, so muting works regardless of each tool's internals.
   Reads the shared language preference only to localize its own label. */
(function(){
  "use strict";
  var LKEY='tcea.mathtools.lang', MKEY='tcea.mathtools.muted';
  var CODES=['en','es','vi','ar','hi','ur','zh'];
  var LAB={
    mute:{en:"Mute sound",es:"Silenciar sonido",vi:"Tắt âm thanh",ar:"كتم الصوت",hi:"आवाज़ बंद करें",ur:"آواز بند کریں",zh:"静音"},
    unmute:{en:"Turn sound on",es:"Activar sonido",vi:"Bật âm thanh",ar:"تشغيل الصوت",hi:"आवाज़ चालू करें",ur:"آواز چالو کریں",zh:"打开声音"}
  };
  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  window.__MT_MUTED = (get(MKEY)==='1');
  // Intercept every speech request; suppress while muted.
  try{
    if(window.speechSynthesis && typeof window.speechSynthesis.speak==='function'){
      var ss=window.speechSynthesis, orig=ss.speak.bind(ss);
      ss.speak=function(u){ if(!window.__MT_MUTED){ try{orig(u);}catch(e){} } };
    }
  }catch(e){}
  function curLang(){ var l=get(LKEY)||'en'; return LAB.mute[l]?l:'en'; }
  function label(el){
    var on=!window.__MT_MUTED, l=curLang(), txt=on?LAB.mute[l]:LAB.unmute[l];
    el.textContent=on?'🔊':'🔇';
    el.setAttribute('aria-label',txt); el.setAttribute('title',txt);
    el.setAttribute('aria-pressed', on?'false':'true');
  }
  function findLangSelect(){
    var sels=document.querySelectorAll('select');
    for(var i=0;i<sels.length;i++){ var o=sels[i].options, c=0;
      for(var j=0;j<o.length;j++){ if(CODES.indexOf((o[j].value||'').toLowerCase())>=0) c++; }
      if(c>=3) return sels[i];
    }
    return null;
  }
  function build(){
    if(document.getElementById('mtMuteBtn')) return;
    if(!(('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window))) return;
    var btn=document.createElement('button');
    btn.id='mtMuteBtn'; btn.type='button';
    btn.style.cssText='font:inherit;font-size:1.15rem;line-height:1;cursor:pointer;'+
      'min-width:44px;min-height:44px;padding:8px 12px;border:2px solid #e2dcf1;'+
      'border-radius:10px;background:#fff;color:#5b3fa5;font-weight:700;margin:0 4px;';
    btn.addEventListener('click',function(){
      window.__MT_MUTED=!window.__MT_MUTED;
      set(MKEY, window.__MT_MUTED?'1':'0');
      if(window.__MT_MUTED){ try{window.speechSynthesis.cancel();}catch(e){} }
      label(btn);
    });
    btn.addEventListener('focus',function(){btn.style.outline='3px solid #5b3fa5';btn.style.outlineOffset='2px';});
    btn.addEventListener('blur',function(){btn.style.outline='';});
    var sel=findLangSelect();
    if(sel && sel.parentNode){
      sel.parentNode.insertBefore(btn, sel);
      sel.addEventListener('change',function(){ setTimeout(function(){label(btn);},0); });
    }else{
      btn.style.position='fixed'; btn.style.top='10px'; btn.style.zIndex='9999';
      btn.style[(document.documentElement.dir==='rtl')?'left':'right']='10px';
      (document.body||document.documentElement).appendChild(btn);
    }
    label(btn);
  }
  if(document.readyState==='complete'){ build(); }
  else{ window.addEventListener('load', build); }
  window.addEventListener('storage',function(e){ if(e.key===LKEY){ var b=document.getElementById('mtMuteBtn'); if(b) label(b); } });
})();
</script>
