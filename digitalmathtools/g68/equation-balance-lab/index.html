<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Equation Balance Lab — a Grades 6–8 algebra app: algebra tiles, a balance scale for solving equations, inequalities on a number line, writing and evaluating expressions, and the number of solutions. Works offline. No data collected.">
<title>Equation Balance Lab</title>
<style>
  :root{
    --bg:#f4eff8;--panel:#ffffff;--ink:#22172b;--muted:#54465f;--line:#d7c8e3;
    --accent:#8e44ad;--accentD:#6c3483;--accent-ink:#ffffff;--good:#166534;--good-bg:#dcfce7;
    --hint:#7a4a00;--hint-bg:#fff4d6;--focus:#0a58ca;
    --xpos:#4caf65;--xneg:#e5736f;--upos:#f5cf4a;--uneg:#ef9a9a;
    --tap:52px;font-size:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-text-size-adjust:100%}
  h1,h2,h3{line-height:1.15;margin:0 0 .3em}
  button{font-family:inherit;font-size:1rem;cursor:pointer}
  button:disabled{cursor:default}

  .topbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;background:var(--accent);color:var(--accent-ink);padding:.55rem .8rem}
  .topbar .brand{font-weight:800;font-size:1.25rem;display:flex;align-items:center;gap:.4rem;margin-inline-end:auto}
  .topbar a.homebtn,.topbar button.tb{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.4rem .7rem;min-height:var(--tap);min-width:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:.35rem;text-decoration:none;font-weight:700;font-size:.95rem}
  .globe{display:inline-flex;align-items:center;gap:.35rem;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.6);border-radius:12px;padding:.2rem .5rem;min-height:var(--tap)}
  .globe span{font-size:1.2rem}
  .globe select{border:0;background:#fff;color:var(--ink);border-radius:8px;min-height:44px;font-weight:700;font-size:1rem;padding:.2rem .4rem}

  main{max-width:1200px;margin:0 auto;padding:.7rem}
  .tabsrow{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:.4rem 0 .7rem}
  .tabs{display:flex;gap:.4rem;flex-wrap:wrap;flex:1 1 auto}
  .tabs button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:.45rem .75rem;min-height:var(--tap);font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:.4rem}
  .tabs button[aria-selected="true"]{background:var(--accentD);color:#fff;border-color:var(--accentD)}
  .tabs button .ic{font-size:1.15rem}
  .stars{background:#fff;border:2px solid var(--line);border-radius:14px;padding:.4rem .8rem;font-weight:800;font-size:1.15rem;min-height:48px;display:inline-flex;align-items:center;gap:.3rem}
  .stars.pop{animation:pop .5s ease}
  @keyframes pop{50%{transform:scale(1.18)}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:.9rem;margin-bottom:.8rem}
  .panelhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.6rem}
  .panelhead h2{margin:0;font-size:1.25rem;margin-inline-end:auto}

  .prompt{display:flex;align-items:center;gap:.6rem;background:#f6eefb;border:2px solid #dcc3ea;border-radius:14px;padding:.6rem .8rem;margin-bottom:.7rem;font-size:1.12rem;font-weight:600;line-height:1.7}
  .speaker{background:var(--accentD);color:#fff;border:0;border-radius:50%;width:var(--tap);height:var(--tap);min-width:var(--tap);font-size:1.4rem;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}

  .btn{background:var(--accentD);color:#fff;border:2px solid var(--accentD);border-radius:12px;padding:.5rem .85rem;min-height:var(--tap);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.3rem}
  .btn.ghost{background:var(--panel);color:var(--accentD)}
  .btn.sq{min-width:var(--tap);font-size:1.4rem;padding:.2rem .6rem}
  .btn[aria-pressed="true"]{background:var(--accentD);color:#fff}
  .btn:disabled{opacity:.45}

  .feedback{margin-top:.6rem;border-radius:12px;padding:.6rem .8rem;font-weight:600;display:none;line-height:1.8}
  .feedback.show{display:block}
  .feedback.good{background:var(--good-bg);color:var(--good);border:2px solid #86efac}
  .feedback.hint{background:var(--hint-bg);color:var(--hint);border:2px solid #f6d271}

  /* Math: always left-to-right, even inside Arabic/Urdu sentences */
  .math{unicode-bidi:isolate;direction:ltr;display:inline;font-weight:800;white-space:nowrap}
  .math i{font-family:Georgia,'Times New Roman',serif;font-weight:700;padding:0 .04em}
  .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-weight:800;margin:0 .08em;white-space:nowrap;font-size:.92em}
  .fr>span{padding:0 .16em}
  .fr>span:first-child{border-bottom:.12em solid currentColor}
  .big{font-size:1.7rem;text-align:center;margin:.3rem 0 .6rem;line-height:2;overflow-wrap:anywhere}
  .big .math,.feedback .math,.prompt .math,.chain .math,.steps .math{white-space:normal}

  .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;margin-top:.7rem}
  .choices:empty{display:none}
  .choice{background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:.5rem;min-height:64px;display:flex;align-items:center;justify-content:center;position:relative;font-size:1.3rem;font-weight:800;color:var(--ink)}
  .choice .lbl{unicode-bidi:isolate}
  .choice .math{white-space:normal}
  .choice.wide{font-size:1.05rem;font-weight:700}
  .choice.correctpick{border-color:var(--good);background:var(--good-bg)}
  .choice.wrongpick{border-color:#e3b341;background:var(--hint-bg);opacity:.75}
  .choice .badge{position:absolute;top:4px;inset-inline-end:6px;font-size:1.1rem;display:none}
  .choice.correctpick .badge{display:block}

  .work:empty{display:none}
  .acts{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;margin:.5rem 0}
  .acts:empty{display:none}
  .note{text-align:center;font-weight:600;color:var(--muted);min-height:1.4em;margin:.3rem 0;line-height:1.8}
  .legend{display:flex;flex-wrap:wrap;gap:.4rem .9rem;justify-content:center;font-size:.85rem;color:var(--muted);margin:.2rem 0 .4rem}
  .legend span{display:inline-flex;align-items:center;gap:.3rem}
  .sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.35)}

  /* Algebra tiles */
  .mat{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;justify-content:center;min-height:110px;padding:.6rem;border:2px dashed #b79acb;border-radius:14px;background:#fbf8fd}
  .matempty{color:var(--muted);align-self:center}
  .tile{border:2px solid rgba(0,0,0,.4);border-radius:6px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0;color:#1a1a1a;font-family:Georgia,serif;font-size:1rem;transition:transform .15s}
  .tile.tx{width:44px;height:100px}
  .tile.t1{width:44px;height:44px}
  .tile.tx.pos{background:var(--xpos)} .tile.tx.neg{background:var(--xneg)}
  .tile.t1.pos{background:var(--upos)} .tile.t1.neg{background:var(--uneg)}
  .tile.sel{outline:4px solid var(--focus);outline-offset:2px;transform:translateY(-6px)}
  .tile.gone{animation:vanish .3s forwards}
  @keyframes vanish{to{transform:scale(.2);opacity:0}}
  .tile.mini{width:22px;height:22px;font-size:.7rem;pointer-events:none}
  .tile.mini.tx{height:40px}
  .palette{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin:.6rem 0}
  .palbtn{background:#fff;border:2px solid var(--line);border-radius:12px;min-height:var(--tap);min-width:76px;padding:.3rem .6rem;display:inline-flex;align-items:center;gap:.4rem;font-weight:800;color:var(--accentD)}
  .area{width:min(100%,400px);display:block;margin:.3rem auto;height:auto}
  .area .cl{fill:#efe3f6;stroke:#3b1f4a;stroke-width:2}
  .area .cl.u{fill:#fdf3cf}
  .area .cell{cursor:pointer}
  .area .cell:focus{outline:none}
  .area .cell:focus rect{stroke:var(--focus);stroke-width:5}
  .area text{font-family:Georgia,serif;font-weight:700;font-size:26px;text-anchor:middle;fill:#22172b}
  .area .vi{font-style:italic}

  /* Balance */
  .bal{width:min(100%,640px);display:block;margin:0 auto;height:auto}
  .bal .bm{fill:#6c3483}
  .bal .fulc{fill:#b79acb;stroke:#3b1f4a;stroke-width:2}
  .bal .str{stroke:#5a4a66;stroke-width:2}
  .bal .pan{fill:#3b1f4a}
  .bal .bx{fill:var(--xpos);stroke:#1d4d2a;stroke-width:2}
  .bal .bx.neg{fill:var(--xneg);stroke:#7b241c}
  .bal .bu{fill:var(--upos);stroke:#7a5a00;stroke-width:1.5}
  .bal .bu.neg{fill:var(--uneg);stroke:#7b241c}
  .bal text{font-family:Georgia,serif;font-weight:700;text-anchor:middle;fill:#1a1a1a}
  .beam{transform-box:view-box;transform-origin:320px 76px}
  .beam.wob{animation:wob .7s ease}
  @keyframes wob{25%{transform:rotate(-3deg)}60%{transform:rotate(2deg)}100%{transform:rotate(0)}}
  .steps{list-style:none;padding:0;margin:.4rem auto;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:1.3rem}
  .steps li{display:flex;flex-direction:column;align-items:center}
  .steps li:last-child .eqs{background:#f6eefb;border-radius:10px;padding:0 .6rem}
  .opcap{font-size:.8rem;color:var(--muted);font-weight:600}
  .pad{display:flex;flex-direction:column;gap:.5rem;align-items:center;margin:.6rem 0 .2rem}
  .padrow{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;align-items:center}
  .opbtn{min-width:var(--tap);min-height:var(--tap);border-radius:12px;border:2px solid var(--line);background:#fff;font-size:1.5rem;font-weight:800;color:var(--accentD)}
  .opbtn[aria-pressed="true"]{background:var(--accentD);color:#fff;border-color:var(--accentD)}
  .numin{width:5.2rem;min-height:var(--tap);font-size:1.3rem;font-weight:800;text-align:center;border:2px solid var(--line);border-radius:12px;font-family:inherit}

  /* Number line */
  .nl{width:100%;max-width:720px;display:block;margin:0 auto;touch-action:none;height:auto}
  .nlax{stroke:#3b1f4a;stroke-width:4;stroke-linecap:round}
  .nlah{fill:#3b1f4a}
  .tk{stroke:#3b1f4a;stroke-width:3}
  .nlt{font-size:26px;font-weight:800;text-anchor:middle;fill:#22172b;font-family:system-ui,sans-serif}
  .ray{stroke:var(--accent);stroke-width:9;stroke-linecap:round}
  .rayh{fill:var(--accent)}
  .pt{stroke:var(--accentD);stroke-width:5}
  .pt.open{fill:#fff} .pt.closed{fill:var(--accentD)} .pt.unset{fill:#fff;stroke:#9a8aa6;stroke-dasharray:5 4}
  .hdl[tabindex]{cursor:grab}
  .hdl:focus{outline:none}
  .hdl:focus .pt{stroke:var(--focus);stroke-width:7}

  /* Write It */
  .tbl{border-collapse:collapse;margin:.4rem auto;font-size:1.25rem;font-weight:700}
  .tbl th,.tbl td{border:2px solid #b79acb;padding:.3rem .8rem;text-align:center;min-width:3rem}
  .tbl th{background:#f6eefb;font-family:Georgia,serif;font-style:italic}
  .expr{font-size:1.8rem;font-weight:800;text-align:center;margin:.6rem 0;line-height:2.2;direction:ltr;unicode-bidi:isolate}
  .opk{min-width:46px;min-height:46px;border-radius:12px;border:2px solid var(--accentD);background:#f6eefb;color:var(--accentD);font-size:1.5rem;font-weight:800;margin:0 .1em;vertical-align:middle;padding:0 .3rem}
  .opk.sup{min-width:44px;min-height:44px;font-size:1rem;vertical-align:super}
  .opk.bad{background:var(--hint-bg);border-color:#e3b341}
  .chain{font-size:1.15rem;text-align:center;line-height:2}

  /* Number of solutions */
  .tryx{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.5rem;margin:.5rem 0;font-weight:700}
  .tryout{flex:1 1 100%;text-align:center;font-size:1.15rem;line-height:1.9}

  .drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:50;align-items:flex-start;justify-content:center;padding:1rem}
  .drawer.open{display:flex}
  .drawer .card{background:var(--panel);border-radius:16px;max-width:600px;width:100%;padding:1rem;max-height:90vh;overflow:auto}
  .setrow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.5rem 0;padding:.5rem 0;border-bottom:1px solid var(--line)}
  .setrow .lab{font-weight:700;min-width:150px}
  .toggle{display:inline-flex;align-items:center;gap:.35rem;border:2px solid var(--line);border-radius:10px;padding:.35rem .55rem;background:#fff;min-height:44px}
  .toggle input{width:22px;height:22px}
  select.diff{font-size:1rem;padding:.4rem;border-radius:10px;border:2px solid var(--line);min-height:48px;max-width:100%}
  .wrapflex{display:flex;flex-wrap:wrap;gap:.4rem}

  footer{max-width:1200px;margin:.5rem auto 2rem;padding:.8rem;color:var(--muted);font-size:.9rem;text-align:center}
  footer a{color:var(--accentD);font-weight:700}
  .stds{font-size:.82rem;color:var(--muted);background:#faf6fd;border:1px dashed var(--line);border-radius:12px;padding:.5rem .7rem;margin-top:.4rem}

  .hidden{display:none !important}
  :focus-visible{outline:4px solid var(--focus);outline-offset:2px}
  @media (max-width:480px){ :root{font-size:17px} .big{font-size:1.4rem} .expr{font-size:1.45rem} .steps{font-size:1.1rem} .tabs button{padding:.4rem .55rem;font-size:.92rem} .panel{padding:.6rem} .tile.tx{height:88px;width:40px} .tile.t1{width:40px;height:40px} }
  @media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

  .printonly{display:none}
  @media print{
    .topbar,.tabsrow,footer,.modepanel,#stdsNote,.no-print,#mtMuteBtn{display:none !important}
    body{background:#fff}
    .printonly{display:block}
    .card-print{border:2px solid #000;border-radius:12px;padding:1rem;margin:0 0 1rem;page-break-inside:avoid}
    .card-print h2{margin:.2rem 0}
    .card-print svg{max-height:150px;max-width:100%}
    main{max-width:100%}
  }
</style>
</head>
<body>
<header class="topbar">
  <span class="brand">🧩 <span data-t="appTitle">Equation Balance Lab</span></span>
  <a class="homebtn" href="../../index.html">🏠 <span data-t="home">Home</span></a>
  <label class="globe"><span aria-hidden="true">🌐</span>
    <select id="langSelect" aria-label="Language / Idioma"></select>
  </label>
  <button class="tb settingsbtn" id="openSettings" type="button">⚙️ <span data-t="teacher">Teacher</span></button>
</header>

<main>
  <div class="tabsrow">
    <div class="tabs" id="tabs" role="tablist" data-ta="modesLbl" aria-label="Modes"></div>
    <span class="stars" id="stars"><span aria-hidden="true">⭐</span><span class="sr" data-t="stars">Problems solved</span> <b id="starCount">0</b></span>
  </div>
  <div id="panels"></div>
  <div class="stds" id="stdsNote"></div>
  <div class="printonly" id="printArea"></div>
</main>

<footer>
  <p data-t="footNote">No accounts · No data collected · Works offline</p>
  <p><a href="../../index.html" data-t="home">Home</a> · <a href="../../policy.html" data-t="privacy">Privacy</a></p>
</footer>

<!-- SETTINGS -->
<div class="drawer" id="settingsDrawer" role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="card">
    <div class="panelhead"><h2 id="setTitle" data-t="teacherTitle">Teacher settings</h2>
      <button class="btn ghost" id="closeSettings" type="button" data-t="close">Close</button></div>
    <div class="setrow"><label class="lab" for="setGrade" data-t="setGrade">Grade level</label>
      <select class="diff" id="setGrade">
        <option value="6" data-t="g6">Grade 6</option>
        <option value="7" data-t="g7">Grade 7</option>
        <option value="8" data-t="g8">Grade 8</option></select>
      <p class="stds" style="margin:0;flex:1 1 100%" data-t="gradeNote"></p></div>
    <div class="setrow"><span class="lab" data-t="setNeg">Negative numbers</span>
      <label class="toggle"><input type="checkbox" id="setNeg"> <span data-t="negOn">Use negative numbers and integers</span></label></div>
    <div class="setrow"><label class="lab" for="setMax" data-t="setMax">Number size</label>
      <select class="diff" id="setMax"></select></div>
    <div class="setrow"><label class="lab" for="setEq" data-t="setEq">Balance equations</label>
      <select class="diff" id="setEq">
        <option value="one" data-t="eqOne">One-step</option>
        <option value="two" data-t="eqTwo">Two-step</option>
        <option value="both" data-t="eqBoth">Variables on both sides</option>
        <option value="mix" data-t="eqMix">Mixed</option></select></div>
    <div class="setrow"><span class="lab" data-t="setModes">Modes</span>
      <div id="modeToggles" class="wrapflex"></div></div>
    <div class="setrow"><span class="lab" data-t="setSpeech">Speech</span>
      <label class="toggle"><input type="checkbox" id="setAuto"> <span data-t="autoRead">Auto-read directions</span></label></div>
    <div class="setrow" style="border:0"><button class="btn" id="printCards" type="button">🖨 <span data-t="printCards">Print challenge cards</span></button></div>
    <p class="stds" data-t="setStored">Settings are saved only on this device. No student information is ever stored.</p>
  </div>
</div>

<script>
"use strict";
/* =========================================================================
   Equation Balance Lab — single-file Grades 6–8 expressions, equations and
   inequalities app. 7 languages. No frameworks, no network, no data collection.
   ========================================================================= */

/* ---------- Language metadata ---------- */
const LANGS = [
  {code:"en", name:"English",     dir:"ltr", bcp:"en-US"},
  {code:"es", name:"Español",     dir:"ltr", bcp:"es-ES"},
  {code:"vi", name:"Tiếng Việt",  dir:"ltr", bcp:"vi-VN"},

    frSay:"{n} over {d}", sDiv:"{v} divided by {d}", sGroup:"{k} times the quantity {e}", sSq:"{b} squared", sCube:"{b} cubed", sPow:"{b} to the power {e}",
    sEq:"{a} equals {b}", sLt:"{a} is less than {b}", sGt:"{a} is greater than {b}", sLe:"{a} is less than or equal to {b}", sGe:"{a} is greater than or equal to {b}", sNe:"{a} is not equal to {b}",
    youPicked:"You picked {x}.",
    tileX:"x-tile (positive x)", tileNX:"negative x-tile", tileOne:"unit tile (positive 1)", tileNOne:"negative unit tile",

    hSigns:"Watch the signs. A negative tile cancels a positive tile of the same shape, so remove zero pairs first and count what is left.",

function Q(n,d){ if(Array.isArray(n)) return n; d=d||1; if(d<0){ n=-n; d=-d; } const g=gcd(n,d)||1; return [n/g,d/g]; }
const qa=(x,y)=>Q(x[0]*y[1]+y[0]*x[1],x[1]*y[1]), qs=(x,y)=>Q(x[0]*y[1]-y[0]*x[1],x[1]*y[1]);
const qm=(x,y)=>Q(x[0]*y[0],x[1]*y[1]), qd=(x,y)=>Q(x[0]*y[1],x[1]*y[0]);
const qv=x=>x[0]/x[1], qz=x=>x[0]===0, qeq=(x,y)=>x[0]===y[0]&&x[1]===y[1];
function qH(x){ x=Q(x); const n=Math.abs(x[0]); return (x[0]<0?"−":"")+(x[1]===1?n:frH(n,x[1])); }
function qS(x){ x=Q(x); const n=Math.abs(x[0]); return (x[0]<0?t("neg")+" ":"")+(x[1]===1?n:t("frSay",{n,d:x[1]})); }
function qP(x){ x=Q(x); const n=Math.abs(x[0]); return (x[0]<0?"−":"")+n+(x[1]===1?"":"/"+x[1]); } // plain text (SVG)
const N = k=>({h:qH(k),s:qS(k)});
const NP = k=>({h:qv(Q(k))<0?"("+qH(k)+")":qH(k), s:qS(k)}); // number, parenthesized if negative

/* ---------- Expressions: every message is a pair {h: HTML, s: speech} ----------
   term = [coef, v, d]: v null = constant, "x" = variable, array = coef × (group); d = shown as v/d */
function ex(terms){ const H=[],S=[];
  terms.forEach((tr,i)=>{ const c=Q(tr[0]), v=tr[1], d=tr[2], ng=c[0]<0, ab=[Math.abs(c[0]),c[1]], one=ab[0]===1&&ab[1]===1;
    let h,s;
    if(v==null){ h=qH(ab); s=qS(ab); }
    else if(Array.isArray(v)){ const g=ex(v); h=(one?"":qH(ab))+"("+g.h+")"; s=one?g.s:t("sGroup",{k:qS(ab),e:g.s}); }
    else if(d){ h=frH((one?"":qH(ab))+`<i>${v}</i>`,d); s=t("sDiv",{v:(one?"":qS(ab)+" ")+v,d}); }
    else { h=(one?"":qH(ab))+`<i>${v}</i>`; s=(one?"":qS(ab)+" ")+v; }
    if(i===0){ H.push((ng?"−":"")+h); S.push((ng?t("neg")+" ":"")+s); }
    else { H.push((ng?"− ":"+ ")+h); S.push(t(ng?"wMinus":"wPlus")+" "+s); } });
  return {h:H.join(" "),s:S.join(" ")};
}
function lin(a,b,v){ a=Q(a); b=Q(b===undefined?0:b); const tr=[]; if(!qz(a)) tr.push([a,v||"x"]); if(!qz(b)||qz(a)) tr.push([b,null]); return ex(tr); }
function collect(terms){ let A=Q(0),B=Q(0);
  terms.forEach(tr=>{ const c=Q(tr[0]), v=tr[1];
    if(v==null) B=qa(B,c);
    else if(Array.isArray(v)){ const [a,b]=collect(v); A=qa(A,qm(c,a)); B=qa(B,qm(c,b)); }
    else A=qa(A,tr[2]?qd(c,Q(tr[2])):c); });
  return [A,B];
}

  if(qz(a)){ h=qH(b); s=qS(b); }
  else { const one=qeq(a,Q(1)), mone=qeq(a,Q(-1));
    h=(one?"":mone?"−":qH(a))+(one?kk.h:"("+qH(k)+")"); s=(one?"":qS(a)+" "+t("wTimes")+" ")+qS(k);

const speechOK = ("speechSynthesis" in window);
function bcpFor(l){ const m=LANGS.find(x=>x.code===l); return m?m.bcp:"en-US"; }
// Prefer warm, natural voices; avoid harsh robotic engines.
function pickWarmVoice(code){
  const vs = speechSynthesis.getVoices()||[];
  const want=code.toLowerCase(), two=want.slice(0,2);
  let best=null, bs=-1;
  for(const v of vs){
    const lc=(v.lang||'').toLowerCase().replace('_','-');
    if(lc!==want && lc.slice(0,2)!==two) continue;
    let s=(lc===want?100:60); const n=(v.name||'').toLowerCase();
    if(/google|natural|neural|online|premium|enhanced|siri/.test(n)) s+=40;
    if(/female|woman|samantha|karen|tessa|moira|fiona|serena|victoria|allison|ava|susan|zoe|amelie|amélie|paulina|monica|mónica|zira|hazel|catherine|linda|kanya|lekha|ting-ting|mei-jia|sin-ji|yu-shu|huihui|xiaoxiao/.test(n)) s+=18;
    if(/espeak|compact|festival|pico|robot|eloquence/.test(n)) s-=60;
    if(v.localService===false) s+=8;
    if(v.default) s+=2;
    if(s>bs){ bs=s; best=v; }
  }
  return best;
}
/* Speech queue. Fixes cut-off audio:
   - a new round no longer calls cancel() over the praise; rounds advance on onend
   - long text is split into sentences (Chrome stops utterances after ~15 s)
   - utterances are kept referenced so Chrome can't garbage-collect them mid-speech
   - after cancel(), the next speak() waits a beat (Chrome drops it otherwise) */
let speechGen=0, speechKeep=[], speechPendingDone=null, speechStarted=false;
function splitSpeech(text){
  const parts=String(text).match(/[^.!?。！？؟।۔]+[.!?。！？؟।۔]*\s*/g)||[text];
  return parts.map(x=>x.trim()).filter(Boolean);
}
function speechEstimateMs(text){ const per=/^(zh)$/.test(lang)?300:95; return 1200+String(text).length*per/0.9; }
function stopSpeech(){
  speechGen++; const d=speechPendingDone; speechPendingDone=null; speechKeep=[];
  if(speechOK){ try{ speechSynthesis.cancel(); }catch(e){} }
  if(d) setTimeout(d,0);
}
function speak(text,onDone){
  const prevDone=speechPendingDone; speechPendingDone=null;
  const gen=++speechGen; let fired=false;
  const done=()=>{ if(fired) return; fired=true; if(speechPendingDone===done) speechPendingDone=null; if(onDone) onDone(); };
  if(onDone) speechPendingDone=done;
  if(prevDone) setTimeout(prevDone,0);  // a superseded speech still lets its round advance
  if(!speechOK || !text || window.__MT_MUTED){ if(onDone) setTimeout(done,700); return; }
  let busy=false;
  try{ busy=speechSynthesis.speaking||speechSynthesis.pending; speechSynthesis.cancel(); }catch(e){}
  const parts=splitSpeech(text), bcp=bcpFor(lang), voice=pickWarmVoice(bcp);
  const start=()=>{
    if(gen!==speechGen) return;
    speechKeep=[];
    try{
      if(speechSynthesis.paused) speechSynthesis.resume();
      parts.forEach((p,i)=>{
        const u=new SpeechSynthesisUtterance(p);
        u.lang=bcp; if(voice) u.voice=voice; u.rate=0.95; u.pitch=1.05;
        u.onstart=()=>{ speechStarted=true; };
        if(i===parts.length-1){ u.onend=done; u.onerror=done; }
        speechKeep.push(u); speechSynthesis.speak(u);
      });
    }catch(e){ done(); }
  };
  if(busy) setTimeout(start,120); else start();
  // Safety net: some engines never fire onend.
  if(onDone) setTimeout(done,speechEstimateMs(text)+2500);
}
/* Speak praise, then start the next round once it finishes (never sooner than minMs). */
const roundIds={tiles:0,balance:0,ineq:0,write:0,sols:0};
function afterPraise(msg,key,next,minMs){
  const id=roundIds[key], t0=Date.now();
  speak(msg,()=>{
    const wait=Math.max(450,(minMs||1200)-(Date.now()-t0));
    setTimeout(()=>{ if(roundIds[key]===id) next(); },wait);
  });
}

function genEq(kind){
  const mx=MX(), neg=settings.neg; let L,R,k;
  if(kind==="one"){ const ty=rand(["add","sub","mul","div"]);
    if(ty==="add"){ const b=ri(1,mx); k=neg?R1(-9,mx,[0]):ri(1,mx); L=[1,b]; R=[0,k+b]; }
    else if(ty==="sub"){ const b=ri(1,mx); k=neg?R1(-9,mx,[0]):b+ri(1,mx); L=[1,-b]; R=[0,k-b]; if(!neg&&k-b<=0){ k=b+1; R=[0,1]; } }
    else if(ty==="mul"){ const a=neg?R1(-9,9,[0,1,-1]):ri(2,9); k=neg?R1(-10,10,[0]):ri(1,10); L=[a,0]; R=[0,a*k]; }
    else { const a=ri(2,6), c=neg?R1(-9,9,[0]):ri(1,10); k=a*c; L=[Q(1,a),0]; R=[0,c]; }
  }else if(kind==="two"){
    let n=0; do{ k=neg?R1(-9,9,[0]):ri(1,10);
      if(Math.random()<.25){ const a=ri(2,5), j=neg?R1(-6,6,[0]):ri(1,6), b=neg?R1(-mx,mx,[0]):ri(1,mx); k=a*j; L=[Q(1,a),b]; R=[0,j+b]; }
      else { const a=neg?R1(-6,6,[0,1,-1]):ri(2,6), b=R1(-mx,mx,[0]); L=[a,b]; R=[0,a*k+b]; }
    }while(!neg&&qv(Q(R[1]))<=0&&++n<50);
  }else{
    let n=0; do{ const a=neg?R1(-5,7,[0]):ri(1,7); let c=neg?R1(-5,7,[0,a]):R1(1,7,[a]); k=neg?R1(-8,8,[0]):ri(1,10);
      const b=neg?R1(-mx,mx,[0]):ri(1,mx); L=[a,b]; R=[c,a*k+b-c*k];
    }while((!neg&&R[1]<=0||R[1]===0)&&++n<80);
  }
  L=[Q(L[0]),Q(L[1])]; R=[Q(R[0]),Q(R[1])];
  if(Math.random()<.25) [L,R]=[R,L];
  return {L,R,k};
}

    pr={e:{h:`${k}<i>x</i><sup>2</sup> + ${m_}`,s:`${k} ${t("sSq",{b:"x"})} ${t("wPlus")} ${m_}`},v}; }
  else { const k=ri(2,6), m_=ri(1,6), n2=ri(1,9), v=neg?R1(-5,6,[m_]):m_+ri(1,6);
    tree=O_("+",O_("×",L_(k),O_("−",L_(v),L_(m_),1)),L_(n2));
    pr={e:ex([[k,[[1,"x"],[-m_,null]]],[n2,null]]),v}; }
  return {tree,pr};
}
function tH(x,btn,ids){ if(isLeaf(x)) return x.n<0?"("+qH(x.n)+")":qH(x.n);
  let h;
  if(x.o==="^"){ const sup=btn?`<button type="button" class="opk sup" data-id="${ids.push(x)-1}" aria-label="${esc(t("sPow",{b:"",e:x.r.n}).trim())}">${x.r.n}</button>`:x.r.n;
    h=tH(x.l,btn,ids)+`<sup>${sup}</sup>`; }
  else { const op=btn?`<button type="button" class="opk" data-id="${ids.push(x)-1}" aria-label="${t(OPW[x.o])}">${x.o}</button>`:x.o;
    h=tH(x.l,btn,ids)+" "+op+" "+tH(x.r,btn,ids); }

}
function tS(x){ if(isLeaf(x)) return qS(x.n);
  if(x.o==="^") return t(x.r.n===2?"sSq":x.r.n===3?"sCube":"sPow",{b:tS(x.l),e:x.r.n});
  return tS(x.l)+" "+t(OPW[x.o])+" "+tS(x.r); }
function eligible(x,out){ out=out||[]; if(isLeaf(x)) return out; if(isLeaf(x.l)&&isLeaf(x.r)) out.push(x); else { eligible(x.l,out); eligible(x.r,out); } return out; }

function newWrite(){

/* =========================================================================
   5. HOW MANY SOLUTIONS? — one, none, infinitely many
   ========================================================================= */
function sideForm(A,B,g){ const neg=settings.neg, f=[()=>lin2(A,B)];
  const ok=[1,2,3,4,5].filter(a1=>a1!==A&&A-a1!==0&&(neg||A-a1>0));
  if(ok.length) f.push(()=>{ const a1=rand(ok); return B?[[a1,"x"],[B,null],[A-a1,"x"]]:[[a1,"x"],[A-a1,"x"]]; });
  if(B&&Math.abs(B)>2) f.push(()=>{ const b1=R1(1,Math.abs(B)+3,[B]); return A?[[A,"x"],[b1,null],[B-b1,null]]:[[b1,null],[B-b1,null]]; });
  if(g>=8&&A){ const ps=[2,3,4,-2].filter(p=>A%p===0&&(neg||p>0)); if(ps.length) f.push(()=>{ const p=rand(ps), q=R1(neg?-4:1,5,[0]), r=B-p*q; return r?[[p,[[A/p,"x"],[q,null]]],[r,null]]:[[p,[[A/p,"x"],[q,null]]]]; }); }
  return rand(f)();
}
function lin2(A,B){ const tr=[]; if(A) tr.push([A,"x"]); if(B||!A) tr.push([B,null]); return tr; }
function genSols(){ const g=G(), neg=settings.neg, kind=rand(["one","none","inf"]);
  let A=neg?R1(-4,6,[0]):ri(1,6), C=kind==="one"?(neg?R1(-4,6,[A]):R1(1,6,[A])):A, B, D, k=null;
  B=neg?R1(-9,9):ri(1,9);
  if(kind==="one"){ k=neg?R1(-6,6):ri(1,6); D=(A-C)*k+B; if(!neg&&D<0){ [A,C]=[C,A]; D=(A-C)*k+B; } }
  else if(kind==="none") D=B+(neg?R1(-6,6,[0]):R1(1,8,[0]));
  else D=B;
  if(!neg&&D<0) D=B+ri(1,5);
  let Lt=sideForm(A,B,g), Rt=sideForm(C,D,g);
  if(JSON.stringify(Lt)===JSON.stringify(Rt)) Lt=sideForm(A,B,g);
  return {kind,A,B,C,D,k,Lt,Rt};
}
function newSols(){
  const m="sols"; startRound(m); const s=st[m], S=genSols(), w=$("#w-"+m);
  const e=rel(ex(S.Lt),"=",ex(S.Rt)), se=rel(lin(S.A,S.B),"=",lin(S.C,S.D));
  s.x=0;

    <div class="tryx no-print"><span>${t("tryX")}</span><button type="button" class="opbtn" id="txDn" aria-label="${t("lessN")}">−</button>
    <b class="math" id="txV" style="min-width:2.5rem;text-align:center;font-size:1.3rem">0</b><button type="button" class="opbtn" id="txUp" aria-label="${t("moreN")}">+</button>
    <div class="tryout" id="txOut" aria-live="polite"></div></div>`;
  const tryDraw=()=>{ const x=s.x, lv=qv(collect(S.Lt)[0])*x+qv(collect(S.Lt)[1]), rv=qv(collect(S.Rt)[0])*x+qv(collect(S.Rt)[1]);
    $("#txV").textContent=x<0?"−"+(-x):x;
    $("#txOut").innerHTML=`${t("leftSide")}: ${M(qH(lv))} &nbsp; ${t("rightSide")}: ${M(qH(rv))} &nbsp; ${lv===rv?"✅ "+t("tryEq"):"≠ "+t("tryNe")}`; };
  $("#txDn").addEventListener("click",()=>{ if(s.done) return; s.x=Math.max(-20,s.x-1); tryDraw(); });
  $("#txUp").addEventListener("click",()=>{ if(s.done) return; s.x=Math.min(20,s.x+1); tryDraw(); });
  tryDraw();
  const showS=()=>{ const el=$("#simpd"); el.innerHTML=tm("simpShown",{e:se}).h; el.classList.remove("hidden"); };
  actBtn(m,"🧹 "+t("simplify"),showS,"ghost");
  const ax=lin(S.A,0), cx=lin(S.C,0), stmt=rel(N(S.B),"≠",N(S.D)), stF=rel(N(S.B),"=",N(S.D));
  const C=[{key:"one",ok:S.kind==="one",h:t("oneSol"),s:t("oneSol")},{key:"none",ok:S.kind==="none",h:t("noSol"),s:t("noSol")},{key:"inf",ok:S.kind==="inf",h:t("infSol"),s:t("infSol")}];
  const g_=$("#c-"+m); choices(m,C,it=>{
    if(it.ok){ showS(); return win(m,S.kind==="one"?tm("goodOne",{ax,cx,k:N(S.k)}):S.kind==="none"?tm("goodNone",{ax,stmt}):tm("goodInf",{e:lin(S.A,S.B)})); }
    nope(m,S.kind==="one"?tm("hOne",{eq:se}):S.kind==="none"?tm("hNone",{eq:se,stmt:stF}):tm("hInf",{eq:se})); },"wide");
  g_.style.gridTemplateColumns="repeat(auto-fit,minmax(170px,1fr))";
  setPrompt(m,tm("solDir",{e}));

/* ---------- Mode switching ---------- */
const NEWFN={tiles:newTiles,balance:newBalance,ineq:newIneq,write:newWrite,sols:newSols};
function firstMode(){ return MODES.find(m=>settings.modes[m])||"tiles"; }
function currentMode(){ const b=$$(".tabs button").find(x=>x.getAttribute("aria-selected")==="true"); return b?b.dataset.mode:firstMode(); }
function showMode(mode){
  if(!settings.modes[mode]) mode=firstMode();
  const switching=currentMode()!==mode;
  if(switching) stopSpeech();
  const g0=speechGen;
  $$(".modepanel").forEach(p=>p.classList.add("hidden"));
  $("#mode-"+mode).classList.remove("hidden");

// Standards codes stay left-to-right inside Arabic/Urdu text.
function stdsHTML(){ return t("stds").replace(/(TEKS|Common Core|\d\.(?:EE\.)?\d+[a-z]?(?:\([^)]*\))?)/g,'<bdi dir="ltr">$1</bdi>'); }

/* ---------- Language engine ---------- */
function resolveLang(){
  try{ const q=new URLSearchParams(location.search).get("lang"); if(q && T[q]) return q; }catch(e){}
  try{ const s=localStorage.getItem(LANG_KEY); if(s && T[s]) return s; }catch(e){}

  return "en";
}

  const sel=$("#langSelect"); if(sel) sel.value=lang;

}

/* ---------- Init ---------- */

    <div class="prompt"><button type="button" class="speaker" data-speak="${m}" data-ta="readAloud" aria-label="Read aloud">🔊</button><span id="p-${m}">…</span></div>

  $("#tabs").addEventListener("keydown",e=>{ const vis=$$(".tabs button").filter(b=>!b.classList.contains("hidden")), i=vis.indexOf(document.activeElement); if(i<0) return;
    const rtl=document.documentElement.dir==="rtl", step={ArrowRight:rtl?-1:1,ArrowLeft:rtl?1:-1}[e.key]; if(!step) return;

function init(){

  $$(".speaker").forEach(b=>b.addEventListener("click",()=>speak(currentSpeech[b.dataset.speak])));

</script>
<script>
/* Student mute toggle — shared across the Digital Math Tools. Self-contained,

   speechSynthesis.speak, so muting works regardless of each tool's internals.
   Reads the shared language preference only to localize its own label. */
(function(){
  "use strict";
  var LKEY='tcea.mathtools.lang', MKEY='tcea.mathtools.muted';
  var CODES=['en','es','vi','ar','hi','ur','zh'];
  var LAB={
    mute:{en:"Mute sound",es:"Silenciar sonido",vi:"Tắt âm thanh",ar:"كتم الصوت",hi:"आवाज़ बंद करें",ur:"آواز بند کریں",zh:"静音"},
    unmute:{en:"Turn sound on",es:"Activar sonido",vi:"Bật âm thanh",ar:"تشغيل الصوت",hi:"आवाज़ चालू करें",ur:"آواز چالو کریں",zh:"打开声音"}
  };
  function get(k){try{return localStorage.getItem(k);}catch(e){return null;}}
  function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}

  try{
    if(window.speechSynthesis && typeof window.speechSynthesis.speak==='function'){
      var ss=window.speechSynthesis, orig=ss.speak.bind(ss);
      ss.speak=function(u){ if(!window.__MT_MUTED){ try{orig(u);}catch(e){} } };
    }
  }catch(e){}
  function curLang(){ var l=get(LKEY)||'en'; return LAB.mute[l]?l:'en'; }
  function label(el){
    var on=!window.__MT_MUTED, l=curLang(), txt=on?LAB.mute[l]:LAB.unmute[l];
    el.textContent=on?'🔊':'🔇';
    el.setAttribute('aria-label',txt); el.setAttribute('title',txt);
    el.setAttribute('aria-pressed', on?'false':'true');
  }
  function findLangSelect(){
    var sels=document.querySelectorAll('select');
    for(var i=0;i<sels.length;i++){ var o=sels[i].options, c=0;
      for(var j=0;j<o.length;j++){ if(CODES.indexOf((o[j].value||'').toLowerCase())>=0) c++; }
      if(c>=3) return sels[i];
    }
    return null;
  }
  function build(){
    if(document.getElementById('mtMuteBtn')) return;
    if(!(('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window))) return;

    btn.id='mtMuteBtn'; btn.type='button';
    btn.style.cssText='font:inherit;font-size:1.15rem;line-height:1;cursor:pointer;'+
      'min-width:44px;min-height:44px;padding:8px 12px;border:2px solid #e2dcf1;'+
      'border-radius:10px;background:#fff;color:#5b3fa5;font-weight:700;margin:0 4px;';
    btn.addEventListener('click',function(){
      window.__MT_MUTED=!window.__MT_MUTED;
      set(MKEY, window.__MT_MUTED?'1':'0');
      if(window.__MT_MUTED){ try{window.speechSynthesis.cancel();}catch(e){} }
      label(btn);
    });
    btn.addEventListener('focus',function(){btn.style.outline='3px solid #5b3fa5';btn.style.outlineOffset='2px';});
    btn.addEventListener('blur',function(){btn.style.outline='';});
    var sel=findLangSelect();
    if(sel && sel.parentNode){
      sel.parentNode.insertBefore(btn, sel);
      sel.addEventListener('change',function(){ setTimeout(function(){label(btn);},0); });
    }else{
      btn.style.position='fixed'; btn.style.top='10px'; btn.style.zIndex='9999';
      btn.style[(document.documentElement.dir==='rtl')?'left':'right']='10px';
      (document.body||document.documentElement).appendChild(btn);
    }
    label(btn);
  }
  if(document.readyState==='complete'){ build(); }
  else{ window.addEventListener('load', build); }
  window.addEventListener('storage',function(e){ if(e.key===LKEY){ var b=document.getElementById('mtMuteBtn'); if(b) label(b); } });
})();
</script>
<script src="/activities/licensing-footer.js" defer></script>
</body>
