<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Digital Math Tools for Grades 6–8</title>
<meta name="description" content="Five self-contained, browser-based math tools for Grade 6, Grade 7, and Grade 8 students in seven languages. No logins, no data collected, works offline.">
<style>
  :root{
    --grape:#5b3fa5;--grape-d:#3f2a78;--sun:#ffcb3d;--sun-d:#e0a400;
    --paper:#f6f4fc;--ink:#1c1730;--ink-soft:#5b5470;--card:#fff;--line:#e2dcf1;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);
    background:radial-gradient(ellipse 60% 45% at 88% -5%,rgba(255,203,61,.18)0,transparent 60%),
    radial-gradient(ellipse 55% 45% at 0% 100%,rgba(91,63,165,.12)0,transparent 60%),var(--paper);
    min-height:100vh;line-height:1.55}
  a{color:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding:20px 20px 90px}

  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
  .crumb{font-weight:800;color:var(--grape);text-decoration:none;font-size:.9rem}
  .crumb:hover{text-decoration:underline}
  .langbar{display:flex;align-items:center;gap:8px;margin-left:auto}
  html[dir="rtl"] .langbar{margin-left:0;margin-right:auto}
  .langbar .globe{font-size:1.15rem}
  #lang{font-family:inherit;font-weight:700;font-size:.92rem;padding:8px 12px;border:2px solid var(--line);
    border-radius:10px;background:#fff;color:var(--grape);cursor:pointer}
  #lang:focus{outline:none;border-color:var(--grape)}

  header.top{text-align:center;padding:6px 0}
  .eyebrow{display:inline-block;background:var(--sun);color:var(--grape-d);font-weight:800;
    font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;padding:6px 18px;border-radius:100px;margin-bottom:14px}
  h1{font-weight:800;font-size:clamp(1.7rem,4.6vw,2.7rem);color:var(--grape);line-height:1.1;max-width:820px;margin:0 auto}
  .sub{color:var(--ink-soft);font-weight:600;margin:12px auto 0;max-width:640px}
  .tally{display:flex;justify-content:center;gap:34px;flex-wrap:wrap;margin-top:22px}
  .tally .n{font-weight:800;font-size:2rem;color:var(--grape);line-height:1}
  .tally .l{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:800;margin-top:3px}

  h2.sec{color:var(--grape);font-size:1.15rem;font-weight:800;margin:34px 0 12px;display:flex;align-items:center;gap:10px}
  h2.sec::after{content:"";flex:1;height:2px;background:var(--line)}

  .toolbar{position:sticky;top:0;z-index:20;background:rgba(246,244,252,.94);backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:16px 0 14px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 4px 14px rgba(30,23,48,.06)}
  #q{flex:1;min-width:200px;font-family:inherit;font-weight:600;font-size:1rem;padding:12px 14px;
    border:2px solid var(--line);border-radius:10px;color:var(--ink);background:#fff}
  #q:focus{outline:none;border-color:var(--grape)}
  .rand{background:var(--sun);color:var(--grape-d);border:none;border-radius:10px;padding:12px 18px;
    font-family:inherit;font-weight:800;cursor:pointer;font-size:.95rem;white-space:nowrap}
  .rand:hover{background:var(--sun-d);color:#fff}
  .count{font-weight:800;color:var(--ink-soft);font-size:.82rem;margin-left:auto;white-space:nowrap}
  html[dir="rtl"] .count{margin-left:0;margin-right:auto}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .tool{display:flex;flex-direction:column;background:var(--card);border:2px solid var(--line);
    border-top:6px solid var(--accent,#5b3fa5);border-radius:16px;padding:18px 18px 16px;text-decoration:none;
    transition:transform .18s cubic-bezier(.2,.7,.3,1),border-color .18s,box-shadow .2s;box-shadow:0 3px 10px rgba(30,23,48,.05)}
  .tool:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(30,23,48,.12)}
  .tool:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
  .tool .ico{font-size:2rem;line-height:1;margin-bottom:8px}
  .tool h3{color:var(--grape);font-size:1.12rem;line-height:1.15;margin-bottom:6px}
  .tool p{font-weight:600;color:var(--ink-soft);font-size:.86rem;flex-grow:1;margin-bottom:10px}
  .tool .tags{display:flex;flex-wrap:wrap;gap:5px}
  .tool .tag{font-size:.66rem;font-weight:800;color:var(--grape-d);background:#eee8fb;border-radius:6px;
    padding:3px 8px;text-transform:uppercase;letter-spacing:.04em}
  .empty{text-align:center;color:var(--ink-soft);font-weight:700;padding:40px 0}

  .note{background:#fff;border:2px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:26px;
    color:var(--ink-soft);font-weight:600;font-size:.9rem}
  .note b{color:var(--grape-d)}
  footer{text-align:center;margin-top:30px;font-size:.82rem;color:var(--ink-soft);font-weight:600}
  footer a{color:var(--grape);font-weight:800}
  @media (prefers-reduced-motion:reduce){.tool{transition:none}.tool:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="crumb" href="../index.html" id="crumb">Back</a>
    <div class="langbar"><span class="globe" aria-hidden="true">🌐</span>
      <select id="lang" aria-label="Language"></select></div>
  </div>

  <header class="top">
    <span class="eyebrow" id="eyebrow"></span>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="tally">
      <div><div class="n" id="tCount">0</div><div class="l" id="lTools"></div></div>
      <div><div class="n">7</div><div class="l" id="lLangs"></div></div>
      <div><div class="n">0</div><div class="l" id="lData"></div></div>
    </div>
  </header>

  <h2 class="sec" id="secFind"></h2>
  <div class="toolbar">
    <input id="q" type="search" autocomplete="off" aria-label="Search math tools">
    <button class="rand" id="rand">Random</button>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"></div>

  <div class="note" id="note"></div>

  <footer><span id="footText"></span> <a href="../policy.html" id="footPrivacy">Privacy</a></footer>
</div>

<script src="../catalog.js"></script>
<script>

  var STORAGE_KEY='tcea.mathtools.lang';
  var LANGS=[
    {code:'en',label:'English',dir:'ltr'},{code:'es',label:'Español',dir:'ltr'},
    {code:'vi',label:'Tiếng Việt',dir:'ltr'},{code:'ar',label:'العربية',dir:'rtl'},
    {code:'hi',label:'हिन्दी',dir:'ltr'},{code:'ur',label:'اردو',dir:'rtl'},

  var UI={
    crumb:{en:"‹ All Digital Math Tools",es:"‹ Todas las Herramientas de Matemáticas",vi:"‹ Tất cả Công cụ Toán",ar:"‹ كل أدوات الرياضيات",hi:"‹ सभी गणित उपकरण",ur:"‹ تمام ریاضی اوزار",zh:"‹ 所有数学工具"},
    eyebrow:{en:"TCEA · Grades 6–8",es:"TCEA · Grados 6–8",vi:"TCEA · Lớp 6–8",ar:"TCEA · الصفوف 6–8",hi:"TCEA · कक्षा 6–8",ur:"TCEA · جماعت 6–8",zh:"TCEA · 六至八年级"},
    h1:{en:"Digital Math Tools for Grades 6–8",
      es:"Herramientas Digitales de Matemáticas para los Grados 6–8",
      vi:"Công cụ Toán Kỹ thuật số cho Lớp 6–8",
      ar:"أدوات الرياضيات الرقمية للصفوف 6–8",
      hi:"कक्षा 6–8 के लिए डिजिटल गणित उपकरण",
      ur:"جماعت 6–8 کے لیے ڈیجیٹل ریاضی اوزار",
      zh:"面向六至八年级的数字数学工具"},
    sub:{en:"Interactive, self-contained math tools for middle school — ratios and proportions, integers and rational numbers, expressions and equations, linear functions, and geometry. No logins. No data collected. Works offline.",
      es:"Herramientas matemáticas interactivas y autónomas para secundaria: razones y proporciones, enteros y números racionales, expresiones y ecuaciones, funciones lineales y geometría. Sin cuentas. Sin recopilar datos. Funciona sin conexión.",
      vi:"Công cụ toán tương tác, độc lập cho trung học cơ sở — tỉ số và tỉ lệ, số nguyên và số hữu tỉ, biểu thức và phương trình, hàm số bậc nhất, và hình học. Không đăng nhập. Không thu thập dữ liệu. Hoạt động ngoại tuyến.",
      ar:"أدوات رياضيات تفاعلية ومكتفية ذاتيًا للمرحلة المتوسطة — النسب والتناسب، والأعداد الصحيحة والنسبية، والعبارات والمعادلات، والدوال الخطية، والهندسة. بلا حسابات. بلا جمع بيانات. تعمل دون اتصال.",
      hi:"मिडिल स्कूल के लिए इंटरैक्टिव, स्वतंत्र गणित उपकरण — अनुपात और समानुपात, पूर्णांक और परिमेय संख्याएँ, व्यंजक और समीकरण, रैखिक फलन, और ज्यामिति। कोई लॉगिन नहीं। कोई डेटा नहीं। ऑफ़लाइन चलता है।",
      ur:"مڈل اسکول کے لیے انٹرایکٹو، خود مکتفی ریاضی اوزار — نسبت اور تناسب، صحیح اور ناطق اعداد، عبارات اور مساوات، خطی تفاعل، اور جیومیٹری۔ کوئی لاگ ان نہیں۔ کوئی ڈیٹا نہیں۔ آف لائن چلتا ہے۔",
      zh:"面向初中的互动式、自成一体的数学工具——比与比例、整数与有理数、表达式与方程、一次函数以及几何。无需登录。不收集数据。可离线使用。"},
    lTools:{en:"Math tools",es:"Herramientas",vi:"Công cụ toán",ar:"أدوات رياضيات",hi:"गणित उपकरण",ur:"ریاضی اوزار",zh:"数学工具"},
    lLangs:{en:"Languages",es:"Idiomas",vi:"Ngôn ngữ",ar:"اللغات",hi:"भाषाएँ",ur:"زبانیں",zh:"语言"},
    lData:{en:"No data",es:"Sin datos",vi:"Không dữ liệu",ar:"بلا بيانات",hi:"कोई डेटा नहीं",ur:"کوئی ڈیٹا نہیں",zh:"无数据"},
    secFind:{en:"Find a math tool",es:"Encuentra una herramienta",vi:"Tìm một công cụ toán",ar:"ابحث عن أداة رياضيات",hi:"एक गणित उपकरण खोजें",ur:"ایک ریاضی اوزار تلاش کریں",zh:"查找数学工具"},
    ph:{en:"Search by name, skill, or standard (e.g. ratios, integers, equations, slope)…",
      es:"Busca por nombre, destreza o estándar (p. ej. razones, enteros, ecuaciones, pendiente)…",
      vi:"Tìm theo tên, kỹ năng hoặc chuẩn (ví dụ: tỉ số, số nguyên, phương trình, hệ số góc)…",
      ar:"ابحث بالاسم أو المهارة أو المعيار (مثل: النسب، الأعداد الصحيحة، المعادلات، الميل)…",
      hi:"नाम, कौशल या मानक से खोजें (जैसे अनुपात, पूर्णांक, समीकरण, ढलान)…",
      ur:"نام، مہارت یا معیار سے تلاش کریں (مثلاً نسبت، صحیح اعداد، مساوات، ڈھلان)…",
      zh:"按名称、技能或标准搜索（例如：比、整数、方程、斜率）…"},
    rand:{en:"🎲 Surprise me",es:"🎲 Sorpréndeme",vi:"🎲 Bất ngờ nào",ar:"🎲 فاجئني",hi:"🎲 कोई भी दिखाओ",ur:"🎲 کوئی بھی دکھاؤ",zh:"🎲 随机一个"},
    unit:{en:"tools",es:"herramientas",vi:"công cụ",ar:"أدوات",hi:"उपकरण",ur:"اوزار",zh:"个工具"},
    unitOne:{en:"tool",es:"herramienta",vi:"công cụ",ar:"أداة",hi:"उपकरण",ur:"اوزار",zh:"个工具"},
    empty:{en:"No tools match — try a different word.",es:"Ninguna herramienta coincide: prueba otra palabra.",vi:"Không có công cụ nào khớp — hãy thử từ khác.",ar:"لا توجد أدوات مطابقة — جرّب كلمة أخرى.",hi:"कोई उपकरण मेल नहीं खाता — कोई और शब्द आज़माएँ।",ur:"کوئی اوزار میل نہیں کھاتا — کوئی اور لفظ آزمائیں۔",zh:"没有匹配的工具——换个词试试。"},
    note:{en:"<b>Grades 6–8 collection.</b> These tools support the Grade 6, 7, and 8 Texas TEKS and the Common Core Grade 6, 7, and 8 standards. Each works for a 15–20 minute lesson segment, station, or intervention block, and has teacher settings for grade level and difficulty.",
      es:"<b>Colección de los Grados 6–8.</b> Estas herramientas apoyan los TEKS de Texas de 6.º, 7.º y 8.º grado y los estándares Common Core de 6.º, 7.º y 8.º grado. Cada una sirve para un segmento de clase, estación o bloque de intervención de 15–20 minutos, y tiene configuraciones del maestro para el grado y la dificultad.",
      vi:"<b>Bộ Lớp 6–8.</b> Các công cụ này hỗ trợ TEKS Texas Lớp 6, 7 và 8 và chuẩn Common Core Lớp 6, 7 và 8. Mỗi công cụ phù hợp cho một phần bài học, trạm học hoặc tiết phụ đạo 15–20 phút, và có cài đặt cho giáo viên về cấp lớp và độ khó.",
      ar:"<b>مجموعة الصفوف 6–8.</b> تدعم هذه الأدوات معايير TEKS في تكساس للصفوف السادس والسابع والثامن ومعايير Common Core للصفوف نفسها. تصلح كل أداة لجزء من درس أو محطة أو حصة دعم مدتها 15–20 دقيقة، وفيها إعدادات للمعلم للصف ومستوى الصعوبة.",
      hi:"<b>कक्षा 6–8 संग्रह.</b> ये उपकरण टेक्सास TEKS कक्षा 6, 7 और 8 तथा Common Core कक्षा 6, 7 और 8 मानकों का समर्थन करते हैं। हर एक 15–20 मिनट के पाठ-खंड, स्टेशन या सहायता सत्र के लिए उपयुक्त है, और इसमें कक्षा स्तर और कठिनाई के लिए शिक्षक सेटिंग हैं।",
      ur:"<b>جماعت 6–8 مجموعہ.</b> یہ اوزار ٹیکساس TEKS جماعت 6، 7 اور 8 اور Common Core جماعت 6، 7 اور 8 کے معیارات کی حمایت کرتے ہیں۔ ہر ایک 15–20 منٹ کے سبق کے حصے، اسٹیشن یا معاونتی سیشن کے لیے موزوں ہے، اور اس میں جماعت اور مشکل کے لیے استاد کی ترتیبات ہیں۔",
      zh:"<b>六至八年级合集。</b>这些工具支持得克萨斯六、七、八年级 TEKS 以及六、七、八年级 Common Core 标准。每个都适合 15–20 分钟的课堂片段、学习站或辅导时段，并有供教师调整年级和难度的设置。"},
    footText:{en:"Digital Math Tools · An educator resource · Self-contained · No logins · No data collected ·",
      es:"Herramientas Digitales de Matemáticas · Un recurso educativo · Autónomo · Sin cuentas · Sin recopilar datos ·",
      vi:"Công cụ Toán Kỹ thuật số · Tài nguyên giáo dục · Độc lập · Không đăng nhập · Không thu thập dữ liệu ·",
      ar:"أدوات الرياضيات الرقمية · مورد تعليمي · مكتفٍ ذاتيًا · بلا حسابات · بلا جمع بيانات ·",
      hi:"डिजिटल गणित उपकरण · एक शैक्षिक संसाधन · स्वतंत्र · कोई लॉगिन नहीं · कोई डेटा नहीं ·",
      ur:"ڈیجیٹل ریاضی اوزار · ایک تعلیمی وسیلہ · خود مکتفی · کوئی لاگ ان نہیں · کوئی ڈیٹا نہیں ·",
      zh:"数字数学工具 · 教育资源 · 自成一体 · 无需登录 · 不收集数据 ·"},
    privacy:{en:"Privacy & Compliance",es:"Privacidad y Cumplimiento",vi:"Quyền riêng tư & Tuân thủ",ar:"الخصوصية والامتثال",hi:"गोपनीयता और अनुपालन",ur:"رازداری و تعمیل",zh:"隐私与合规"},
    langLabel:{en:"Language",es:"Idioma",vi:"Ngôn ngữ",ar:"اللغة",hi:"भाषा",ur:"زبان",zh:"语言"}
  };

  var lang='en';
  function pick(d){return (d&&(d[lang]||d.en))||'';}
  function T(k){return pick(UI[k]);}
  function normalize(raw){if(!raw)return '';var s=String(raw).toLowerCase();for(var i=0;i<LANGS.length;i++){if(s.indexOf(LANGS[i].code)===0)return LANGS[i].code;}return '';}
  function detect(){var p=new URLSearchParams(location.search||'');var c=[p.get('lang')];try{c.push(localStorage.getItem(STORAGE_KEY));}catch(e){}c.push(navigator.language);(navigator.languages||[]).forEach(function(l){c.push(l);});for(var i=0;i<c.length;i++){var n=normalize(c[i]);if(n)return n;}return 'en';}
  function dirFor(code){for(var i=0;i<LANGS.length;i++)if(LANGS[i].code===code)return LANGS[i].dir;return 'ltr';}
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function countWord(n){return n+' '+(n===1?pick(UI.unitOne):pick(UI.unit));}

  var TOOLS=(C.tools||[]).filter(function(t){return t.collection===COLLECTION;});
  var grid=document.getElementById('grid'),empty=document.getElementById('empty'),
      countEl=document.getElementById('count'),qEl=document.getElementById('q'),
      langSel=document.getElementById('lang');

  function toolCard(t){
    return '<a class="tool" style="--accent:'+t.accent+'" href="'+esc(BASE+t.href)+'">'+
      '<div class="ico" aria-hidden="true">'+t.icon+'</div>'+
      '<h3>'+esc(t.title)+'</h3><p>'+esc(pick(t.desc))+'</p>'+
      '<div class="tags">'+t.tags.map(function(k){return '<span class="tag">'+esc(pick(C.TAG[k]))+'</span>';}).join('')+'</div></a>';
  }
  function matches(q){
    var terms=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    return TOOLS.filter(function(t){
      if(!terms.length) return true;
      var hay=(t.title+' '+pick(t.desc)+' '+t.tags.map(function(k){return pick(C.TAG[k]);}).join(' ')+' '+t.kw).toLowerCase();
      return terms.every(function(term){return hay.indexOf(term)!==-1;});
    });
  }
  function renderList(){
    var list=matches(qEl.value);
    grid.innerHTML=list.map(toolCard).join('');
    empty.style.display=list.length?'none':'block';
    countEl.textContent=qEl.value.trim()?countWord(list.length):'';
  }
  function apply(){
    document.documentElement.lang=lang; document.documentElement.dir=dirFor(lang);
    document.getElementById('crumb').textContent=T('crumb');
    document.getElementById('eyebrow').textContent=T('eyebrow');
    document.getElementById('h1').textContent=T('h1');
    document.getElementById('sub').textContent=T('sub');
    document.getElementById('lTools').textContent=T('lTools');
    document.getElementById('lLangs').textContent=T('lLangs');
    document.getElementById('lData').textContent=T('lData');
    document.getElementById('secFind').textContent=T('secFind');
    qEl.setAttribute('placeholder',T('ph'));
    document.getElementById('rand').textContent=T('rand');
    document.getElementById('empty').textContent=T('empty');
    document.getElementById('note').innerHTML=pick(UI.note);
    document.getElementById('footText').textContent=T('footText');
    document.getElementById('footPrivacy').textContent=T('privacy');
    langSel.setAttribute('aria-label',T('langLabel'));
    document.getElementById('tCount').textContent=TOOLS.length;
    renderList();
  }

  langSel.innerHTML=LANGS.map(function(l){return '<option value="'+l.code+'">'+esc(l.label)+'</option>';}).join('');
  lang=detect(); langSel.value=lang;
  langSel.addEventListener('change',function(){lang=langSel.value;try{localStorage.setItem(STORAGE_KEY,lang);}catch(e){}apply();});
  qEl.addEventListener('input',renderList);
  document.getElementById('rand').addEventListener('click',function(){
    var list=matches(qEl.value); if(!list.length) list=TOOLS;
    var pk=list[(Math.random()*list.length)|0]; if(pk) location.href=BASE+pk.href;
  });
  apply();
})();
</script>
<script src="/activities/licensing-footer.js" defer></script>
</body>
