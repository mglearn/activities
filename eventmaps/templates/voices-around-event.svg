<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850"
     font-family="'Fredoka','Nunito',sans-serif" role="img"
     aria-label="Voices Around the Event — blank organizer template">
  <title>Voices Around the Event — blank organizer</title>
  <desc>A US-Letter landscape organizer: a central event, four stakeholder cards (What did they want? / fear or oppose? / action? / evidence? / how affected?), a synthesis strip, and a source strip. All labels are live SVG text so they can be localized. Grayscale-safe: stakeholders are distinguished by border style, not colour.</desc>
  <style>
    .lbl{font-size:15px;font-weight:600;fill:#516079}
    .fld{font-size:12px;font-weight:600;fill:#516079}
    .name{font-size:19px;font-weight:700}
    .ev-t{font-size:26px;font-weight:700;fill:#054c8c}
    .ev-l{font-size:12px;font-weight:700;fill:#054c8c;letter-spacing:2px}
    .line{stroke:#8a97a8;stroke-width:1;stroke-dasharray:2 4}
    .glyph{font-size:12px;font-weight:700}
    .syq{font-size:14px;font-weight:700;fill:#023266}
    .oss{font-size:13px;font-weight:700;fill:#054c8c}
  </style>

  <rect x="0" y="0" width="1100" height="850" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="46" font-size="24" font-weight="700" fill="#054c8c">Voices Around the Event</text>
  <text x="40" y="70" class="lbl">Event: ______________________________     Date: ______________     Grades 6–8 · U.S. History</text>

  <!-- Central event -->
  <rect x="430" y="360" width="240" height="120" rx="10" fill="#eef4fb" stroke="#054c8c" stroke-width="3"/>
  <rect x="437" y="367" width="226" height="106" rx="7" fill="none" stroke="#054c8c" stroke-width="1"/>
  <text x="550" y="400" text-anchor="middle" class="ev-l">THE EVENT</text>
  <text x="550" y="432" text-anchor="middle" class="ev-t">____________</text>
  <text x="550" y="458" text-anchor="middle" class="lbl">Date / place</text>

  <!-- Stakeholder card template, repeated. Grayscale-safe border styles. -->
  <!-- TL: solid -->
  <g transform="translate(40,95)">
    <rect width="470" height="235" rx="10" fill="#ffffff" stroke="#238a8d" stroke-width="2"/>
    <rect width="470" height="6" fill="#238a8d"/>
    <text x="18" y="34" class="name" fill="#238a8d">Group 1: ________________</text>
    <text x="440" y="30" text-anchor="end" class="glyph" fill="#238a8d">S1</text>
    <text x="18" y="66" class="fld">What did they want?</text><line class="line" x1="18" y1="82" x2="452" y2="82"/>
    <text x="18" y="104" class="fld">What did they fear or oppose?</text><line class="line" x1="18" y1="120" x2="452" y2="120"/>
    <text x="18" y="142" class="fld">What action did they take?</text><line class="line" x1="18" y1="158" x2="452" y2="158"/>
    <text x="18" y="180" class="fld">What evidence supports this?</text><line class="line" x1="18" y1="196" x2="452" y2="196"/>
    <text x="18" y="218" class="fld">How did the event affect them?</text><line class="line" x1="18" y1="228" x2="452" y2="228"/>
  </g>
  <!-- TR: dashed -->
  <g transform="translate(590,95)">
    <rect width="470" height="235" rx="10" fill="#ffffff" stroke="#d97a28" stroke-width="2" stroke-dasharray="8 5"/>
    <rect width="470" height="6" fill="#d97a28"/>
    <text x="18" y="34" class="name" fill="#d97a28">Group 2: ________________</text>
    <text x="440" y="30" text-anchor="end" class="glyph" fill="#d97a28">S2</text>
    <text x="18" y="66" class="fld">What did they want?</text><line class="line" x1="18" y1="82" x2="452" y2="82"/>
    <text x="18" y="104" class="fld">What did they fear or oppose?</text><line class="line" x1="18" y1="120" x2="452" y2="120"/>
    <text x="18" y="142" class="fld">What action did they take?</text><line class="line" x1="18" y1="158" x2="452" y2="158"/>
    <text x="18" y="180" class="fld">What evidence supports this?</text><line class="line" x1="18" y1="196" x2="452" y2="196"/>
    <text x="18" y="218" class="fld">How did the event affect them?</text><line class="line" x1="18" y1="228" x2="452" y2="228"/>
  </g>
  <!-- BL: dotted -->
  <g transform="translate(40,510)">
    <rect width="470" height="235" rx="10" fill="#ffffff" stroke="#6d5aa8" stroke-width="2" stroke-dasharray="2 4"/>
    <rect width="470" height="6" fill="#6d5aa8"/>
    <text x="18" y="34" class="name" fill="#6d5aa8">Group 3: ________________</text>
    <text x="440" y="30" text-anchor="end" class="glyph" fill="#6d5aa8">S3</text>
    <text x="18" y="66" class="fld">What did they want?</text><line class="line" x1="18" y1="82" x2="452" y2="82"/>
    <text x="18" y="104" class="fld">What did they fear or oppose?</text><line class="line" x1="18" y1="120" x2="452" y2="120"/>
    <text x="18" y="142" class="fld">What action did they take?</text><line class="line" x1="18" y1="158" x2="452" y2="158"/>
    <text x="18" y="180" class="fld">What evidence supports this?</text><line class="line" x1="18" y1="196" x2="452" y2="196"/>
    <text x="18" y="218" class="fld">How did the event affect them?</text><line class="line" x1="18" y1="228" x2="452" y2="228"/>
  </g>
  <!-- BR: double -->
  <g transform="translate(590,510)">
    <rect x="3" y="3" width="464" height="229" rx="10" fill="#ffffff" stroke="#5a8f52" stroke-width="1"/>
    <rect width="470" height="235" rx="12" fill="none" stroke="#5a8f52" stroke-width="1"/>
    <rect width="470" height="6" fill="#5a8f52"/>
    <text x="18" y="34" class="name" fill="#5a8f52">Group 4: ________________</text>
    <text x="440" y="30" text-anchor="end" class="glyph" fill="#5a8f52">S4</text>
    <text x="18" y="66" class="fld">What did they want?</text><line class="line" x1="18" y1="82" x2="452" y2="82"/>
    <text x="18" y="104" class="fld">What did they fear or oppose?</text><line class="line" x1="18" y1="120" x2="452" y2="120"/>
    <text x="18" y="142" class="fld">What action did they take?</text><line class="line" x1="18" y1="158" x2="452" y2="158"/>
    <text x="18" y="180" class="fld">What evidence supports this?</text><line class="line" x1="18" y1="196" x2="452" y2="196"/>
    <text x="18" y="218" class="fld">How did the event affect them?</text><line class="line" x1="18" y1="228" x2="452" y2="228"/>
  </g>

  <!-- Synthesis strip -->
  <g transform="translate(40,762)">
    <rect width="1020" height="72" rx="8" fill="#fffdf3" stroke="#d9a010" stroke-width="2"/>
    <text x="14" y="24" class="syq">Where did perspectives overlap? ____________________</text>
    <text x="360" y="24" class="syq">Where did they conflict? ____________________</text>
    <text x="700" y="24" class="syq">Whose perspective is missing? ______________</text>
    <text x="14" y="56" class="oss">Sources:  S1 ____________   S2 ____________   S3 ____________</text>
  </g>
</svg>
