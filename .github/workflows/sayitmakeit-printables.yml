name: Say It Make It printables
on:
  push:
    paths: ['sayitmakeit/**', '.github/workflows/sayitmakeit-printables.yml']
  pull_request:
    paths: ['sayitmakeit/**', '.github/workflows/sayitmakeit-printables.yml']
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install PDF validator
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Check generated files and printable artifacts
        working-directory: sayitmakeit
        run: npm run check
