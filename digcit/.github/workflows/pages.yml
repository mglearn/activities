name: Deploy to GitHub Pages

# digcit is fully OPEN: scripts/build-pages.js publishes every activity (all 18,
# grades K-8). Regenerates pages with the Pages domain first so social/OG image
# URLs are correct, then assembles and deploys _site/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://mglearn.github.io/activities/digcit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Regenerate pages for the Pages domain (OG/social URLs)
        run: |
          node scripts/gen-site.js
          node scripts/gen-html.js
      - name: Assemble free-tier _site (excludes paid content)
        run: node scripts/build-pages.js
      - name: Assemble password-gated /demo (all lessons playable)
        env:
          DEMO_PASSWORD: ${{ vars.DEMO_PASSWORD || 'ShowMe2026!' }}
        run: node scripts/build-demo.js
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
