<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Page not found — Learning Activities Hub</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;max-width:560px;margin:64px auto;padding:0 22px;color:#161c2e;line-height:1.6}a{color:#054c8c;font-weight:700}h1{font-size:1.3rem;color:#054c8c}</style>
<script>
/* Friendly forwarding for legacy internal paths on the Activities Hub.
     - old CTOB name:   /activities/breakouts/*   -> /activities/ctobs/*
     - redundant nest:  /activities/activities/*  -> /activities/ctobs/* */
(function () {
  var p = location.pathname, s = location.search, h = location.hash;

  /* Resolve the hub's base first, then match the ONE segment after it.
     Matching the whole path in a single pass is what broke this before: a
     lazy `(.*?)\/(?:breakouts|activities)` locks onto the leading
     `/activities`, leaving the captured prefix empty so the guard that
     required it to end in `/activities` never passed — the forwards below
     had simply stopped firing. Making the quantifier greedy instead trades
     that for a double rewrite: `/activities/activities/activities/x` lands
     on `/activities/ctobs/ctobs/x`, because the result still matches on the
     next 404. Anchoring to the base and rewriting a single segment does
     neither.

     Base is the first `/activities` segment (the GitHub Pages project root);
     falling back to '' also makes this work when the hub is served at the
     root of a local dev server. */
  var base = p.match(/^(.*?\/activities)(?=\/)/);
  var root = base ? base[1] : '';
  var rest = p.slice(root.length);

  /* History Event Maps was rebuilt as a library of blank organizers; the old
     per-event activity pages and downloads/ PDFs are gone. Land those on the
     map library instead of a dead end. */
  if (/^\/eventmaps\/(?:activities|downloads)(?:\/|$)/.test(rest)) {
    location.replace(root + '/eventmaps/'); return;
  }

  /* old CTOB name / redundant nest -> ctobs */
  var seg = rest.match(/^\/(?:breakouts|activities)(\/.*)?$/);
  if (seg) {
    var tail = seg[1] || '/';
    /* ...except where the next segment is a hub area of its own rather than a
       CTOB suite. /activities/breakouts/relic-rooms/ used to resolve, but
       Relic Rooms is a sibling of ctobs, not a child, so the plain rewrite
       sends it to a ctobs path that does not exist. Note `science` is absent
       on purpose: it is both a hub area and a CTOB suite, and ctobs/science/
       resolves, so the default below is already right for it.

       A regex, not an object lookup — `AREAS['constructor']` would be truthy
       on an object literal and forward junk paths to /activities/constructor/. */
    var AREAS = /^(?:digcit|digitalmathtools|eventmaps|genailit|lab-safety|plotpoint|pst|relic-rooms|sayitmakeit)$/;
    var area = tail.match(/^\/([^\/]+)(\/.*)?$/);
    if (area && AREAS.test(area[1])) {
      location.replace(root + '/' + area[1] + (area[2] || '/') + s + h); return;
    }
    location.replace(root + '/ctobs' + tail + s + h); return;
  }
})();
</script>
</head>
<body>
<h1>We couldn’t find that page</h1>
<p>It may have moved. Try the <a href="/activities/">Learning Activities Hub</a> to find breakouts, problem-solving units, relic rooms, digital citizenship, and AI literacy activities.</p>
<p><a href="/activities/">Activities Hub</a> &middot; <a href="/tcea/">TCEA project home</a></p>
<script src="/activities/licensing-footer.js" defer></script>
</body>
</html>
